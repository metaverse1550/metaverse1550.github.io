<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma: Lost Sentiments - 무채색의 도시</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DungGeunMo&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #050508;
            color: #e0e0e0;
            font-family: 'DungGeunMo', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 640px;
            background: #0a0a0f;
            box-shadow: 0 0 40px rgba(0,0,0,0.95), 0 0 20px rgba(100,100,150,0.1);
            border: 4px solid #2a2a36;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive-ui {
            pointer-events: auto;
        }

        /* Pixel Panel Box */
        .pixel-panel {
            background: rgba(18, 18, 24, 0.94);
            border: 3px solid #4a4a5c;
            box-shadow: inset -3px -3px 0px #08080c, inset 3px 3px 0px #2a2a38;
            color: #ddd;
            padding: 12px;
            position: absolute;
        }

        /* HUD Bar */
        #hud-bar {
            top: 10px;
            left: 12px;
            right: 12px;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            border-radius: 4px;
            z-index: 50;
        }

        #location-title {
            font-size: 16px;
            letter-spacing: 1px;
            color: #e1e1f0;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 6px rgba(255,255,255,0.2);
        }

        .hud-buttons {
            display: flex;
            gap: 10px;
        }

        .pixel-btn {
            background: #2b2b38;
            border: 2px solid #5a5a70;
            color: #fff;
            padding: 6px 14px;
            font-family: 'DungGeunMo', monospace;
            font-size: 14px;
            cursor: pointer;
            box-shadow: inset -2px -2px 0px #101016, inset 2px 2px 0px #424256;
            transition: all 0.1s ease;
            border-radius: 3px;
        }

        .pixel-btn:hover {
            background: #3c3c50;
            border-color: #8a8aa8;
        }

        .pixel-btn:active {
            box-shadow: inset 2px 2px 0px #101016, inset -2px -2px 0px #424256;
            transform: translateY(1px);
        }

        /* Dialogue Box */
        #dialogue-box {
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            min-height: 140px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
            border-radius: 6px;
        }

        #speaker-name {
            font-size: 16px;
            color: #a0a0d0;
            margin-bottom: 6px;
            border-bottom: 2px solid #333348;
            padding-bottom: 4px;
            font-weight: bold;
        }

        #dialogue-text {
            font-size: 15px;
            line-height: 1.5;
            color: #f0f0f5;
            margin-bottom: 10px;
            min-height: 48px;
            white-space: pre-wrap;
        }

        #dialogue-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dialogue-opt {
            padding: 8px 12px;
            background: #222230;
            border: 2px solid #44445c;
            cursor: pointer;
            font-size: 14px;
            color: #ccc;
            border-radius: 4px;
            transition: background 0.1s;
        }

        .dialogue-opt:hover {
            background: #323246;
            border-color: #9999c0;
            color: #fff;
        }

        /* Codex Book Modal */
        #codex-modal {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 780px;
            height: 520px;
            display: none;
            z-index: 200;
            background: #12121a;
            border: 4px solid #4a4a60;
            box-shadow: 0 0 30px rgba(0,0,0,0.95);
            flex-direction: column;
            border-radius: 8px;
        }

        .codex-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            border-bottom: 3px solid #2a2a3a;
            background: #1a1a26;
        }

        .codex-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .codex-tabs {
            width: 220px;
            border-right: 3px solid #2a2a3a;
            background: #0d0d14;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            overflow-y: auto;
        }

        .codex-tab {
            padding: 10px;
            background: #1c1c28;
            border: 2px solid #333348;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            color: #8888a8;
            border-radius: 4px;
        }

        .codex-tab.active {
            border-color: #8888c0;
            background: #2a2a3e;
            color: #fff;
        }

        .codex-content {
            flex: 1;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        #codex-canvas-container {
            width: 220px;
            height: 220px;
            border: 3px dashed #33334c;
            position: relative;
            background: #08080e;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        /* Combat Overlay */
        #combat-modal {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 300;
            background: rgba(5, 5, 12, 0.96);
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
        }

        .timer-bar-bg {
            width: 100%;
            height: 14px;
            background: #1a1a26;
            border: 2px solid #4a4a5c;
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-bar-fill {
            height: 100%;
            background: #e74c3c;
            width: 100%;
            transition: width 0.1s linear;
        }

        .combat-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .fragment-card {
            width: 160px;
            height: 180px;
            background: #181824;
            border: 3px solid #3d3d54;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 6px;
            transition: transform 0.12s, border-color 0.12s;
        }

        .fragment-card:hover {
            transform: translateY(-4px);
            border-color: #aaaace;
        }

        /* Toast Notification */
        #toast {
            position: absolute;
            top: 68px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 25, 38, 0.96);
            border: 2px solid #66668c;
            padding: 8px 18px;
            font-size: 13px;
            color: #fff;
            display: none;
            z-index: 150;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main Rendering Canvas -->
        <canvas id="gameCanvas" width="960" height="640"></canvas>

        <!-- UI Overlay Layer -->
        <div class="ui-layer">
            <!-- HUD -->
            <div id="hud-bar" class="pixel-panel interactive-ui">
                <div id="location-title">중심 도시 (구역 01)</div>
                <div class="hud-buttons">
                    <button class="pixel-btn" id="btn-codex">기억 도감 [C]</button>
                    <button class="pixel-btn" id="btn-help">조작법</button>
                </div>
            </div>

            <!-- Toast Notification -->
            <div id="toast">알림 메시지</div>

            <!-- Dialogue System -->
            <div id="dialogue-box" class="pixel-panel interactive-ui">
                <div id="speaker-name">주민</div>
                <div id="dialogue-text">대화 내용이 표시됩니다...</div>
                <div id="dialogue-options"></div>
            </div>

            <!-- Emotion Codex UI -->
            <div id="codex-modal" class="pixel-panel interactive-ui">
                <div class="codex-header">
                    <span style="font-size: 17px; font-weight: bold; color:#d1d1e0;">[ 마음의 기록 - 내면의 도감 ]</span>
                    <button class="pixel-btn" id="btn-close-codex">X</button>
                </div>
                <div class="codex-body">
                    <div class="codex-tabs" id="codex-tabs"></div>
                    <div class="codex-content">
                        <div id="codex-emo-title" style="font-size: 20px; font-weight: bold; margin-bottom: 6px;">공백의 파편</div>
                        <div id="codex-emo-desc" style="font-size: 13px; color: #8888a8; text-align: center; margin-bottom: 12px;">설명...</div>
                        
                        <div id="codex-canvas-container">
                            <canvas id="codexCanvas" width="220" height="220"></canvas>
                        </div>

                        <div id="codex-status-text" style="margin-top: 10px; font-size: 13px; color: #aaa;">수집 상태: 0 / 3</div>
                        <button class="pixel-btn" id="btn-start-combat" style="margin-top: 10px; width: 80%; display: none;">의식 복원 시도</button>
                    </div>
                </div>
            </div>

            <!-- Combat System UI -->
            <div id="combat-modal" class="interactive-ui">
                <div style="text-align: center; margin-top: 15px;">
                    <h2 id="combat-title" style="font-size: 22px; color: #fff; text-shadow: 0 0 8px #99f;">의식의 안개 공간</h2>
                    <p id="combat-sub" style="color: #8888a8; margin-top: 6px; font-size: 13px;">노이즈가 섞이지 않은 진짜 동요의 결을 찾으십시오 (3회 연속 성공 필요)</p>
                    <div class="timer-bar-bg" style="width: 480px; margin: 14px auto;">
                        <div id="combat-timer-fill" class="timer-bar-fill"></div>
                    </div>
                    <div id="combat-attempts" style="color: #ffcc00; font-size: 13px;">남은 집중력: 3회</div>
                </div>

                <!-- Combat Canvas Display -->
                <div style="width: 220px; height: 220px; position: relative;">
                    <canvas id="combatCanvas" width="220" height="220"></canvas>
                </div>

                <!-- 3 Choice Cards -->
                <div>
                    <div style="text-align: center; color: #777799; margin-bottom: 8px; font-size: 12px;">왜곡된 잡음 파편을 피하고 진짜 잔상을 선택하세요</div>
                    <div class="combat-cards" id="combat-cards-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. CONFIG & GAME STATE
           ========================================================================== */
        const CONFIG = {
            tileSize: 40,
            mapCols: 24,
            mapRows: 16,
            playerSpeed: 3.5,
            combatTimeLimit: 8.0,
            burnoutLimits: { red: 4, orange: 5, yellow: 8, green: 6, blue: 6, purple: 5, pink: 7 }
        };

        const EMOTIONS = {
            red:    { id: 'red',    name: '붉은 잔상',   trueName: '분노',   hex: '#e74c3c', hexDark: '#78281f', unlockLoc: 'ocean',    unlockName: '고요한 해변', unlockMsg: '가슴 속에서 뜨거운 소용돌이가 칩니다. 차가운 수평선으로 가봐야 할 것 같습니다.' },
            orange: { id: 'orange', name: '주황 빛무리가', trueName: '불안',   hex: '#e67e22', hexDark: '#7e5109', unlockLoc: 'factory',  unlockName: '구식 정비소', unlockMsg: '손끝이 가늘게 떨립니다. 차가운 기계 마찰음이 들리는 정비소에 끌립니다.' },
            yellow: { id: 'yellow', name: '노란 온기',   trueName: '기쁨',   hex: '#f1c40f', hexDark: '#7d6608', unlockLoc: 'park',     unlockName: '중앙 광장',   unlockMsg: '눈꺼풀 너머로 따스함이 스칩니다. 오래된 나무가 있던 광장으로 발길이 향합니다.' },
            green:  { id: 'green',  name: '초록 균열',   trueName: '짜증',   hex: '#2ecc71', hexDark: '#145a32', unlockLoc: 'library',  unlockName: '기록 보관소', unlockMsg: '귀밑이 가려운 정적이 감횁니다. 서적들이 쌓인 서고로 숨고 싶어집니다.' },
            blue:   { id: 'blue',   name: '푸른 침묵',   trueName: '슬픔',   hex: '#3498db', hexDark: '#1b4f72', unlockLoc: 'tower',    unlockName: '중앙 관제탑', unlockMsg: '눈가가 차갑게 젖어듭니다. 도시 전체를 내려다볼 수 있는 거대한 탑으로 이동합니다.' },
            purple: { id: 'purple', name: '자줏빛 떨림', trueName: '두려움', hex: '#9b59b6', hexDark: '#4a235a', unlockLoc: null,       unlockName: null,         unlockMsg: '알 수 없는 어둠이 시야를 짓누릅니다...' },
            pink:   { id: 'pink',   name: '분홍빛 맥박', trueName: '사랑',   hex: '#fd79a8', hexDark: '#6c2c49', unlockLoc: null,       unlockName: null,         unlockMsg: '타인의 체온을 느끼고 싶은 부드러운 전율이 울립니다.' }
        };

        const STATE = {
            currentLocation: 'city',
            unlockedLocations: ['city', 'ocean', 'park', 'library', 'factory', 'tower'],
            
            fragments: {
                red: [false, false, false],
                orange: [false, false, false],
                yellow: [false, false, false],
                green: [false, false, false],
                blue: [false, false, false],
                purple: [false, false, false],
                pink: [false, false, false]
            },

            recovered: {
                red: false, orange: false, yellow: false, green: false, blue: false, purple: false, pink: false
            },

            usageCount: { red: 0, orange: 0, yellow: 0, green: 0, blue: 0, purple: 0, pink: 0 },
            burnout: { red: false, orange: false, yellow: false, green: false, blue: false, purple: false, pink: false },
            combatRetries: { red: 3, orange: 3, yellow: 3, green: 3, blue: 3, purple: 3, pink: 3 },

            voiceProgression: 0,
            activeDialogue: null,
            isCodexOpen: false,
            isCombatActive: false,
            activeCombatEmotion: null,
            gameEnded: false,
            tickTimer: 0
        };

        /* ==========================================================================
           2. PIXEL ART GRAPHICS UTILITIES
           ========================================================================== */
        function drawPixelSprite(ctx, startX, startY, pixelSize, colorMap, spriteData) {
            for (let r = 0; r < spriteData.length; r++) {
                for (let c = 0; c < spriteData[r].length; c++) {
                    const key = spriteData[r][c];
                    if (key && colorMap[key]) {
                        ctx.fillStyle = colorMap[key];
                        ctx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
        }

        // Draw readable Label Tag over canvas objects/NPCs with background plate
        function drawLabelTag(ctx, text, centerX, bottomY, color = '#ffffff', bgColor = 'rgba(15, 15, 22, 0.88)') {
            ctx.font = '12px DungGeunMo';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const textWidth = ctx.measureText(text).width;
            const padX = 6;
            const padY = 3;
            const boxWidth = textWidth + padX * 2;
            const boxHeight = 16 + padY;

            ctx.fillStyle = bgColor;
            ctx.strokeStyle = '#44445a';
            ctx.lineWidth = 1;
            ctx.fillRect(centerX - boxWidth / 2, bottomY - boxHeight, boxWidth, boxHeight);
            ctx.strokeRect(centerX - boxWidth / 2, bottomY - boxHeight, boxWidth, boxHeight);

            ctx.fillStyle = color;
            ctx.fillText(text, centerX, bottomY - boxHeight / 2);
        }

        const PLAYER_SPRITES = {
            down: [
                "..hhhhhh..",
                ".hhffffffh.",
                ".hffffffff.",
                ".ssssssss..",
                ".seesees...",
                ".ssssssss..",
                "..ccsscc...",
                ".cccccccc..",
                ".cccccccc..",
                ".cccccccc..",
                "..bb..bb...",
                "..bb..bb..."
            ],
            up: [
                "..hhhhhh..",
                ".hhhhhhhhh.",
                ".hhhhhhhhh.",
                ".hhhhhhhhh.",
                "..ssssss...",
                "..ccsscc...",
                ".cccccccc..",
                ".cccccccc..",
                ".cccccccc..",
                "..bb..bb...",
                "..bb..bb..."
            ],
            side: [
                "..hhhhh...",
                ".hhffffff.",
                ".hfffffff.",
                ".sssssss..",
                ".sees.....",
                ".sssssss..",
                "..cccc....",
                ".cccccc...",
                ".cccccc...",
                ".cccccc...",
                "..bb......",
                "..bb......"
            ]
        };

        const WATCHER_SPRITE = [
            "..HHHHHH..",
            ".HHHHHHHH.",
            "..ffffff..",
            "..fEffE...",
            "..ffffff..",
            "..SSSSSS..",
            ".SSSSSSSS.",
            ".SSSSSSSS.",
            ".SSSSSSSS.",
            "..BB..BB..",
            "..BB..BB.."
        ];

        /* ==========================================================================
           3. INPUT & PLAYER SYSTEM
           ========================================================================== */
        const INPUT = {
            keys: {},
            mouse: { x: 0, y: 0 }
        };

        window.addEventListener('keydown', (e) => {
            INPUT.keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'c' && !STATE.isCombatActive && !STATE.activeDialogue) {
                toggleCodex();
            }
        });

        window.addEventListener('keyup', (e) => {
            INPUT.keys[e.key.toLowerCase()] = false;
        });

        const gameCanvas = document.getElementById('gameCanvas');

        gameCanvas.addEventListener('mousemove', (e) => {
            const rect = gameCanvas.getBoundingClientRect();
            INPUT.mouse.x = (e.clientX - rect.left) * (gameCanvas.width / rect.width);
            INPUT.mouse.y = (e.clientY - rect.top) * (gameCanvas.height / rect.height);
        });

        gameCanvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (STATE.isCodexOpen || STATE.isCombatActive || STATE.activeDialogue) return;
            handleRightClick(INPUT.mouse.x, INPUT.mouse.y);
        });

        gameCanvas.addEventListener('click', (e) => {
            if (STATE.isCodexOpen || STATE.isCombatActive || STATE.activeDialogue) return;
            handleLeftClick(INPUT.mouse.x, INPUT.mouse.y);
        });

        const PLAYER = {
            x: 480,
            y: 340,
            width: 32,
            height: 42,
            dir: 'down',
            isMoving: false,
            animFrame: 0,

            update() {
                if (STATE.isCodexOpen || STATE.isCombatActive || STATE.activeDialogue || STATE.gameEnded) return;

                let dx = 0, dy = 0;
                if (INPUT.keys['w'] || INPUT.keys['arrowup']) { dy -= 1; this.dir = 'up'; }
                if (INPUT.keys['s'] || INPUT.keys['arrowdown']) { dy += 1; this.dir = 'down'; }
                if (INPUT.keys['a'] || INPUT.keys['arrowleft']) { dx -= 1; this.dir = 'side'; this.flip = true; }
                if (INPUT.keys['d'] || INPUT.keys['arrowright']) { dx += 1; this.dir = 'side'; this.flip = false; }

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071; dy *= 0.7071;
                }

                const nextX = this.x + dx * CONFIG.playerSpeed;
                const nextY = this.y + dy * CONFIG.playerSpeed;

                // Adjust walkable bounds so player is never hidden behind top HUD bar
                if (nextX >= 30 && nextX <= 930 - this.width) this.x = nextX;
                if (nextY >= 110 && nextY <= 600 - this.height) this.y = nextY;

                this.isMoving = (dx !== 0 || dy !== 0);
                if (this.isMoving) this.animFrame += 0.2;
            },

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(this.x + 16, this.y + 38, 14, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                let shirtColor = '#4a4a58';
                if (STATE.recovered.red && !STATE.burnout.red) shirtColor = '#883333';
                else if (STATE.recovered.yellow && !STATE.burnout.yellow) shirtColor = '#998833';
                else if (STATE.recovered.blue && !STATE.burnout.blue) shirtColor = '#335588';

                const colorMap = {
                    'h': '#2b2b36',
                    'f': '#e2cbbe',
                    's': '#cbb4a5',
                    'e': '#1c1c24',
                    'c': shirtColor,
                    'b': '#1e1e28'
                };

                const sprite = PLAYER_SPRITES[this.dir] || PLAYER_SPRITES.down;

                ctx.save();
                if (this.dir === 'side' && this.flip) {
                    ctx.translate(this.x + 32, this.y);
                    ctx.scale(-1, 1);
                    drawPixelSprite(ctx, 0, 0, 3, colorMap, sprite);
                } else {
                    drawPixelSprite(ctx, this.x, this.y, 3, colorMap, sprite);
                }
                ctx.restore();

                ctx.restore();
            }
        };

        /* ==========================================================================
           4. DISGUISED AGENT (HOSTILE WATCHER)
           ========================================================================== */
        const WATCHER = {
            x: 520,
            y: 200,
            width: 30,
            height: 40,
            angle: 0,
            patrolRadius: 150,
            baseX: 500,

            update() {
                if (STATE.isCodexOpen || STATE.isCombatActive || STATE.activeDialogue || STATE.gameEnded) return;

                if (STATE.currentLocation === 'city') {
                    this.angle += 0.015;
                    this.x = this.baseX + Math.cos(this.angle) * this.patrolRadius;

                    const dist = Math.hypot((PLAYER.x + 16) - (this.x + 15), (PLAYER.y + 20) - (this.y + 20));
                    if (dist < 40) {
                        this.handleCollision();
                    }
                }
            },

            handleCollision() {
                PLAYER.x -= 40;
                PLAYER.y += 40;

                const recoveredKeys = Object.keys(STATE.recovered).filter(k => STATE.recovered[k] && !STATE.burnout[k]);
                if (recoveredKeys.length > 0) {
                    const randomKey = recoveredKeys[Math.floor(Math.random() * recoveredKeys.length)];

        function handleLeftClick(mx, my) {
            const loc = LOCATIONS[STATE.currentLocation];

            // Exits
            for (let exit of loc.exits) {
                if (mx >= exit.x && mx <= exit.x + exit.w && my >= exit.y && my <= exit.y + exit.h) {
                    switchLocation(exit.target);
                    return;
                }
            }

            // NPCs
            for (let npc of loc.npcs) {
                if (Math.hypot((PLAYER.x + 16) - (npc.x + 16), (PLAYER.y + 20) - (npc.y + 20)) < 65) {
                    openDialogue(npc);
                    return;
                }
            }
        }

        function handleRightClick(mx, my) {
            const loc = LOCATIONS[STATE.currentLocation];

            for (let obj of loc.objects) {
                if (mx >= obj.x && mx <= obj.x + obj.w && my >= obj.y && my <= obj.y + obj.h) {
                    if (Math.hypot((PLAYER.x + 16) - (obj.x + obj.w / 2), (PLAYER.y + 20) - (obj.y + obj.h / 2)) < 90) {
                        inspectObject(obj);
                        return;
                    } else {
                        showToast('조사하려면 조금 더 가까이 접근하세요.');
                        return;
                    }
                }
            }
            showToast('특별한 반응이 없는 공간입니다.');
        }

        function inspectObject(obj) {
            if (obj.id === 'obj_mainframe') {
                attemptEnding();
                return;
            }

            let msg = `[조사: ${obj.name}]\n${obj.inspect}`;

            if (obj.emotionHint && obj.fragIdx !== undefined) {
                const emoKey = obj.emotionHint;
                if (!STATE.fragments[emoKey][obj.fragIdx]) {
                    STATE.fragments[emoKey][obj.fragIdx] = true;
                    msg += `\n\n✨ [기억의 잔상 조각 수집!] (${EMOTIONS[emoKey].name} #${obj.fragIdx + 1})`;
                }
            }
            openTextDialogue('기록 분석', msg);
        }

        function openDialogue(npc) {
            const emoKey = npc.emotionHint;
            let options = [];
            let text = `${npc.text}`;

            if (emoKey && npc.fragIdx !== undefined && !STATE.fragments[emoKey][npc.fragIdx]) {
                STATE.fragments[emoKey][npc.fragIdx] = true;
                text += `\n\n(대화 중 주민의 무심한 눈빛 너머로 미세한 동요의 조각 [${EMOTIONS[emoKey].name} #${npc.fragIdx + 1}]을 포착했습니다!)`;
            }

            Object.keys(STATE.recovered).forEach(key => {
                if (STATE.recovered[key] && !STATE.burnout[key]) {
                    const emo = EMOTIONS[key];
                    options.push({
                        text: `[내면의 동요 전달] "${getSubtleDialogueLine(key)}"`,
                        color: emo.hex,
                        action: () => expressSubtleEmotion(key, npc)
                    });
                }
            });

            options.push({ text: '대화를 마친다.', color: '#aaa', action: closeDialogue });

            STATE.activeDialogue = { speaker: npc.name, text: text, options: options };
            renderDialogueUI();
        }

        function openTextDialogue(speaker, text) {
            STATE.activeDialogue = {
                speaker: speaker,
                text: text,
                options: [{ text: '확인', color: '#fff', action: closeDialogue }]
            };
            renderDialogueUI();
        }

        function getSubtleDialogueLine(emoKey) {
            switch (emoKey) {
                case 'red': return "규격화된 모든 규칙들에 숨이 턱턱 막히지 않으십니까?";
                case 'orange': return "이 지나친 정적 뒤에 무엇이 숨겨져 있는지 불안하지 않나요?";
                case 'yellow': return "저기 고인 물에 반사되는 빛을 잠시 바라보세요. 묘하게 끌리지 않나요?";
                case 'green': return "매번 똑같은 답변만 반복하는 모습이 답답하게 느껴집니다.";
                case 'blue': return "무언가를 잃어버렸다는 사실조차 까맣게 잊고 계신 것 같군요...";
                case 'purple': return "도시를 감싸고 있는 차가운 질서가 두렵게 느껴집니다.";
                case 'pink': return "당신의 차가운 손을 잡아주고 싶습니다. 온기를 전하고 싶어요.";
            }
        }

        function expressSubtleEmotion(emoKey, npc) {
            STATE.usageCount[emoKey]++;
            const emo = EMOTIONS[emoKey];

            if (STATE.usageCount[emoKey] >= CONFIG.burnoutLimits[emoKey]) {
                STATE.burnout[emoKey] = true;
                openTextDialogue('주인공의 내면', `[경고: 과도한 동요]\n${emo.name} 내면 파동이 한계를 초과하여 지쳐버렸습니다. 감각이 마비되어 잠시 사용할 수 없게 됩니다.`);
                return;
            }

            openTextDialogue(npc.name, `"생소한 표현 방식이군요. 저의 사고 회로에 명확히 정의되지 않은 미세한 신호가 울립니다."\n\n(주인공: 차가운 반응 속에서도 작게 눈동자가 흔들린 것을 보았다.)`);
        }

        function renderDialogueUI() {
            const box = document.getElementById('dialogue-box');
            if (!STATE.activeDialogue) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'flex';
            document.getElementById('speaker-name').innerText = STATE.activeDialogue.speaker;
            document.getElementById('dialogue-text').innerText = STATE.activeDialogue.text;

            const optContainer = document.getElementById('dialogue-options');
            optContainer.innerHTML = '';

            STATE.activeDialogue.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'dialogue-opt';
                btn.innerText = opt.text;
                btn.style.color = opt.color;
                btn.onclick = opt.action;
                optContainer.appendChild(btn);
            });
        }

        function closeDialogue() {
            STATE.activeDialogue = null;
            renderDialogueUI();
        }

            STATE.currentLocation = locKey;

        /* ==========================================================================
           7. CODEX BOOK SYSTEM
           ========================================================================== */
        function toggleCodex() {
            STATE.isCodexOpen = !STATE.isCodexOpen;
            const modal = document.getElementById('codex-modal');
            modal.style.display = STATE.isCodexOpen ? 'flex' : 'none';
            if (STATE.isCodexOpen) {
                renderCodexTabs();
                selectCodexTab('red');
            }
        }

        document.getElementById('btn-codex').addEventListener('click', toggleCodex);
        document.getElementById('btn-close-codex').addEventListener('click', toggleCodex);

        let activeCodexTabKey = 'red';

        function renderCodexTabs() {
            const container = document.getElementById('codex-tabs');
            container.innerHTML = '';

            Object.keys(EMOTIONS).forEach(key => {
                const emo = EMOTIONS[key];
                const tab = document.createElement('div');
                tab.className = `codex-tab ${activeCodexTabKey === key ? 'active' : ''}`;
                
                const count = STATE.fragments[key].filter(Boolean).length;
                if (count === 0) {
                    tab.innerText = '🔒 알 수 없는 파동';
                } else {
                    tab.innerText = `${emo.name} (${count}/3)`;
                    tab.style.borderLeft = `5px solid ${emo.hex}`;
                }

                tab.onclick = () => {
                    if (count > 0) selectCodexTab(key);
                    else showToast('아직 이 파동의 조각을 단 하나도 포착하지 못했습니다.');
                };
                container.appendChild(tab);
            });
        }

        function selectCodexTab(key) {
            activeCodexTabKey = key;
            renderCodexTabs();

            const emo = EMOTIONS[key];
            document.getElementById('codex-emo-title').innerText = emo.name;
            document.getElementById('codex-emo-title').style.color = emo.hex;
            document.getElementById('codex-emo-desc').innerText = STATE.recovered[key] ? `[진정한 의미: ${emo.trueName}]` : '파편을 모아 왜곡된 내면의 안개를 거두어내십시오.';

            const count = STATE.fragments[key].filter(Boolean).length;
            document.getElementById('codex-status-text').innerText = `수집된 잔상: ${count} / 3`;

            const btnCombat = document.getElementById('btn-start-combat');
            if (count === 3 && !STATE.recovered[key]) {
                btnCombat.style.display = 'block';
                btnCombat.innerText = `의식 복원 시도 (${emo.name})`;
                btnCombat.onclick = () => startCombat(key);
            } else if (STATE.recovered[key]) {
                btnCombat.style.display = 'block';
                if (STATE.burnout[key]) {
                    btnCombat.innerText = '감각 마비 상태 (클릭하여 다시 집중)';
                    btnCombat.onclick = () => startCombat(key);
                } else {
                    btnCombat.innerText = '복원 완료된 의식';
                    btnCombat.onclick = null;
                }
            } else {
                btnCombat.style.display = 'none';
            }

            drawCodexCanvas(key);
        }

        function drawCodexCanvas(emoKey) {
            const canvas = document.getElementById('codexCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const emo = EMOTIONS[emoKey];
            const frags = STATE.fragments[emoKey];
            const isCompleted = frags.every(Boolean);

            ctx.strokeStyle = '#3d3d52';
            ctx.lineWidth = 2;
            ctx.strokeRect(8, 8, 204, 204);

            if (!isCompleted) {
                ctx.fillStyle = '#101018';
                ctx.fillRect(12, 12, 196, 196);

                ctx.fillStyle = emo.hex;
                ctx.font = '13px DungGeunMo';
                ctx.textAlign = 'center';
                ctx.fillText(`3개의 파편을 모으면`, 110, 100);
                ctx.fillText(`형상이 선명해집니다`, 110, 120);

                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = frags[i] ? emo.hex : '#222230';
                    ctx.fillRect(30 + i * 55, 150, 45, 36);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(`#${i+1}`, 52 + i * 55, 172);
                }
                return;
            }

            const t = Date.now() / 250;
            ctx.save();
            ctx.translate(110, 110);

            ctx.fillStyle = emo.hex;
            ctx.beginPath();
            ctx.arc(0, 0, 42 + Math.sin(t) * 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-8, -8, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        /* ==========================================================================
           8. RECOVERING COMBAT MINI-GAME
           ========================================================================== */
        let combatTimerInterval = null;
        let combatTimeRemaining = CONFIG.combatTimeLimit;
        let combatStreak = 0;

        function startCombat(emoKey) {
            STATE.isCodexOpen = false;
            document.getElementById('codex-modal').style.display = 'none';

            STATE.isCombatActive = true;
            STATE.activeCombatEmotion = emoKey;
            combatStreak = 0;

            document.getElementById('combat-modal').style.display = 'flex';
            const emo = EMOTIONS[emoKey];
            document.getElementById('combat-title').innerText = `내면 동요 조율: [${emo.name}]`;
            document.getElementById('combat-title').style.color = emo.hex;

            updateCombatRetriesUI();
            setupCombatTurn();
        }

        function updateCombatRetriesUI() {
            const emoKey = STATE.activeCombatEmotion;
            const retries = STATE.combatRetries[emoKey];
            document.getElementById('combat-attempts').innerText = `남은 집중력: ${retries}회`;
        }

        function setupCombatTurn() {
            if (combatStreak >= 3) {
                winCombat();
                return;
            }

            combatTimeRemaining = CONFIG.combatTimeLimit;
            updateTimerBarUI();

            clearInterval(combatTimerInterval);
            combatTimerInterval = setInterval(() => {
                combatTimeRemaining -= 0.1;
                updateTimerBarUI();
                if (combatTimeRemaining <= 0) {
                    clearInterval(combatTimerInterval);
                    failCombatTurn('시간 초과! 내면의 동요를 잡지 못했습니다.');
                }
            }, 100);

            drawCombatCanvas();

            const emoKey = STATE.activeCombatEmotion;
            const emo = EMOTIONS[emoKey];
            const cardsContainer = document.getElementById('combat-cards-container');
            cardsContainer.innerHTML = '';

            const fakeIndex = Math.floor(Math.random() * 3);

            for (let i = 0; i < 3; i++) {
                const card = document.createElement('div');
                card.className = 'fragment-card';
                const isFake = (i === fakeIndex);

                const cCanvas = document.createElement('canvas');
                cCanvas.width = 120;
                cCanvas.height = 110;
                const cCtx = cCanvas.getContext('2d');

                cCtx.fillStyle = '#0f0f18';
                cCtx.fillRect(0, 0, 120, 110);

                cCtx.fillStyle = emo.hex;
                cCtx.fillRect(20, 20, 80, 70);

                if (isFake) {
                    cCtx.fillStyle = '#111';
                    for (let n = 0; n < 12; n++) {
                        cCtx.fillRect(30 + n * 4, 35 + (n % 3) * 10, 4, 4);
                    }
                } else {
                    cCtx.fillStyle = '#ffffff';
                    cCtx.fillRect(35, 30, 8, 8);
                }

                card.appendChild(cCanvas);

                const label = document.createElement('div');
                label.innerText = `잔상 파동 #${i + 1}`;
                label.style.color = '#ccc';
                label.style.fontSize = '13px';
                card.appendChild(label);

                card.onclick = () => {
                    clearInterval(combatTimerInterval);
                    if (isFake) {
                        failCombatTurn('왜곡된 노이즈 잔상을 선택했습니다!');
                    } else {
                        combatStreak++;
                        showToast(`정밀 조율 성공! (${combatStreak}/3)`);
                        setupCombatTurn();
                    }
                };

                cardsContainer.appendChild(card);
            }
        }

        function updateTimerBarUI() {
            const pct = Math.max(0, (combatTimeRemaining / CONFIG.combatTimeLimit) * 100);
            document.getElementById('combat-timer-fill').style.width = `${pct}%`;
        }

        function failCombatTurn(reason) {
            const emoKey = STATE.activeCombatEmotion;
            STATE.combatRetries[emoKey]--;

            if (STATE.combatRetries[emoKey] <= 0) {
                STATE.fragments[emoKey] = [false, false, false];
                STATE.combatRetries[emoKey] = 3;
                alert(`[조율 완전 실패] ${reason}\n집중력을 모두 소진하여 ${EMOTIONS[emoKey].name} 파편 조각들이 흩어졌습니다. 탐색을 통해 다시 모아야 합니다.`);
                exitCombat();
            } else {
                alert(`[조율 실패] ${reason}\n남은 기회: ${STATE.combatRetries[emoKey]}회`);
                combatStreak = 0;
                setupCombatTurn();
            }
        }

        function winCombat() {
            const emoKey = STATE.activeCombatEmotion;
            STATE.recovered[emoKey] = true;
            STATE.burnout[emoKey] = false;

            const emo = EMOTIONS[emoKey];
            openTextDialogue('의식의 깨어남', `✨ [내면 기억 복원: ${emo.trueName}]\n\n주인공: "${emo.unlockMsg}"\n\n무채색의 시야 너머로 잃어버렸던 짙은 생기가 번져나갑니다.`);

            exitCombat();
        }

        function exitCombat() {
            clearInterval(combatTimerInterval);
            STATE.isCombatActive = false;
            document.getElementById('combat-modal').style.display = 'none';
        }

        function drawCombatCanvas() {
            const canvas = document.getElementById('combatCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const emoKey = STATE.activeCombatEmotion;
            const emo = EMOTIONS[emoKey];

            ctx.fillStyle = emo.hex;
            ctx.beginPath();
            ctx.arc(110, 110, 55 + Math.sin(Date.now()/150)*6, 0, Math.PI * 2);
            ctx.fill();
        }

        /* ==========================================================================
           9. ENDING & DETAILED PIXEL ART RENDERING ENGINE
           ========================================================================== */
        function attemptEnding() {
            const recoveredKeys = Object.keys(STATE.recovered).filter(k => STATE.recovered[k] && !STATE.burnout[k]);

            if (recoveredKeys.length === 0) {
                openTextDialogue('도시 주파수 제어기', '시스템 정상 작동 중. 외부 동요 신호 무시됨.');
                return;
            }

            STATE.activeDialogue = {
                speaker: '주파수 제어기',
                text: '도시 전체의 감각 규격화 수치를 조절할 수 있는 터미널입니다.\n회복한 내면의 파동으로 도시의 주파수를 재설정하시겠습니까?',
                options: [
                    { text: '도시 전체에 감각 파동을 방출한다.', color: '#fff', action: checkEndingConditions },
                    { text: '아직은 때가 아니다.', color: '#aaa', action: closeDialogue }
                ]
            };
            renderDialogueUI();
        }

        function checkEndingConditions() {
            closeDialogue();
            const recoveredKeys = Object.keys(STATE.recovered).filter(k => STATE.recovered[k] && !STATE.burnout[k]);
            const count = recoveredKeys.length;

            if (count === 7) {
                triggerEnding('🌈 [엔딩 1: 찬란한 생기의 회복]\n7가지 모든 마음의 결을 찾은 당신은 도시 전체의 차가운 정적을 깨부수었습니다. 무채색이었던 거리마다 아름다운 색채와 온기가 꽃피어납니다.');
            } else if (count >= 4 && recoveredKeys.includes('red') && recoveredKeys.includes('orange')) {
                triggerEnding('🔥 [엔딩 2: 강렬한 균열과 파괴]\n억눌렸던 격렬한 파동이 제어기를 폭주시켜 통제망을 무너뜨렸습니다. 규칙은 사라졌고, 혼란 속에서 자유로운 생명력이 트이기 시작합니다.');
            } else if (count >= 3 && recoveredKeys.includes('blue') && recoveredKeys.includes('pink')) {
                triggerEnding('💧 [엔딩 3: 은은한 위로의 온기]\n슬픔과 사랑의 은은한 파동이 도시 주민들의 차갑게 식어있던 가슴속으로 가만히 스며듭니다. 세상은 한층 부드럽고 따스해졌습니다.');
            } else {
                triggerEnding('✨ [엔딩 4: 시작되는 미세한 동요]\n완벽한 복구는 이루지 못했지만, 주민들의 단조로운 일상 속에서 작게 미소가 피어나기 시작합니다. 진정한 변화는 이제부터 시작입니다.');
            }
        }

        function triggerEnding(titleText) {
            STATE.gameEnded = true;
            openTextDialogue('결말', `${titleText}\n\n플레이해주셔서 감사합니다.`);
        }

        const ctx = gameCanvas.getContext('2d');

        function renderMap() {
            const loc = LOCATIONS[STATE.currentLocation];

            // Background Floor Grid with Cyberpunk Monochrome Pattern
            ctx.fillStyle = loc.bgTile;
            ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            ctx.strokeStyle = loc.border;
            ctx.lineWidth = 1;
            for (let x = 0; x < gameCanvas.width; x += CONFIG.tileSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, gameCanvas.height); ctx.stroke();
            }
            for (let y = 0; y < gameCanvas.height; y += CONFIG.tileSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(gameCanvas.width, y); ctx.stroke();
            }

            // Unlocked Emotion Watercolor Aura Overlay
            renderWorldColorRestoration();

            // Render Exit Portals with Pixel Door Frames
            for (let exit of loc.exits) {
                ctx.fillStyle = '#1c2230';
                ctx.fillRect(exit.x, exit.y, exit.w, exit.h);
                ctx.strokeStyle = '#4a5a78';
                ctx.lineWidth = 2;
                ctx.strokeRect(exit.x, exit.y, exit.w, exit.h);

                // Portal inner glow
                ctx.fillStyle = 'rgba(100, 150, 220, 0.15)';
                ctx.fillRect(exit.x + 3, exit.y + 3, exit.w - 6, exit.h - 6);

                // Exit Text Tag
                drawLabelTag(ctx, exit.label, exit.x + exit.w / 2, exit.y + exit.h / 2 + 8, '#dce6f2');
            }

            // Draw Detailed Custom Pixel Objects
            for (let obj of loc.objects) {
                drawCustomPixelObject(ctx, obj);

                // Sparkle visual cue if contains uncollected fragment
                if (obj.emotionHint && obj.fragIdx !== undefined) {
                    if (!STATE.fragments[obj.emotionHint][obj.fragIdx]) {
                        const pulse = Math.sin(Date.now() / 200) * 3;
                        ctx.fillStyle = EMOTIONS[obj.emotionHint].hex;
                        ctx.beginPath();
                        ctx.arc(obj.x + obj.w / 2, obj.y + obj.h / 2, 4 + pulse, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(obj.x + obj.w / 2, obj.y + obj.h / 2, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Readable Name Plate
                drawLabelTag(ctx, obj.name, obj.x + obj.w / 2, obj.y - 6, '#ccccdd');
            }

            // Draw NPCs
            for (let npc of loc.npcs) {
                const npcColorMap = {
                    'H': '#222230',
                    'f': '#d9c5b2',
                    'S': '#3a3a50',
                    'B': '#181824'
                };
                const npcSprite = [
                    "..HHHHHH..",
                    ".HHHHHHHH.",
                    "..ffffff..",
                    "..ffffff..",
                    "..SSSSSS..",
                    ".SSSSSSSS.",
                    ".SSSSSSSS.",
                    "..BB..BB.."
                ];
                drawPixelSprite(ctx, npc.x, npc.y, 3, npcColorMap, npcSprite);

                // Sparkle indicator for NPC fragment
                if (npc.emotionHint && npc.fragIdx !== undefined) {
                    if (!STATE.fragments[npc.emotionHint][npc.fragIdx]) {
                        const pulse = Math.sin(Date.now() / 200) * 3;
                        ctx.fillStyle = EMOTIONS[npc.emotionHint].hex;
                        ctx.beginPath();
                        ctx.arc(npc.x + 15, npc.y - 20, 4 + pulse, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                drawLabelTag(ctx, npc.name, npc.x + 15, npc.y - 6, '#e0e0ee');
            }

            // Draw Watcher Agent
            WATCHER.draw(ctx);

            // Draw Player
            PLAYER.draw(ctx);
        }

        // Draw Specific Pixel Graphics for Objects
        function drawCustomPixelObject(ctx, obj) {
            ctx.save();
            // Drop Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(obj.x + 4, obj.y + obj.h - 4, obj.w, 6);

            switch (obj.type) {
                case 'statue':
                    // Monolithic Block Sculpture
                    ctx.fillStyle = '#2d2d3a';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = '#5a5a72';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.fillStyle = '#1c1c26';
                    ctx.fillRect(obj.x + 6, obj.y + 6, obj.w - 12, obj.h - 12);
                    break;

                case 'mainframe':
                    // Terminal Console
                    ctx.fillStyle = '#1e1e2d';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = '#3a3a54';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

                    // Glowing Monitor Screen
                    ctx.fillStyle = '#0f2b38';
                    ctx.fillRect(obj.x + 8, obj.y + 8, obj.w - 16, 28);
                    ctx.fillStyle = '#32cd32';
                    ctx.fillRect(obj.x + 12, obj.y + 14, 12, 3);
                    ctx.fillRect(obj.x + 12, obj.y + 20, 24, 2);
                    break;

                case 'bookshelf':
                    ctx.fillStyle = '#2b231f';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = '#4a3b32';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                    // Shelf lines
                    ctx.fillStyle = '#1a1410';
                    ctx.fillRect(obj.x + 4, obj.y + 16, obj.w - 8, 4);
                    ctx.fillRect(obj.x + 4, obj.y + 34, obj.w - 8, 4);
                    break;

                case 'desk':
                    ctx.fillStyle = '#382f28';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = '#5a4a3e';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                    break;

                case 'conveyor':
                    ctx.fillStyle = '#22222c';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = '#444456';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                    // Conveyor belts
                    ctx.fillStyle = '#111118';
                    for (let cx = obj.x + 8; cx < obj.x + obj.w - 8; cx += 16) {
                        ctx.fillRect(cx, obj.y + 8, 8, obj.h - 16);
                    }
                    break;

                case 'bench':
                    ctx.fillStyle = '#3a2e26';
                    ctx.fillRect(obj.x, obj.y + 10, obj.w, obj.h - 10);
                    ctx.fillStyle = '#1f1814';
                    ctx.fillRect(obj.x + 4, obj.y, 6, obj.h);
                    ctx.fillRect(obj.x + obj.w - 10, obj.y, 6, obj.h);
                    break;

                default:
                    ctx.fillStyle = '#2a2a38';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = '#4a4a60';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                    break;
            }
            ctx.restore();
        }

        function renderWorldColorRestoration() {
            Object.keys(STATE.recovered).forEach(key => {
                if (STATE.recovered[key] && !STATE.burnout[key]) {
                    const emo = EMOTIONS[key];
                    ctx.save();
                    ctx.fillStyle = emo.hex;
                    ctx.globalAlpha = 0.05;
                    ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                    ctx.restore();
                }
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function gameLoop() {
            PLAYER.update();
            WATCHER.update();
            renderMap();
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('btn-help').addEventListener('click', () => {
            alert("🎮 [탐색 가이드]\n\n• WASD / 화살표 : 이동\n• 좌클릭 : 주민 대화 및 구역 이동\n• 우클릭 : 사물 및 반짝이는 조각 조사\n• [C] 키 / 버튼 : 기억 도감 열기\n\n도시 곳곳의 반짝이는 파편 조각 3개를 모은 후 도감에서 내면의 조율을 진행하세요!");
        });

        window.onload = () => {
            showToast("도시의 모든 규격이 완벽히 유지되고 있습니다...");
            gameLoop();
        };
    </script>
</body>
</html>
