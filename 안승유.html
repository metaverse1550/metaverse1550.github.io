<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>왕국으로 돌아가는 길 - Fantasy Puzzle Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e0933 0%, #3a0d4c 20%, #0f2b48 40%, #2b1055 60%, #431235 80%, #0d1b2a 100%);
            background-size: 400% 400%;
            animation: vibrantBgGradient 16s ease infinite;
            color: #f3e8ff;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        @keyframes vibrantBgGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: #a78bfa;
            border-radius: 3px;
        }
        /* Glassmorphic UI styling */
        .glass-panel {
            background: rgba(35, 25, 52, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(232, 180, 254, 0.35);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(216, 180, 254, 0.12);
        }
        
        @keyframes bgOrbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(30px, -40px) scale(1.2); opacity: 0.7; }
        }
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
            animation: bgOrbFloat 8s ease-in-out infinite alternate;
        }
        .pulse-glow {
            animation: pulseGlow 2.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(232, 121, 249, 0.4), 0 0 30px rgba(167, 139, 250, 0.3); }
            100% { box-shadow: 0 0 32px rgba(251, 146, 60, 0.8), 0 0 50px rgba(236, 72, 153, 0.6); }
        }
        .fairy-float {
            animation: fairyFloat 3s ease-in-out infinite alternate;
        }
        @keyframes fairyFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(2deg); }
        }
        /* Screen shake animation on trap damage */
        .shake {
            animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 1px, 0); }
            20%, 80% { transform: translate3d(4px, -2px, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 3px, 0); }
            40%, 60% { transform: translate3d(5px, -3px, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4 select-none">

    <!-- Ambient Background Magical Orbs with Vibrant Colorful Gradients -->
    <div class="bg-orb w-[500px] h-[500px] bg-gradient-to-tr from-pink-500/35 via-purple-600/30 to-indigo-500/35 top-[-100px] left-[-100px]"></div>
    <div class="bg-orb w-[450px] h-[450px] bg-gradient-to-tr from-cyan-400/30 via-emerald-500/30 to-teal-600/30 bottom-[-100px] right-[-100px]" style="animation-delay: -4s;"></div>
    <div class="bg-orb w-[400px] h-[400px] bg-gradient-to-tr from-amber-400/30 via-rose-500/30 to-violet-600/30 top-1/3 left-1/2 -translate-x-1/2" style="animation-delay: -2s;"></div>
    <div class="bg-orb w-[350px] h-[350px] bg-gradient-to-tr from-fuchsia-500/25 via-sky-400/25 to-lime-400/25 bottom-1/4 left-10" style="animation-delay: -6s;"></div>

    <!-- Main Game Container -->
    <div id="game-container" class="relative w-full max-w-5xl bg-slate-950 rounded-3xl overflow-hidden shadow-2xl border-2 border-purple-400/40 flex flex-col items-center transition-transform z-10">
        
        <!-- Top HUD Bar -->
        <div class="w-full glass-panel px-4 py-3 flex flex-wrap items-center justify-between z-10 text-xs sm:text-sm md:text-base border-b border-pink-400/30">
            <!-- Room Indicator -->
            <div class="flex items-center gap-2">
                <span class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 text-pink-100 px-3.5 py-1 rounded-full font-bold border border-pink-300/50 font-jua text-sm sm:text-lg shadow-md flex items-center gap-1">
                    🌸 요정의 정원 <span id="hud-room" class="text-amber-300 font-extrabold">1</span> / 5
                </span>
                <span id="hud-room-title" class="hidden sm:inline text-pink-200 text-xs font-semibold drop-shadow">
                    [ 모험의 시작 ]
                </span>
            </div>

            <!-- Health Bar -->
            <div class="flex items-center gap-2 my-1 sm:my-0">
                <span class="font-bold text-pink-200 font-jua flex items-center gap-1 text-sm sm:text-base drop-shadow">💖 체력</span>
                <div class="w-28 sm:w-44 h-5 bg-slate-950/80 rounded-full overflow-hidden p-0.5 border border-pink-400/50 relative shadow-inner">
                    <div id="hud-hp-bar" class="h-full bg-gradient-to-r from-rose-500 via-pink-400 to-amber-300 rounded-full transition-all duration-300" style="width: 100%;"></div>
                    <span id="hud-hp-text" class="absolute inset-0 flex items-center justify-center text-[10px] sm:text-xs font-extrabold text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">100 / 100</span>
                </div>
            </div>

            <!-- Active Buffs -->
            <div id="hud-buffs" class="flex gap-2 text-xs">
                <!-- Dynamic Buff Badges -->
            </div>
        </div>

        <!-- Canvas Frame -->
        <div class="relative w-full aspect-[4/3] sm:aspect-[16/10] max-h-[70vh] flex justify-center items-center bg-slate-950 overflow-hidden">
            <canvas id="gameCanvas" class="w-full h-full object-contain block"></canvas>

            <!-- Interactive Prompt Overlay -->
            <div id="interaction-prompt" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-2xl text-amber-200 font-jua text-sm sm:text-base flex items-center gap-2 animate-bounce shadow-xl border border-amber-300/60 pointer-events-none">
                <span class="bg-amber-400 text-purple-950 font-extrabold px-2.5 py-0.5 rounded-lg text-xs shadow">Space</span>
                <span id="prompt-text">✨ 요정의 마법 제단 상호작용</span>
            </div>

            <!-- Item Notification Toast -->
            <div id="toast-msg" class="hidden absolute top-6 left-1/2 -translate-x-1/2 glass-panel px-5 py-2.5 rounded-2xl text-amber-200 font-bold font-jua text-xs sm:text-sm transition-all duration-300 transform -translate-y-4 opacity-0 pointer-events-none border border-amber-400/60 shadow-2xl">
                ✨ 아이템 획득!
            </div>
        </div>

        <!-- Bottom Controls & Inventory Bar -->
        <div class="w-full glass-panel p-3 flex flex-col md:flex-row items-center justify-between gap-3 z-10 border-t border-purple-400/30">
            <!-- Inventory Slots -->
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <span class="text-xs font-bold text-pink-200 font-jua whitespace-nowrap flex items-center gap-1">🎒 마법 가방:</span>
                <div id="inventory-slots" class="flex gap-2">
                    <!-- Inventory items -->
                </div>
            </div>

            <!-- Guide / Controls Legend -->
            <div class="text-[11px] sm:text-xs text-purple-200/90 flex items-center gap-3 flex-wrap justify-center md:justify-end font-medium">
                <span>🎮 <strong class="text-amber-200">방향키 / WASD</strong>: 이동</span>
                <span>✨ <strong class="text-amber-200">Space</strong>: 퍼즐 풀기 / 타일 회전</span>
                <span>🧪 <strong class="text-amber-200">1~4 / 클릭</strong>: 보물 사용</span>
            </div>
        </div>
    </div>

    <!-- Puzzle UI Overlay (Modal) -->
    <div id="puzzle-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-purple-950/75 backdrop-blur-md">
        <div class="glass-panel p-6 rounded-3xl max-w-lg w-full flex flex-col items-center gap-4 border-2 border-pink-300/60 shadow-2xl relative fairy-float">
            <button id="btn-close-puzzle" class="absolute top-3 right-4 text-pink-300 hover:text-white font-bold text-2xl transition hover:scale-110">✕</button>

            <div class="text-center">
                <h2 id="puzzle-modal-title" class="text-2xl font-jua text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.6)]">🔮 요정의 마법 퍼즐</h2>
                <p id="puzzle-modal-desc" class="text-xs sm:text-sm text-pink-100 mt-1">퍼즐 설명이 여기에 표시됩니다.</p>
            </div>

            <!-- Canvas for Puzzle Shapes Rendering inside modal -->
            <div class="relative bg-slate-950/90 rounded-2xl p-4 border border-pink-400/40 flex justify-center items-center shadow-inner">
                <canvas id="puzzleCanvas" width="320" height="300" class="cursor-pointer rounded-xl"></canvas>
            </div>

            <!-- Puzzle Controls / Buttons -->
            <div class="flex gap-3 w-full justify-center">
                <button id="btn-hint-puzzle" class="px-4 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-jua rounded-2xl text-sm transition shadow-lg flex items-center gap-1 border border-purple-300/40">
                    🔍 지혜의 돋보기 사용
                </button>
                <button id="btn-solve-puzzle" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-pink-500 hover:from-amber-400 hover:to-pink-400 text-purple-950 font-extrabold font-jua rounded-2xl text-sm transition shadow-lg border border-amber-200">
                    🔓 즉시 해제하기
                </button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-lg">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full flex flex-col items-center text-center gap-5 border-2 border-rose-400/60 shadow-2xl">
            <div class="text-6xl animate-bounce">🥀</div>
            <div>
                <h2 class="text-3xl font-jua text-rose-300">모험의 일시 중단</h2>
                <p class="text-pink-100 text-sm mt-2">정원의 가시 함정을 버티지 못했습니다.<br>마법의 기운을 다듬어 다시 시작해볼까요?</p>
            </div>
            <button id="btn-restart" class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white font-jua text-lg rounded-2xl shadow-lg transition transform hover:scale-105 border border-pink-300/40">
                🔄 요정의 정원 다시 도전하기
            </button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-purple-950/85 backdrop-blur-lg">
        <div class="glass-panel p-8 rounded-3xl max-w-lg w-full flex flex-col items-center text-center gap-5 border-2 border-amber-300/80 shadow-2xl pulse-glow">
            <div class="text-6xl animate-pulse">👑</div>
            <div>
                <h2 class="text-3xl font-jua text-amber-300 drop-shadow">왕국 귀환 성공!</h2>
                <p class="text-pink-100 text-sm mt-2">5개의 신비로운 요정 퍼즐 정원을 모두 풀고 무사히 아름다운 왕국으로 돌아왔습니다!</p>
            </div>
            <div id="victory-stats" class="w-full bg-purple-950/70 rounded-2xl p-4 text-xs text-pink-100 space-y-1.5 text-left border border-pink-400/30 shadow-inner">
                <!-- End Stats -->
            </div>
            <button id="btn-play-again" class="w-full py-3.5 bg-gradient-to-r from-amber-400 via-pink-400 to-emerald-400 hover:from-amber-300 hover:to-emerald-300 text-purple-950 font-jua text-lg font-bold rounded-2xl shadow-xl transition transform hover:scale-105 border border-amber-200">
                🏰 새로운 모험 떠나기
            </button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           6. PUZZLE: 3종류의 다채로운 요정 마법 퍼즐 시스템
           ========================================================================== */
        const PUZZLE = {
            canvas: null,
            ctx: null,
            mode: 'SHAPE', // 'SHAPE', 'PATH', 'MEMORY'
            
            // 1) Shape Puzzle Data
            slots: [],
            pieces: [],
            selectedPiece: null,
            shapeTypes: [
                { id: 'star', name: '별', color: '#fbbf24' },
                { id: 'moon', name: '초승달', color: '#38bdf8' },
                { id: 'gem', name: '보석', color: '#f472b6' },
                { id: 'heart', name: '하트', color: '#f43f5e' },
                { id: 'flower', name: '꽃', color: '#a78bfa' },
                { id: 'sun', name: '태양', color: '#fb923c' }
            ],

            // 2) Path Pipe Connection Data
            gridSize: 3,
            pathGrid: [],
            
            // 3) Rune Memory Sequence Data
            sequence: [],
            playerSeq: [],
            runes: [
                { id: 0, name: '불꽃 룬', color: '#f43f5e', x: 160, y: 80, symbol: '🔥' },
                { id: 1, name: '물결 룬', color: '#38bdf8', x: 235, y: 155, symbol: '💧' },
                { id: 2, name: '대지 룬', color: '#34d399', x: 160, y: 230, symbol: '🌿' },
                { id: 3, name: '빛 룬', color: '#fbbf24', x: 85, y: 155, symbol: '✨' }
            ],
            showingSeqIndex: -1,
            isShowingSeq: false,
            seqTimer: null,

            init() {
                this.canvas = document.getElementById('puzzleCanvas');
                if (this.canvas) {
                    this.ctx = this.canvas.getContext('2d');
                    
                    const handleInput = (e) => {
                        if (GAME.state !== 'PUZZLE_MODE') return;
                        const rect = this.canvas.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const clickY = e.clientY - rect.top;
                        this.handleClick(clickX, clickY);
                    };

                    this.canvas.addEventListener('click', handleInput);
                }
            },

            setupPuzzle(roomIndex) {
                if (!this.canvas) {
                    this.canvas = document.getElementById('puzzleCanvas');
                    this.ctx = this.canvas.getContext('2d');
                }
                this.canvas.width = 320;
                this.canvas.height = 300;

                if (this.seqTimer) clearTimeout(this.seqTimer);

                // 방 별 퍼즐 모드 결정
                if (roomIndex === 0) this.mode = 'SHAPE';
                else if (roomIndex === 1) this.mode = 'PATH';
                else if (roomIndex === 2) this.mode = 'MEMORY';
                else if (roomIndex === 3) this.mode = 'SHAPE';
                else this.mode = 'MEMORY';

                UI.updatePuzzleModalTitle(roomIndex, this.mode);

                if (this.mode === 'SHAPE') {
                    this.setupShapePuzzle(roomIndex);
                } else if (this.mode === 'PATH') {
                    this.setupPathPuzzle(roomIndex);
                } else if (this.mode === 'MEMORY') {
                    this.setupMemoryPuzzle(roomIndex);
                }

                this.draw();
            },

            /* --- Mode 1: Shape Puzzle --- */
            setupShapePuzzle(roomIndex) {
                const count = roomIndex === 0 ? 3 : 4;
                const shuffledTypes = [...this.shapeTypes].sort(() => Math.random() - 0.5).slice(0, count);

                this.slots = [];
                this.pieces = [];
                this.selectedPiece = null;

                const slotWidth = this.canvas.width / count;
                for (let i = 0; i < count; i++) {
                    this.slots.push({
                        id: i,
                        type: shuffledTypes[i],
                        x: slotWidth * i + slotWidth / 2,
                        y: 75,
                        size: 26,
                        isFilled: false
                    });
                }

                const shuffledPieces = [...shuffledTypes].sort(() => Math.random() - 0.5);
                for (let i = 0; i < count; i++) {
                    this.pieces.push({
                        id: i,
                        type: shuffledPieces[i],
                        x: slotWidth * i + slotWidth / 2,
                        y: 220,
                        size: 24,
                        isPlaced: false,
                        isSelected: false
                    });
                }
            },

            /* --- Mode 2: Path Puzzle --- */
            setupPathPuzzle(roomIndex) {
                this.gridSize = 3;
                this.pathGrid = [];

                // 3x3 길 타일 생성 [Top, Right, Bottom, Left]
                const tileTemplates = [
                    { type: 'curve', baseConn: [1, 1, 0, 0] }, // 0: Top-Right
                    { type: 'line',  baseConn: [0, 1, 0, 1] }, // 1: Horizontal
                    { type: 'curve', baseConn: [0, 1, 1, 0] }, // 2: Right-Bottom
                    { type: 'line',  baseConn: [1, 0, 1, 0] }, // 3: Vertical
                    { type: 'cross', baseConn: [1, 1, 1, 1] }, // 4: Cross
                    { type: 'curve', baseConn: [1, 0, 0, 1] }, // 5: Top-Left
                    { type: 'curve', baseConn: [0, 1, 1, 0] }, // 6: Right-Bottom
                    { type: 'line',  baseConn: [0, 1, 0, 1] }, // 7: Horizontal
                    { type: 'curve', baseConn: [1, 0, 0, 1] }  // 8: Top-Left
                ];

                for (let r = 0; r < 3; r++) {
                    this.pathGrid[r] = [];
                    for (let c = 0; c < 3; c++) {
                        const idx = r * 3 + c;
                        const template = tileTemplates[idx];
                        const randomRot = Math.floor(Math.random() * 4);
                        this.pathGrid[r][c] = {
                            r, c,
                            type: template.type,
                            baseConn: template.baseConn,
                            rot: randomRot
                        };
                    }
                }
            },

            /* --- Mode 3: Memory Puzzle --- */
            setupMemoryPuzzle(roomIndex) {
                const seqLength = roomIndex === 2 ? 4 : 5;
                this.sequence = [];
                this.playerSeq = [];
                for (let i = 0; i < seqLength; i++) {
                    this.sequence.push(Math.floor(Math.random() * 4));
                }
                this.playMemorySequence();
            },

            playMemorySequence() {
                this.isShowingSeq = true;
                this.playerSeq = [];
                let step = 0;

                const nextStep = () => {
                    if (step < this.sequence.length) {
                        this.showingSeqIndex = this.sequence[step];
                        this.draw();
                        EFFECTS.add(this.runes[this.showingSeqIndex].x, this.runes[this.showingSeqIndex].y, this.runes[this.showingSeqIndex].color, 12, 3);
                        step++;
                        this.seqTimer = setTimeout(() => {
                            this.showingSeqIndex = -1;
                            this.draw();
                            this.seqTimer = setTimeout(nextStep, 350);
                        }, 500);
                    } else {
                        this.isShowingSeq = false;
                        this.showingSeqIndex = -1;
                        this.draw();
                        UI.showToast('🪄 빛난 룬 문양의 순서를 그대로 터치하세요!');
                    }
                };
                this.seqTimer = setTimeout(nextStep, 600);
            },

            handleClick(x, y) {
                if (this.mode === 'SHAPE') {
                    this.handleShapeClick(x, y);
                } else if (this.mode === 'PATH') {
                    this.handlePathClick(x, y);
                } else if (this.mode === 'MEMORY') {
                    this.handleMemoryClick(x, y);
                }
            },

            handleShapeClick(x, y) {
                for (const piece of this.pieces) {
                    if (piece.isPlaced) continue;
                    const dist = Math.hypot(x - piece.x, y - piece.y);
                    if (dist < piece.size + 12) {
                        this.pieces.forEach(p => p.isSelected = false);
                        piece.isSelected = true;
                        this.selectedPiece = piece;
                        EFFECTS.add(piece.x, piece.y, piece.type.color, 8, 2);
                        this.draw();
                        return;
                    }
                }

                for (const slot of this.slots) {
                    const dist = Math.hypot(x - slot.x, y - slot.y);
                    if (dist < slot.size + 16) {
                        if (slot.isFilled) return;
                        if (this.selectedPiece) {
                            if (this.selectedPiece.type.id === slot.type.id) {
                                slot.isFilled = true;
                                this.selectedPiece.isPlaced = true;
                                this.selectedPiece.isSelected = false;
                                const color = this.selectedPiece.type.color;
                                this.selectedPiece = null;
                                EFFECTS.add(slot.x, slot.y, color, 25, 4);
                                UI.showToast('✨ 문양이 완벽하게 들어맞았습니다!');
                                this.draw();
                                this.checkVictory();
                            } else {
                                EFFECTS.add(slot.x, slot.y, '#f43f5e', 10, 2);
                                UI.showToast('🥀 모양이 일치하지 않습니다.');
                            }
                        } else {
                            UI.showToast('👇 먼저 아래 마법 조각을 선택하세요.');
                        }
                        return;
                    }
                }
            },

            handlePathClick(x, y) {
                const offsetX = 50;
                const offsetY = 40;
                const cellSize = 73;

                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        const cx = offsetX + c * cellSize;
                        const cy = offsetY + r * cellSize;
                        if (x >= cx && x < cx + cellSize && y >= cy && y < cy + cellSize) {
                            const tile = this.pathGrid[r][c];
                            tile.rot = (tile.rot + 1) % 4;
                            EFFECTS.add(cx + cellSize / 2, cy + cellSize / 2, '#38bdf8', 10, 2.5);
                            this.draw();
                            this.checkPathVictory();
                            return;
                        }
                    }
                }
            },

            handleMemoryClick(x, y) {
                if (this.isShowingSeq) return;

                for (const rune of this.runes) {
                    const dist = Math.hypot(x - rune.x, y - rune.y);
                    if (dist < 32) {
                        this.playerSeq.push(rune.id);
                        EFFECTS.add(rune.x, rune.y, rune.color, 18, 3.5);
                        
                        const currentIndex = this.playerSeq.length - 1;
                        if (this.playerSeq[currentIndex] !== this.sequence[currentIndex]) {
                            UI.showToast('🥀 순서가 틀렸습니다! 다시 시작합니다.');
                            this.playerSeq = [];
                            setTimeout(() => this.playMemorySequence(), 800);
                        } else {
                            if (this.playerSeq.length === this.sequence.length) {
                                UI.showToast('✨ 룬 문양 기억 성공!');
                                this.checkVictory();
                            } else {
                                UI.showToast(`✨ 올바른 순서! (${this.playerSeq.length} / ${this.sequence.length})`);
                            }
                        }
                        this.draw();
                        return;
                    }
                }
            },

            getRotatedConn(tile) {
                const conn = [...tile.baseConn];
                const shift = tile.rot % 4;
                for (let i = 0; i < shift; i++) {
                    conn.unshift(conn.pop());
                }
                return conn; // [Top, Right, Bottom, Left]
            },

            checkPathVictory() {
                // BFS로 (0,0) [Top 입구] 에서 (2,2) [Right/Bottom 출구] 연결 확인
                const startTile = this.pathGrid[0][0];
                const startConn = this.getRotatedConn(startTile);
                if (!startConn[3] && !startConn[0]) return; // 좌/상 연결 필요

                const visited = Array(3).fill(null).map(() => Array(3).fill(false));
                const queue = [{ r: 0, c: 0 }];
                visited[0][0] = true;

                while (queue.length > 0) {
                    const { r, c } = queue.shift();
                    if (r === 2 && c === 2) {
                        this.checkVictory();
                        return;
                    }

                    const currConn = this.getRotatedConn(this.pathGrid[r][c]);
                    const dirs = [
                        { dr: -1, dc: 0, outIdx: 0, inIdx: 2 }, // Top
                        { dr: 0, dc: 1, outIdx: 1, inIdx: 3 },  // Right
                        { dr: 1, dc: 0, outIdx: 2, inIdx: 0 },  // Bottom
                        { dr: 0, dc: -1, outIdx: 3, inIdx: 1 }  // Left
                    ];

                    for (const dir of dirs) {
                        if (currConn[dir.outIdx]) {
                            const nr = r + dir.dr;
                            const nc = c + dir.dc;
                            if (nr >= 0 && nr < 3 && nc >= 0 && nc < 3 && !visited[nr][nc]) {
                                const nextConn = this.getRotatedConn(this.pathGrid[nr][nc]);
                                if (nextConn[dir.inIdx]) {
                                    visited[nr][nc] = true;
                                    queue.push({ r: nr, c: nc });
                                }
                            }
                        }
                    }
                }
            },

            useHint() {
                if (this.mode === 'SHAPE') {
                    const unfilledSlot = this.slots.find(s => !s.isFilled);
                    if (unfilledSlot) {
                        const matchingPiece = this.pieces.find(p => p.type.id === unfilledSlot.type.id && !p.isPlaced);
                        if (matchingPiece) {
                            unfilledSlot.isFilled = true;
                            matchingPiece.isPlaced = true;
                            matchingPiece.isSelected = false;
                            if (this.selectedPiece === matchingPiece) this.selectedPiece = null;
                            EFFECTS.add(unfilledSlot.x, unfilledSlot.y, '#fbbf24', 30, 4.5);
                            UI.showToast(`🔍 [${unfilledSlot.type.name}] 조각을 찾아서 맞췄습니다!`);
                            this.draw();
                            this.checkVictory();
                        }
                    }
                } else if (this.mode === 'PATH') {
                    // 아무 타일이나 맞게 회전
                    for (let r = 0; r < 3; r++) {
                        for (let c = 0; c < 3; c++) {
                            const tile = this.pathGrid[r][c];
                            if (tile.rot !== 0) {
                                tile.rot = 0;
                                EFFECTS.add(50 + c * 73 + 36, 40 + r * 73 + 36, '#fbbf24', 25, 4);
                                UI.showToast('🔍 지혜의 돋보기로 별빛 경로 하나를 올바르게 정렬했습니다!');
                                this.draw();
                                this.checkPathVictory();
                                return;
                            }
                        }
                    }
                } else if (this.mode === 'MEMORY') {
                    UI.showToast('🔍 룬 문양 순서를 다시 보여줍니다.');
                    this.playMemorySequence();
                }
            },

            checkVictory() {
                let isComplete = false;
                if (this.mode === 'SHAPE') isComplete = this.slots.every(s => s.isFilled);
                else if (this.mode === 'PATH' || this.mode === 'MEMORY') isComplete = true;

                if (isComplete) {
                    setTimeout(() => {
                        MAP.currentRoom.door.isOpen = true;
                        MAP.currentRoom.altar.solved = true;
                        UI.closePuzzleModal();
                        UI.showToast('🌸 퍼즐 해결 완료! 요정의 문이 열렸습니다.');
                        EFFECTS.add(MAP.currentRoom.door.x, MAP.currentRoom.door.y, '#34d399', 45, 5);
                    }, 300);
                }
            },

            draw() {
                if (!this.ctx) return;
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.mode === 'SHAPE') {
                    this.drawShapePuzzle(ctx);
                } else if (this.mode === 'PATH') {
                    this.drawPathPuzzle(ctx);
                } else if (this.mode === 'MEMORY') {
                    this.drawMemoryPuzzle(ctx);
                }
            },

            drawShapePuzzle(ctx) {
                ctx.fillStyle = 'rgba(30, 16, 55, 0.6)';
                ctx.beginPath();
                ctx.roundRect(10, 15, this.canvas.width - 20, 120, 16);
                ctx.roundRect(10, 155, this.canvas.width - 20, 130, 16);
                ctx.fill();

                ctx.strokeStyle = 'rgba(232, 180, 254, 0.2)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(10, 15, this.canvas.width - 20, 120);
                ctx.strokeRect(10, 155, this.canvas.width - 20, 130);

                ctx.font = 'bold 12px "Jua", sans-serif';
                ctx.fillStyle = '#f472b6';
                ctx.textAlign = 'left';
                ctx.fillText('🏛️ 요정의 문양 틀', 20, 34);
                ctx.fillText('🪄 마법 조각 선택', 20, 174);

                for (const slot of this.slots) {
                    ctx.save();
                    ctx.translate(slot.x, slot.y + 10);
                    ctx.beginPath();
                    ctx.arc(0, 0, slot.size + 8, 0, Math.PI * 2);
                    ctx.fillStyle = slot.isFilled ? 'rgba(52, 211, 153, 0.25)' : 'rgba(15, 10, 25, 0.7)';
                    ctx.fill();
                    ctx.strokeStyle = slot.isFilled ? '#34d399' : '#a78bfa';
                    ctx.lineWidth = slot.isFilled ? 2.5 : 1.5;
                    if (!slot.isFilled) ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    this.drawShapeGraphic(ctx, slot.type.id, slot.size, slot.isFilled ? slot.type.color : 'rgba(255, 255, 255, 0.18)', !slot.isFilled);
                    ctx.restore();
                }

                for (const piece of this.pieces) {
                    if (piece.isPlaced) continue;
                    ctx.save();
                    const floatY = piece.isSelected ? Math.sin(Date.now() / 150) * 5 - 6 : 0;
                    ctx.translate(piece.x, piece.y + floatY);

                    if (piece.isSelected) {
                        ctx.beginPath();
                        ctx.arc(0, 0, piece.size + 12, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(251, 191, 36, 0.3)';
                        ctx.fill();
                        ctx.strokeStyle = '#fbbf24';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    ctx.beginPath();
                    ctx.arc(0, 0, piece.size + 6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(46, 16, 101, 0.85)';
                    ctx.fill();
                    ctx.strokeStyle = piece.type.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    this.drawShapeGraphic(ctx, piece.type.id, piece.size - 2, piece.type.color, false);
                    ctx.restore();
                }
            },

            drawPathPuzzle(ctx) {
                const offsetX = 50;
                const offsetY = 40;
                const cellSize = 73;

                ctx.fillStyle = 'rgba(24, 15, 45, 0.8)';
                ctx.beginPath();
                ctx.roundRect(35, 25, 250, 250, 16);
                ctx.fill();
                ctx.strokeStyle = 'rgba(232, 180, 254, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        const tile = this.pathGrid[r][c];
                        const cx = offsetX + c * cellSize;
                        const cy = offsetY + r * cellSize;

                        ctx.save();
                        ctx.translate(cx + cellSize / 2, cy + cellSize / 2);

                        ctx.fillStyle = 'rgba(45, 25, 75, 0.8)';
                        ctx.fillRect(-cellSize / 2 + 2, -cellSize / 2 + 2, cellSize - 4, cellSize - 4);
                        ctx.strokeStyle = 'rgba(167, 139, 250, 0.3)';
                        ctx.strokeRect(-cellSize / 2 + 2, -cellSize / 2 + 2, cellSize - 4, cellSize - 4);

                        // 회전 적용
                        ctx.rotate((tile.rot * 90) * Math.PI / 180);

                        ctx.strokeStyle = '#38bdf8';
                        ctx.lineWidth = 7;
                        ctx.lineCap = 'round';

                        const conn = tile.baseConn;
                        ctx.beginPath();
                        if (conn[0]) { ctx.moveTo(0, 0); ctx.lineTo(0, -cellSize / 2); }
                        if (conn[1]) { ctx.moveTo(0, 0); ctx.lineTo(cellSize / 2, 0); }
                        if (conn[2]) { ctx.moveTo(0, 0); ctx.lineTo(0, cellSize / 2); }
                        if (conn[3]) { ctx.moveTo(0, 0); ctx.lineTo(-cellSize / 2, 0); }
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(0, 0, 6, 0, Math.PI * 2);
                        ctx.fillStyle = '#fbbf24';
                        ctx.fill();

                        ctx.restore();
                    }
                }

                ctx.font = 'bold 12px "Jua", sans-serif';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('⚡ 시작', 10, 80);
                ctx.fillStyle = '#34d399';
                ctx.fillText('🚪 출구', 270, 250);
            },

            drawMemoryPuzzle(ctx) {
                ctx.fillStyle = 'rgba(20, 10, 35, 0.7)';
                ctx.beginPath();
                ctx.roundRect(20, 20, this.canvas.width - 40, 260, 20);
                ctx.fill();

                for (const rune of this.runes) {
                    ctx.save();
                    ctx.translate(rune.x, rune.y);

                    const isHighlight = this.showingSeqIndex === rune.id;

                    ctx.beginPath();
                    ctx.arc(0, 0, 30, 0, Math.PI * 2);
                    ctx.fillStyle = isHighlight ? rune.color : 'rgba(40, 20, 65, 0.9)';
                    ctx.fill();

                    ctx.lineWidth = isHighlight ? 4 : 2;
                    ctx.strokeStyle = rune.color;
                    ctx.stroke();

                    ctx.font = '22px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(rune.symbol, 0, 0);

                    ctx.restore();
                }

                ctx.font = 'bold 13px "Jua", sans-serif';
                ctx.fillStyle = this.isShowingSeq ? '#fbbf24' : '#a78bfa';
                ctx.textAlign = 'center';
                ctx.fillText(
                    this.isShowingSeq ? '👀 순서를 기억하세요...' : '✨ 룬을 순서대로 터치하세요!',
                    160,
                    268
                );
            },

            drawShapeGraphic(ctx, shapeId, size, color, isSilhouette) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.strokeStyle = isSilhouette ? '#f472b6' : '#ffffff';
                ctx.lineWidth = isSilhouette ? 1.5 : 1;
                ctx.beginPath();

                if (shapeId === 'star') {
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * size, -Math.sin((18 + i * 72) * Math.PI / 180) * size);
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (size / 2.2), -Math.sin((54 + i * 72) * Math.PI / 180) * (size / 2.2));
                    }
                    ctx.closePath();
                } else if (shapeId === 'moon') {
                    ctx.arc(0, 0, size, 0.5 * Math.PI, 1.5 * Math.PI, true);
                    ctx.quadraticCurveTo(size * 0.5, 0, 0, size);
                } else if (shapeId === 'gem') {
                    ctx.moveTo(0, -size);
                    ctx.lineTo(size, -size * 0.3);
                    ctx.lineTo(0, size);
                    ctx.lineTo(-size, -size * 0.3);
                    ctx.closePath();
                } else if (shapeId === 'heart') {
                    ctx.moveTo(0, size * 0.7);
                    ctx.bezierCurveTo(-size * 1.2, -size * 0.2, -size * 0.8, -size * 1.1, 0, -size * 0.4);
                    ctx.bezierCurveTo(size * 0.8, -size * 1.1, size * 1.2, -size * 0.2, 0, size * 0.7);
                } else if (shapeId === 'flower') {
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 72) * Math.PI / 180;
                        ctx.arc(Math.cos(angle) * (size * 0.5), Math.sin(angle) * (size * 0.5), size * 0.45, 0, Math.PI * 2);
                    }
                } else if (shapeId === 'sun') {
                    ctx.arc(0, 0, size * 0.65, 0, Math.PI * 2);
                }

                ctx.fill();
                if (!isSilhouette) ctx.stroke();
                ctx.restore();
            }
        };

        /* ==========================================================================
           7. MAP & UI Update for Multi-Puzzle Modes
           ========================================================================== */
        const CONFIG = {
            MAP_COLS: 16,
            MAP_ROWS: 12,
            TILE_SIZE: 48,
            PASTEL_COLORS: {
                floor1: '#3d2243',
                floor2: '#311a37',

            },
            ROOM_THEMES: [
                { name: '달콤한 무지개 꽃길', floor1: '#3d1c3a', floor2: '#2a1233', wall: '#7e3564', wallTop: '#a84786', wallOutline: '#f472b6', border: 'rgba(244,114,182,0.3)', light: 'rgba(251,113,133,0.35)', lightSecondary: 'rgba(56,189,248,0.25)', accentColors: ['#f472b6', '#fbbf24', '#38bdf8', '#34d399', '#c084fc'] },
                { name: '몽환적인 에메랄드 하늘 정원', floor1: '#13303b', floor2: '#0d222b', wall: '#1b5a6b', wallTop: '#247b91', wallOutline: '#38bdf8', border: 'rgba(56,189,248,0.3)', light: 'rgba(56,189,248,0.35)', lightSecondary: 'rgba(250,204,21,0.25)', accentColors: ['#38bdf8', '#34d399', '#f472b6', '#fb923c', '#e879f9'] },
                { name: '신비한 오로라 라벤더 숲', floor1: '#2a1a4a', floor2: '#1b1035', wall: '#502d84', wallTop: '#6d3eb5', wallOutline: '#c084fc', border: 'rgba(192,132,252,0.3)', light: 'rgba(192,132,252,0.35)', lightSecondary: 'rgba(244,114,182,0.25)', accentColors: ['#c084fc', '#818cf8', '#f472b6', '#38bdf8', '#facc15'] },

        /* ==========================================================================
           2. INPUT CONTROLLER
           ========================================================================== */
        const INPUT = {
            keys: {},
            init() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                        const idx = parseInt(e.code.replace('Digit', '')) - 1;
                        ITEMS.useByIndex(idx);
                    }
                });
                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
            }
        };

        /* ==========================================================================
           3. PLAYER SYSTEM (귀여운 어린이 마법사)
           ========================================================================== */
        const PLAYER = {
            x: 0,
            y: 0,
            radius: 16,
            speed: 3.5,
            hp: 100,
            maxHp: 100,
            invincibleTimer: 0,
            buffs: {},
            blinkTimer: 0,
            isBlinking: false,
            facingRight: true,

            reset(x, y) {
                this.x = x;
                this.y = y;
                this.hp = 100;
                this.maxHp = 100;
                this.invincibleTimer = 0;
                this.buffs = {};
            },

            hasBuff(name) {
                return this.buffs[name] && this.buffs[name] > 0;
            },

            addBuff(name, duration) {
                this.buffs[name] = duration;
            },

            update() {
                if (GAME.state !== 'PLAYING') return;

                if (this.invincibleTimer > 0) this.invincibleTimer--;

                for (const buff in this.buffs) {
                    if (this.buffs[buff] > 0) {
                        this.buffs[buff]--;
                    }
                }

                let moveSpeed = this.speed;
                if (this.hasBuff('speed')) moveSpeed *= 1.5;

                let dx = 0;
                let dy = 0;

                if (INPUT.keys['ArrowLeft'] || INPUT.keys['KeyA']) { dx -= 1; this.facingRight = false; }
                if (INPUT.keys['ArrowRight'] || INPUT.keys['KeyD']) { dx += 1; this.facingRight = true; }
                if (INPUT.keys['ArrowUp'] || INPUT.keys['KeyW']) dy -= 1;
                if (INPUT.keys['ArrowDown'] || INPUT.keys['KeyS']) dy += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                const nextX = this.x + dx * moveSpeed;
                const nextY = this.y + dy * moveSpeed;

                if (!MAP.checkWallCollision(nextX, this.y, this.radius)) {
                    this.x = nextX;
                }
                if (!MAP.checkWallCollision(this.x, nextY, this.radius)) {
                    this.y = nextY;
                }

                if (this.invincibleTimer <= 0) {
                    for (const trap of MAP.currentRoom.traps) {
                        const dist = Math.hypot(this.x - trap.x, this.y - trap.y);
                        if (dist < this.radius + trap.radius) {
                            if (this.hasBuff('shield')) {
                                UI.showToast('🛡️ 별빛 수호막이 함정 데미지를 막았습니다!');
                            } else {
                                this.hp = Math.max(0, this.hp - 15);
                                this.invincibleTimer = 45;
                                EFFECTS.add(this.x, this.y, '#f43f5e', 20, 3);
                                UI.showToast('🥀 장미 가시 함정에 찔렸습니다! (-15 HP)');

                                const container = document.getElementById('game-container');
                                container.classList.add('shake');
                                setTimeout(() => container.classList.remove('shake'), 350);

                                if (this.hp <= 0) {
                                    GAME.gameOver();
                                }
                            }
                            break;
                        }
                    }
                }

                for (let i = MAP.currentRoom.items.length - 1; i >= 0; i--) {
                    const item = MAP.currentRoom.items[i];
                    const dist = Math.hypot(this.x - item.x, this.y - item.y);
                    if (dist < this.radius + 18) {
                        ITEMS.collect(item.type);
                        MAP.currentRoom.items.splice(i, 1);
                    }
                }

                this.blinkTimer++;
                if (this.blinkTimer > 180) {
                    this.isBlinking = true;
                    if (this.blinkTimer > 192) {
                        this.isBlinking = false;
                        this.blinkTimer = 0;
                    }
                }
            },

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.invincibleTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                const bobY = Math.sin(Date.now() / 150) * 2;

                ctx.beginPath();
                ctx.ellipse(0, 14, 12, 6, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.fill();

                if (!this.facingRight) ctx.scale(-1, 1);

                // 1. 마법 빗자루
                ctx.save();
                ctx.translate(-8, 4 + bobY);
                ctx.rotate(-0.3);
                ctx.fillStyle = '#b45309';
                ctx.fillRect(-2, -18, 4, 26);
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.moveTo(-6, 8);
                ctx.lineTo(6, 8);
                ctx.lineTo(8, 22);
                ctx.lineTo(-8, 22);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // 2. 다크 초콜릿 로브
                ctx.fillStyle = '#3b1c14';
                ctx.beginPath();
                ctx.moveTo(-10, 2 + bobY);
                ctx.lineTo(10, 2 + bobY);
                ctx.lineTo(13, 15 + bobY);
                ctx.lineTo(-13, 15 + bobY);
                ctx.closePath();
                ctx.fill();

                // 3. 별 목걸이
                const necklaceColors = ['#fbbf24', '#f43f5e', '#38bdf8', '#a78bfa'];
                for (let i = 0; i < 4; i++) {
                    ctx.fillStyle = necklaceColors[i];
                    ctx.beginPath();
                    ctx.arc(-6 + i * 4, 3 + bobY, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 4. 얼굴 & 볼터치
                ctx.fillStyle = '#fce7f3';
                ctx.beginPath();
                ctx.arc(0, -6 + bobY, 11, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
                ctx.beginPath();
                ctx.arc(-6, -4 + bobY, 3, 0, Math.PI * 2);
                ctx.arc(6, -4 + bobY, 3, 0, Math.PI * 2);
                ctx.fill();

                // 머리 (브라운 헤어 & 뱅)
                ctx.fillStyle = '#6b3a19';
                ctx.beginPath();
                ctx.arc(0, -9 + bobY, 11.5, Math.PI, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(0, -11 + bobY, 10, 5, 0, 0, Math.PI);
                ctx.fill();

                // 표정 (^ ^)
                ctx.strokeStyle = '#3b1c14';
                ctx.lineWidth = 1.5;
                if (this.isBlinking) {
                    ctx.beginPath();
                    ctx.moveTo(-6, -6 + bobY); ctx.lineTo(-2, -6 + bobY);
                    ctx.moveTo(2, -6 + bobY); ctx.lineTo(6, -6 + bobY);
