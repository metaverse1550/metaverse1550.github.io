                // 입
                ctx.beginPath();
                ctx.arc(0, -3 + bobY, 2, 0, Math.PI);
                ctx.stroke();

                // 5. 마법사 고깔 모자 & 끝자락 별
                ctx.fillStyle = '#2d150d';
                ctx.beginPath();
                ctx.ellipse(0, -12 + bobY, 16, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-10, -13 + bobY);
                ctx.quadraticCurveTo(-2, -22 + bobY, 10, -28 + bobY);
                ctx.lineTo(6, -13 + bobY);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(10, -28 + bobY, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                if (this.hasBuff('shield')) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        };

        /* ==========================================================================
           4. ITEMS SYSTEM
           ========================================================================== */
        const ITEMS = {
            inventory: [],

            collect(type) {
                if (this.inventory.length >= 4) {
                    UI.showToast('🎒 가방이 가득 찼습니다!');
                    return;
                }

                const itemData = {
                    potion: { id: 'potion', name: '체력 포션', icon: '🧪', desc: '체력 40 회복' },
                    shield: { id: 'shield', name: '별빛 아뮬렛', icon: '🛡️', desc: '10초간 함정 무효화' },
                    boots: { id: 'boots', name: '신풍 부츠', icon: '👟', desc: '10초간 이동속도 증가' },
                    magnifier: { id: 'magnifier', name: '지혜의 돋보기', icon: '🔍', desc: '퍼즐 힌트 자동 맞춤' }
                }[type];

                if (itemData) {
                    this.inventory.push(itemData);
                    UI.showToast(`✨ [${itemData.name}] 아이템 획득!`);
                    UI.renderInventory();
                }
            },

            useByIndex(index) {
                if (index < 0 || index >= this.inventory.length) return;
                const item = this.inventory[index];

                if (item.id === 'potion') {
                    PLAYER.hp = Math.min(PLAYER.maxHp, PLAYER.hp + 40);
                    EFFECTS.add(PLAYER.x, PLAYER.y, '#f472b6', 25, 4);
                    UI.showToast('🧪 체력이 40 회복되었습니다!');
                    this.inventory.splice(index, 1);
                } else if (item.id === 'shield') {
                    PLAYER.addBuff('shield', 600);
                    EFFECTS.add(PLAYER.x, PLAYER.y, '#38bdf8', 25, 4);
                    UI.showToast('🛡️ 별빛 수호막이 발동되었습니다!');
                    this.inventory.splice(index, 1);
                } else if (item.id === 'boots') {
                    PLAYER.addBuff('speed', 600);
                    EFFECTS.add(PLAYER.x, PLAYER.y, '#34d399', 25, 4);
                    UI.showToast('👟 신풍 버프가 발동되었습니다!');
                    this.inventory.splice(index, 1);
                } else if (item.id === 'magnifier') {
                    if (GAME.state === 'PUZZLE_MODE') {
                        PUZZLE.useHint();
                        this.inventory.splice(index, 1);
                    } else {
                        UI.showToast('💡 퍼즐 제단 앞에서 사용하거나 퍼즐 모드 중 사용 가능합니다.');
                    }
                }

                UI.renderInventory();
            },

            drawItemGraphic(ctx, type, x, y) {
                ctx.save();
                ctx.translate(x, y);

                const floatY = Math.sin(Date.now() / 250 + x) * 3;

                ctx.beginPath();
                ctx.arc(0, floatY, 14, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
                ctx.fill();

                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const iconMap = { potion: '🧪', shield: '🛡️', boots: '👟', magnifier: '🔍' };
                ctx.fillText(iconMap[type] || '✨', 0, floatY);

                ctx.restore();
            }
        };

        /* ==========================================================================
           5. VISUAL EFFECTS SYSTEM
           ========================================================================== */
        const EFFECTS = {
            particles: [],
            fairyDust: [],
            themeParticles: [],
            fadeAlpha: 0,

            initFairyDust() {
                this.fairyDust = [];
                for (let i = 0; i < 35; i++) {
                    this.fairyDust.push({
                        x: Math.random() * (CONFIG.MAP_COLS * CONFIG.TILE_SIZE),
                        y: Math.random() * (CONFIG.MAP_ROWS * CONFIG.TILE_SIZE),
                        radius: Math.random() * 2 + 1,
                        alpha: Math.random() * 0.7 + 0.2,
                        speedY: Math.random() * 0.4 + 0.2,
                        color: ['#f472b6', '#a78bfa', '#fbbf24', '#38bdf8'][Math.floor(Math.random() * 4)]
                    });
                }

                // Theme-specific ambient floating particles (petals, spores, sparkles)
                this.themeParticles = [];
                for (let i = 0; i < 25; i++) {
                    this.themeParticles.push({
                        x: Math.random() * (CONFIG.MAP_COLS * CONFIG.TILE_SIZE),
                        y: Math.random() * (CONFIG.MAP_ROWS * CONFIG.TILE_SIZE),
                        size: Math.random() * 4 + 2,
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: Math.random() * 0.5 + 0.3,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.05
                    });
                }
            },

            add(x, y, color, count = 15, maxSpeed = 3) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * maxSpeed + 0.5;
                    this.particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        decay: Math.random() * 0.03 + 0.02,
                        size: Math.random() * 4 + 2,
                        color
                    });
                }
            },

            triggerFade(targetAlpha) {
                this.fadeAlpha = targetAlpha;
            },

            update() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                for (const dust of this.fairyDust) {
                    dust.y -= dust.speedY;
                    if (dust.y < 0) {
                        dust.y = CONFIG.MAP_ROWS * CONFIG.TILE_SIZE;
                        dust.x = Math.random() * (CONFIG.MAP_COLS * CONFIG.TILE_SIZE);
                    }
                }

                for (const tp of this.themeParticles) {
                    tp.x += tp.vx + Math.sin(Date.now() / 800 + tp.y) * 0.2;
                    tp.y += tp.vy;
                    tp.rotation += tp.rotSpeed;
                    if (tp.y > CONFIG.MAP_ROWS * CONFIG.TILE_SIZE) {
                        tp.y = -10;
                        tp.x = Math.random() * (CONFIG.MAP_COLS * CONFIG.TILE_SIZE);
                    }
                }
            },

            draw(ctx) {
                ctx.save();
                for (const dust of this.fairyDust) {
                    ctx.beginPath();
                    ctx.arc(dust.x, dust.y, dust.radius, 0, Math.PI * 2);
                    ctx.fillStyle = dust.color;
                    ctx.globalAlpha = dust.alpha * (0.5 + Math.sin(Date.now() / 300 + dust.x) * 0.3);
                    ctx.fill();
                }
                ctx.restore();

                // Draw room ambient atmospheric particles (petals/spores/leaves)
                ctx.save();
                const roomIndex = MAP.currentRoomIndex;
                const themeColors = ['#f472b6', '#38bdf8', '#c084fc', '#34d399', '#fb923c'];
                const pColor = themeColors[roomIndex % themeColors.length];

                for (const tp of this.themeParticles) {
                    ctx.save();
                    ctx.translate(tp.x, tp.y);
                    ctx.rotate(tp.rotation);
                    ctx.globalAlpha = 0.65;
                    ctx.fillStyle = pColor;

                    if (roomIndex === 0) {
                        // Petal shape
                        ctx.beginPath();
                        ctx.ellipse(0, 0, tp.size, tp.size * 0.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (roomIndex === 3) {
                        // Diamond sparkle
                        ctx.beginPath();
                        ctx.moveTo(0, -tp.size);
                        ctx.lineTo(tp.size * 0.6, 0);
                        ctx.lineTo(0, tp.size);
                        ctx.lineTo(-tp.size * 0.6, 0);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        // Glowing spore
                        ctx.beginPath();
                        ctx.arc(0, 0, tp.size * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                ctx.restore();

                ctx.save();
                for (const p of this.particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                }
                ctx.restore();
            }
        };

        /* ==========================================================================
           6. GAME ENGINE & MAIN LOOP
           ========================================================================== */
        const GAME = {
            state: 'PLAYING', // 'PLAYING', 'PUZZLE_MODE', 'GAMEOVER', 'VICTORY'

            init() {
                MAP.init();
                PLAYER.reset(MAP.currentRoom.spawnX, MAP.currentRoom.spawnY);
                EFFECTS.initFairyDust();
                PUZZLE.init();
                UI.init();
                this.state = 'PLAYING';
                this.loop();
            },

            update() {
                if (this.state === 'GAMEOVER' || this.state === 'VICTORY') return;

                PLAYER.update();
                EFFECTS.update();
                UI.updateHUD();

                // Check interaction prompt with altar
                const altar = MAP.currentRoom.altar;
                const distToAltar = Math.hypot(PLAYER.x - altar.x, PLAYER.y - altar.y);
                if (distToAltar < PLAYER.radius + altar.radius + 15) {
                    if (!altar.solved) {
                        UI.showPrompt('✨ 요정의 마법 제단 상호작용 (Space)');
                        if (INPUT.keys['Space']) {
                            INPUT.keys['Space'] = false;
                            UI.openPuzzleModal();
                        }
                    } else {
                        UI.hidePrompt();
                    }
                } else {
                    UI.hidePrompt();
                }

                // Check room exit door
                const door = MAP.currentRoom.door;
                const distToDoor = Math.hypot(PLAYER.x - door.x, PLAYER.y - door.y);
                if (distToDoor < PLAYER.radius + door.radius && door.isOpen) {
                    this.nextRoom();
                }
            },

            nextRoom() {
                MAP.currentRoomIndex++;
                if (MAP.currentRoomIndex >= MAP.rooms.length) {
                    this.victory();
                } else {
                    MAP.currentRoom = MAP.rooms[MAP.currentRoomIndex];
                    PLAYER.x = MAP.currentRoom.spawnX;
                    PLAYER.y = MAP.currentRoom.spawnY;
                    UI.showToast(`🌸 제 ${MAP.currentRoomIndex + 1} 구역: ${MAP.currentRoom.title}`);
                }
            },

            gameOver() {
                this.state = 'GAMEOVER';
                document.getElementById('gameover-modal').classList.remove('hidden');
            },

            victory() {
                this.state = 'VICTORY';
                const statsElem = document.getElementById('victory-stats');
                statsElem.innerHTML = `
                    <p class="text-sm">✨ 클리어한 방: 5 / 5</p>
                    <p class="text-sm">💖 남은 체력: ${Math.ceil(PLAYER.hp)} HP</p>
                    <p class="text-sm">🎒 가방 아이템: ${ITEMS.inventory.length} 개</p>
                `;
                document.getElementById('victory-modal').classList.remove('hidden');
            },

            restart() {
                document.getElementById('gameover-modal').classList.add('hidden');
                document.getElementById('victory-modal').classList.add('hidden');
                MAP.init();
                PLAYER.reset(MAP.currentRoom.spawnX, MAP.currentRoom.spawnY);
                ITEMS.inventory = [];
                UI.renderInventory();
                this.state = 'PLAYING';
            },

            draw() {
                const canvas = document.getElementById('gameCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (canvas.width !== CONFIG.MAP_COLS * CONFIG.TILE_SIZE) {
                    canvas.width = CONFIG.MAP_COLS * CONFIG.TILE_SIZE;
                    canvas.height = CONFIG.MAP_ROWS * CONFIG.TILE_SIZE;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                MAP.draw(ctx);
                EFFECTS.draw(ctx);
                PLAYER.draw(ctx);
            },

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        /* ==========================================================================
           7. MAP: 방 5개 및 대기 광원 / 고품질 그래픽 렌더링
           ========================================================================== */
        const MAP = {
            rooms: [],
            currentRoomIndex: 0,
            currentRoom: null,

            init() {
                this.rooms = [];
                const roomNames = [
                    "1. 햇살 감도는 꽃잎 숲길",
                    "2. 신비로운 버섯 요정 정원",
                    "3. 별빛 무지개 기사의 정원",
                    "4. 달빛 룬 문양의 전당",
                    "5. 왕국으로 통하는 요정의 문"
                ];

                for (let i = 0; i < 5; i++) {
                    this.rooms.push(this.generateRoomData(i, roomNames[i]));
                }
                this.currentRoomIndex = 0;
                this.currentRoom = this.rooms[0];
            },

            generateRoomData(index, title) {
                const cols = CONFIG.MAP_COLS;
                const rows = CONFIG.MAP_ROWS;
                const ts = CONFIG.TILE_SIZE;

                const walls = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
                            if (!(r === Math.floor(rows / 2) && c === cols - 1)) {
                                walls.push({ x: c * ts, y: r * ts, w: ts, h: ts });
                            }
                        }
                    }
                }

                if (index >= 1) {
                    walls.push({ x: 4 * ts, y: 3 * ts, w: ts, h: ts * 2 });
                    walls.push({ x: 11 * ts, y: 6 * ts, w: ts, h: ts * 2 });
                }
                if (index >= 3) {
                    walls.push({ x: 7 * ts, y: 2 * ts, w: ts * 2, h: ts });
                    walls.push({ x: 7 * ts, y: 8 * ts, w: ts * 2, h: ts });
                }

                const altar = {
                    x: 8 * ts,
                    y: 5 * ts,
                    radius: 24,
                    solved: false
                };

                const door = {
                    x: (cols - 1) * ts + ts / 2,
                    y: Math.floor(rows / 2) * ts + ts / 2,
                    radius: 28,
                    isOpen: false
                };

                const traps = [];
                const trapCount = 2 + index * 2;
                for (let t = 0; t < trapCount; t++) {
                    const tx = (2 + Math.floor(Math.random() * (cols - 4))) * ts + ts / 2;
                    const ty = (2 + Math.floor(Math.random() * (rows - 4))) * ts + ts / 2;
                    if (Math.hypot(tx - altar.x, ty - altar.y) > 80 && tx > 120) {
                        traps.push({ x: tx, y: ty, radius: 15 });
                    }
                }

                const items = [];
                const possibleTypes = ['potion', 'shield', 'boots', 'magnifier'];
                const itemType = possibleTypes[index % possibleTypes.length];
                items.push({
                    x: (3 + Math.floor(Math.random() * 3)) * ts + ts / 2,
                    y: (2 + Math.floor(Math.random() * 6)) * ts + ts / 2,
                    type: itemType
                });

                if (index % 2 === 1) {
                    items.push({
                        x: 12 * ts + ts / 2,
                        y: 2 * ts + ts / 2,
                        type: 'potion'
                    });
                }

                const decors = [];
                const cuteIcons = ['🌸', '🍄', '🎀', '✨', '🍀', '🐣', '🍓', '🧸', '☁️', '🌟', '🌈', '🧁'];
                for (let i = 0; i < 24; i++) {
                    const dx = (1 + Math.floor(Math.random() * (cols - 2))) * ts + ts / 2;
                    const dy = (1 + Math.floor(Math.random() * (rows - 2))) * ts + ts / 2;
                    decors.push({
                        x: dx,
                        y: dy,
                        icon: cuteIcons[Math.floor(Math.random() * cuteIcons.length)],
                        offset: Math.random() * Math.PI * 2
                    });
                }

                return {
                    index,
                    title,
                    walls,
                    altar,
                    door,
                    traps,
                    items,
                    decors,
                    theme: CONFIG.ROOM_THEMES[index],
                    spawnX: 2 * ts,
                    spawnY: Math.floor(rows / 2) * ts + ts / 2
                };
            },

            checkWallCollision(x, y, radius) {
                if (x - radius < CONFIG.TILE_SIZE || x + radius > (CONFIG.MAP_COLS - 1) * CONFIG.TILE_SIZE) {
                    const isExitRow = Math.abs(y - this.currentRoom.door.y) < CONFIG.TILE_SIZE;
                    if (!(x + radius > (CONFIG.MAP_COLS - 1) * CONFIG.TILE_SIZE && isExitRow && this.currentRoom.door.isOpen)) {
                        return true;
                    }
                }
                if (y - radius < CONFIG.TILE_SIZE || y + radius > (CONFIG.MAP_ROWS - 1) * CONFIG.TILE_SIZE) {
                    return true;
                }

                for (const wall of this.currentRoom.walls) {
                    if (x + radius > wall.x && x - radius < wall.x + wall.w &&
                        y + radius > wall.y && y - radius < wall.y + wall.h) {
                        return true;
                    }
                }
                return false;
            },

            draw(ctx) {
                const ts = CONFIG.TILE_SIZE;
                const room = this.currentRoom;
                const theme = room.theme;

                // 1. 고품질 다색 바닥 타일, 돌 블록 패턴 및 알록달록 타일 포인트
                for (let r = 0; r < CONFIG.MAP_ROWS; r++) {
                    for (let c = 0; c < CONFIG.MAP_COLS; c++) {
                        const isEven = (r + c) % 2 === 0;
                        ctx.fillStyle = isEven ? theme.floor1 : theme.floor2;
                        ctx.fillRect(c * ts, r * ts, ts, ts);

                        // 무작위 다채로운 타일 은은한 컬러 틴트
                        const colorIdx = (r * 5 + c * 7) % theme.accentColors.length;
                        if ((r * 3 + c * 11) % 7 === 0) {
                            ctx.fillStyle = theme.accentColors[colorIdx];
                            ctx.globalAlpha = 0.08;
                            ctx.fillRect(c * ts, r * ts, ts, ts);
                            ctx.globalAlpha = 1.0;
                        }

                        // Cobblestone / brick texture lines
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(c * ts, r * ts, ts, ts);

                        // Inner tile bevel & accent lines
                        ctx.strokeStyle = theme.border;
                        ctx.lineWidth = 1;
                        ctx.strokeRect(c * ts + 2, r * ts + 2, ts - 4, ts - 4);

                        // Subtle floral / moss specks on corners with diverse colors
                        if ((r * 7 + c * 3) % 5 === 0) {
                            ctx.fillStyle = theme.accentColors[(r + c) % theme.accentColors.length];
                            ctx.globalAlpha = 0.25;
                            ctx.fillRect(c * ts + 4, r * ts + 4, 5, 5);
                            ctx.globalAlpha = 1.0;
                        }
                    }
                }

                // 2. 바닥 중앙 회전 무지개 마법 룬 문양 (Rainbow Gradient Floor Circle)
                ctx.save();
                const centerX = (CONFIG.MAP_COLS * ts) / 2;
                const centerY = (CONFIG.MAP_ROWS * ts) / 2;
                ctx.translate(centerX, centerY);
                ctx.rotate(Date.now() / 4000);

                const ringGrad = ctx.createConicGradient(0, 0, 0);
                ringGrad.addColorStop(0, '#f472b6');
                ringGrad.addColorStop(0.2, '#fbbf24');
                ringGrad.addColorStop(0.4, '#34d399');
                ringGrad.addColorStop(0.6, '#38bdf8');
                ringGrad.addColorStop(0.8, '#c084fc');
                ringGrad.addColorStop(1, '#f472b6');

                ctx.beginPath();
                ctx.arc(0, 0, 110, 0, Math.PI * 2);
                ctx.strokeStyle = ringGrad;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.5;
                ctx.setLineDash([10, 6]);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 80, 0, Math.PI * 2);
                ctx.strokeStyle = theme.light;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                for (let i = 0; i < 6; i++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.fillStyle = theme.accentColors[i % theme.accentColors.length];
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.arc(80, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 3. 살랑살랑 움직이는 귀여운 바닥 데코 (리본, 꽃, 아기새, 무지개 등)
                for (const d of room.decors) {
                    ctx.save();
                    const floatY = Math.sin(Date.now() / 350 + d.offset) * 2.5;
                    ctx.font = '15px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.globalAlpha = 0.85;
                    ctx.fillText(d.icon, d.x, d.y + floatY);
                    ctx.restore();
                }

                // 4. 귀여운 가시 장미 함정 (🌸)
                for (const trap of room.traps) {
                    ctx.save();
                    ctx.translate(trap.x, trap.y);

                    const pulse = Math.sin(Date.now() / 200) * 1.5;

                    ctx.beginPath();
                    ctx.arc(0, 0, trap.radius + 4 + pulse, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(244, 114, 182, 0.28)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(0, 0, trap.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(225, 29, 72, 0.35)';
                    ctx.fill();

                    ctx.font = '18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🌹', 0, 0);

                    ctx.restore();
                }

                // 5. 입체적인 석조 벽면 & creeping ivy 덩굴 & 마법 등불
                for (const wall of room.walls) {
                    // Wall base shadow
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.fillRect(wall.x + 4, wall.y + 4, wall.w, wall.h);

                    ctx.fillStyle = theme.wall;
                    ctx.beginPath();
                    ctx.roundRect(wall.x, wall.y, wall.w, wall.h, 10);
                    ctx.fill();

                    ctx.fillStyle = theme.wallTop;
                    ctx.beginPath();
                    ctx.roundRect(wall.x + 3, wall.y + 3, wall.w - 6, wall.h - 8, 8);
                    ctx.fill();

                    ctx.strokeStyle = theme.wallOutline;
                    ctx.lineWidth = 1.8;
                    ctx.strokeRect(wall.x + 3, wall.y + 3, wall.w - 6, wall.h - 6);

                    // Stone cracks / brick details on wall
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(wall.x + 6, wall.y + wall.h / 2);
                    ctx.lineTo(wall.x + wall.w - 6, wall.y + wall.h / 2);
                    ctx.stroke();

                    // Creeping ivy leaf overlay
                    ctx.fillStyle = CONFIG.PASTEL_COLORS.ivyGreen;
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.arc(wall.x + 6, wall.y + 6, 4, 0, Math.PI * 2);
                    ctx.arc(wall.x + 12, wall.y + 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;

                    // 벽 위의 미니 꽃 장식
                    ctx.font = '10px sans-serif';
                    ctx.fillStyle = '#fbcfe8';
                    ctx.fillText('🌸', wall.x + wall.w / 2, wall.y + wall.h / 2);
                }

                // 모서리 마법 등불 (Torch lanterns)
                const lanterns = [
                    { x: ts * 1.5, y: ts * 1.5 },
                    { x: (CONFIG.MAP_COLS - 1.5) * ts, y: ts * 1.5 },
                    { x: ts * 1.5, y: (CONFIG.MAP_ROWS - 1.5) * ts },
                    { x: (CONFIG.MAP_COLS - 1.5) * ts, y: (CONFIG.MAP_ROWS - 1.5) * ts }
                ];
                for (const l of lanterns) {
                    ctx.save();
                    const flicker = Math.sin(Date.now() / 100 + l.x) * 3;
                    const lGlow = ctx.createRadialGradient(l.x, l.y, 2, l.x, l.y, 45 + flicker);
                    lGlow.addColorStop(0, 'rgba(253, 224, 71, 0.4)');
                    lGlow.addColorStop(0.5, 'rgba(251, 146, 60, 0.15)');
                    lGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = lGlow;
                    ctx.beginPath();
                    ctx.arc(l.x, l.y, 45 + flicker, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(l.x, l.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 6. 탐험 아이템
                for (const item of room.items) {
                    ITEMS.drawItemGraphic(ctx, item.type, item.x, item.y);
                }

                // 7. 사랑스러운 요정 퍼즐 제단
                const altar = room.altar;
                ctx.save();
                ctx.translate(altar.x, altar.y);

                const hoverY = Math.sin(Date.now() / 280) * 4;

                ctx.beginPath();
                ctx.arc(0, 8, altar.radius + 8, 0, Math.PI * 2);
                ctx.fillStyle = altar.solved ? 'rgba(52, 211, 153, 0.4)' : 'rgba(244, 114, 182, 0.4)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, hoverY, altar.radius, 0, Math.PI * 2);
                ctx.fillStyle = CONFIG.PASTEL_COLORS.puzzleAltar;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = altar.solved ? '#34d399' : '#fef08a';
                ctx.stroke();

                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(altar.solved ? '✨' : '💖', 0, hoverY);

                ctx.restore();

                // 8. 귀여운 리본 요정 출구 문
                const door = room.door;
                ctx.save();
                ctx.translate(door.x, door.y);

                ctx.fillStyle = door.isOpen ? CONFIG.PASTEL_COLORS.doorOpen : CONFIG.PASTEL_COLORS.doorLocked;
                ctx.beginPath();
                ctx.roundRect(-18, -26, 36, 52, 12);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#fef08a';
                ctx.stroke();

                // 상단 리본
                ctx.font = '14px sans-serif';
                ctx.fillText('🎀', 0, -28);

                ctx.font = '12px "Jua", sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(door.isOpen ? 'OPEN' : 'LOCK', 0, 2);

                ctx.restore();

                // 9. 몽환적인 햇살 오버레이 & 사선 마법 빛줄기 (God Rays)
                this.drawLightingOverlay(ctx);
            },

            drawLightingOverlay(ctx) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';

                // 1) 좌상단 다채로운 주 광원 (Primary Warm/Pastel Light)
                const grad1 = ctx.createRadialGradient(0, 0, 20, CONFIG.MAP_COLS * CONFIG.TILE_SIZE * 0.6, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE * 0.6, 500);
                grad1.addColorStop(0, this.currentRoom.theme.light);
                grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad1;
                ctx.fillRect(0, 0, CONFIG.MAP_COLS * CONFIG.TILE_SIZE, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE);

                // 2) 우하단 보조 반사 광원 (Secondary Cyan/Magenta/Gold Light for rich color blending)
                const grad2 = ctx.createRadialGradient(
                    CONFIG.MAP_COLS * CONFIG.TILE_SIZE, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE, 30,
                    CONFIG.MAP_COLS * CONFIG.TILE_SIZE * 0.4, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE * 0.4, 450
                );
                grad2.addColorStop(0, this.currentRoom.theme.lightSecondary);
                grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad2;
                ctx.fillRect(0, 0, CONFIG.MAP_COLS * CONFIG.TILE_SIZE, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE);

                // 사선 다채로운 마법 빛줄기 (Atmospheric Rainbow God Rays)
                ctx.fillStyle = 'rgba(255, 235, 200, 0.04)';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(220, 0);
                ctx.lineTo(CONFIG.MAP_COLS * CONFIG.TILE_SIZE, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE - 80);
                ctx.lineTo(CONFIG.MAP_COLS * CONFIG.TILE_SIZE, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(200, 230, 255, 0.03)';
                ctx.beginPath();
                ctx.moveTo(100, 0);
                ctx.lineTo(350, 0);
                ctx.lineTo(CONFIG.MAP_COLS * CONFIG.TILE_SIZE, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE - 200);
                ctx.lineTo(CONFIG.MAP_COLS * CONFIG.TILE_SIZE, CONFIG.MAP_ROWS * CONFIG.TILE_SIZE - 50);
                ctx.closePath();
                ctx.fill();

                // 제단 주변 핑크/민트/골드 다채로운 멀티 아우라
                const altar = this.currentRoom.altar;
                const altarGlow = ctx.createRadialGradient(altar.x, altar.y, 5, altar.x, altar.y, 100);
                if (altar.solved) {
                    altarGlow.addColorStop(0, 'rgba(52, 211, 153, 0.4)');
                    altarGlow.addColorStop(0.5, 'rgba(56, 189, 248, 0.2)');
                    altarGlow.addColorStop(1, 'rgba(0,0,0,0)');
                } else {
                    altarGlow.addColorStop(0, 'rgba(244, 114, 182, 0.4)');
                    altarGlow.addColorStop(0.5, 'rgba(251, 191, 36, 0.2)');
                    altarGlow.addColorStop(1, 'rgba(0,0,0,0)');
                }
                ctx.fillStyle = altarGlow;
                ctx.beginPath();
                ctx.arc(altar.x, altar.y, 100, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };

        /* ==========================================================================
           8. UI: HUD, 모달, 인벤토리 및 사용자 알림
           ========================================================================== */
        const UI = {
            init() {
                document.getElementById('btn-close-puzzle').addEventListener('click', () => this.closePuzzleModal());
                document.getElementById('btn-hint-puzzle').addEventListener('click', () => ITEMS.useByIndex(this.findItemIndex('magnifier')));
                document.getElementById('btn-solve-puzzle').addEventListener('click', () => PUZZLE.checkVictory());
                document.getElementById('btn-restart').addEventListener('click', () => GAME.restart());
                document.getElementById('btn-play-again').addEventListener('click', () => GAME.restart());

                this.renderInventory();
            },

            findItemIndex(itemId) {
                return ITEMS.inventory.findIndex(i => i.id === itemId);
            },

            updateHUD() {
                document.getElementById('hud-room').innerText = MAP.currentRoomIndex + 1;
                document.getElementById('hud-room-title').innerText = `[ ${MAP.currentRoom.title} ]`;

                const hpPercent = Math.max(0, (PLAYER.hp / PLAYER.maxHp) * 100);
                document.getElementById('hud-hp-bar').style.width = `${hpPercent}%`;
                document.getElementById('hud-hp-text').innerText = `${Math.ceil(PLAYER.hp)} / ${PLAYER.maxHp}`;

                const buffContainer = document.getElementById('hud-buffs');
                buffContainer.innerHTML = '';

                if (PLAYER.hasBuff('shield')) {
                    buffContainer.innerHTML += `<span class="bg-sky-600/90 border border-sky-300 px-2.5 py-0.5 rounded-full text-white font-bold animate-pulse text-[11px] shadow">🛡️ 별빛 수호</span>`;
                }
                if (PLAYER.hasBuff('speed')) {
                    buffContainer.innerHTML += `<span class="bg-emerald-600/90 border border-emerald-300 px-2.5 py-0.5 rounded-full text-white font-bold animate-pulse text-[11px] shadow">👟 신풍 버프</span>`;
                }
            },

            renderInventory() {
                const container = document.getElementById('inventory-slots');
                container.innerHTML = '';

                for (let i = 0; i < 4; i++) {
                    const item = ITEMS.inventory[i];
                    const slot = document.createElement('div');
                    slot.className = `w-11 h-11 rounded-2xl border-2 flex items-center justify-center cursor-pointer transition transform hover:scale-105 relative shadow-md ${
                        item ? 'bg-purple-900/80 border-pink-300/60' : 'bg-slate-900/40 border-purple-400/20'
                    }`;

                    if (item) {
                        slot.innerHTML = `<span class="text-2xl">${item.icon}</span><span class="absolute -top-1.5 -right-1.5 bg-amber-400 text-purple-950 text-[10px] font-extrabold rounded-full w-4 h-4 flex items-center justify-center shadow">${i + 1}</span>`;
                        slot.title = `${item.name}: ${item.desc} (단축키 ${i + 1})`;
                        slot.onclick = () => ITEMS.useByIndex(i);
                    } else {
                        slot.innerHTML = `<span class="text-xs text-pink-300/30 font-extrabold">${i + 1}</span>`;
                    }
                    container.appendChild(slot);
                }
            },

            showPrompt(text) {
                const prompt = document.getElementById('interaction-prompt');
                document.getElementById('prompt-text').innerText = text;
                prompt.classList.remove('hidden');
            },

            hidePrompt() {
                document.getElementById('interaction-prompt').classList.add('hidden');
            },

            showToast(msg) {
                const toast = document.getElementById('toast-msg');
                toast.innerText = msg;
                toast.classList.remove('hidden', 'opacity-0', '-translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');

                clearTimeout(this.toastTimeout);
                this.toastTimeout = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', '-translate-y-4');
                    setTimeout(() => toast.classList.add('hidden'), 300);
                }, 2200);
            },

            openPuzzleModal() {
                GAME.state = 'PUZZLE_MODE';
                PUZZLE.setupPuzzle(MAP.currentRoomIndex);
                document.getElementById('puzzle-modal').classList.remove('hidden');
            },

            closePuzzleModal() {
                document.getElementById('puzzle-modal').classList.add('hidden');
                if (GAME.state === 'PUZZLE_MODE') {
                    GAME.state = 'PLAYING';
                }
            },

            updatePuzzleModalTitle(roomIndex, mode) {
                const titleElem = document.getElementById('puzzle-modal-title');
                const descElem = document.getElementById('puzzle-modal-desc');

                if (mode === 'SHAPE') {
                    titleElem.innerText = `제 ${roomIndex + 1} 방 : 요정의 모양 맞추기 퍼즐`;
                    descElem.innerHTML = `아래 마법 조각을 선택한 후 상단 <span class="text-amber-300 font-bold">알맞은 실루엣 틀</span>을 누르세요.`;
                } else if (mode === 'PATH') {
                    titleElem.innerText = `제 ${roomIndex + 1} 방 : 별빛 마법길 연결 퍼즐`;
                    descElem.innerHTML = `각 타일을 터치해 회전시켜 <span class="text-amber-300 font-bold">시작 지점에서 출구까지 별빛 경로</span>를 연결하세요.`;
                } else if (mode === 'MEMORY') {
                    titleElem.innerText = `제 ${roomIndex + 1} 방 : 신비한 룬 문양 기억 퍼즐`;
                    descElem.innerHTML = `차례대로 반짝이는 <span class="text-amber-300 font-bold">룬 문양의 순서를 기억</span>하고 똑같이 누르세요.`;
                }
            }
        };

        /* ==========================================================================
           10. WINDOW ONLOAD INITIALIZATION
           ========================================================================== */
        window.onload = function() {
            GAME.init();
        };
    </script>
