<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Dungeon Rogue</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090a0f;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            background: #0d1117;
            border: 1px solid #30363d;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #0b0e14;
            cursor: crosshair;
        }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: none;
        }

        .controls-hint span {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>

// --- INPUT SYSTEM ---
class InputHandler {
    constructor(canvas) {
        this.keys = {};
        this.mouse = { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2, down: false, rightDown: false };
        this.canvas = canvas;
        this.keyPressTriggers = {};

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (!this.keys[k]) {
                this.keyPressTriggers[k] = true;
            }
            this.keys[k] = true;
            if (['tab', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            this.keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            this.mouse.x = (e.clientX - rect.left) * scaleX;
            this.mouse.y = (e.clientY - rect.top) * scaleY;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                this.mouse.down = true;
                this.mouse.clicked = true;
            } else if (e.button === 2) {
                this.mouse.rightDown = true;
                this.mouse.rightClicked = true;
                e.preventDefault();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) this.mouse.down = false;
            if (e.button === 2) this.mouse.rightDown = false;
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());
    }

    isPressed(key) {
        return !!this.keys[key.toLowerCase()];
    }

    wasTriggered(key) {
        const k = key.toLowerCase();
        if (this.keyPressTriggers[k]) {
            this.keyPressTriggers[k] = false;
            return true;
        }
        return false;
    }

    clearTriggers() {
        this.keyPressTriggers = {};
        this.mouse.clicked = false;
        this.mouse.rightClicked = false;
    }
}

// --- PARTICLE & VISUAL EFFECTS SYSTEM ---
class ParticleSystem {
    constructor() {
        this.particles = [];
        this.floatingTexts = [];
        this.screenShakeTime = 0;
        this.screenShakeIntensity = 0;
        this.groundAoEs = [];
    }

    shake(time, intensity) {
        this.screenShakeTime = time;
        this.screenShakeIntensity = intensity;
    }

    addParticle(x, y, vx, vy, radius, color, life, type = 'normal') {
        this.particles.push({
            x, y, vx, vy, radius, color, life, maxLife: life, type, alpha: 1
        });
    }

    addDamageText(x, y, text, color = '#ffffff', fontSize = 18, isCrit = false) {
        this.floatingTexts.push({
            x, y, text, color, fontSize, isCrit,
            life: 45, maxLife: 45, vy: -1.2
        });
    }

    addFloatingText(x, y, text, color = '#ffffff', fontSize = 18, isCrit = false) {
        this.addDamageText(x, y, text, color, fontSize, isCrit);
    }

    addBurst(x, y, color, count = 12, speed = 4) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = (Math.random() * 0.7 + 0.3) * speed;
            this.addParticle(
                x, y,
                Math.cos(angle) * spd,
                Math.sin(angle) * spd,
                Math.random() * 3.5 + 1.5,
                color,
                Math.floor(Math.random() * 20 + 15)
            );
        }
    }

    addTrail(x, y, radius, color) {
        this.addParticle(x, y, 0, 0, radius, color, 12, 'fade');
    }

    addGroundAoE(x, y, radius, color, duration, onExpire = null) {
        this.groundAoEs.push({ x, y, radius, color, duration, maxDuration: duration, onExpire, currentRadius: 0 });
    }

    update() {
        if (this.screenShakeTime > 0) this.screenShakeTime--;

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            if (p.type === 'fade') {
                p.alpha = p.life / p.maxLife;
            } else {
                p.vx *= 0.94;
                p.vy *= 0.94;
                p.alpha = p.life / p.maxLife;
            }

            if (p.life <= 0) this.particles.splice(i, 1);
        }

        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const ft = this.floatingTexts[i];
            ft.y += ft.vy;
            ft.life--;
            if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }

        for (let i = this.groundAoEs.length - 1; i >= 0; i--) {
            const aoe = this.groundAoEs[i];
            aoe.duration--;
            const progress = 1 - (aoe.duration / aoe.maxDuration);
            aoe.currentRadius = aoe.radius * progress;

            if (aoe.duration <= 0) {
                if (aoe.onExpire) aoe.onExpire();
                this.groundAoEs.splice(i, 1);
            }
        }
    }

    draw(ctx) {
        ctx.save();

        // Draw Ground Warning AoEs
        for (const aoe of this.groundAoEs) {
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = aoe.color;
            ctx.beginPath();
            ctx.arc(aoe.x, aoe.y, aoe.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 0.7;
            ctx.strokeStyle = aoe.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(aoe.x, aoe.y, aoe.currentRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        for (const p of this.particles) {
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        for (const ft of this.floatingTexts) {
            const progress = ft.life / ft.maxLife;
            ctx.globalAlpha = Math.max(0, progress);
            ctx.fillStyle = ft.color;
            ctx.font = `${ft.isCrit ? 'bold ' : ''}${ft.fontSize}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.restore();
    }

    applyShake(ctx) {
        if (this.screenShakeTime > 0) {
            const dx = (Math.random() - 0.5) * this.screenShakeIntensity;
            const dy = (Math.random() - 0.5) * this.screenShakeIntensity;
            ctx.translate(dx, dy);
        }
    }
}

    canUnlock(node) {
        if (node.unlocked) return false;
        if (this.player.sp < node.cost) return false;

        for (const reqId of node.reqs) {
            const reqNode = this.nodes.find(n => n.id === reqId);
            if (!reqNode || !reqNode.unlocked) return false;
        }

        if (node.isJobBranch && this.player.secondJob) {
            return false;
        }

        return true;
    }

    unlock(node) {
        if (!this.canUnlock(node)) return false;
        this.player.sp -= node.cost;
        node.unlocked = true;

        if (node.isJobBranch) {
            this.player.secondJob = node.isJobBranch;
            this.player.secondJobTitle = node.title.replace('[2차전직] ', '');
        }

        if (node.isSkill === 1) this.player.hasSkill1 = true;
        if (node.isSkill === 2) this.player.hasSkill2 = true;
        if (node.isUlt) this.player.hasUlt = node.isUlt;

        if (node.stat === 'maxHp') {
            this.player.maxHp += node.val;
            this.player.hp += node.val;
        } else if (node.stat === 'maxMp') {
            this.player.maxMp += node.val;
            this.player.mp += node.val;
        } else if (node.stat === 'atkMult') {
            this.player.attackBonus += node.val;
        } else if (node.stat === 'speedMult') {
            this.player.speedBonus += node.val;
        } else if (node.stat === 'critChance') {
            this.player.critChanceBonus += node.val;
        } else if (node.stat === 'ber_atk') {
            this.player.attackBonus += 0.25;
            this.player.critChanceBonus += 0.15;
        } else if (node.stat === 'lifesteal') {
            this.player.lifesteal += node.val;
        } else if (node.stat === 'pal_def') {
            this.player.maxHp += 60;
            this.player.hp += 60;
            this.player.damageReduction += 0.25;
        } else if (node.stat === 'thorns') {
            this.player.hasThorns = true;
        } else if (node.stat === 'triple_bolt') {
            this.player.hasTripleBolt = true;
        } else if (node.stat === 'cdr') {
            this.player.cdr += node.val;
        } else if (node.stat === 'manaShield') {
            this.player.hasManaShield = true;
        } else if (node.stat === 'critDmg') {
            this.player.critDamageMultiplier += node.val;
        } else if (node.stat === 'poison') {
            this.player.hasPoison = true;
        } else if (node.stat === 'dashClone') {
            this.player.hasDashClone = true;
        } else if (node.stat === 'dashCdr') {
            this.player.dashCdr += node.val;
        }

        return true;
    }

    draw(ctx, mouse) {
        ctx.fillStyle = 'rgba(10, 14, 23, 0.94)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 30px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('스킬 트리 & 2차 전직 (Skill Tree)', CANVAS_WIDTH / 2, 60);

        const jobStatus = this.player.secondJobTitle ? ` [현재 전직: ${this.player.secondJobTitle}]` : ' [2차 전직 미선택]';
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        ctx.fillText(`남은 스킬 포인트 (SP): ${this.player.sp}${jobStatus}`, CANVAS_WIDTH / 2, 95);

        ctx.lineWidth = 3;
        for (const node of this.nodes) {
            for (const reqId of node.reqs) {
                const reqNode = this.nodes.find(n => n.id === reqId);
                if (reqNode) {
                    ctx.beginPath();
                    ctx.moveTo(reqNode.x, reqNode.y);
                    ctx.lineTo(node.x, node.y);
                    ctx.strokeStyle = (reqNode.unlocked && node.unlocked) ? '#38bdf8' : '#334155';
                    ctx.stroke();
                }
            }
        }

        let hoveredNode = null;
        for (const node of this.nodes) {
            const dist = Math.hypot(mouse.x - node.x, mouse.y - node.y);
            const isHovered = dist < 28;
            if (isHovered) hoveredNode = node;

            ctx.beginPath();
            ctx.arc(node.x, node.y, 28, 0, Math.PI * 2);

            if (node.unlocked) {
                ctx.fillStyle = node.isJobBranch ? '#a855f7' : '#0284c7';
                ctx.strokeStyle = '#38bdf8';
            } else if (this.canUnlock(node)) {
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#fbbf24';
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = '#475569';
            }

            ctx.lineWidth = isHovered ? 5 : 3;
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(node.title.substring(0, 6), node.x, node.y + 4);
        }

        if (hoveredNode) {
            const tx = Math.min(hoveredNode.x + 35, CANVAS_WIDTH - 270);
            const ty = Math.max(hoveredNode.y - 40, 120);
            const can = this.canUnlock(hoveredNode);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.96)';
            ctx.strokeStyle = hoveredNode.unlocked ? '#38bdf8' : (can ? '#fbbf24' : '#64748b');
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(tx, ty, 250, 115, 8);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 15px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(hoveredNode.title, tx + 14, ty + 26);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px "Segoe UI", sans-serif';
            this.wrapText(ctx, hoveredNode.desc, tx + 14, ty + 48, 220, 16);

            ctx.font = 'bold 12px "Segoe UI", sans-serif';
            if (hoveredNode.unlocked) {
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('[ 습득 완료 ]', tx + 14, ty + 95);
            } else if (can) {
                ctx.fillStyle = '#4ade80';
                ctx.fillText(`[ 클릭하여 해금 - 필요 SP: ${hoveredNode.cost} ]`, tx + 14, ty + 95);
            } else {
                ctx.fillStyle = '#f87171';
                ctx.fillText(`[ 선행 필요 / 2차전직 중복불가 (비용: ${hoveredNode.cost}) ]`, tx + 14, ty + 95);
            }
        }

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('다시 [ K ] 또는 [ TAB ] 키를 누르면 게임으로 돌아갑니다.', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 35);
    }

    wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, y);
    }

    handleClick(mouse) {
        for (const node of this.nodes) {
            const dist = Math.hypot(mouse.x - node.x, mouse.y - node.y);
            if (dist < 28) {
                this.unlock(node);
                break;
            }
        }
    }
}

// --- PROJECTILE CLASS ---
class Projectile {
    constructor(x, y, vx, vy, radius, damage, isPlayer, color, lifetime = 120, extra = {}) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = radius;
        this.damage = damage;
        this.isPlayer = isPlayer;
        this.color = color;
        this.lifetime = lifetime;
        this.extra = extra;
        this.markedForDeletion = false;
    }

    update(dungeon) {
        this.x += this.vx;
        this.y += this.vy;
        this.lifetime--;

        if (this.lifetime <= 0) this.markedForDeletion = true;
        if (!this.extra.isGhostProj && dungeon.isWallColliding(this.x, this.y, this.radius)) {
            this.markedForDeletion = true;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- PLAYER CLASS ---
class Player {
    constructor(classType) {
        this.classData = CLASS_TYPES[classType];
        this.x = CANVAS_WIDTH / 2;
        this.y = CANVAS_HEIGHT / 2;
        this.radius = 18;

        this.maxHp = this.classData.hp;
        this.hp = this.maxHp;
        this.maxMp = this.classData.mp;
        this.mp = this.maxMp;

        this.baseSpeed = this.classData.speed;
        this.speedBonus = 0;
        this.baseAttack = this.classData.attack;
        this.attackBonus = 0;

        this.attackSpeedBonus = 0;
        this.critChanceBonus = 0;
        this.critDamageMultiplier = 1.5;

        this.level = 1;
        this.exp = 0;
        this.nextLevelExp = 50;
        this.sp = 0;

        this.secondJob = null;
        this.secondJobTitle = '';

        this.hasSkill1 = false;
        this.hasSkill2 = false;
        this.hasUlt = null;

        this.lifesteal = 0;
        this.damageReduction = 0;
        this.hasThorns = false;
        this.hasTripleBolt = false;
        this.cdr = 0;
        this.hasManaShield = false;
        this.hasPoison = false;
        this.hasDashClone = false;
        this.dashCdr = 0;

        this.attackCooldown = 0;
        this.dashCooldown = 0;
        this.skill1Cooldown = 0;
        this.skill2Cooldown = 0;
        this.ultCooldown = 0;

        this.isDashing = false;
        this.dashTimer = 0;
        this.iFrames = 60;
        this.slowTimer = 0;
        this.angle = 0;

        this.berserkBuffTimer = 0;
    }

    get attack() {
        let atk = Math.round(this.baseAttack * (1 + this.attackBonus));
        if (this.secondJob === 'BERSERKER' && (this.hp / this.maxHp) < 0.5) {
            atk = Math.round(atk * 1.5);
        }
        return atk;
    }

    get speed() {
        let spd = this.baseSpeed * (1 + this.speedBonus);
        if (this.slowTimer > 0) spd *= 0.5; // 50% slow effect
        return spd;
    }

    get critChance() {
        return Math.min(1.0, this.classData.critChance + this.critChanceBonus);
    }

    gainExp(amount, ps) {
        this.exp += amount;
        ps.addFloatingText(this.x, this.y - 25, `+${amount} EXP`, '#38bdf8', 15);
        while (this.exp >= this.nextLevelExp) {
            this.exp -= this.nextLevelExp;
            this.level++;
            this.sp += 1;
            this.nextLevelExp = Math.floor(this.nextLevelExp * 1.4);
            this.hp = this.maxHp;
            this.mp = this.maxMp;
            ps.addFloatingText(this.x, this.y - 45, 'LEVEL UP! +1 SP', '#fbbf24', 22, true);
            ps.addBurst(this.x, this.y, '#fbbf24', 25, 6);
        }
    }

    update(input, dungeon, ps, projectiles, enemies) {
        if (this.mp < this.maxMp) this.mp = Math.min(this.maxMp, this.mp + 0.12);

        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.dashCooldown > 0) this.dashCooldown--;
        if (this.skill1Cooldown > 0) this.skill1Cooldown--;
        if (this.skill2Cooldown > 0) this.skill2Cooldown--;
        if (this.ultCooldown > 0) this.ultCooldown--;
        if (this.iFrames > 0) this.iFrames--;
        if (this.slowTimer > 0) this.slowTimer--;
        if (this.berserkBuffTimer > 0) this.berserkBuffTimer--;

        this.angle = Math.atan2(input.mouse.y - this.y, input.mouse.x - this.x);

        if (this.isDashing) {
            this.dashTimer--;
            ps.addTrail(this.x, this.y, this.radius, this.classData.color);
            const moveSpeed = this.speed * 2.8;
            const dx = Math.cos(this.dashAngle) * moveSpeed;
            const dy = Math.sin(this.dashAngle) * moveSpeed;

            if (!dungeon.isWallColliding(this.x + dx, this.y, this.radius)) this.x += dx;
            if (!dungeon.isWallColliding(this.x, this.y + dy, this.radius)) this.y += dy;

            if (this.dashTimer <= 0) this.isDashing = false;
            return;
        }

        if ((input.wasTriggered(' ') || input.wasTriggered('shift') || input.mouse.rightClicked) && this.dashCooldown <= 0) {
            let moveX = 0, moveY = 0;
            if (input.isPressed('w') || input.isPressed('arrowup')) moveY -= 1;
            if (input.isPressed('s') || input.isPressed('arrowdown')) moveY += 1;
            if (input.isPressed('a') || input.isPressed('arrowleft')) moveX -= 1;
            if (input.isPressed('d') || input.isPressed('arrowright')) moveX += 1;

            this.dashAngle = (moveX !== 0 || moveY !== 0) ? Math.atan2(moveY, moveX) : this.angle;
            this.isDashing = true;
            this.dashTimer = 12;

            const baseDashCd = 60 * (1 - this.dashCdr);
            this.dashCooldown = Math.max(20, baseDashCd);
            this.iFrames = 22;

            if (this.hasDashClone) {
                projectiles.push(new Projectile(this.x, this.y, 0, 0, 30, Math.round(this.attack * 1.4), true, '#a855f7', 15, { isMelee: true }));
            }

            ps.shake(6, 4);
            ps.addBurst(this.x, this.y, '#ffffff', 10, 3);
            return;
        }

        let moveX = 0, moveY = 0;
        if (input.isPressed('w') || input.isPressed('arrowup')) moveY -= 1;
        if (input.isPressed('s') || input.isPressed('arrowdown')) moveY += 1;
        if (input.isPressed('a') || input.isPressed('arrowleft')) moveX -= 1;
        if (input.isPressed('d') || input.isPressed('arrowright')) moveX += 1;

        if (moveX !== 0 && moveY !== 0) {
            moveX /= Math.SQRT2;
            moveY /= Math.SQRT2;
        }

        const nextX = this.x + moveX * this.speed;
        const nextY = this.y + moveY * this.speed;

        if (!dungeon.isWallColliding(nextX, this.y, this.radius)) this.x = nextX;
        if (!dungeon.isWallColliding(this.x, nextY, this.radius)) this.y = nextY;

        if (input.mouse.down && this.attackCooldown <= 0) {
            this.useBasicAttack(projectiles, ps);
        }
    }

    useBasicAttack(projectiles, ps) {
        let speedMult = (1 + this.attackSpeedBonus);
        if (this.berserkBuffTimer > 0) speedMult *= 2.0;

        const interval = Math.max(8, Math.floor(60 / (this.classData.attackSpeed * speedMult)));
        this.attackCooldown = interval;

        const isCrit = Math.random() < this.critChance;
        let dmg = this.attack;
        if (isCrit) dmg = Math.round(dmg * this.critDamageMultiplier);

        if (this.classData.id === 'WARRIOR') {
            ps.shake(4, 3);
            projectiles.push(new Projectile(
                this.x + Math.cos(this.angle) * 25,
                this.y + Math.sin(this.angle) * 25,
                Math.cos(this.angle) * 6, Math.sin(this.angle) * 6,
                28, dmg, true, '#f87171', 8, { isMelee: true, isCrit }
            ));
        } else if (this.classData.id === 'MAGE') {
            if (this.hasTripleBolt) {
                for (let i = -1; i <= 1; i++) {
                    const ang = this.angle + (i * 0.18);
                    projectiles.push(new Projectile(
                        this.x, this.y, Math.cos(ang) * 11, Math.sin(ang) * 11,
                        8, Math.round(dmg * 0.8), true, '#60a5fa', 80, { isCrit }
                    ));
                }
            } else {
                projectiles.push(new Projectile(
                    this.x, this.y, Math.cos(this.angle) * 11, Math.sin(this.angle) * 11,
                    8, dmg, true, '#60a5fa', 90, { isCrit }
                ));
            }
        } else if (this.classData.id === 'ROGUE') {
            projectiles.push(new Projectile(
                this.x, this.y, Math.cos(this.angle) * 15, Math.sin(this.angle) * 15,
                6, dmg, true, '#34d399', 50, { isCrit, isPoison: this.hasPoison }
            ));
        }
    }

    useSkill1(projectiles, ps) {
        if (!this.hasSkill1 || this.skill1Cooldown > 0) return;
        const cdMult = (1 - this.cdr) * (this.berserkBuffTimer > 0 ? 0.5 : 1.0);

        if (this.classData.id === 'WARRIOR') {
            this.skill1Cooldown = Math.floor(180 * cdMult);
            ps.shake(10, 8);
            for (let i = 0; i < 8; i++) {
                const ang = (Math.PI * 2 / 8) * i;
                projectiles.push(new Projectile(
                    this.x, this.y, Math.cos(ang) * 7, Math.sin(ang) * 7,
                    24, Math.round(this.attack * 1.6), true, '#ef4444', 15, { isMelee: true }
                ));
            }
        } else if (this.classData.id === 'MAGE') {
            if (this.mp < 20) return;
            this.mp -= 20;
            this.skill1Cooldown = Math.floor(120 * cdMult);
            ps.shake(8, 6);
            const radius = (this.secondJob === 'ARCHMAGE') ? 28 : 14;
            projectiles.push(new Projectile(
                this.x, this.y, Math.cos(this.angle) * 9, Math.sin(this.angle) * 9,
                radius, Math.round(this.attack * 2.3), true, '#f97316', 80, { isExplosive: true }
            ));
        } else if (this.classData.id === 'ROGUE') {
            this.skill1Cooldown = Math.floor(100 * cdMult);
            ps.shake(6, 4);
            for (let i = -2; i <= 2; i++) {
                const ang = this.angle + (i * 0.15);
                projectiles.push(new Projectile(
                    this.x, this.y, Math.cos(ang) * 14, Math.sin(ang) * 14,
                    6, Math.round(this.attack * 0.95), true, '#10b981', 50, { isPoison: this.hasPoison }
                ));
            }
        }
    }

    useSkill2(projectiles, ps) {
        if (!this.hasSkill2 || this.skill2Cooldown > 0) return;
        const cdMult = (1 - this.cdr) * (this.berserkBuffTimer > 0 ? 0.5 : 1.0);

        if (this.classData.id === 'WARRIOR') {
            this.skill2Cooldown = Math.floor(220 * cdMult);
            ps.shake(14, 12);
            projectiles.push(new Projectile(
                this.x, this.y, Math.cos(this.angle) * 12, Math.sin(this.angle) * 12,
                38, Math.round(this.attack * 2.6), true, '#b91c1c', 25, { isMelee: true }
            ));
        } else if (this.classData.id === 'MAGE') {
            if (this.mp < 30) return;
            this.mp -= 30;
            this.skill2Cooldown = Math.floor(180 * cdMult);
            ps.shake(10, 8);
            for (let i = 0; i < 16; i++) {
                const ang = (Math.PI * 2 / 16) * i;
                projectiles.push(new Projectile(
                    this.x, this.y, Math.cos(ang) * 5, Math.sin(ang) * 5,
                    16, Math.round(this.attack * 1.3), true, '#38bdf8', 35, { isSlow: true }
                ));
            }
        } else if (this.classData.id === 'ROGUE') {
            this.skill2Cooldown = Math.floor(160 * cdMult);
            ps.shake(8, 6);
            ps.addBurst(this.x, this.y, '#a855f7', 20, 5);
            this.x += Math.cos(this.angle) * 150;
            this.y += Math.sin(this.angle) * 150;
            this.iFrames = 18;
            ps.addBurst(this.x, this.y, '#a855f7', 20, 5);
        }
    }

    useUltimate(projectiles, ps, enemies) {
        if (!this.hasUlt || this.ultCooldown > 0) return;
        this.ultCooldown = 900;

        if (this.hasUlt === 'WARRIOR_BER') {
            this.berserkBuffTimer = 600;
            ps.shake(15, 12);
            ps.addFloatingText(this.x, this.y - 40, '피의 분노 발동!', '#ef4444', 24, true);
        } else if (this.hasUlt === 'WARRIOR_PAL') {
            this.iFrames = 240;
            ps.shake(15, 12);
            ps.addFloatingText(this.x, this.y - 40, '천상의 무적 방벽!', '#fbbf24', 24, true);
            for (let i = 0; i < 12; i++) {
                const ang = (Math.PI * 2 / 12) * i;
                projectiles.push(new Projectile(this.x, this.y, Math.cos(ang) * 8, Math.sin(ang) * 8, 20, 150, true, '#fbbf24', 40));
            }
        } else if (this.hasUlt === 'MAGE_ARCH') {
            ps.shake(20, 15);
            ps.addFloatingText(this.x, this.y - 40, '메테오 스트라이크!', '#f97316', 26, true);
            for (let i = 0; i < 8; i++) {
                const rx = 150 + Math.random() * (CANVAS_WIDTH - 300);
                const ry = 150 + Math.random() * (CANVAS_HEIGHT - 300);
                setTimeout(() => {
                    ps.addBurst(rx, ry, '#f97316', 30, 8);
                    projectiles.push(new Projectile(rx, ry, 0, 0, 60, 300, true, '#f97316', 15, { isMelee: true }));
                }, i * 150);
            }
        } else if (this.hasUlt === 'MAGE_CHR') {
            ps.shake(15, 10);
            ps.addFloatingText(this.x, this.y - 40, '시간 정지 (TIME STOP)!', '#38bdf8', 26, true);
            for (const enemy of enemies) {
                enemy.freezeTimer = 210;
            }
        } else if (this.hasUlt === 'ROGUE_ASS') {
            let strongest = null;
            let maxHp = 0;
            for (const enemy of enemies) {
                if (enemy.hp > maxHp) {
                    maxHp = enemy.hp;
                    strongest = enemy;
                }
            }
            if (strongest) {
                ps.shake(18, 14);
                strongest.takeDamage(this.attack * 10, ps, true);
                ps.addFloatingText(strongest.x, strongest.y - 30, '암살 처단!', '#a855f7', 28, true);
            }
        } else if (this.hasUlt === 'ROGUE_SHA') {
            ps.shake(15, 12);
            ps.addFloatingText(this.x, this.y - 40, '백화요란 단검 난무!', '#10b981', 26, true);
            for (let i = 0; i < 24; i++) {
                const ang = (Math.PI * 2 / 24) * i;
                projectiles.push(new Projectile(this.x, this.y, Math.cos(ang) * 16, Math.sin(ang) * 16, 6, Math.round(this.attack * 1.5), true, '#10b981', 60, { isCrit: true }));
            }
        }
    }

    takeDamage(amount, ps, projectiles) {
        if (this.iFrames > 0) return;

        let finalDamage = amount * (1 - this.damageReduction);

        if (this.hasManaShield && this.mp > 10) {
            const manaAbsorb = Math.min(this.mp, finalDamage * 0.5);
            this.mp -= manaAbsorb;
            finalDamage -= manaAbsorb;
        }

        this.hp -= Math.max(1, Math.round(finalDamage));
        this.iFrames = 25;
        ps.shake(12, 10);
        ps.addDamageText(this.x, this.y - 20, `-${Math.round(finalDamage)}`, '#f87171', 20, true);
        ps.addBurst(this.x, this.y, '#ef4444', 12, 4);

        if (this.hasThorns && projectiles) {
            for (let i = 0; i < 8; i++) {
                const ang = (Math.PI * 2 / 8) * i;
                projectiles.push(new Projectile(this.x, this.y, Math.cos(ang) * 6, Math.sin(ang) * 6, 12, 25, true, '#fbbf24', 20));
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.iFrames > 0 && Math.floor(this.iFrames / 4) % 2 === 0) {
            ctx.globalAlpha = 0.35;
        }

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(this.angle) * 30, Math.sin(this.angle) * 30);
        ctx.stroke();

        ctx.fillStyle = this.classData.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.classData.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        if (this.slowTimer > 0) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();
    }
}

// --- ENEMY CLASS (EXTENDED WITH MORE TYPES & ELITE MECHANICS) ---
class Enemy {
    constructor(x, y, type, floor = 1, isElite = false) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.floor = floor;
        this.isElite = isElite;
        this.markedForDeletion = false;
        this.flashWhiteTimer = 0;
        this.freezeTimer = 0;
        this.poisonTimer = 0;
        this.timer = 0;

        // Elite Aura Properties
        this.eliteType = isElite ? ['SPEED', 'SHIELD', 'EXPLOSIVE'][Math.floor(Math.random() * 3)] : null;
        this.shieldHp = 0;

        this.configureStats();
    }

    configureStats() {
        const mult = 1 + (this.floor - 1) * 0.4;
        this.name = '기본 몬스터';

        if (this.type === 'SLIME') {
            this.name = '슬라임';
            this.radius = 16;
            this.hp = Math.round(40 * mult);
            this.speed = 2.2;
            this.damage = 10;
            this.color = '#22c55e';
            this.expReward = 20;
        } else if (this.type === 'GOBLIN') {
            this.name = '고블린 러너';
            this.radius = 14;
            this.hp = Math.round(55 * mult);
            this.speed = 3.6;
            this.damage = 14;
            this.color = '#eab308';
            this.expReward = 30;
        } else if (this.type === 'ARCHER') {
            this.name = '해골 궁수';
            this.radius = 15;
            this.hp = Math.round(45 * mult);
            this.speed = 2.0;
            this.damage = 12;
            this.color = '#a855f7';
            this.expReward = 35;
            this.shootCooldown = 0;
        } else if (this.type === 'ORC') {
            this.name = '오크 전사';
            this.radius = 24;
            this.hp = Math.round(140 * mult);
            this.speed = 1.6;
            this.damage = 22;
            this.color = '#f97316';
            this.expReward = 60;
        } else if (this.type === 'GHOST') {
            this.name = '유령 추적자';
            this.radius = 15;
            this.hp = Math.round(65 * mult);
            this.speed = 2.8;
            this.damage = 16;
            this.color = '#38bdf8';
            this.expReward = 45;
            this.isGhost = true; // Can pass through walls
            this.alpha = 0.6;
        } else if (this.type === 'BOMBER') {
            this.name = '자폭 해골';
            this.radius = 16;
            this.hp = Math.round(35 * mult);
            this.speed = 3.8;
            this.damage = 45;
            this.color = '#ef4444';
            this.expReward = 40;
            this.isPreparingExplosion = false;
            this.explodeTimer = 0;
        } else if (this.type === 'SHAMAN') {
            this.name = '다크 샤만';
            this.radius = 18;
            this.hp = Math.round(80 * mult);
            this.speed = 1.8;
            this.damage = 15;
            this.color = '#10b981';
            this.expReward = 65;
            this.summonCooldown = 180;
        } else if (this.type === 'GOLEM') {
            this.name = '철갑 골렘';
            this.radius = 28;
            this.hp = Math.round(220 * mult);
            this.speed = 1.2;
            this.damage = 30;
            this.color = '#64748b';
            this.expReward = 90;
            this.armor = 0.4; // 40% damage reduction
        } else if (this.type === 'BOSS') {
            this.configureBossStats();
        }

        if (this.isElite) {
            this.name = `[엘리트] ${this.name}`;
            this.hp = Math.round(this.hp * 2.2);
            this.radius += 5;
            this.expReward *= 3;
            if (this.eliteType === 'SHIELD') this.shieldHp = Math.round(this.hp * 0.5);
            if (this.eliteType === 'SPEED') this.speed *= 1.4;
        }

        this.maxHp = this.hp;
    }

    configureBossStats() {
        if (this.floor === 1) {
            this.name = '슬라임 킹 (B1F BOSS)';
            this.radius = 48;
            this.hp = 1200;
            this.speed = 1.7;
            this.damage = 22;
            this.color = '#15803d';
            this.expReward = 600;
        } else if (this.floor === 2) {
            this.name = '대마도사 리치 (B2F BOSS)';
            this.radius = 42;
            this.hp = 2200;
            this.speed = 2.1;
            this.damage = 28;
            this.color = '#7e22ce';
            this.expReward = 1000;
        } else {
            this.name = '심연의 마왕 (FINAL BOSS)';
            this.radius = 52;
            this.hp = 3800;
            this.speed = 2.5;
            this.damage = 36;
            this.color = '#b91c1c';
            this.expReward = 2000;
        }
        this.maxHp = this.hp;
        this.bossTimer = 0;
        this.phase = 1;
    }

    update(player, dungeon, ps, projectiles, roomEnemies) {
        if (this.flashWhiteTimer > 0) this.flashWhiteTimer--;
        this.timer++;

        if (this.freezeTimer > 0) {
            this.freezeTimer--;
            return;
        }

        if (this.poisonTimer > 0) {
            this.poisonTimer--;
            if (this.poisonTimer % 20 === 0) {
                this.takeDamage(12, ps);
            }
        }

        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        const dist = Math.hypot(player.x - this.x, player.y - this.y);

        if (this.type === 'BOSS') {
            this.updateBossPatterns(player, dungeon, ps, projectiles, roomEnemies, angle, dist);
            return;
        }

        // --- SPECIFIC MOB BEHAVIORS ---
        if (this.type === 'BOMBER') {
            if (dist < 120 && !this.isPreparingExplosion) {
                this.isPreparingExplosion = true;
                this.explodeTimer = 45; // 0.75s warning
                ps.addGroundAoE(this.x, this.y, 90, '#ef4444', 45, () => {
                    ps.shake(12, 10);
                    ps.addBurst(this.x, this.y, '#f97316', 25, 8);
                    const eDist = Math.hypot(player.x - this.x, player.y - this.y);
                    if (eDist <= 90) player.takeDamage(this.damage, ps, projectiles);
                    this.markedForDeletion = true;
                });
            }

            if (!this.isPreparingExplosion) {
                this.moveTowards(angle, dungeon);
            } else {
                this.explodeTimer--;
            }
        } else if (this.type === 'SHAMAN') {
            this.summonCooldown--;
            if (this.summonCooldown <= 0 && roomEnemies.length < 12) {
                this.summonCooldown = 240;
                ps.addFloatingText(this.x, this.y - 20, '슬라임 소환!', '#10b981', 14);
                ps.addBurst(this.x, this.y, '#10b981', 12, 4);
                const miniSlime = new Enemy(this.x + (Math.random() - 0.5) * 40, this.y + (Math.random() - 0.5) * 40, 'SLIME', this.floor);
                roomEnemies.push(miniSlime);
            }
            if (dist < 260) {
                this.moveTowards(angle + Math.PI, dungeon); // Kiting
            } else {
                this.moveTowards(angle, dungeon);
            }
        } else if (this.type === 'ARCHER') {
            if (this.shootCooldown > 0) this.shootCooldown--;
            if (dist < 250 && dist > 140) {
                if (this.shootCooldown <= 0) {
                    this.shootCooldown = 100;
                    projectiles.push(new Projectile(this.x, this.y, Math.cos(angle) * 6, Math.sin(angle) * 6, 6, this.damage, false, '#c084fc', 120));
                }
            } else if (dist <= 140) {
                this.moveTowards(angle + Math.PI, dungeon);
            } else {
                this.moveTowards(angle, dungeon);
            }
        } else {
            this.moveTowards(angle, dungeon);
        }

        // Collision Damage to Player
        if (dist < this.radius + player.radius && this.type !== 'BOMBER') {
            player.takeDamage(this.damage, ps, projectiles);
        }
    }

    moveTowards(angle, dungeon) {
        const dx = Math.cos(angle) * this.speed;
        const dy = Math.sin(angle) * this.speed;

        if (this.isGhost) {
            this.x += dx;
            this.y += dy;
        } else {
            if (!dungeon.isWallColliding(this.x + dx, this.y, this.radius)) this.x += dx;
            if (!dungeon.isWallColliding(this.x, this.y + dy, this.radius)) this.y += dy;
        }
    }

    updateBossPatterns(player, dungeon, ps, projectiles, roomEnemies, angle, dist) {
        this.bossTimer++;
        if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
            this.phase = 2;
            ps.addFloatingText(this.x, this.y - 50, '페이즈 2 광폭화!', '#ef4444', 28, true);
            ps.shake(15, 12);
        }

        // Movement
        this.moveTowards(angle, dungeon);

        // --- B1F BOSS: SLIME KING ---
        if (this.floor === 1) {
            if (this.bossTimer % 110 === 0) {
                ps.addGroundAoE(this.x, this.y, 160, '#22c55e', 40, () => {
                    ps.shake(12, 8);
                    for (let i = 0; i < 12; i++) {
                        const a = (Math.PI * 2 / 12) * i;
                        projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 5, Math.sin(a) * 5, 10, 18, false, '#22c55e', 100));
                    }
                });
            }
            if (this.bossTimer % 220 === 0 && this.phase === 2) {
                for (let i = 0; i < 2; i++) {
                    roomEnemies.push(new Enemy(this.x + (i * 30 - 15), this.y, 'SLIME', this.floor));
                }
            }
        }

        // --- B2F BOSS: LICH ARCHMAGE ---
        else if (this.floor === 2) {
            if (this.bossTimer % 90 === 0) {
                const count = this.phase === 2 ? 16 : 10;
                for (let i = 0; i < count; i++) {
                    const a = (Math.PI * 2 / count) * i + (this.bossTimer * 0.02);
                    projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 6, Math.sin(a) * 6, 8, 20, false, '#a855f7', 120, { isGhostProj: true }));
                }
            }
            if (this.bossTimer % 180 === 0) {
                // Frost Bolt slowing shot
                projectiles.push(new Projectile(this.x, this.y, Math.cos(angle) * 8, Math.sin(angle) * 8, 14, 25, false, '#38bdf8', 100, { isSlow: true }));
            }
            if (this.bossTimer % 250 === 0) {
                // Teleport
                ps.addBurst(this.x, this.y, '#a855f7', 20, 5);
                this.x = 200 + Math.random() * (CANVAS_WIDTH - 400);
                this.y = 200 + Math.random() * (CANVAS_HEIGHT - 400);
                ps.addBurst(this.x, this.y, '#a855f7', 20, 5);
            }
        }

        // --- B3F BOSS: ABYSS DEMON LORD ---
        else if (this.floor === 3) {
            if (this.bossTimer % 60 === 0) {
                projectiles.push(new Projectile(this.x, this.y, Math.cos(angle) * 9, Math.sin(angle) * 9, 12, 28, false, '#ef4444', 90));
            }
            if (this.bossTimer % 160 === 0) {
                ps.addGroundAoE(player.x, player.y, 140, '#f97316', 50, () => {
                    ps.shake(16, 12);
                    ps.addBurst(player.x, player.y, '#f97316', 30, 8);
                    const d = Math.hypot(player.x - player.x, player.y - player.y);
                    projectiles.push(new Projectile(player.x, player.y, 0, 0, 140, 40, false, '#f97316', 10, { isMelee: true }));
                });
            }
            if (this.bossTimer % 240 === 0 && this.phase === 2) {
                ps.shake(18, 14);
                for (let i = 0; i < 20; i++) {
                    const a = (Math.PI * 2 / 20) * i;
                    projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 7, Math.sin(a) * 7, 10, 24, false, '#dc2626', 150));
                }
            }
        }

        if (dist < this.radius + player.radius) {
            player.takeDamage(this.damage, ps, projectiles);
        }
    }

    takeDamage(amount, ps, isCrit = false) {
        let finalAmt = amount;

        // Armor logic
        if (this.armor) finalAmt *= (1 - this.armor);

        // Elite Shield absorbs damage
        if (this.shieldHp > 0) {
            if (this.shieldHp >= finalAmt) {
                this.shieldHp -= finalAmt;
                ps.addDamageText(this.x, this.y - 15, `[Shield ${Math.round(finalAmt)}]`, '#38bdf8', 14);
                return;
            } else {
                finalAmt -= this.shieldHp;
                this.shieldHp = 0;
            }
        }

        this.hp -= finalAmt;
        this.flashWhiteTimer = 4;
        ps.addDamageText(this.x, this.y - 15, `${Math.round(finalAmt)}`, isCrit ? '#facc15' : '#ffffff', isCrit ? 22 : 16, isCrit);
        ps.addBurst(this.x, this.y, this.color, 6, 3);

        if (this.hp <= 0) {
            this.markedForDeletion = true;
            ps.addBurst(this.x, this.y, this.color, 25, 6);

            // Explosive Elite death effect
            if (this.isElite && this.eliteType === 'EXPLOSIVE') {
                ps.shake(10, 8);
                ps.addBurst(this.x, this.y, '#ef4444', 30, 8);
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Elite Aura Effect
        if (this.isElite) {
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.fillStyle = this.freezeTimer > 0 ? '#38bdf8' : (this.flashWhiteTimer > 0 ? '#ffffff' : this.color);
        ctx.shadowBlur = this.isElite ? 18 : 10;
        ctx.shadowColor = this.isElite ? '#fbbf24' : this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Elite Shield Bar
        if (this.shieldHp > 0) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
            ctx.stroke();
        }

        // HP bar (for non-bosses)
        if (this.type !== 'BOSS' && this.hp < this.maxHp) {
            const barW = this.radius * 2;
            const hpRatio = Math.max(0, this.hp / this.maxHp);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(-barW / 2, -this.radius - 12, barW, 5);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-barW / 2, -this.radius - 12, barW * hpRatio, 5);
        }

        ctx.restore();
    }
}

// --- DUNGEON SYSTEM ---
class Room {
    constructor(gridX, gridY, type = 'BATTLE') {
        this.gridX = gridX;
        this.gridY = gridY;
        this.type = type;
        this.cleared = (type === 'START' || type === 'REST');
        this.visited = false;
        this.enemies = [];
        this.doors = { N: false, S: false, E: false, W: false };
    }
}

class Dungeon {
    constructor(floor = 1) {
        this.floor = floor;
        this.gridSize = 4;
        this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(null));
        this.currentRoom = null;

        this.bounds = {
            left: 100,
            right: CANVAS_WIDTH - 100,
            top: 100,
            bottom: CANVAS_HEIGHT - 100
        };

        this.generateDungeon();
    }

    generateDungeon() {
        const startX = 1;
        const startY = 1;
        const startRoom = new Room(startX, startY, 'START');
        startRoom.visited = true;
        this.grid[startX][startY] = startRoom;
        this.currentRoom = startRoom;

        const roomQueue = [{ x: startX, y: startY }];
        let totalRooms = 7 + this.floor * 2;
        let createdRooms = 1;

        const dirs = [
            { x: 0, y: -1, door: 'N', opp: 'S' },
            { x: 0, y: 1, door: 'S', opp: 'N' },
            { x: 1, y: 0, door: 'E', opp: 'W' },
            { x: -1, y: 0, door: 'W', opp: 'E' }
        ];

        let lastCreatedRoom = null;

        while (roomQueue.length > 0 && createdRooms < totalRooms) {
            const curr = roomQueue.shift();
            const currRoom = this.grid[curr.x][curr.y];
            dirs.sort(() => Math.random() - 0.5);

            for (const d of dirs) {
                const nx = curr.x + d.x;
                const ny = curr.y + d.y;

                if (nx >= 0 && nx < this.gridSize && ny >= 0 && ny < this.gridSize) {
                    if (!this.grid[nx][ny] && createdRooms < totalRooms) {
                        const newRoom = new Room(nx, ny, 'BATTLE');
                        this.grid[nx][ny] = newRoom;
                        createdRooms++;
                        lastCreatedRoom = newRoom;

                        currRoom.doors[d.door] = true;
                        newRoom.doors[d.opp] = true;

                        roomQueue.push({ x: nx, y: ny });
                    }
                }
            }
        }

        if (lastCreatedRoom) lastCreatedRoom.type = 'BOSS';
    }

    spawnEnemiesForRoom(room) {
        if (room.cleared || room.enemies.length > 0) return;

        if (room.type === 'BOSS') {
            const boss = new Enemy(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 50, 'BOSS', this.floor);
            room.enemies.push(boss);
            return;
        }

        const count = 3 + Math.floor(Math.random() * 3) + this.floor;
        const availableTypes = ['SLIME', 'GOBLIN', 'ARCHER', 'ORC', 'GHOST', 'BOMBER', 'SHAMAN', 'GOLEM'];

        for (let i = 0; i < count; i++) {
            const x = this.bounds.left + 80 + Math.random() * (this.bounds.right - this.bounds.left - 160);
            const y = this.bounds.top + 80 + Math.random() * (this.bounds.bottom - this.bounds.top - 160);
            const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
            const isElite = Math.random() < 0.2; // 20% Elite chance
            room.enemies.push(new Enemy(x, y, type, this.floor, isElite));
        }
    }

    isWallColliding(x, y, radius) {
        if (x - radius < this.bounds.left) {
            if (!(y > CANVAS_HEIGHT / 2 - 50 && y < CANVAS_HEIGHT / 2 + 50 && this.currentRoom.doors.W && this.currentRoom.cleared)) return true;
        }
        if (x + radius > this.bounds.right) {
            if (!(y > CANVAS_HEIGHT / 2 - 50 && y < CANVAS_HEIGHT / 2 + 50 && this.currentRoom.doors.E && this.currentRoom.cleared)) return true;
        }
        if (y - radius < this.bounds.top) {
            if (!(x > CANVAS_WIDTH / 2 - 50 && x < CANVAS_WIDTH / 2 + 50 && this.currentRoom.doors.N && this.currentRoom.cleared)) return true;
        }
        if (y + radius > this.bounds.bottom) {
            if (!(x > CANVAS_WIDTH / 2 - 50 && x < CANVAS_WIDTH / 2 + 50 && this.currentRoom.doors.S && this.currentRoom.cleared)) return true;
        }
        return false;
    }

    checkDoorTransitions(player, ps) {
        if (!this.currentRoom.cleared) return;

        const cx = this.currentRoom.gridX;
        const cy = this.currentRoom.gridY;

        if (player.y < this.bounds.top - 10 && this.currentRoom.doors.N) {
            this.transitionRoom(cx, cy - 1, player, CANVAS_WIDTH / 2, this.bounds.bottom - 40, ps);
        } else if (player.y > this.bounds.bottom + 10 && this.currentRoom.doors.S) {
            this.transitionRoom(cx, cy + 1, player, CANVAS_WIDTH / 2, this.bounds.top + 40, ps);
        } else if (player.x < this.bounds.left - 10 && this.currentRoom.doors.W) {
            this.transitionRoom(cx - 1, cy, player, this.bounds.right - 40, CANVAS_HEIGHT / 2, ps);
        } else if (player.x > this.bounds.right + 10 && this.currentRoom.doors.E) {
            this.transitionRoom(cx + 1, cy, player, this.bounds.left + 40, CANVAS_HEIGHT / 2, ps);
        }
    }

    transitionRoom(nx, ny, player, px, py, ps) {
        if (this.grid[nx][ny]) {
            this.currentRoom = this.grid[nx][ny];
            this.currentRoom.visited = true;
            player.x = px;
            player.y = py;

            player.iFrames = 60;
            if (ps) ps.addFloatingText(px, py - 35, '방 입장! 1초간 무적', '#fbbf24', 18, true);

            this.spawnEnemiesForRoom(this.currentRoom);
        }
    }

    draw(ctx) {
        ctx.fillStyle = '#111827';
        ctx.fillRect(this.bounds.left, this.bounds.top, this.bounds.right - this.bounds.left, this.bounds.bottom - this.bounds.top);

        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 1;
        for (let x = this.bounds.left; x <= this.bounds.right; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, this.bounds.top);
            ctx.lineTo(x, this.bounds.bottom);
            ctx.stroke();
        }
        for (let y = this.bounds.top; y <= this.bounds.bottom; y += 40) {
            ctx.beginPath();
            ctx.moveTo(this.bounds.left, y);
            ctx.lineTo(this.bounds.right, y);
            ctx.stroke();
        }

        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 12;
        ctx.strokeRect(this.bounds.left, this.bounds.top, this.bounds.right - this.bounds.left, this.bounds.bottom - this.bounds.top);

        const isUnlocked = this.currentRoom.cleared;
        ctx.fillStyle = isUnlocked ? '#10b981' : '#ef4444';

        if (this.currentRoom.doors.N) ctx.fillRect(CANVAS_WIDTH / 2 - 40, this.bounds.top - 12, 80, 14);
        if (this.currentRoom.doors.S) ctx.fillRect(CANVAS_WIDTH / 2 - 40, this.bounds.bottom - 2, 80, 14);
        if (this.currentRoom.doors.W) ctx.fillRect(this.bounds.left - 12, CANVAS_HEIGHT / 2 - 40, 14, 80);
        if (this.currentRoom.doors.E) ctx.fillRect(this.bounds.right - 2, CANVAS_HEIGHT / 2 - 40, 14, 80);
    }
}

// --- MAIN GAME ENGINE CLASS ---
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        this.input = new InputHandler(this.canvas);
        this.ps = new ParticleSystem();

        this.state = STATE.TITLE;
        this.selectedClass = 'WARRIOR';

        this.player = null;
        this.dungeon = null;
        this.skillTree = null;
        this.projectiles = [];

        this.hitStopFrames = 0;

        this.init();
    }

    init() {
        requestAnimationFrame((timestamp) => this.loop(timestamp));
    }

    startNewGame() {
        this.player = new Player(this.selectedClass);
        this.dungeon = new Dungeon(1);
        this.skillTree = new SkillTree(this.player);
        this.projectiles = [];
        this.state = STATE.PLAYING;
    }

    loop(timestamp) {
        this.update();
        this.render();
        requestAnimationFrame((ts) => this.loop(ts));
    }

    update() {
        if ((this.input.wasTriggered('k') || this.input.wasTriggered('tab')) &&
            (this.state === STATE.PLAYING || this.state === STATE.SKILL_TREE)) {
            this.state = (this.state === STATE.PLAYING) ? STATE.SKILL_TREE : STATE.PLAYING;
        }

        if (this.state === STATE.TITLE) {
            if (this.input.mouse.clicked || this.input.wasTriggered(' ') || this.input.wasTriggered('enter')) {
                this.state = STATE.SELECT;
            }
            this.input.clearTriggers();
            return;
        }

        if (this.state === STATE.SELECT) {
            this.updateSelectScreen();
            this.input.clearTriggers();
            return;
        }

        if (this.input.wasTriggered('r') && (this.state === STATE.GAME_OVER || this.state === STATE.VICTORY)) {
            this.state = STATE.SELECT;
        }

        if (this.state === STATE.PLAYING) {
            if (this.hitStopFrames > 0) {
                this.hitStopFrames--;
                return;
            }

            const room = this.dungeon.currentRoom;

            this.player.update(this.input, this.dungeon, this.ps, this.projectiles, room.enemies);

            if (this.input.wasTriggered('q')) this.player.useSkill1(this.projectiles, this.ps);
            if (this.input.wasTriggered('e')) this.player.useSkill2(this.projectiles, this.ps);
            if (this.input.wasTriggered('r')) this.player.useUltimate(this.projectiles, this.ps, room.enemies);

            this.dungeon.checkDoorTransitions(this.player, this.ps);

            for (let i = room.enemies.length - 1; i >= 0; i--) {
                const enemy = room.enemies[i];
                enemy.update(this.player, this.dungeon, this.ps, this.projectiles, room.enemies);

                if (enemy.markedForDeletion) {
                    this.player.gainExp(enemy.expReward, this.ps);
                    room.enemies.splice(i, 1);

                    if (enemy.type === 'BOSS') {
                        if (this.dungeon.floor >= 3) {
                            this.state = STATE.VICTORY;
                        } else {
                            this.dungeon = new Dungeon(this.dungeon.floor + 1);
                            this.player.iFrames = 60;
                            this.ps.addFloatingText(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, `FLOOR ${this.dungeon.floor} CLEARED!`, '#4ade80', 30, true);
                        }
                    }
                }
            }

            if (room.enemies.length === 0 && !room.cleared) {
                room.cleared = true;
                this.ps.addFloatingText(CANVAS_WIDTH / 2, 200, '방 클리어 (ROOM CLEARED!)', '#4ade80', 24, true);
            }

            for (let i = this.projectiles.length - 1; i >= 0; i--) {
                const proj = this.projectiles[i];
                proj.update(this.dungeon);

                if (proj.isPlayer) {
                    for (const enemy of room.enemies) {
                        const dist = Math.hypot(proj.x - enemy.x, proj.y - enemy.y);
                        if (dist < proj.radius + enemy.radius) {
                            enemy.takeDamage(proj.damage, this.ps, proj.extra.isCrit);
                            this.hitStopFrames = 2;

                            if (this.player.lifesteal > 0) {
                                this.player.hp = Math.min(this.player.maxHp, this.player.hp + Math.round(proj.damage * this.player.lifesteal));
                            }

                            if (proj.extra.isSlow) enemy.freezeTimer = 60;
                            if (proj.extra.isPoison) enemy.poisonTimer = 120;
                            if (proj.extra.isExplosive) {
                                this.ps.addBurst(proj.x, proj.y, '#f97316', 20, 6);
                                this.ps.shake(8, 6);
                            }
                            if (!proj.extra.isMelee && !proj.extra.isPiercing) {
                                proj.markedForDeletion = true;
                            }
                            break;
                        }
                    }
                } else {
                    const dist = Math.hypot(proj.x - this.player.x, proj.y - this.player.y);
                    if (dist < proj.radius + this.player.radius) {
                        this.player.takeDamage(proj.damage, this.ps, this.projectiles);
                        if (proj.extra.isSlow) this.player.slowTimer = 90; // 1.5s slow effect on player
                        proj.markedForDeletion = true;
                    }
                }

                if (proj.markedForDeletion) {
                    this.projectiles.splice(i, 1);
                }
            }

            if (this.player.hp <= 0) {
                this.state = STATE.GAME_OVER;
            }

            this.ps.update();
        } else if (this.state === STATE.SKILL_TREE) {
            if (this.input.mouse.clicked) {
                this.skillTree.handleClick(this.input.mouse);
            }
        }

        this.input.clearTriggers();
    }

    render() {
        this.ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        this.ctx.save();
        this.ps.applyShake(this.ctx);

        if (this.state === STATE.TITLE) {
            this.renderTitleScreen();
        } else if (this.state === STATE.SELECT) {
            this.renderSelectScreen();
        } else if (this.state === STATE.PLAYING || this.state === STATE.SKILL_TREE) {
            this.dungeon.draw(this.ctx);

            for (const proj of this.projectiles) proj.draw(this.ctx);
            for (const enemy of this.dungeon.currentRoom.enemies) enemy.draw(this.ctx);
            this.player.draw(this.ctx);

            this.ps.draw(this.ctx);

            this.renderHUD();

            if (this.state === STATE.SKILL_TREE) {
                this.skillTree.draw(this.ctx, this.input.mouse);
            }
        } else if (this.state === STATE.GAME_OVER) {
            this.renderGameOverScreen();
        } else if (this.state === STATE.VICTORY) {
            this.renderVictoryScreen();
        }

        this.ctx.restore();
    }

    renderTitleScreen() {
        this.ctx.fillStyle = '#0b0e14';
        this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        this.ctx.fillStyle = '#f8fafc';
        this.ctx.font = 'bold 52px "Segoe UI", sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('MINIMAL DUNGEON ROGUE', CANVAS_WIDTH / 2, 250);

        this.ctx.fillStyle = '#38bdf8';
        this.ctx.font = 'bold 20px "Segoe UI", sans-serif';
        this.ctx.fillText('몬스터 다양성 & 엘리트/층별 보스 기믹 업데이트', CANVAS_WIDTH / 2, 310);

        const btnW = 340, btnH = 70;
        const btnX = CANVAS_WIDTH / 2 - btnW / 2, btnY = 400;
        const isHover = this.input.mouse.x >= btnX && this.input.mouse.x <= btnX + btnW &&
                        this.input.mouse.y >= btnY && this.input.mouse.y <= btnY + btnH;

        this.ctx.fillStyle = isHover ? '#0284c7' : '#0369a1';
        this.ctx.strokeStyle = isHover ? '#7dd3fc' : '#38bdf8';
        this.ctx.lineWidth = isHover ? 4 : 2;

        this.ctx.beginPath();
        this.ctx.roundRect(btnX, btnY, btnW, btnH, 12);
        this.ctx.fill();
        this.ctx.stroke();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 24px "Segoe UI", sans-serif';
        this.ctx.fillText('캐릭터 선택하기', CANVAS_WIDTH / 2, btnY + 43);
    }

    updateSelectScreen() {
        const classes = ['WARRIOR', 'MAGE', 'ROGUE'];
        const cardW = 310, cardH = 460;
        const startX = (CANVAS_WIDTH - (cardW * 3 + 25 * 2)) / 2, startY = 145;

        classes.forEach((classKey, idx) => {
            const x = startX + idx * (cardW + 25);
            const y = startY;

            if (this.input.mouse.x >= x && this.input.mouse.x <= x + cardW &&
                this.input.mouse.y >= y && this.input.mouse.y <= y + cardH) {
                if (this.input.mouse.clicked) this.selectedClass = classKey;
            }
        });

        const btnW = 320, btnH = 55;
        const btnX = CANVAS_WIDTH / 2 - btnW / 2, btnY = 645;

        if (this.input.mouse.x >= btnX && this.input.mouse.x <= btnX + btnW &&
            this.input.mouse.y >= btnY && this.input.mouse.y <= btnY + btnH) {
            if (this.input.mouse.clicked) this.startNewGame();
        }
    }

    wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, y);
    }

    renderSelectScreen() {
        this.ctx.fillStyle = '#0b0e14';
        this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        this.ctx.fillStyle = '#f8fafc';
        this.ctx.font = 'bold 38px "Segoe UI", sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('클래스 선택 (CHOOSE YOUR CLASS)', CANVAS_WIDTH / 2, 80);

        this.ctx.fillStyle = '#94a3b8';
        this.ctx.font = '15px "Segoe UI", sans-serif';
        this.ctx.fillText('직업 카드에서 세부 능력치 및 특징을 확인하세요', CANVAS_WIDTH / 2, 112);

        const classes = ['WARRIOR', 'MAGE', 'ROGUE'];
        const cardW = 310, cardH = 460;
        const startX = (CANVAS_WIDTH - (cardW * 3 + 25 * 2)) / 2, startY = 145;

        classes.forEach((classKey, idx) => {
            const c = CLASS_TYPES[classKey];
            const x = startX + idx * (cardW + 25);
            const y = startY;
            const isSelected = this.selectedClass === classKey;

            this.ctx.fillStyle = isSelected ? 'rgba(30, 41, 59, 0.95)' : 'rgba(15, 23, 42, 0.8)';
            this.ctx.strokeStyle = isSelected ? c.color : '#334155';
            this.ctx.lineWidth = isSelected ? 4 : 1.5;

            this.ctx.beginPath();
            this.ctx.roundRect(x, y, cardW, cardH, 16);
            this.ctx.fill();
            this.ctx.stroke();

            this.ctx.fillStyle = c.color;
            this.ctx.beginPath();
            this.ctx.arc(x + cardW / 2, y + 48, 24, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 21px "Segoe UI", sans-serif';
            this.ctx.textAlign = 'center';
            this.ctx.fillText(c.name, x + cardW / 2, y + 100);

            this.ctx.fillStyle = '#94a3b8';
            this.ctx.font = '12px "Segoe UI", sans-serif';
            this.wrapText(this.ctx, c.desc, x + 20, y + 125, cardW - 40, 16);

            this.ctx.strokeStyle = '#334155';
            this.ctx.lineWidth = 1;
            this.ctx.beginPath();
            this.ctx.moveTo(x + 20, y + 175);
            this.ctx.lineTo(x + cardW - 20, y + 175);
            this.ctx.stroke();

            this.ctx.fillStyle = '#38bdf8';
            this.ctx.font = 'bold 13px "Segoe UI", sans-serif';
            this.ctx.textAlign = 'left';
            this.ctx.fillText('기본 능력치 (BASE STATS)', x + 20, y + 198);

            const stats = [
                { label: '체력 (HP)', val: c.hp, max: 200, color: '#ef4444' },
                { label: '마나 (MP)', val: c.mp, max: 150, color: '#3b82f6' },
                { label: '공격력 (ATK)', val: c.attack, max: 30, color: '#f97316' },
                { label: '공격속도 (SPD)', val: c.attackSpeed, max: 2.5, color: '#eab308' },
                { label: '이동속도 (MOVE)', val: c.speed, max: 5.0, color: '#a855f7' },
                { label: '치명타율 (CRIT)', val: `${Math.round(c.critChance * 100)}%`, rawVal: c.critChance, max: 0.5, color: '#10b981' },
                { label: '방어력 (DEF)', val: c.defense, max: 10, color: '#64748b' }
            ];

            let statY = y + 225;
            stats.forEach(st => {
                this.ctx.fillStyle = '#cbd5e1';
                this.ctx.font = '12px "Segoe UI", sans-serif';
                this.ctx.textAlign = 'left';
                this.ctx.fillText(st.label, x + 20, statY);

                this.ctx.fillStyle = '#f8fafc';
                this.ctx.font = 'bold 12px "Segoe UI", sans-serif';
                this.ctx.textAlign = 'right';
                this.ctx.fillText(`${st.val}`, x + cardW - 20, statY);

                const barX = x + 130;
                const barW = cardW - 150 - 45;
                const ratio = Math.min(1.0, (typeof st.val === 'number' ? st.val : st.rawVal) / st.max);

                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.beginPath();
                this.ctx.roundRect(barX, statY - 9, barW, 6, 3);
                this.ctx.fill();

                this.ctx.fillStyle = st.color;
                this.ctx.beginPath();
                this.ctx.roundRect(barX, statY - 9, Math.max(4, barW * ratio), 6, 3);
                this.ctx.fill();

                statY += 24;
            });

            const badgeY = y + cardH - 32;
            if (isSelected) {
                this.ctx.fillStyle = c.color;
                this.ctx.beginPath();
                this.ctx.roundRect(x + 20, badgeY - 14, cardW - 40, 28, 6);
                this.ctx.fill();

                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = 'bold 13px "Segoe UI", sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('✓ 선택됨 (SELECTED)', x + cardW / 2, badgeY + 4);
            } else {
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                this.ctx.strokeStyle = '#334155';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.roundRect(x + 20, badgeY - 14, cardW - 40, 28, 6);
                this.ctx.fill();
                this.ctx.stroke();

                this.ctx.fillStyle = '#64748b';
                this.ctx.font = '12px "Segoe UI", sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('클릭하여 선택', x + cardW / 2, badgeY + 4);
            }
        });

        const btnW = 320, btnH = 55;
        const btnX = CANVAS_WIDTH / 2 - btnW / 2, btnY = 645;

        this.ctx.fillStyle = CLASS_TYPES[this.selectedClass].color;
        this.ctx.beginPath();
        this.ctx.roundRect(btnX, btnY, btnW, btnH, 12);
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 21px "Segoe UI", sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('게임 시작 (START GAME)', CANVAS_WIDTH / 2, btnY + 35);
    }

    renderHUD() {
        const x = 20;
        let y = 20;

        // Player HP Bar
        this.ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        this.ctx.fillRect(x, y, 220, 20);
        this.ctx.fillStyle = '#ef4444';
        this.ctx.fillRect(x, y, 220 * Math.max(0, this.player.hp / this.player.maxHp), 20);
        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 1;
        this.ctx.strokeRect(x, y, 220, 20);

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 12px "Segoe UI", sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText(`HP ${Math.ceil(this.player.hp)} / ${this.player.maxHp}`, x + 110, y + 15);

        // Player MP Bar
        y += 26;
        this.ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        this.ctx.fillRect(x, y, 220, 16);
        this.ctx.fillStyle = '#3b82f6';
        this.ctx.fillRect(x, y, 220 * Math.max(0, this.player.mp / this.player.maxMp), 16);
        this.ctx.strokeRect(x, y, 220, 16);

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 11px "Segoe UI", sans-serif';
        this.ctx.fillText(`MP ${Math.ceil(this.player.mp)} / ${this.player.maxMp}`, x + 110, y + 12);

        // Level & Job Title
        y += 22;
        const jobName = this.player.secondJobTitle ? ` [${this.player.secondJobTitle}]` : '';
        this.ctx.textAlign = 'left';
        this.ctx.fillStyle = '#f8fafc';
        this.ctx.font = 'bold 15px "Segoe UI", sans-serif';
        this.ctx.fillText(`Lv.${this.player.level}${jobName} (SP: ${this.player.sp})`, x, y + 25);

        this.ctx.fillStyle = '#38bdf8';
        this.ctx.fillText(`층수: B${this.dungeon.floor}F`, x + 210, y + 25);

        // BOSS Top Health Bar Display
        const boss = this.dungeon.currentRoom.enemies.find(e => e.type === 'BOSS');
        if (boss) {
            this.renderBossHealthBar(boss);
        }

        this.renderSkillIcons();
        this.renderMinimap();
    }

    renderBossHealthBar(boss) {
        const barW = 600;
        const barH = 22;
        const bx = (CANVAS_WIDTH - barW) / 2;
        const by = 25;

        this.ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        this.ctx.fillRect(bx - 10, by - 20, barW + 20, barH + 30);
        this.ctx.strokeStyle = '#ef4444';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(bx - 10, by - 20, barW + 20, barH + 30);

        this.ctx.fillStyle = '#f8fafc';
        this.ctx.font = 'bold 14px "Segoe UI", sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText(`${boss.name} ${boss.phase === 2 ? '(광폭화 상태!)' : ''}`, CANVAS_WIDTH / 2, by - 5);

        const hpRatio = Math.max(0, boss.hp / boss.maxHp);
        this.ctx.fillStyle = '#334155';
        this.ctx.fillRect(bx, by, barW, barH);
        this.ctx.fillStyle = boss.phase === 2 ? '#dc2626' : '#f97316';
        this.ctx.fillRect(bx, by, barW * hpRatio, barH);
        this.ctx.strokeStyle = '#ffffff';
        this.ctx.strokeRect(bx, by, barW, barH);
    }

    renderSkillIcons() {
        const startX = CANVAS_WIDTH / 2 - 110;
        const y = CANVAS_HEIGHT - 70;

        const skills = [
            { label: 'Q [스킬1]', cd: this.player.skill1Cooldown, unlocked: this.player.hasSkill1 },
            { label: 'E [스킬2]', cd: this.player.skill2Cooldown, unlocked: this.player.hasSkill2 },
            { label: 'R [궁극기]', cd: this.player.ultCooldown, unlocked: !!this.player.hasUlt },
            { label: 'Shift/Space', cd: this.player.dashCooldown, unlocked: true }
        ];

        skills.forEach((s, i) => {
            const sx = startX + i * 60;
            this.ctx.fillStyle = s.unlocked ? '#1e293b' : '#0f172a';
            this.ctx.strokeStyle = s.unlocked ? '#38bdf8' : '#475569';
            this.ctx.lineWidth = 2;

            this.ctx.beginPath();
            this.ctx.roundRect(sx, y, 50, 50, 8);
            this.ctx.fill();
            this.ctx.stroke();

            if (s.cd > 0) {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                this.ctx.fillRect(sx, y, 50, 50);
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = 'bold 15px "Segoe UI", sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(`${(s.cd / 60).toFixed(1)}s`, sx + 25, y + 30);
            } else {
                this.ctx.fillStyle = s.unlocked ? '#ffffff' : '#64748b';
                this.ctx.font = 'bold 10px "Segoe UI", sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(s.label, sx + 25, y + 28);
            }
        });
    }

    renderMinimap() {
        const size = 100;
        const x = CANVAS_WIDTH - size - 20, y = 20;
        const roomSize = size / this.dungeon.gridSize;

        this.ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        this.ctx.strokeStyle = '#334155';
        this.ctx.lineWidth = 2;
        this.ctx.fillRect(x, y, size, size);
        this.ctx.strokeRect(x, y, size, size);

        for (let r = 0; r < this.dungeon.gridSize; r++) {
            for (let c = 0; c < this.dungeon.gridSize; c++) {
                const room = this.dungeon.grid[r][c];
                if (!room || !room.visited) continue;

                const rx = x + r * roomSize + 2;
                const ry = y + c * roomSize + 2;
                const rw = roomSize - 4, rh = roomSize - 4;

                this.ctx.fillStyle = (room === this.dungeon.currentRoom) ? '#38bdf8' : (room.cleared ? '#10b981' : '#ef4444');
                this.ctx.fillRect(rx, ry, rw, rh);
            }
        }
    }

    renderGameOverScreen() {
        this.ctx.fillStyle = 'rgba(11, 14, 20, 0.85)';
        this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        this.ctx.fillStyle = '#ef4444';
        this.ctx.font = 'bold 50px "Segoe UI", sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 320);

        this.ctx.fillStyle = '#38bdf8';
        this.ctx.font = 'bold 22px "Segoe UI", sans-serif';
        this.ctx.fillText('클래스 선택으로 돌아가려면 [ R ] 키를 누르세요', CANVAS_WIDTH / 2, 460);
    }

    renderVictoryScreen() {
        this.ctx.fillStyle = 'rgba(11, 14, 20, 0.9)';
        this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        this.ctx.fillStyle = '#facc15';
        this.ctx.font = 'bold 52px "Segoe UI", sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('ALL FLOORS CLEARED! VICTORY!', CANVAS_WIDTH / 2, 300);

        this.ctx.fillStyle = '#4ade80';
        this.ctx.font = 'bold 22px "Segoe UI", sans-serif';
        this.ctx.fillText('클래스 선택으로 돌아가려면 [ R ] 키를 누르세요', CANVAS_WIDTH / 2, 460);
    }
}

window.onload = () => {
    new Game();
};
</script>
</body>
</html>
