<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우당탕탕! 뚜벅이 대질주</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap');

    * {
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Jua', 'Nunito', sans-serif;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #7bd389;
    }

    /* Animations & Glassmorphism */
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.9)); }
    }

    .pulse-glow-btn {
      animation: pulse-glow 2s infinite;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border: 4px solid #ffffff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    /* Touch Controls Overlay */
    .touch-btn {
      background: rgba(255, 255, 255, 0.4);
      border: 3px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(6px);
      user-select: none;
    }
    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 flex flex-col items-center justify-center min-h-screen">

  <div id="game-container" class="relative w-full h-full overflow-hidden">
    <!-- Main Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Overlay 1: Start Menu -->
    <div id="menu-screen" class="absolute inset-0 flex flex-col items-center justify-center p-4 z-20 bg-slate-950/40 backdrop-blur-sm">
      <div class="glass-panel rounded-3xl p-6 md:p-8 max-w-lg w-full text-center transform transition-all shadow-2xl">
        <!-- Title Badge -->
        <div class="inline-block bg-amber-400 text-amber-950 font-black px-6 py-2 rounded-full text-sm md:text-base tracking-wider uppercase mb-3 shadow-md border-2 border-white">
          🏃‍♂️ 말랑말랑 뽀작 레이싱 🏃‍♀️
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-slate-800 mb-2 tracking-wide drop-shadow-sm">
          우당탕탕! <span class="text-amber-500">뽀작뚜벅이</span> 대질주
        </h1>
        <p class="text-slate-600 mb-4 font-semibold text-sm md:text-base">
          오직 두 다리로 아장아장! 퐁퐁 달리고 드리프트로 신나게 골인해요!
        </p>

        <!-- Interactive Character Selection -->
        <div class="mb-4">
          <label class="block text-slate-700 font-bold mb-1.5 text-sm">플레이어 캐릭터 선택: <span id="selected-char-name" class="text-amber-600 font-black">곰몽이 🐻</span></label>
          <div class="flex justify-center items-center gap-2 md:gap-3 bg-slate-100/80 p-2 rounded-2xl border border-slate-200 shadow-inner">
            <button onclick="selectCharacter(0)" data-char-idx="0" class="char-btn w-11 h-11 md:w-12 md:h-12 rounded-full border-4 border-amber-600 bg-amber-200 flex items-center justify-center text-2xl md:text-3xl shadow-md transform scale-110 transition cursor-pointer" title="곰몽이">🐻</button>
            <button onclick="selectCharacter(1)" data-char-idx="1" class="char-btn w-11 h-11 md:w-12 md:h-12 rounded-full border-2 border-slate-300 bg-slate-100 opacity-70 hover:opacity-100 flex items-center justify-center text-2xl md:text-3xl shadow-sm hover:scale-105 transition cursor-pointer" title="토찌">🐰</button>
            <button onclick="selectCharacter(2)" data-char-idx="2" class="char-btn w-11 h-11 md:w-12 md:h-12 rounded-full border-2 border-slate-300 bg-slate-100 opacity-70 hover:opacity-100 flex items-center justify-center text-2xl md:text-3xl shadow-sm hover:scale-105 transition cursor-pointer" title="뀨구리">🐸</button>
            <button onclick="selectCharacter(3)" data-char-idx="3" class="char-btn w-11 h-11 md:w-12 md:h-12 rounded-full border-2 border-slate-300 bg-slate-100 opacity-70 hover:opacity-100 flex items-center justify-center text-2xl md:text-3xl shadow-sm hover:scale-105 transition cursor-pointer" title="냥냥이">🐱</button>
            <button onclick="selectCharacter(4)" data-char-idx="4" class="char-btn w-11 h-11 md:w-12 md:h-12 rounded-full border-2 border-slate-300 bg-slate-100 opacity-70 hover:opacity-100 flex items-center justify-center text-2xl md:text-3xl shadow-sm hover:scale-105 transition cursor-pointer" title="멍뭉이">🐶</button>
            <button onclick="selectCharacter(5)" data-char-idx="5" class="char-btn w-11 h-11 md:w-12 md:h-12 rounded-full border-2 border-slate-300 bg-slate-100 opacity-70 hover:opacity-100 flex items-center justify-center text-2xl md:text-3xl shadow-sm hover:scale-105 transition cursor-pointer" title="펭찌">🐧</button>
          </div>
        </div>

        <!-- Difficulty Selection -->
        <div class="mb-4">
          <label class="block text-slate-700 font-bold mb-1.5 text-sm">난이도 선택</label>
          <div class="grid grid-cols-3 gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
            <button onclick="selectDifficulty('EASY')" data-diff="EASY" class="diff-btn py-2.5 rounded-xl font-bold text-sm transition bg-slate-100 text-slate-600">🌱 아기뚜벅</button>
            <button onclick="selectDifficulty('NORMAL')" data-diff="NORMAL" class="diff-btn py-2.5 rounded-xl font-bold text-sm transition bg-amber-400 text-slate-900 shadow-md">⚡ 쌩쌩이</button>
            <button onclick="selectDifficulty('HARD')" data-diff="HARD" class="diff-btn py-2.5 rounded-xl font-bold text-sm transition bg-slate-100 text-slate-600">🔥 폭풍뚜벅</button>
          </div>
        </div>

        <!-- Sound Controls & God Mode -->
        <div class="grid grid-cols-2 gap-2 mb-5">
          <button id="bgm-toggle-btn" onclick="toggleBGM()" class="py-2.5 px-3 rounded-2xl font-black text-xs md:text-sm transition border-2 border-purple-300 bg-purple-100 text-purple-900 hover:bg-purple-200 flex items-center justify-center gap-1.5 shadow-sm">
            <span id="bgm-icon">🎶</span> <span id="bgm-status">BGM: 켜짐</span>
          </button>

          <button id="god-mode-btn" onclick="toggleGodMode()" class="py-2.5 px-3 rounded-2xl font-black text-xs md:text-sm transition border-2 border-amber-300 bg-amber-100 text-amber-900 hover:bg-amber-200 flex items-center justify-center gap-1.5 shadow-sm">
            <span>👑 필승 모드: <span id="god-mode-status" class="text-emerald-600 font-black">ON (무조건 1등)</span></span>
          </button>
        </div>

        <!-- Start Game Button -->
        <button onclick="startGame()" class="pulse-glow-btn w-full bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-amber-950 font-black text-xl py-4 rounded-2xl shadow-xl border-2 border-white transition transform active:scale-95 flex items-center justify-center gap-2">
          <span>🚀 신나게 달려볼까? 출발!</span>
        </button>
      </div>
    </div>

    <!-- Overlay: 3-Second Countdown -->
    <div id="countdown-overlay" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none z-20">
      <div id="countdown-text" class="text-8xl md:text-9xl font-black text-amber-400 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] transition-all duration-200">
        3
      </div>
    </div>

    <!-- Overlay 2: Race HUD -->
    <div id="hud-screen" class="hidden absolute inset-0 pointer-events-none p-4 flex flex-col justify-between z-10">
      <!-- Top Bar: Rank & Progress & Sound & Pause -->
      <div class="flex justify-between items-start w-full gap-2">
        <!-- Current Rank Card -->
        <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 border-2 border-white shadow-lg pointer-events-auto">
          <div class="text-xs font-black text-slate-500 uppercase tracking-wider">순위</div>
          <div id="hud-rank" class="text-3xl md:text-4xl font-black text-amber-500 drop-shadow-sm">1위</div>
          <div id="hud-total-racers" class="text-xs font-bold text-slate-400">/ 6명</div>
        </div>

        <!-- Progress Bar -->
        <div class="flex-1 max-w-xs md:max-w-md glass-panel px-4 py-2 rounded-2xl flex flex-col justify-center border-2 border-white shadow-lg pointer-events-auto">
          <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
            <span>START 🏁</span>
            <span id="hud-distance-text">결승선까지 100%</span>
            <span>GOAL 🏆</span>
          </div>
          <div class="w-full bg-slate-200 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-300">
            <div id="hud-progress-fill" class="bg-gradient-to-r from-emerald-400 to-amber-400 h-full rounded-full transition-all duration-200" style="width: 0%"></div>
          </div>
        </div>

        <!-- Pause & Controls -->
        <div class="flex gap-2 pointer-events-auto">
          <button onclick="toggleBGM()" class="glass-panel w-14 h-14 rounded-2xl flex items-center justify-center text-purple-700 text-xl font-black hover:bg-slate-100 transition border-2 border-white shadow-lg active:scale-95">
            <span id="hud-bgm-icon">🎵</span>
          </button>
          <button onclick="togglePause()" class="glass-panel w-14 h-14 rounded-2xl flex items-center justify-center text-slate-700 text-xl font-black hover:bg-slate-100 transition border-2 border-white shadow-lg active:scale-95">
            ⏸️
          </button>
        </div>
      </div>

      <!-- Bottom Bar: Boost Meter & Speedometer -->
      <div class="flex justify-between items-end w-full">
        <!-- Boost Gauge Bar -->
        <div class="glass-panel p-3 rounded-2xl border-2 border-white shadow-lg w-48 md:w-64 pointer-events-auto">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-black text-amber-600 flex items-center gap-1">
              <i class="fa-solid fa-bolt"></i> 부스트 게이지
            </span>
            <span id="hud-boost-status" class="text-[10px] font-bold text-slate-500">Space 준비</span>
          </div>
          <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden p-0.5 border border-slate-300">
            <div id="hud-boost-fill" class="bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 h-full rounded-full transition-all duration-100" style="width: 0%"></div>
          </div>
        </div>

        <!-- Speed Display -->
        <div class="glass-panel px-4 py-2 rounded-2xl text-center border-2 border-white shadow-lg pointer-events-auto">
          <div id="hud-speed" class="text-2xl md:text-3xl font-black text-slate-800">0</div>
          <div class="text-[10px] font-bold text-slate-400 uppercase">Km/h</div>
        </div>
      </div>
    </div>

    <!-- Mobile / Touch Controls Overlay -->
    <div id="touch-controls" class="hidden absolute inset-0 pointer-events-none z-15 flex flex-col justify-end p-4">
      <div class="flex justify-between items-end w-full pointer-events-auto">
        <!-- D-Pad -->
        <div class="grid grid-cols-3 gap-2 w-36 h-36">
          <div></div>
          <button id="btn-up" class="touch-btn rounded-2xl flex items-center justify-center text-white text-2xl font-black">▲</button>
          <div></div>
          <button id="btn-left" class="touch-btn rounded-2xl flex items-center justify-center text-white text-2xl font-black">◀</button>
          <button id="btn-down" class="touch-btn rounded-2xl flex items-center justify-center text-white text-2xl font-black">▼</button>
          <button id="btn-right" class="touch-btn rounded-2xl flex items-center justify-center text-white text-2xl font-black">▶</button>
        </div>
        <!-- Action Buttons -->
        <div class="flex gap-3">
          <button id="btn-drift" class="touch-btn w-16 h-16 rounded-full flex flex-col items-center justify-center text-white font-black text-xs bg-amber-500/40 border-amber-300">
            <span>DRIFT</span>
            <span class="text-[9px] opacity-80">(Shift)</span>
          </button>
          <button id="btn-boost" class="touch-btn w-20 h-20 rounded-full flex flex-col items-center justify-center text-white font-black text-sm bg-rose-500/50 border-rose-300 shadow-lg">
            <span>BOOST</span>
            <span class="text-[10px] opacity-80">(Space)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Overlay 3: Pause Menu -->
    <div id="pause-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center p-4 z-30 bg-slate-900/60 backdrop-blur-md">
      <div class="glass-panel rounded-3xl p-6 max-w-xs w-full text-center border-4 border-white shadow-2xl">
        <h2 class="text-3xl font-black text-slate-800 mb-4">⏸️ 일시 정지</h2>
        <div class="space-y-3">
          <button onclick="togglePause()" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-black text-lg py-3 rounded-2xl shadow transition border-2 border-white">
            ▶ 계속하기
          </button>
          <button onclick="goToMenu()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-base py-3 rounded-2xl transition">
            🏠 메인 메뉴로
          </button>
        </div>
      </div>
    </div>

    <!-- Overlay 4: Result Screen -->
    <div id="result-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center p-4 z-30 bg-slate-950/60 backdrop-blur-md">
      <div class="glass-panel rounded-3xl p-6 md:p-8 max-w-md w-full text-center transform transition-all border-4 border-white shadow-2xl">
        <div id="result-icon" class="text-6xl mb-2 animate-bounce">🏆</div>
        <h2 id="result-title" class="text-3xl md:text-4xl font-black text-slate-800 mb-1">
          우승했습니다!
        </h2>
        <p id="result-subtitle" class="text-slate-600 font-semibold mb-6 text-sm">
          압도적인 드리프트 실력으로 1위를 달성했어요!
        </p>

        <!-- Final Rank Card -->
        <div class="bg-amber-100 border-2 border-amber-300 rounded-2xl p-4 mb-6 flex justify-around items-center shadow-inner">
          <div>
            <div class="text-xs text-amber-800 font-bold">최종 순위</div>
            <div id="result-final-rank" class="text-4xl font-black text-amber-600">1위</div>
          </div>
          <div class="h-10 w-0.5 bg-amber-300"></div>
          <div>
            <div class="text-xs text-amber-800 font-bold">선택 난이도</div>
            <div id="result-diff-badge" class="text-lg font-black text-amber-700">보통</div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
          <button onclick="restartGame()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-lg py-3.5 rounded-2xl shadow-lg border-2 border-white transition">
            🔄 다시 달리기
          </button>
          <button onclick="goToMenu()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-base py-3 rounded-2xl transition">
            🏠 메인 메뉴로
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       0. WEB AUDIO SYNTH SOUND SYSTEM (BGM & SFX)
       ========================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.bgmEnabled = true;
        this.isPlayingBGM = false;
        this.bgmTimer = null;
        this.step = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // KickFlip - "눈에 거슬리고 싶어" (Eye-Poppin') Dynamic Hyper-Punk Synth Sequence
      startBGM() {
        this.init();
        if (!this.bgmEnabled || this.isPlayingBGM || !this.ctx) return;
        this.isPlayingBGM = true;
        this.step = 0;

        // Upbeat, bouncy BPM (approx 138 BPM)
        const tempoMs = 110; 

        // Energetic Hyper-Punk Melody Notes (Frequencies in Hz) inspired by "눈에 거슬리고 싶어"
        const melody = [
          // Verse / Chorus Motif
          523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 523.25, // C5, E5, G5, E5, A5, G5, E5, C5
          587.33, 698.46, 880.00, 698.46, 987.77, 880.00, 698.46, 587.33, // D5, F5, A5, F5, B5, A5, F5, D5
          659.25, 783.99, 987.77, 783.99, 1046.50, 987.77, 783.99, 659.25, // E5, G5, B5, G5, C6, B5, G5, E5
          880.00, 783.99, 659.25, 587.33, 523.25, 587.33, 659.25, 783.99  // Hook line "눈에 거슬리고 싶어~"
        ];

        const bassline = [
          261.63, 261.63, 329.63, 329.63, 293.66, 293.66, 349.23, 349.23,
          329.63, 329.63, 392.00, 392.00, 440.00, 440.00, 392.00, 329.63
        ];

        this.bgmTimer = setInterval(() => {
          if (!this.isPlayingBGM || !this.ctx) return;

          const now = this.ctx.currentTime;
          const noteFreq = melody[this.step % melody.length];
          const bassFreq = bassline[Math.floor(this.step / 2) % bassline.length];

          // 1. Lead Hyper-Punk Glitch Synth
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = (this.step % 4 === 0) ? 'square' : 'sawtooth';
          osc.frequency.setValueAtTime(noteFreq, now);

          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);

          // 2. Energetic Bass Synth
          if (this.step % 2 === 0) {
            const bassOsc = this.ctx.createOscillator();
            const bassGain = this.ctx.createGain();
            bassOsc.type = 'triangle';
            bassOsc.frequency.setValueAtTime(bassFreq / 2, now);

            bassGain.gain.setValueAtTime(0.12, now);
            bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

            bassOsc.connect(bassGain);
            bassGain.connect(this.ctx.destination);
            bassOsc.start(now);
            bassOsc.stop(now + 0.18);
          }

          // 3. Upbeat Punchy Drum Beat (Kick / Snare / Hi-Hat)
          if (this.step % 4 === 0) { // Kick
            this.playKick(now);
          } else if (this.step % 4 === 2) { // Snare
            this.playSnare(now);
          }

          this.step++;
        }, tempoMs);
      }

      stopBGM() {
        this.isPlayingBGM = false;
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }

      playKick(now) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      playSnare(now) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

      // SFX: Boost Sound
      playBoostSFX() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.35);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }

      // SFX: Bump Sound
      playBumpSFX() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
    }

    const soundEngine = new SoundEngine();

    /* ==========================================
       1. GAME CONFIGURATION & GLOBALS
       ========================================== */
    const CONFIG = {
      // Racer Default Stats
      PLAYER_BASE_SPEED: 7.2,       // Player has ~8% edge over AI base
      AI_BASE_SPEED: 6.6,
      ACCELERATION: 0.28,
      DECELERATION: 0.15,
      BRAKE_FORCE: 0.35,
      TURN_SPEED: 0.055,
      
      // Drift & Boost
      DRIFT_TURN_MULT: 1.45,
      DRIFT_BOOST_CHARGE_RATE: 1.25, // Boost gauge charge per frame during drift
      MAX_BOOST_GAUGE: 100,
      BOOST_SPEED_MULT: 1.6,
      BOOST_DURATION_FRAMES: 90,     // 1.5 seconds at 60fps
      
      // Physics & Bumping
      RADIUS: 24,                    // Racer collision circle radius
      BUMP_RECOIL_FORCE: 3.5,
      
      // Camera
      CAM_SMOOTHING: 0.12,
      
      // Track
      TRACK_WIDTH: 220,
      
      // Difficulty Settings
      DIFFICULTY: {
        EASY: { aiSpeedMult: 0.88, aiMistakeRate: 0.08, aiBoostChance: 0.003 },
        NORMAL: { aiSpeedMult: 1.0, aiMistakeRate: 0.04, aiBoostChance: 0.008 },
        HARD: { aiSpeedMult: 1.12, aiMistakeRate: 0.01, aiBoostChance: 0.016 }
      }
    };

    const CHARACTERS = [
      { type: 'bear', name: '곰몽이', emoji: '🐻', color: '#f59e0b', darkColor: '#b45309', lightColor: '#fde68a', shirt: '#ef4444' },
      { type: 'rabbit', name: '토찌', emoji: '🐰', color: '#fb7185', darkColor: '#be123c', lightColor: '#fecdd3', shirt: '#3b82f6' },
      { type: 'frog', name: '뀨구리', emoji: '🐸', color: '#10b981', darkColor: '#047857', lightColor: '#a7f3d0', shirt: '#f59e0b' },
      { type: 'cat', name: '냥냥이', emoji: '🐱', color: '#3b82f6', darkColor: '#1d4ed8', lightColor: '#bfdbfe', shirt: '#10b981' },
      { type: 'dog', name: '멍뭉이', emoji: '🐶', color: '#a855f7', darkColor: '#6b21a8', lightColor: '#e9d5ff', shirt: '#ec4899' },
      { type: 'penguin', name: '펭찌', emoji: '🐧', color: '#06b6d4', darkColor: '#0e7490', lightColor: '#cffaff', shirt: '#f97316' }

    let selectedCharacterIndex = 0;

    function selectCharacter(index) {

    let selectedDifficulty = 'NORMAL';
    let godMode = true; // Enabled by default for guaranteed victory
    let gameState = 'MENU'; // MENU, RACE, PAUSE, RESULT
    let canvas, ctx;

    /* ==========================================
       2. INPUT SYSTEM
       ========================================== */
    const Input = {
      keys: {},
      touch: { up: false, down: false, left: false, right: false, drift: false, boost: false },
      
      init() {
        window.addEventListener('keydown', e => {
          soundEngine.init();
          this.keys[e.code] = true;
          this.keys[e.key] = true;
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'ShiftLeft', 'ShiftRight'].includes(e.code) || e.key === 'Shift') {
            e.preventDefault();
          }
        });
        window.addEventListener('keyup', e => {
          this.keys[e.code] = false;
          this.keys[e.key] = false;
        });

        // Touch button listeners
        const bindTouch = (id, key) => {
          const el = document.getElementById(id);
          if (!el) return;
          const start = (e) => { e.preventDefault(); soundEngine.init(); this.touch[key] = true; };
          const end = (e) => { e.preventDefault(); this.touch[key] = false; };
          el.addEventListener('touchstart', start, {passive: false});
          el.addEventListener('touchend', end, {passive: false});
          el.addEventListener('mousedown', start);
          el.addEventListener('mouseup', end);
          el.addEventListener('mouseleave', end);
        };

        bindTouch('btn-up', 'up');
        bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-drift', 'drift');
        bindTouch('btn-boost', 'boost');

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          document.getElementById('touch-controls').classList.remove('hidden');
        }
      },

      isUp() { return !!(this.keys['ArrowUp'] || this.keys['KeyW'] || this.touch.up); },
      isDown() { return !!(this.keys['ArrowDown'] || this.keys['KeyS'] || this.touch.down); },
      isLeft() { return !!(this.keys['ArrowLeft'] || this.keys['KeyA'] || this.touch.left); },
      isRight() { return !!(this.keys['ArrowRight'] || this.keys['KeyD'] || this.touch.right); },
      isDrift() { return !!(this.keys['ShiftLeft'] || this.keys['ShiftRight'] || this.keys['Shift'] || this.touch.drift); },
      isDrifting() { return this.isDrift(); },
      isBoost() { return !!(this.keys['Space'] || this.touch.boost); }
    };

    /* ==========================================
       3. TRACK & DECORATIONS SYSTEM
       ========================================== */
    class Track {
      constructor() {
        this.width = CONFIG.TRACK_WIDTH;
        this.waypoints = [];
        this.decorations = [];
        this.length = 0;
        this.buildTrack();
      }

      buildTrack() {
        const rawPoints = [
          { x: 400, y: 1200 },
          { x: 400, y: 300 },   // Straight start line
          { x: 700, y: -200 },  // Smooth curve right
          { x: 1400, y: -100 }, 
          { x: 1800, y: 400 },  // Sharp curve down
          { x: 1600, y: 1000 },
          { x: 2200, y: 1400 }, // S-curve section
          { x: 2800, y: 1000 },
          { x: 3200, y: 300 },  // High speed straight
          { x: 3800, y: 0 },
          { x: 4500, y: 400 },  // Chicane
          { x: 4800, y: 1100 },
          { x: 5500, y: 1200 }, // Final stretch
          { x: 6400, y: 1200 }  // FINISH LINE
        ];

        this.waypoints = [];
        const samples = 15;
        for (let i = 0; i < rawPoints.length - 1; i++) {
          const p0 = rawPoints[Math.max(0, i - 1)];
          const p1 = rawPoints[i];
          const p2 = rawPoints[i + 1];
          const p3 = rawPoints[Math.min(rawPoints.length - 1, i + 2)];

          for (let t = 0; t < 1; t += 1 / samples) {
            const pt = catmullRom(p0, p1, p2, p3, t);
            this.waypoints.push(pt);
          }
        }
        this.waypoints.push(rawPoints[rawPoints.length - 1]);

        let totalDist = 0;
        this.waypoints[0].dist = 0;
        for (let i = 1; i < this.waypoints.length; i++) {
          const dx = this.waypoints[i].x - this.waypoints[i - 1].x;
          const dy = this.waypoints[i].y - this.waypoints[i - 1].y;
          totalDist += Math.hypot(dx, dy);
          this.waypoints[i].dist = totalDist;
        }
        this.length = totalDist;

        this.decorations = [];
        const decorTypes = ['tree', 'flower', 'rock', 'bush'];
        for (let i = 2; i < this.waypoints.length - 2; i += 2) {
          const wp = this.waypoints[i];
          const prev = this.waypoints[i - 1];
          const angle = Math.atan2(wp.y - prev.y, wp.x - prev.x);
          const perpX = -Math.sin(angle);
          const perpY = Math.cos(angle);

          [-1, 1].forEach(side => {
            const distOff = (this.width / 2) + 60 + Math.random() * 120;
            const x = wp.x + perpX * distOff * side;
            const y = wp.y + perpY * distOff * side;
            const type = decorTypes[Math.floor(Math.random() * decorTypes.length)];
            const scale = 0.8 + Math.random() * 0.5;
            this.decorations.push({ x, y, type, scale });
          });
        }
      }

      getProgress(x, y) {
        let closestIndex = 0;
        let minDistSq = Infinity;
        for (let i = 0; i < this.waypoints.length; i++) {
          const dx = x - this.waypoints[i].x;
          const dy = y - this.waypoints[i].y;
          const dSq = dx * dx + dy * dy;
          if (dSq < minDistSq) {
            minDistSq = dSq;
            closestIndex = i;
          }
        }
        const wp = this.waypoints[closestIndex];
        return Math.min(1, Math.max(0, wp.dist / this.length));
      }

      constrainRacer(racer) {
        let closestIdx = 0;
        let minDistSq = Infinity;
        for (let i = 0; i < this.waypoints.length; i++) {
          const dx = racer.x - this.waypoints[i].x;
          const dy = racer.y - this.waypoints[i].y;
          const dSq = dx * dx + dy * dy;
          if (dSq < minDistSq) {
            minDistSq = dSq;
            closestIdx = i;
          }
        }

        const maxDist = (this.width / 2) - CONFIG.RADIUS;
        const i1 = Math.max(0, closestIdx - 1);
        const i2 = Math.min(this.waypoints.length - 1, closestIdx + 1);

        let minSegDistSq = Infinity;
        let closestSegPt = { x: racer.x, y: racer.y };

        for (let i = i1; i < i2; i++) {
          const p1 = this.waypoints[i];
          const p2 = this.waypoints[i + 1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const lenSq = dx * dx + dy * dy;
          if (lenSq === 0) continue;

          let t = ((racer.x - p1.x) * dx + (racer.y - p1.y) * dy) / lenSq;
          t = Math.max(0, Math.min(1, t));

          const projX = p1.x + t * dx;
          const projY = p1.y + t * dy;
          const distSq = (racer.x - projX) ** 2 + (racer.y - projY) ** 2;

          if (distSq < minSegDistSq) {
            minSegDistSq = distSq;
            closestSegPt = { x: projX, y: projY };
          }
        }

        const currentDist = Math.sqrt(minSegDistSq);
        if (currentDist > maxDist) {
          const nx = (racer.x - closestSegPt.x) / (currentDist || 1);
          const ny = (racer.y - closestSegPt.y) / (currentDist || 1);

          racer.x = closestSegPt.x + nx * maxDist;
          racer.y = closestSegPt.y + ny * maxDist;
          racer.speed *= 0.95;
        }
      }

      draw(ctx) {
        if (this.waypoints.length < 2) return;

        // Outer dirt/sand border
        ctx.lineWidth = this.width + 30;
        ctx.strokeStyle = '#fef08a';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(this.waypoints[0].x, this.waypoints[0].y);
        for (let i = 1; i < this.waypoints.length; i++) {
          ctx.lineTo(this.waypoints[i].x, this.waypoints[i].y);
        }
        ctx.stroke();

        // Main asphalt road
        ctx.lineWidth = this.width;
        ctx.strokeStyle = '#334155';
        ctx.stroke();

        // Center line
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.setLineDash([30, 30]);
        ctx.beginPath();
        ctx.moveTo(this.waypoints[0].x, this.waypoints[0].y);
        for (let i = 1; i < this.waypoints.length; i++) {
          ctx.lineTo(this.waypoints[i].x, this.waypoints[i].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // Start Banner
        const startWp = this.waypoints[2];
        const nextWp = this.waypoints[3];
        const angle = Math.atan2(nextWp.y - startWp.y, nextWp.x - startWp.x);
        this.drawCheckeredBanner(ctx, startWp.x, startWp.y, angle, 'START 🏁');

        // Finish Banner
        const finishWp = this.waypoints[this.waypoints.length - 2];
        const finishPrev = this.waypoints[this.waypoints.length - 3];
        const finishAngle = Math.atan2(finishWp.y - finishPrev.y, finishWp.x - finishPrev.x);
        this.drawCheckeredBanner(ctx, finishWp.x, finishWp.y, finishAngle, 'FINISH 🏆');
      }

      drawCheckeredBanner(ctx, x, y, angle, label) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + Math.PI / 2);

        const w = this.width;
        const h = 28;

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-w / 2, -h / 2, w, h);

        const size = 14;
        ctx.fillStyle = '#ffffff';
        for (let ix = -w / 2; ix < w / 2; ix += size) {
          for (let iy = -h / 2; iy < h / 2; iy += size) {
            if ((Math.floor(ix / size) + Math.floor(iy / size)) % 2 === 0) {
              ctx.fillRect(ix, iy, size, size);
            }
          }
        }

        ctx.fillStyle = '#f59e0b';
        ctx.font = '900 20px "Jua", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(label, 0, -h / 2 - 8);

        ctx.restore();
      }

      drawDecorations(ctx) {
        this.decorations.forEach(d => {
          ctx.save();
          ctx.translate(d.x, d.y);
          ctx.scale(d.scale, d.scale);

          if (d.type === 'tree') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.ellipse(0, 15, 20, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#78350f';
            ctx.fillRect(-6, 0, 12, 20);

            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(0, -10, 24, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.arc(-6, -16, 12, 0, Math.PI * 2);
            ctx.fill();
          } else if (d.type === 'flower') {
            ctx.fillStyle = '#f43f5e';
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
              ctx.beginPath();
              ctx.arc(Math.cos(a) * 8, Math.sin(a) * 8, 5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();
          } else if (d.type === 'rock') {
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.arc(-3, -3, 8, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.arc(10, 2, 12, 0, Math.PI * 2);
            ctx.arc(-10, 2, 12, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
      }
    }

    function catmullRom(p0, p1, p2, p3, t) {
      const v0 = (p2.x - p0.x) * 0.5;
      const v1 = (p3.x - p1.x) * 0.5;
      const t2 = t * t;
      const t3 = t2 * t;

      const x = (2 * p1.x - 2 * p2.x + v0 + v1) * t3 +
                (-3 * p1.x + 3 * p2.x - 2 * v0 - v1) * t2 +
                v0 * t + p1.x;

      const wy0 = (p2.y - p0.y) * 0.5;
      const wy1 = (p3.y - p1.y) * 0.5;

      const y = (2 * p1.y - 2 * p2.y + wy0 + wy1) * t3 +
                (-3 * p1.y + 3 * p2.y - 2 * wy0 - wy1) * t2 +
                wy0 * t + p1.y;

      return { x, y };
    }

    /* ==========================================
       4. RACER ENTITY (PLAYER & AI)
       ========================================== */
    class Racer {
      constructor(id, name, emoji, color, isPlayer = false, type = 'bear', darkColor = '#b45309', lightColor = '#fde68a', shirtColor = '#ef4444') {
        this.id = id;
        this.name = name;
        this.emoji = emoji;
        this.color = color;
        this.darkColor = darkColor;
        this.lightColor = lightColor;
        this.shirtColor = shirtColor;
        this.type = type;
        this.isPlayer = isPlayer;

        // Position & Velocity
        this.x = 0;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.angle = 0;
        this.speed = 0;
        this.maxSpeed = isPlayer ? CONFIG.PLAYER_BASE_SPEED : CONFIG.AI_BASE_SPEED;

        // Status Flags & Meters
        this.isDrifting = false;
        this.boostGauge = 0;
        this.boostTimer = 0;
        this.progress = 0;
        this.rank = 1;
        this.finished = false;

        // Animations
        this.runCycle = 0;
        this.tiltAngle = 0;
        this.bumpTimer = 0;

        // AI fields
        this.targetNodeIndex = 1;
        this.aiPathOffset = (Math.random() - 0.5) * (CONFIG.TRACK_WIDTH * 0.6);
      }

      reset(startX, startY, startAngle) {
        this.x = startX;
        this.y = startY;
        this.vx = 0;
        this.vy = 0;
        this.angle = startAngle;
        this.speed = 0;
        this.isDrifting = false;
        this.boostGauge = 0;
        this.boostTimer = 0;
        this.progress = 0;
        this.finished = false;
        this.runCycle = 0;
        this.targetNodeIndex = 1;
      }

      update(track) {
        if (this.finished) return;

        if (this.isPlayer) {
          this.updatePlayerInput();
        } else {
          this.updateAILogic(track);
        }

        // Boost speed multiplier
        let currentMaxSpeed = this.maxSpeed;
        if (this.boostTimer > 0) {
          currentMaxSpeed *= CONFIG.BOOST_SPEED_MULT;
          this.boostTimer--;
          if (Math.random() < 0.6) {
            effectsSystem.addBoostSparkle(this.x, this.y);
          }
        }

        this.speed = Math.min(this.speed, currentMaxSpeed);
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;

        this.x += this.vx;
        this.y += this.vy;

        if (this.speed > 0.5) {
          this.runCycle += this.speed * 0.08;
        }

        this.progress = track.getProgress(this.x, this.y);

        if (this.progress >= 0.985 && !this.finished) {
          this.finished = true;
        }

        if (this.bumpTimer > 0) this.bumpTimer--;
      }

      updatePlayerInput() {
        if (godMode) {
          this.boostGauge = CONFIG.MAX_BOOST_GAUGE;
          this.boostTimer = 10; // 무한 부스트 유지
          this.maxSpeed = CONFIG.PLAYER_BASE_SPEED * 2.8; // 압도적인 최고 속도
          
          // 가만히 있어도 자동으로 초고속 전진
          if (this.speed < CONFIG.PLAYER_BASE_SPEED * 1.8) {
            this.speed = CONFIG.PLAYER_BASE_SPEED * 1.8;
          }

          // 자동 트랙 방향 보정 (조작하지 않을 때도 트랙을 따라 자연스럽게 조향)
          if (!Input.isLeft() && !Input.isRight() && gameEngine && gameEngine.track) {
            const waypoints = gameEngine.track.waypoints;
            let closestIdx = 0;
            let minD = Infinity;
            for (let i = 0; i < waypoints.length; i++) {
              const d = Math.hypot(waypoints[i].x - this.x, waypoints[i].y - this.y);
              if (d < minD) { minD = d; closestIdx = i; }
            }
            const targetWp = waypoints[Math.min(waypoints.length - 1, closestIdx + 2)];
            const targetAngle = Math.atan2(targetWp.y - this.y, targetWp.x - this.x);
            let diff = targetAngle - this.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.angle += Math.sign(diff) * Math.min(Math.abs(diff), CONFIG.TURN_SPEED * 0.8);
          }
        } else {
          this.maxSpeed = CONFIG.PLAYER_BASE_SPEED;
        }

        if (Input.isUp()) {
          this.speed += CONFIG.ACCELERATION * (godMode ? 3.0 : 1.0);
        } else if (Input.isDown()) {
          this.speed -= CONFIG.BRAKE_FORCE;
          if (this.speed < -2) this.speed = -2;
        } else {
          if (!godMode) {
            if (this.speed > 0) {
              this.speed = Math.max(0, this.speed - CONFIG.DECELERATION);
            } else if (this.speed < 0) {
              this.speed = Math.min(0, this.speed + CONFIG.DECELERATION);
            }
          }
        }

        let turn = CONFIG.TURN_SPEED;
        const driftPressed = Input.isDrifting();

        if (driftPressed && this.speed > 3 && (Input.isLeft() || Input.isRight())) {
          this.isDrifting = true;
          turn *= CONFIG.DRIFT_TURN_MULT;

          this.boostGauge = Math.min(CONFIG.MAX_BOOST_GAUGE, this.boostGauge + CONFIG.DRIFT_BOOST_CHARGE_RATE);

          if (Math.random() < 0.5) {
            effectsSystem.addDriftSmoke(this.x, this.y, this.angle);
          }
        } else {
          this.isDrifting = false;
        }

        if (Input.isLeft()) {
          this.angle -= turn;
          this.tiltAngle = Math.max(-0.3, this.tiltAngle - 0.05);
        } else if (Input.isRight()) {
          this.angle += turn;
          this.tiltAngle = Math.min(0.3, this.tiltAngle + 0.05);
        } else {
          this.tiltAngle *= 0.8;
        }

        if (Input.isBoost()) {
          if (this.boostGauge >= CONFIG.MAX_BOOST_GAUGE) {
            this.boostTimer = CONFIG.BOOST_DURATION_FRAMES;
            this.boostGauge = 0;
            soundEngine.playBoostSFX();
            effectsSystem.addBoostBurst(this.x, this.y);
          }
        }
      }

      updateAILogic(track) {
        const diffConfig = CONFIG.DIFFICULTY[selectedDifficulty];
        let aiSpeedLimit = this.maxSpeed * diffConfig.aiSpeedMult;

        // 필승 모드: AI가 플레이어보다 앞서거나 가까워지면 AI 속도를 대폭 줄임
        if (godMode) {
          const player = gameEngine ? gameEngine.getPlayer() : null;
          if (player && this.progress >= player.progress - 0.02) {
            aiSpeedLimit *= 0.25; // 플레이어를 절대 앞지를 수 없도록 둔화
          }
        }

        const waypoints = track.waypoints;
        let targetWp = waypoints[this.targetNodeIndex];

        const targetX = targetWp.x + Math.cos(this.targetNodeIndex) * this.aiPathOffset;
        const targetY = targetWp.y + Math.sin(this.targetNodeIndex) * this.aiPathOffset;

        const distToTarget = Math.hypot(targetX - this.x, targetY - this.y);
        if (distToTarget < 120 && this.targetNodeIndex < waypoints.length - 1) {
          this.targetNodeIndex++;
        }

        const desiredAngle = Math.atan2(targetY - this.y, targetX - this.x);
        let angleDiff = desiredAngle - this.angle;

        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

        if (Math.random() < diffConfig.aiMistakeRate) {
          angleDiff += (Math.random() - 0.5) * 0.4;
        }

        this.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), CONFIG.TURN_SPEED * 0.9);

        if (Math.abs(angleDiff) > 0.8 && this.speed > 4) {
          this.isDrifting = true;
          this.speed *= 0.98;
          this.boostGauge = Math.min(CONFIG.MAX_BOOST_GAUGE, this.boostGauge + CONFIG.DRIFT_BOOST_CHARGE_RATE * 0.8);
        } else {
          this.isDrifting = false;
          if (this.speed < aiSpeedLimit) {
            this.speed += CONFIG.ACCELERATION * 0.85;
          }
        }

        if (this.boostGauge >= CONFIG.MAX_BOOST_GAUGE && Math.random() < diffConfig.aiBoostChance) {
          this.boostTimer = CONFIG.BOOST_DURATION_FRAMES;
          this.boostGauge = 0;
          effectsSystem.addBoostBurst(this.x, this.y);
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle + Math.PI / 2 + this.tiltAngle);

        const r = CONFIG.RADIUS;
        const bounceY = Math.sin(this.runCycle) * 5;
        const legSwing = Math.sin(this.runCycle);

        // 1. Soft Shadow
        const shadowGrad = ctx.createRadialGradient(0, 12, 2, 0, 14, r * 1.4);
        shadowGrad.addColorStop(0, 'rgba(15, 23, 42, 0.4)');
        shadowGrad.addColorStop(0.7, 'rgba(15, 23, 42, 0.15)');
        shadowGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.ellipse(0, 14, r * 1.25, r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        if (this.bumpTimer > 0) {
          ctx.rotate(Math.sin(this.bumpTimer) * 0.25);
        }

        // 2. Booster Flame Effects
        if (this.boostTimer > 0) {
          ctx.fillStyle = '#ff4500';
          ctx.beginPath();
          ctx.arc((Math.random() - 0.5) * 10, r + 12 + Math.random() * 10, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffea00';
          ctx.beginPath();
          ctx.arc((Math.random() - 0.5) * 6, r + 8 + Math.random() * 6, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        // 3. Cute Tails (Bear, Rabbit, Cat, Dog)
        ctx.fillStyle = this.darkColor;
        if (this.type === 'cat') {
          ctx.beginPath();
          ctx.arc(Math.sin(this.runCycle) * 6, r + 8, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'rabbit' || this.type === 'bear') {
          ctx.beginPath();
          ctx.arc(0, r + 4, 6, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'dog') {
          ctx.beginPath();
          ctx.arc(Math.cos(this.runCycle) * 7, r + 6, 5.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. Stylish Running Sneakers (Left & Right)
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1e293b';

        // Left Sneaker
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(-r * 0.55, r * 0.65 + legSwing * 1.2, 7, 5, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(-r * 0.55 - 4, r * 0.65 + legSwing * 1.2, 8, 3);

        // Right Sneaker
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(r * 0.55, r * 0.65 - legSwing * 1.2, 7, 5, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(r * 0.55 - 4, r * 0.65 - legSwing * 1.2, 8, 3);

        // 5. Cute Chunky Body & Racing Jersey
        ctx.fillStyle = this.shirtColor;
        ctx.beginPath();
        ctx.arc(0, bounceY + 3, r * 0.82, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        // Jersey Collar Detail
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, bounceY - 6, r * 0.4, 0, Math.PI);
        ctx.fill();

        // 6. Round Chubby Head
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, bounceY - 6, r * 0.85, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 7. Character-Specific Cute Ears & Accessories
        if (this.type === 'bear') {
          // Bear ears with inner pads
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(-r * 0.7, bounceY - r * 0.85, 8.5, 0, Math.PI * 2);
          ctx.arc(r * 0.7, bounceY - r * 0.85, 8.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#fecdd3';
          ctx.beginPath();
          ctx.arc(-r * 0.7, bounceY - r * 0.85, 4.5, 0, Math.PI * 2);
          ctx.arc(r * 0.7, bounceY - r * 0.85, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // Cute Pilot Goggles on Head
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(-14, bounceY - r * 1.1, 28, 6);
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(-7, bounceY - r * 1.1 + 3, 5, 0, Math.PI * 2);
          ctx.arc(7, bounceY - r * 1.1 + 3, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

        } else if (this.type === 'rabbit') {
          // Bouncy Long Bunny Ears
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.ellipse(-r * 0.4, bounceY - r * 1.25 + Math.sin(this.runCycle) * 2, 6, 14, -0.15, 0, Math.PI * 2);
          ctx.ellipse(r * 0.4, bounceY - r * 1.25 - Math.sin(this.runCycle) * 2, 6, 14, 0.15, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#fda4af';
          ctx.beginPath();
          ctx.ellipse(-r * 0.4, bounceY - r * 1.25 + Math.sin(this.runCycle) * 2, 3, 9, -0.15, 0, Math.PI * 2);
          ctx.ellipse(r * 0.4, bounceY - r * 1.25 - Math.sin(this.runCycle) * 2, 3, 9, 0.15, 0, Math.PI * 2);
          ctx.fill();

          // Red Ribbon Bow
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(-8, bounceY - r * 0.7, 4, 0, Math.PI * 2);
          ctx.arc(-16, bounceY - r * 0.7, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffe4e6';
          ctx.beginPath();
          ctx.arc(-12, bounceY - r * 0.7, 2.5, 0, Math.PI * 2);
          ctx.fill();

        } else if (this.type === 'cat') {
          // Sharp Kitty Ears
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.moveTo(-r * 0.75, bounceY - r * 0.3);
          ctx.lineTo(-r * 0.9, bounceY - r * 1.15);
          ctx.lineTo(-r * 0.25, bounceY - r * 0.75);
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(r * 0.75, bounceY - r * 0.3);
          ctx.lineTo(r * 0.9, bounceY - r * 1.15);
          ctx.lineTo(r * 0.25, bounceY - r * 0.75);
          ctx.fill();
          ctx.stroke();

          // Pink Inner Ears
          ctx.fillStyle = '#f472b6';
          ctx.beginPath();
          ctx.moveTo(-r * 0.7, bounceY - r * 0.4);
          ctx.lineTo(-r * 0.82, bounceY - r * 1.0);
          ctx.lineTo(-r * 0.35, bounceY - r * 0.7);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(r * 0.7, bounceY - r * 0.4);
          ctx.lineTo(r * 0.82, bounceY - r * 1.0);
          ctx.lineTo(r * 0.35, bounceY - r * 0.7);
          ctx.fill();

        } else if (this.type === 'frog') {
          // Frog Pop Eyes
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(-r * 0.55, bounceY - r * 0.85, 8.5, 0, Math.PI * 2);
          ctx.arc(r * 0.55, bounceY - r * 0.85, 8.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Shiny Mini Crown
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.moveTo(-6, bounceY - r * 0.85);
          ctx.lineTo(-9, bounceY - r * 1.25);
          ctx.lineTo(-3, bounceY - r * 1.0);
          ctx.lineTo(0, bounceY - r * 1.3);
          ctx.lineTo(3, bounceY - r * 1.0);
          ctx.lineTo(9, bounceY - r * 1.25);
          ctx.lineTo(6, bounceY - r * 0.85);
          ctx.fill();

        } else if (this.type === 'dog') {
          // Floppy Puppy Ears
          ctx.fillStyle = this.darkColor;
          ctx.beginPath();
          ctx.ellipse(-r * 0.8, bounceY - r * 0.2 + legSwing, 6.5, 11, 0.35, 0, Math.PI * 2);
          ctx.ellipse(r * 0.8, bounceY - r * 0.2 - legSwing, 6.5, 11, -0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Sporty Cap
          ctx.fillStyle = '#3b82f6';
          ctx.beginPath();
          ctx.arc(0, bounceY - r * 0.6, r * 0.65, Math.PI, 0);
          ctx.fill();
          ctx.fillRect(-12, bounceY - r * 0.6, 24, 4);

        } else if (this.type === 'penguin') {
          // Headphone Set
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(-r * 0.85, bounceY - 6, 6, 0, Math.PI * 2);
          ctx.arc(r * 0.85, bounceY - 6, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(0, bounceY - 6, r * 0.85, Math.PI, 0);
          ctx.stroke();

          // White belly area
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(0, bounceY - 3, r * 0.5, r * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // 8. Chubby Snout Muzzle
        if (this.type !== 'frog' && this.type !== 'penguin') {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(0, bounceY - 3, 8.5, 6.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // 9. Kawaii Sparkle Anime Eyes (Large + Dual White Highlights)
        const eyeOffsetX = (this.type === 'frog') ? r * 0.55 : 6;
        const eyeOffsetY = (this.type === 'frog') ? bounceY - r * 0.85 : bounceY - 8;

        // Eye Backgrounds
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(-eyeOffsetX, eyeOffsetY, 3.5, 4.5, 0, 0, Math.PI * 2);
        ctx.ellipse(eyeOffsetX, eyeOffsetY, 3.5, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eye Sparkle Catchlights
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-eyeOffsetX - 1.2, eyeOffsetY - 1.5, 1.4, 0, Math.PI * 2);
        ctx.arc(eyeOffsetX - 1.2, eyeOffsetY - 1.5, 1.4, 0, Math.PI * 2);
        ctx.arc(-eyeOffsetX + 1, eyeOffsetY + 1.2, 0.7, 0, Math.PI * 2);
        ctx.arc(eyeOffsetX + 1, eyeOffsetY + 1.2, 0.7, 0, Math.PI * 2);
        ctx.fill();

        // 10. Cute Blushing Cheeks (Rosy Pink Glow)
        ctx.fillStyle = 'rgba(251, 113, 133, 0.55)';
        ctx.beginPath();
        ctx.ellipse(-11, bounceY - 3, 4, 2.5, 0, 0, Math.PI * 2);
        ctx.ellipse(11, bounceY - 3, 4, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 11. Nose & Expressive Mouth
        if (this.type === 'penguin') {
          // Beak
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.polygon = [
            ctx.moveTo(0, bounceY - 5),
            ctx.lineTo(-4, bounceY - 1),
            ctx.lineTo(4, bounceY - 1)
          ];
          ctx.fill();
        } else {
          // Cute Nose
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.ellipse(0, bounceY - 5.5, 2.5, 1.8, 0, 0, Math.PI * 2);
          ctx.fill();

          // Cute Mouth Expression
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#0f172a';
          if (this.type === 'dog') {
            // Dog sticking tongue out 😛
            ctx.fillStyle = '#ff4d6d';
            ctx.beginPath();
            ctx.arc(0, bounceY - 1, 3.5, 0, Math.PI);
            ctx.fill();
            ctx.stroke();
          } else {
            // 'w' or cute smile
            ctx.beginPath();
            ctx.arc(-2, bounceY - 3, 2, 0, Math.PI * 0.8);
            ctx.arc(2, bounceY - 3, 2, Math.PI * 0.2, Math.PI);
            ctx.stroke();
          }
        }

        // 12. Paws / Arms Swinging
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.arc(-r * 0.85, bounceY + legSwing * 0.6, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(r * 0.85, bounceY - legSwing * 0.6, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }
    }

    /* ==========================================
       5. ITEM BOX & PARTICLE EFFECTS SYSTEM
       ========================================== */
    class ItemBox {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.active = true;
        this.respawnTimer = 0;
        this.rotation = Math.random() * Math.PI;
      }

      update() {
        this.rotation += 0.04;
        if (!this.active) {
          this.respawnTimer++;
          if (this.respawnTimer > 300) {
            this.active = true;
            this.respawnTimer = 0;
          }
        }
      }

      draw(ctx) {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const floatY = Math.sin(Date.now() * 0.005) * 4;
        ctx.translate(0, floatY);

        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 12;

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.rect(-14, -14, 28, 28);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 16px "Jua", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚡', 0, 0);

        ctx.restore();
      }
    }

    class EffectsSystem {
      constructor() {
        this.particles = [];
      }

      addBoostSparkle(x, y) {
        for (let i = 0; i < 2; i++) {
          this.particles.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            size: 3 + Math.random() * 4,
            color: Math.random() < 0.5 ? '#f59e0b' : '#38bdf8',
            life: 1,
            decay: 0.05
          });
        }
      }

      addDriftSmoke(x, y, angle) {
        this.particles.push({
          x: x - Math.cos(angle) * 15,
          y: y - Math.sin(angle) * 15,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          size: 8 + Math.random() * 6,
          color: 'rgba(255, 255, 255, 0.6)',
          life: 1,
          decay: 0.04
        });
      }

      addBoostBurst(x, y) {
        for (let i = 0; i < 18; i++) {
          const a = (Math.PI * 2 / 18) * i;
          const spd = 3 + Math.random() * 5;
          this.particles.push({
            x, y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            size: 5 + Math.random() * 5,
            color: '#fbbf24',
            life: 1,
            decay: 0.03
          });
        }
      }

      addBumpPop(x, y) {
        for (let i = 0; i < 10; i++) {
          this.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            size: 4 + Math.random() * 4,
            color: '#f43f5e',
            life: 1,
            decay: 0.06
          });
        }
      }

      updateAndDraw(ctx) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;

          if (p.life <= 0) {
            this.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    const effectsSystem = new EffectsSystem();

    /* ==========================================
       6. GAME ENGINE & SCENE CONTROL
       ========================================== */
    class GameEngine {
      constructor() {
        this.track = new Track();
        this.racers = [];
        this.itemBoxes = [];
        this.camera = { x: 0, y: 0 };
        this.initRacers();
        this.initItems();
      }

      initRacers() {
        this.racers = [];
        const pInfo = CHARACTERS[selectedCharacterIndex];
        const player = new Racer('player', pInfo.name, pInfo.emoji, pInfo.color, true, pInfo.type, pInfo.darkColor, pInfo.lightColor, pInfo.shirt);
        this.racers.push(player);

        CHARACTERS.forEach((aiInfo, idx) => {
          if (idx !== selectedCharacterIndex) {
            const ai = new Racer(`ai_${idx}`, aiInfo.name, aiInfo.emoji, aiInfo.color, false, aiInfo.type, aiInfo.darkColor, aiInfo.lightColor, aiInfo.shirt);
            this.racers.push(ai);
          }
        });

        this.resetGridPositions();
      }

      resetGridPositions() {
        const startWp = this.track.waypoints[1];
        const nextWp = this.track.waypoints[2];
        const startAngle = Math.atan2(nextWp.y - startWp.y, nextWp.x - startWp.x);
        const perpAngle = startAngle + Math.PI / 2;

        this.racers.forEach((racer, index) => {
          const row = Math.floor(index / 2);
          const col = (index % 2 === 0) ? -1 : 1;
          const offsetX = Math.cos(perpAngle) * (col * 40) - Math.cos(startAngle) * (row * 60);
          const offsetY = Math.sin(perpAngle) * (col * 40) - Math.sin(startAngle) * (row * 60);

          racer.reset(startWp.x + offsetX, startWp.y + offsetY, startAngle);
        });
      }

      initItems() {
        this.itemBoxes = [];
        for (let i = 15; i < this.track.waypoints.length - 15; i += 22) {
          const wp = this.track.waypoints[i];
          this.itemBoxes.push(new ItemBox(wp.x - 30, wp.y - 20));
          this.itemBoxes.push(new ItemBox(wp.x + 30, wp.y + 20));
        }
      }

      update() {
        if (gameState !== 'RACE') return;

        this.racers.forEach(racer => {
          racer.update(this.track);
          this.track.constrainRacer(racer);
        });

        // Bumping Physics
        for (let i = 0; i < this.racers.length; i++) {
          for (let j = i + 1; j < this.racers.length; j++) {
            const r1 = this.racers[i];
            const r2 = this.racers[j];
            const dx = r2.x - r1.x;
            const dy = r2.y - r1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = CONFIG.RADIUS * 2;

            if (dist < minDist && dist > 0) {
              const overlap = (minDist - dist) * 0.5;
              const nx = dx / dist;
              const ny = dy / dist;

              if (godMode && r1.isPlayer) {
                r2.x += nx * overlap * 5.0;
                r2.y += ny * overlap * 5.0;
                r2.speed *= 0.2;
              } else if (godMode && r2.isPlayer) {
                r1.x -= nx * overlap * 5.0;
                r1.y -= ny * overlap * 5.0;
                r1.speed *= 0.2;
              } else {
                r1.x -= nx * overlap;
                r1.y -= ny * overlap;
                r2.x += nx * overlap;
                r2.y += ny * overlap;
              }

              r1.bumpTimer = 10;
              r2.bumpTimer = 10;
              soundEngine.playBumpSFX();
              effectsSystem.addBumpPop((r1.x + r2.x) / 2, (r1.y + r2.y) / 2);
            }
          }
        }

        // Item Pickup
        this.itemBoxes.forEach(box => {
          box.update();
          if (!box.active) return;

          this.racers.forEach(racer => {
            if (Math.hypot(racer.x - box.x, racer.y - box.y) < CONFIG.RADIUS + 16) {
              box.active = false;
              racer.boostGauge = Math.min(CONFIG.MAX_BOOST_GAUGE, racer.boostGauge + 50);
              effectsSystem.addBoostBurst(box.x, box.y);
            }
          });
        });

        // Rankings
        this.racers.sort((a, b) => b.progress - a.progress);
        this.racers.forEach((racer, index) => {
          racer.rank = index + 1;
        });

        const player = this.getPlayer();

        // 절대 우승 안전장치: AI가 결승선(92% 이상) 근처에 먼저 다가가면 플레이어가 추월할 때까지 AI 정지
        if (godMode && player) {
          this.racers.forEach(r => {
            if (!r.isPlayer && r.progress >= 0.92 && player.progress < 0.92) {
              r.speed = 0.2;
            }
          });
        }

        if (player) {
          this.camera.x += (player.x - this.camera.x) * CONFIG.CAM_SMOOTHING;
          this.camera.y += (player.y - this.camera.y) * CONFIG.CAM_SMOOTHING;
        }

        this.updateHUD();

        const winner = this.racers.find(r => r.finished);
        if (winner || (player && player.finished)) {
          endRace(player ? player.rank === 1 : true);
        }
      }

      getPlayer() {
        return this.racers.find(r => r.isPlayer);
      }

      updateHUD() {
        const player = this.getPlayer();
        if (!player) return;

        const rankMap = ['1위', '2위', '3위', '4위', '5위', '6위'];
        document.getElementById('hud-rank').innerText = rankMap[player.rank - 1] || `${player.rank}위`;
        document.getElementById('hud-total-racers').innerText = `/ ${this.racers.length}명`;

        const progPct = Math.min(100, Math.floor(player.progress * 100));
        document.getElementById('hud-progress-fill').style.width = `${progPct}%`;
        document.getElementById('hud-distance-text').innerText = `결승선까지 ${100 - progPct}%`;

        const speedKmh = Math.floor(player.speed * 12);
        document.getElementById('hud-speed').innerText = speedKmh;

        const boostPct = Math.min(100, Math.floor((player.boostGauge / CONFIG.MAX_BOOST_GAUGE) * 100));
        const boostBar = document.getElementById('hud-boost-fill');
        boostBar.style.width = `${boostPct}%`;

        const boostStatusText = document.getElementById('hud-boost-status');
        if (player.boostTimer > 0) {
          boostStatusText.innerText = '⚡ BOOSTER!';
          boostStatusText.className = 'text-[10px] font-black text-rose-500 animate-pulse';
        } else if (boostPct >= 100) {
          boostStatusText.innerText = 'Space 사용가능!';
          boostStatusText.className = 'text-[10px] font-black text-amber-500 animate-bounce';
        } else {
          boostStatusText.innerText = '충전 중...';
          boostStatusText.className = 'text-[10px] font-bold text-slate-500';
        }
      }

      draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2 - this.camera.x, canvas.height / 2 - this.camera.y);

        this.track.draw(ctx);
        this.track.drawDecorations(ctx);
        this.itemBoxes.forEach(box => box.draw(ctx));
        this.racers.forEach(racer => racer.draw(ctx));
        effectsSystem.updateAndDraw(ctx);

        ctx.restore();

        const player = this.getPlayer();
        if (player && player.boostTimer > 0) {
          this.drawSpeedLines();
        }
      }

      drawSpeedLines() {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 3;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 100 + Math.random() * 300;
          const len = 40 + Math.random() * 80;

          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist);
          ctx.lineTo(cx + Math.cos(angle) * (dist + len), cy + Math.sin(angle) * (dist + len));
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    let gameEngine = null;

    /* ==========================================
       8. STATE MANAGEMENT & UI LOGIC
       ========================================== */
    let countdownValue = 3;
    let countdownTimer = null;

    function init() {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      Input.init();
      selectCharacter(0);
      gameEngine = new GameEngine();

      requestAnimationFrame(gameLoop);
    }

    function selectDifficulty(diff) {
      selectedDifficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.remove('bg-amber-400', 'text-slate-900', 'shadow-md');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      const activeBtn = document.querySelector(`[data-diff="${diff}"]`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
        activeBtn.classList.add('bg-amber-400', 'text-slate-900', 'shadow-md');
      }
    }

    function toggleBGM() {
      soundEngine.init();
      soundEngine.bgmEnabled = !soundEngine.bgmEnabled;

      const bgmStatus = document.getElementById('bgm-status');
      const bgmIcon = document.getElementById('bgm-icon');
      const hudIcon = document.getElementById('hud-bgm-icon');

      if (soundEngine.bgmEnabled) {
        if (bgmStatus) bgmStatus.innerText = 'BGM: 켜짐';
        if (bgmIcon) bgmIcon.innerText = '🎶';
        if (hudIcon) hudIcon.innerText = '🎵';
        if (gameState === 'RACE' || gameState === 'COUNTDOWN') {
          soundEngine.startBGM();
        }
      } else {
        if (bgmStatus) bgmStatus.innerText = 'BGM: 끔';
        if (bgmIcon) bgmIcon.innerText = '🔇';
        if (hudIcon) hudIcon.innerText = '🔇';
        soundEngine.stopBGM();
      }
    }

    function toggleGodMode() {
      godMode = !godMode;
      const statusEl = document.getElementById('god-mode-status');
      const btn = document.getElementById('god-mode-btn');
      if (godMode) {
        statusEl.innerText = 'ON';
        statusEl.className = 'text-emerald-600 font-black';
        btn.className = 'py-2.5 px-3 rounded-2xl font-black text-xs md:text-sm transition border-2 border-amber-300 bg-amber-100 text-amber-900 hover:bg-amber-200 flex items-center justify-center gap-1.5 shadow-sm';
      } else {
        statusEl.innerText = 'OFF';
        statusEl.className = 'text-slate-400 font-bold';
        btn.className = 'py-2.5 px-3 rounded-2xl font-bold text-xs md:text-sm transition border-2 border-slate-200 bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5';
      }
    }

    function startGame() {
      soundEngine.startBGM();

      gameState = 'COUNTDOWN';
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('pause-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('hud-screen').classList.remove('hidden');

      gameEngine.resetGridPositions();
      const player = gameEngine.getPlayer();
      if (player) {
        gameEngine.camera.x = player.x;
        gameEngine.camera.y = player.y;
      }

      const overlay = document.getElementById('countdown-overlay');
      const textEl = document.getElementById('countdown-text');
      overlay.classList.remove('hidden');

      countdownValue = 3;
      textEl.innerText = countdownValue;
      textEl.className = 'text-8xl md:text-9xl font-black text-amber-400 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] scale-125 transition-all duration-200';

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        countdownValue--;
        if (countdownValue > 0) {
          textEl.innerText = countdownValue;
          textEl.className = 'text-8xl md:text-9xl font-black text-amber-400 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] scale-125 transition-all duration-200';
        } else if (countdownValue === 0) {
          textEl.innerText = '출발! 🏁';
          textEl.className = 'text-7xl md:text-9xl font-black text-emerald-400 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] scale-150 transition-all duration-200';
          gameState = 'RACE';
        } else {
          clearInterval(countdownTimer);
          overlay.classList.add('hidden');
        }
      }, 1000);
    }

    function togglePause() {
      if (gameState === 'RACE') {
        gameState = 'PAUSE';
        soundEngine.stopBGM();
        document.getElementById('pause-screen').classList.remove('hidden');
      } else if (gameState === 'PAUSE') {
        gameState = 'RACE';
        soundEngine.startBGM();
        document.getElementById('pause-screen').classList.add('hidden');
      }
    }

    function endRace(isVictory) {
      gameState = 'RESULT';
      soundEngine.stopBGM();
      document.getElementById('hud-screen').classList.add('hidden');
      
      const resultScreen = document.getElementById('result-screen');
      resultScreen.classList.remove('hidden');

      const player = gameEngine.getPlayer();
      const rankText = `${player.rank}위`;

      document.getElementById('result-final-rank').innerText = rankText;
      document.getElementById('result-diff-badge').innerText = 
        selectedDifficulty === 'EASY' ? '🌱 아기뚜벅' :
        selectedDifficulty === 'NORMAL' ? '⚡ 쌩쌩이' : '🔥 폭풍뚜벅';

      if (isVictory) {
        document.getElementById('result-icon').innerText = '🏆';
        document.getElementById('result-title').innerText = '축하해요! 1등으로 골인!';
        document.getElementById('result-subtitle').innerText = '우주에서 제일 귀엽고 빠른 뽀작 뚜벅이 인정!';
      } else {
        document.getElementById('result-icon').innerText = '🏃‍♂️';
        document.getElementById('result-title').innerText = `${rankText}로 완주했어요!`;
        document.getElementById('result-subtitle').innerText = '다음엔 드리프트 부스터로 1등을 노려봐요!';
      }
    }

    function restartGame() {
      gameEngine.initRacers();
      startGame();
    }

    function goToMenu() {
      soundEngine.stopBGM();
      if (countdownTimer) clearInterval(countdownTimer);
      const countdownOverlay = document.getElementById('countdown-overlay');
      if (countdownOverlay) countdownOverlay.classList.add('hidden');

      gameState = 'MENU';
      document.getElementById('pause-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('hud-screen').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
    }

    /* ==========================================
       9. MAIN GAME LOOP
       ========================================== */
    function gameLoop() {
      if (gameEngine) {
        gameEngine.update();
        gameEngine.draw();
      }
      requestAnimationFrame(gameLoop);
    }

    window.onload = init;
  </script>
</body>
</html>
