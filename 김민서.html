/**
 * ==========================================
 * 2. GEMINI API CLIENT: API 연동 로직
 * ==========================================
 */
const apiKey = ""; // Canvas 환경에서 자동 주입됨

// Exponential backoff helper for Gemini fetch calls
async function fetchWithRetry(url, options, retries = 3, backoff = 1000) {
  try {
    const res = await fetch(url, options);
    if (!res.ok) {
      if (res.status === 429 && retries > 0) {
        await new Promise(r => setTimeout(r, backoff));
        return fetchWithRetry(url, options, retries - 1, backoff * 2);
      }
      throw new Error(`HTTP Error ${res.status}`);
    }
    return res;
  } catch (err) {
    if (retries > 0) {
      await new Promise(r => setTimeout(r, backoff));
      return fetchWithRetry(url, options, retries - 1, backoff * 2);
    }
    throw err;
  }
}

// 텍스트 생성 API (gemini-3-flash-preview)
async function callGeminiText(prompt, systemInstruction = "") {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
  const payload = {
    contents: [{ parts: [{ text: prompt }] }],
  };

  if (systemInstruction) {
    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
  }

  const response = await fetchWithRetry(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const result = await response.json();
  const text = result?.candidates?.[0]?.content?.parts?.[0]?.text || "점장님이 고개를 갸웃거립니다.";
  return text;
}

// 구조화 JSON 생성 API (gemini-3-flash-preview + JSON schema)
async function callGeminiStructured(prompt, responseSchema, systemInstruction = "") {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
  const payload = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: responseSchema
    }
  };

  if (systemInstruction) {
    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
  }

  const response = await fetchWithRetry(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const result = await response.json();
  const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
  return JSON.parse(rawText);
}

// 음성 합성 API (gemini-2.5-flash-preview-tts)
async function callGeminiTTS(textToSpeak) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
  const payload = {
    contents: [{
      parts: [{ text: `한국어로 다정하고 명랑하게 말해주세요: ${textToSpeak}` }]
    }],
    generationConfig: {
      responseModalities: ["AUDIO"],
      speechConfig: {
        voiceConfig: {
          prebuiltVoiceConfig: { voiceName: "Kore" }
        }
      }
    }
  };

  const response = await fetchWithRetry(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const result = await response.json();
  const part = result?.candidates?.[0]?.content?.parts?.[0];
  const audioDataBase64 = part?.inlineData?.data;
  const mimeType = part?.inlineData?.mimeType || "audio/L16;rate=24000";

  if (!audioDataBase64) {
    throw new Error("TTS Audio response empty");
  }

  // PCM16 -> WAV 변환 후 Audio element 플레이
  const sampleRateMatch = mimeType.match(/rate=(\d+)/);
  const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;

  const rawBytes = base64ToArrayBuffer(audioDataBase64);
  const pcm16 = new Int16Array(rawBytes);
  const wavBlob = pcm16ToWavBlob(pcm16, sampleRate);
  const audioUrl = URL.createObjectURL(wavBlob);

  return audioUrl;
}

// PCM16 데이터를 WAV Blob으로 만드는 도우미 함수
function pcm16ToWavBlob(pcm16, sampleRate) {
  const buffer = new ArrayBuffer(44 + pcm16.length * 2);
  const view = new DataView(buffer);

  function writeString(offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + pcm16.length * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, pcm16.length * 2, true);

  for (let i = 0; i < pcm16.length; i++) {
    view.setInt16(44 + i * 2, pcm16[i], true);
  }

  return new Blob([view], { type: 'audio/wav' });
}

function base64ToArrayBuffer(base64) {
  const binaryString = window.atob(base64);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  return bytes.buffer;
}

/**

class Fruit {
  constructor(x, y, level, isStatic = false) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.angle = (Math.random() - 0.5) * 0.2;
    this.vAngle = 0;
    this.level = level;
    this.info = CONFIG.FRUITS[level];
    this.radius = this.info.radius;
    this.isStatic = isStatic;
    this.id = Math.random().toString(36).substring(2, 9);
    
    this.scaleX = 0;
    this.scaleY = 0;
    this.targetScaleX = 1;
    this.targetScaleY = 1;
    this.spawnAnimation = 0;
  }

  update(dt) {
    if (this.spawnAnimation < 1) {
      this.spawnAnimation += dt * 8;
      if (this.spawnAnimation > 1) this.spawnAnimation = 1;
      const ease = Math.sin((this.spawnAnimation * Math.PI) / 2);
      this.scaleX = ease;
      this.scaleY = ease;
    } else {
      this.scaleX += (this.targetScaleX - this.scaleX) * 0.15;
      this.scaleY += (this.targetScaleY - this.scaleY) * 0.15;
      this.targetScaleX += (1 - this.targetScaleX) * 0.1;
      this.targetScaleY += (1 - this.targetScaleY) * 0.1;
    }

    this.angle += this.vAngle;
    this.vAngle *= CONFIG.PHYSICS.ROLL_FRICTION;
  }

  applySquash(factorX, factorY) {
    this.scaleX = factorX;
    this.scaleY = factorY;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.scale(this.scaleX, this.scaleY);

    // 아이템 살짝 돋보이게 하는 부드러운 입체 그림자
    ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;

    // 원형 배경 및 테두리를 지우고 아이템 이모지 크기를 물리 충돌 범위에 맞춰 확대
    ctx.font = `${this.radius * 1.85}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.info.emoji, 0, 2);

    ctx.restore();
  }
}

/**
 * ==========================================
 * 5. INPUT MANAGEMENT
 * ==========================================
 */
const INPUT = {
  mouseX: CONFIG.CANVAS_WIDTH / 2,
  isPointerDown: false,

  init() {
    const getCanvasPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const scaleX = CONFIG.CANVAS_WIDTH / rect.width;
      const scaleY = CONFIG.CANVAS_HEIGHT / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    };

    const handleMove = (e) => {
      const pos = getCanvasPos(e);
      this.mouseX = pos.x;
      this.clampMouse();
    };

    const handleStart = (e) => {
      this.isPointerDown = true;
      const pos = getCanvasPos(e);
      this.mouseX = pos.x;
      this.clampMouse();

      if (currentState !== GAME_STATE.PLAYING) {
        if (pos.y > 380 && pos.y < 450 && Math.abs(pos.x - CONFIG.CANVAS_WIDTH / 2) < 110) {
          resetGame();
        }
      }
    };

    const handleEnd = (e) => {
      if (!this.isPointerDown) return;
      this.isPointerDown = false;

      if (currentState === GAME_STATE.PLAYING) {
        dropCurrentFruit();
      }
    };

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd(e); }, { passive: false });
  },

  clampMouse() {
    if (!currentFruit) return;
    const minX = CONFIG.BOX.X + currentFruit.radius + 4;
    const maxX = CONFIG.BOX.X + CONFIG.BOX.WIDTH - currentFruit.radius - 4;
    this.mouseX = Math.max(minX, Math.min(maxX, this.mouseX));
  }
};

/**
 * ==========================================
 * 6. PHYSICS & MERGE
 * ==========================================
 */
function updatePhysics() {
  const subSteps = CONFIG.PHYSICS.SUB_STEPS;
  const box = CONFIG.BOX;

  for (let step = 0; step < subSteps; step++) {
    for (let f of fruits) {
      if (f.isStatic) continue;

      f.vy += CONFIG.PHYSICS.GRAVITY / subSteps;
      f.vx *= Math.pow(CONFIG.PHYSICS.AIR_RESISTANCE, 1 / subSteps);
      f.vy *= Math.pow(CONFIG.PHYSICS.AIR_RESISTANCE, 1 / subSteps);

      f.x += f.vx / subSteps;
      f.y += f.vy / subSteps;

      const minX = box.X + f.radius;
      const maxX = box.X + box.WIDTH - f.radius;
      const maxY = box.Y + box.HEIGHT - f.radius;

      if (f.x < minX) {
        f.x = minX;
        f.vx *= -CONFIG.PHYSICS.BOUNCE;
        f.vAngle += f.vy * 0.005;
        f.applySquash(0.85, 1.15);
      } else if (f.x > maxX) {
        f.x = maxX;
        f.vx *= -CONFIG.PHYSICS.BOUNCE;
        f.vAngle -= f.vy * 0.005;
        f.applySquash(0.85, 1.15);
      }

      if (f.y > maxY) {
        f.y = maxY;
        f.vy *= -CONFIG.PHYSICS.BOUNCE;
        f.vx *= CONFIG.PHYSICS.FRICTION;
        f.vAngle += f.vx * 0.01;

        if (Math.abs(f.vy) > 1) {
          f.applySquash(1.2, 0.8);
        }
      }
    }

    for (let i = 0; i < fruits.length; i++) {
      for (let j = i + 1; j < fruits.length; j++) {
        let f1 = fruits[i];
        let f2 = fruits[j];

        if (f1.isStatic || f2.isStatic) continue;

        let dx = f2.x - f1.x;
        let dy = f2.y - f1.y;
        let dist = Math.hypot(dx, dy);
        let minDist = f1.radius + f2.radius;

        if (dist < minDist) {
          if (f1.level === f2.level && !f1.toRemove && !f2.toRemove) {
            mergeFruits(f1, f2);
            return;
          }

          let overlap = minDist - dist;
          if (dist === 0) { dx = 0.01; dy = 0; dist = 0.01; }
          let nx = dx / dist;
          let ny = dy / dist;

          f1.x -= nx * overlap * 0.5;
          f1.y -= ny * overlap * 0.5;
          f2.x += nx * overlap * 0.5;
          f2.y += ny * overlap * 0.5;

          let kx = f1.vx - f2.vx;
          let ky = f1.vy - f2.vy;
          let p = (nx * kx + ny * ky) * (1 + CONFIG.PHYSICS.BOUNCE);

          f1.vx -= p * nx * 0.5;
          f1.vy -= p * ny * 0.5;
          f2.vx += p * nx * 0.5;
          f2.vy += p * ny * 0.5;

          let tangentX = -ny;
          let tangentY = nx;
          let tangentVel = (f1.vx - f2.vx) * tangentX + (f1.vy - f2.vy) * tangentY;
          f1.vAngle -= tangentVel * 0.002;
          f2.vAngle += tangentVel * 0.002;
        }
      }
    }
  }
}

/**
 * ==========================================
 * 7. MERGE & GAME EVENT LOGIC
 * ==========================================
 */
function mergeFruits(f1, f2) {
  f1.toRemove = true;
  f2.toRemove = true;

  const nextLevel = f1.level + 1;
  const midX = (f1.x + f2.x) / 2;
  const midY = (f1.y + f2.y) / 2;

  fruits = fruits.filter(f => !f.toRemove);

  totalMerges++;
  combo++;

  const mergedInfo = CONFIG.FRUITS[nextLevel];
  const addedScore = mergedInfo.score + (combo > 1 ? combo * 5 : 0);
  score += addedScore;

  createMergeEffects(midX, midY, mergedInfo.color, addedScore);

  // Gemini AI 코멘트 이벤트 트리거 (큰 과일 합성 혹은 높은 콤보)
  if (nextLevel >= 3 || combo >= 2) {
    triggerAIShopkeeperComment({
      type: 'MERGE',
      fruitName: mergedInfo.name,
      level: nextLevel,
      combo: combo
    });
  }

  if (mergedInfo.isFinal) {
    const finalFruit = new Fruit(midX, midY, nextLevel);
    fruits.push(finalFruit);
    currentState = GAME_STATE.CLEAR;
    triggerAIShopkeeperComment({ type: 'CLEAR' });
    return;
  }

  const newFruit = new Fruit(midX, midY, nextLevel);
  newFruit.vy = -1.8;
  newFruit.applySquash(0.7, 1.3);
  fruits.push(newFruit);
}

function createMergeEffects(x, y, color, points) {
  popTexts.push({ x, y, text: `+${points}`, alpha: 1.0, scale: 1.3, vy: -1.2 });

  const particleCount = 14;
  for (let i = 0; i < particleCount; i++) {
    const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.3;
    const speed = Math.random() * 5 + 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 5 + 3,
      color: color,
      alpha: 1.0,
      decay: Math.random() * 0.02 + 0.025
    });
  }
}

function updateEffects(dt) {
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= p.decay;
  }
  particles = particles.filter(p => p.alpha > 0);

  for (let t of popTexts) {
    t.y += t.vy;
    t.alpha -= 0.02;
    t.scale = Math.max(1.0, t.scale - 0.01);
  }
  popTexts = popTexts.filter(t => t.alpha > 0);
}

function getRandomSpawnLevel() {
  const weights = [0.4, 0.3, 0.2, 0.1];
  const r = Math.random();
  let sum = 0;
  for (let i = 0; i < weights.length; i++) {
    sum += weights[i];
    if (r <= sum) return i;
  }
  return 0;
}

function spawnCurrentFruit() {
  if (currentState !== GAME_STATE.PLAYING) return;

  currentFruit = new Fruit(INPUT.mouseX, CONFIG.BOX.Y - 35, nextFruitLevel, true);
  nextFruitLevel = getRandomSpawnLevel();
  dropTimer = CONFIG.GAME.DROP_TIME_LIMIT;
  isCooldown = false;
  combo = 0;
}

function dropCurrentFruit() {
  if (!currentFruit || isCooldown) return;

  currentFruit.isStatic = false;
  currentFruit.x = INPUT.mouseX;
  currentFruit.y = CONFIG.BOX.Y - 25;
  fruits.push(currentFruit);
  currentFruit = null;

  isCooldown = true;
  cooldownTimer = CONFIG.GAME.DROP_COOLDOWN;
}

function resetGame() {
  fruits = [];
  particles = [];
  popTexts = [];
  score = 0;
  combo = 0;
  totalMerges = 0;
  overflowTimer = 0;
  currentState = GAME_STATE.PLAYING;
  nextFruitLevel = getRandomSpawnLevel();
  spawnCurrentFruit();
  
  updateShopkeeperSpeech("새로운 게임 시작! 이번엔 최고의 기록을 세워보세요!");
}

function checkGameOverConditions(dt) {
  if (currentState !== GAME_STATE.PLAYING) return;

  if (currentFruit && !isCooldown) {
    dropTimer -= dt;
    if (dropTimer <= 0) {
      dropTimer = 0;
      gameOverReason = '5초 시간 초과!';
      currentState = GAME_STATE.GAME_OVER;
      triggerAIShopkeeperComment({ type: 'GAMEOVER', reason: gameOverReason });
      return;
    }
  }

  let isOverflowing = false;
  for (let f of fruits) {
    if (!f.isStatic && (f.y - f.radius) < CONFIG.BOX.DANGER_Y && Math.abs(f.vy) < 0.8) {
      isOverflowing = true;
      break;
    }
  }

  if (isOverflowing) {
    overflowTimer += dt;
    if (overflowTimer >= CONFIG.GAME.OVERFLOW_LIMIT_TIME) {
      gameOverReason = '과일이 상자를 넘쳤어요!';
      currentState = GAME_STATE.GAME_OVER;
      triggerAIShopkeeperComment({ type: 'GAMEOVER', reason: gameOverReason });
    }
  } else {
    overflowTimer = Math.max(0, overflowTimer - dt * 2);
  }
}

/**
 * ==========================================
 * 8. AI SHOPKEEPER & GEMINI FEATURES
 * ==========================================
 */

function updateShopkeeperSpeech(text) {
  currentSpeechText = text;
  const speechEl = document.getElementById('shopkeeperSpeech');
  if (speechEl) {
    speechEl.textContent = `"${text}"`;
  }

async function triggerAIShopkeeperComment(event) {
  const now = Date.now();
  if (now - lastCommentTime < 4000 && event.type === 'MERGE') return; // 너무 잦은 피드백 방지
  lastCommentTime = now;

  let prompt = "";
  if (event.type === 'MERGE') {
    prompt = `사용자가 과일 머지 게임에서 ${event.fruitName} (단계 ${event.level})를 ${event.combo}연속 콤보로 합성했습니다! 점수: ${score}. 친근하고 귀여운 과일가게 점장님 스타일로 1문장의 짧고 신나는 추임새 반응을 한국어로 해주세요.`;
  } else if (event.type === 'GAMEOVER') {
    prompt = `사용자가 ${event.reason} 이유로 게임오버 되었습니다. 최종 점수: ${score}. 귀여운 과일가게 점장님 캐릭터로서 격려하고 다음 판을 응원하는 따뜻한 1문장 반응을 한국어로 해주세요.`;
  } else if (event.type === 'CLEAR') {
    prompt = `사용자가 최고 단계(수박) 완성에 성공하여 게임을 클리어했습니다! 최종 점수: ${score}. 아주 기뻐하며 축하해주는 과일가게 점장님 1문장 추임새를 한국어로 해주세요.`;
  }

  try {
    const sysInst = "당신은 아기자기한 과일 가게의 친절하고 명랑한 베어 점장님입니다. 항상 느낌표와 생동감 넘치는 표정을 담아 한 문장(20자 이내)으로 말합니다.";
    const responseText = await callGeminiText(prompt, sysInst);
    const cleanedText = responseText.replace(/^["']|["']$/g, '').trim();
    updateShopkeeperSpeech(cleanedText);
  } catch (err) {
    console.debug("AI Commentary fallback", err);
  }
}

 */
function drawShopBackground() {
  const awningHeight = 40;
  const stripeWidth = 35;
  const count = Math.ceil(CONFIG.CANVAS_WIDTH / stripeWidth);

  for (let i = 0; i < count; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#ff595e' : '#ffffff';
    ctx.beginPath();
    ctx.rect(i * stripeWidth, 0, stripeWidth, awningHeight);
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(i * stripeWidth + stripeWidth / 2, awningHeight, stripeWidth / 2, 0, Math.PI);
    ctx.fill();
  }

  ctx.fillStyle = '#f7e7ce';
  ctx.fillRect(0, awningHeight + 5, CONFIG.CANVAS_WIDTH, 55);
  ctx.strokeStyle = '#e0c9a6';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, awningHeight + 5, CONFIG.CANVAS_WIDTH, 55);
}

function drawUI() {
  drawShopBackground();

  // 점수 텍스트
  ctx.fillStyle = '#5d4037';
  ctx.font = '900 20px "Jua", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`점수: ${score}`, 20, 75);

  // 제한 시간 게이지
  const timerRatio = Math.max(0, dropTimer / CONFIG.GAME.DROP_TIME_LIMIT);
  const barWidth = 110;
  const barHeight = 12;
  const barX = 135;
  const barY = 64;

  ctx.fillStyle = '#e0d0b8';
  ctx.beginPath();
  ctx.roundRect(barX, barY, barWidth, barHeight, 6);
  ctx.fill();

  ctx.fillStyle = timerRatio > 0.3 ? '#2ecc71' : '#e74c3c';
  ctx.beginPath();
  ctx.roundRect(barX, barY, barWidth * timerRatio, barHeight, 6);
  ctx.fill();

  ctx.fillStyle = '#5d4037';
  ctx.font = '700 12px sans-serif';
  ctx.fillText(`⏱️ ${dropTimer.toFixed(1)}s`, barX + 28, barY + 10);

  // 다음 과일 미리보기 슬롯
  ctx.textAlign = 'right';
  ctx.font = '700 13px "Jua", sans-serif';
  ctx.fillText('NEXT', CONFIG.CANVAS_WIDTH - 22, 62);

  const nextX = CONFIG.CANVAS_WIDTH - 40;
  const nextY = 80;
  ctx.beginPath();
  ctx.arc(nextX, nextY, 18, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#8d5b4c';
  ctx.lineWidth = 2;
  ctx.stroke();

  const nextInfo = CONFIG.FRUITS[nextFruitLevel];
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(nextInfo.emoji, nextX, nextY + 1);

  // ====================
  // Play Box (과일 상자)
  // ====================
  const box = CONFIG.BOX;

  ctx.fillStyle = '#fffdf7';
  ctx.fillRect(box.X, box.Y, box.WIDTH, box.HEIGHT);

  ctx.lineWidth = box.WALL_THICKNESS;
  ctx.strokeStyle = '#a06a58';
  ctx.strokeRect(
    box.X - box.WALL_THICKNESS / 2, 
    box.Y - box.WALL_THICKNESS / 2, 
    box.WIDTH + box.WALL_THICKNESS, 
    box.HEIGHT + box.WALL_THICKNESS
  );

  // Danger Line
  ctx.save();
  ctx.beginPath();
  ctx.setLineDash([8, 6]);
  ctx.moveTo(box.X, box.DANGER_Y);
  ctx.lineTo(box.X + box.WIDTH, box.DANGER_Y);

  const isWarning = overflowTimer > 0;
  ctx.strokeStyle = isWarning ? `rgba(231, 76, 60, ${0.5 + Math.sin(Date.now() * 0.01) * 0.5})` : 'rgba(231, 76, 60, 0.4)';
  ctx.lineWidth = isWarning ? 3 : 2;
  ctx.stroke();
  ctx.restore();

  // 조준선
  if (currentFruit && !isCooldown) {
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.moveTo(currentFruit.x, currentFruit.y);
    ctx.lineTo(currentFruit.x, box.Y + box.HEIGHT);
    ctx.strokeStyle = 'rgba(141, 91, 76, 0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

function drawOverlays() {
  if (currentState === GAME_STATE.PLAYING) return;

  ctx.fillStyle = 'rgba(60, 40, 30, 0.75)';
  ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cardX = CONFIG.CANVAS_WIDTH / 2 - 130;
  const cardY = 180;
  const cardW = 260;
  const cardH = 280;

  ctx.fillStyle = '#fff8eb';
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cardW, cardH, 20);
  ctx.fill();
  ctx.strokeStyle = '#8d5b4c';
  ctx.lineWidth = 6;
  ctx.stroke();

  if (currentState === GAME_STATE.GAME_OVER) {
    ctx.fillStyle = '#e74c3c';
    ctx.font = '900 30px "Jua", sans-serif';
    ctx.fillText('게임 오버!', CONFIG.CANVAS_WIDTH / 2, cardY + 45);

    ctx.fillStyle = '#7f8c8d';
    ctx.font = '700 15px sans-serif';
    ctx.fillText(gameOverReason, CONFIG.CANVAS_WIDTH / 2, cardY + 85);

    ctx.fillStyle = '#5d4037';
    ctx.font = '900 22px "Jua", sans-serif';
    ctx.fillText(`최종 점수: ${score}`, CONFIG.CANVAS_WIDTH / 2, cardY + 130);

  } else if (currentState === GAME_STATE.CLEAR) {
    ctx.fillStyle = '#2ecc71';
    ctx.font = '900 30px "Jua", sans-serif';
    ctx.fillText('축하합니다!', CONFIG.CANVAS_WIDTH / 2, cardY + 40);

    ctx.fillStyle = '#27ae60';
    ctx.font = '700 16px "Jua", sans-serif';
    ctx.fillText('🎉 최종 과일을 완성했습니다! 🎉', CONFIG.CANVAS_WIDTH / 2, cardY + 85);

    ctx.fillStyle = '#5d4037';
    ctx.font = '900 22px "Jua", sans-serif';
    ctx.fillText(`최종 점수: ${score}`, CONFIG.CANVAS_WIDTH / 2, cardY + 130);
  }

  // 재시작 클릭 영역
  const btnX = CONFIG.CANVAS_WIDTH / 2 - 90;
  const btnY = cardY + 185;
  const btnW = 180;
  const btnH = 50;

  ctx.fillStyle = '#ff7675';
  ctx.beginPath();
  ctx.roundRect(btnX, btnY, btnW, btnH, 16);
  ctx.fill();

  ctx.strokeStyle = '#d63031';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = '900 20px "Jua", sans-serif';
  ctx.fillText('다시 시작하기', CONFIG.CANVAS_WIDTH / 2, btnY + 25);
}

/**
 * ==========================================
 * 10. MAIN ANIMATION LOOP
 * ==========================================
 */
let lastTime = performance.now();

function setupCanvasScale() {
  canvas.width = CONFIG.CANVAS_WIDTH;
  canvas.height = CONFIG.CANVAS_HEIGHT;
}

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.08);
  lastTime = now;

  if (currentState === GAME_STATE.PLAYING) {
    if (isCooldown) {
      cooldownTimer -= dt;
      if (cooldownTimer <= 0) {
        spawnCurrentFruit();
      }
    } else if (currentFruit) {
      currentFruit.x = INPUT.mouseX;
      currentFruit.y = CONFIG.BOX.Y - 35;
      currentFruit.update(dt);
    }

    updatePhysics();
    checkGameOverConditions(dt);
  }

  for (let f of fruits) f.update(dt);
  updateEffects(dt);

  ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
  drawUI();

  for (let f of fruits) f.draw(ctx);
  if (currentFruit) currentFruit.draw(ctx);

  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  for (let t of popTexts) {
    ctx.save();
    ctx.font = `900 ${Math.floor(18 * t.scale)}px "Jua", sans-serif`;
    ctx.fillStyle = '#d63031';
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.max(0, t.alpha);
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }

  drawOverlays();

  requestAnimationFrame(gameLoop);
}

// 초기화 시작
window.addEventListener('resize', setupCanvasScale);
window.onload = () => {
  setupCanvasScale();
  INPUT.init();
  nextFruitLevel = getRandomSpawnLevel();
  spawnCurrentFruit();
  requestAnimationFrame(gameLoop);
};
</script>
