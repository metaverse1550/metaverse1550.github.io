<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사이드뷰 대전 격투 - Tekken Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', 'Orbitron', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        /* Health & Gauge Animations */
        .bar-transition {
            transition: width 0.25s ease-out;
        }

        .ult-glow {
            animation: pulse-glow 1.2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b; }
            100% { box-shadow: 0 0 25px #fbbf24, 0 0 40px #ef4444; }
        }

        .btn-touch {
            active: scale-95;
            transition: transform 0.05s ease;
        }

        /* Custom Scrollbar for Help Modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 sm:p-4 bg-slate-950 select-none">

    <!-- TOP HUD: Health, Ultimate, Round Markers, Timer -->
    <header class="w-full max-w-5xl flex flex-col gap-2 z-10 px-2">
        <!-- Main Stats Panel -->
        <div class="grid grid-cols-12 gap-2 sm:gap-4 items-center bg-slate-900/90 border border-slate-800 p-2 sm:p-3 rounded-2xl shadow-2xl backdrop-blur-md">
            
            <!-- Player 1 Info & Health -->
            <div class="col-span-5 flex flex-col gap-1">
                <div class="flex justify-between items-center px-1">
                    <span class="font-bold text-cyan-400 text-xs sm:text-base flex items-center gap-1">
                        <i class="fa-solid font-orbitron text-cyan-300">P1</i> 플레이어
                    </span>
                    <!-- P1 Round Wins -->
                    <div class="flex gap-1" id="p1-rounds">
                        <div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full border border-yellow-400 bg-slate-800 round-dot"></div>
                        <div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full border border-yellow-400 bg-slate-800 round-dot"></div>
                    </div>
                </div>
                <!-- Health Bar P1 -->
                <div class="w-full bg-slate-950 h-5 sm:h-7 rounded-lg overflow-hidden border border-slate-700 p-0.5 relative">
                    <div id="p1-health" class="bg-gradient-to-r from-cyan-600 to-cyan-400 h-full rounded bar-transition w-full flex justify-end items-center pr-2">
                        <span id="p1-hp-text" class="text-[10px] sm:text-xs font-black font-orbitron text-slate-950 drop-shadow">200 / 200</span>
                    </div>
                </div>
                <!-- Ultimate Bar P1 -->
                <div class="flex items-center gap-2">
                    <span class="text-[10px] sm:text-xs font-bold text-amber-400 font-orbitron shrink-0">ULT</span>
                    <div class="w-full bg-slate-950 h-2.5 sm:h-3.5 rounded-md overflow-hidden border border-amber-500/40 p-0.5 relative">
                        <div id="p1-ult" class="bg-gradient-to-r from-amber-500 to-red-500 h-full rounded bar-transition w-0"></div>
                    </div>
                </div>
            </div>

            <!-- Timer & Versus Center -->
            <div class="col-span-2 flex flex-col items-center justify-center">
                <div class="bg-slate-950 border border-slate-700 px-3 py-1 sm:px-4 sm:py-2 rounded-xl shadow-inner text-center">
                    <span id="match-timer" class="text-xl sm:text-3xl font-black text-yellow-400 font-orbitron tracking-wider">99</span>
                </div>
                <span class="text-[10px] sm:text-xs text-slate-400 font-bold mt-0.5 font-orbitron">BO3 MATCH</span>
            </div>

            <!-- Player 2 (AI) Info & Health -->
            <div class="col-span-5 flex flex-col gap-1">
                <div class="flex justify-between items-center px-1">
                    <!-- P2 Round Wins -->
                    <div class="flex gap-1" id="p2-rounds">
                        <div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full border border-yellow-400 bg-slate-800 round-dot"></div>
                        <div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full border border-yellow-400 bg-slate-800 round-dot"></div>
                    </div>
                    <span class="font-bold text-red-400 text-xs sm:text-base flex items-center gap-1">
                        AI 적 <i class="fa-solid font-orbitron text-red-300">P2</i>
                    </span>
                </div>
                <!-- Health Bar P2 -->
                <div class="w-full bg-slate-950 h-5 sm:h-7 rounded-lg overflow-hidden border border-slate-700 p-0.5 relative">
                    <div id="p2-health" class="bg-gradient-to-l from-red-600 to-red-400 h-full rounded bar-transition w-full ml-auto flex justify-start items-center pl-2">
                        <span id="p2-hp-text" class="text-[10px] sm:text-xs font-black font-orbitron text-slate-950 drop-shadow">200 / 200</span>
                    </div>
                </div>
                <!-- Ultimate Bar P2 -->
                <div class="flex items-center gap-2">
                    <div class="w-full bg-slate-950 h-2.5 sm:h-3.5 rounded-md overflow-hidden border border-amber-500/40 p-0.5 relative">
                        <div id="p2-ult" class="bg-gradient-to-l from-amber-500 to-red-500 h-full rounded bar-transition w-0 ml-auto"></div>
                    </div>
                    <span class="text-[10px] sm:text-xs font-bold text-amber-400 font-orbitron shrink-0">ULT</span>
                </div>
            </div>

        </div>
    </header>

    <!-- MAIN GAME CANVAS CONTAINER -->
    <main class="relative w-full max-w-5xl flex-1 my-2 flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full object-contain"></canvas>

        <!-- Round / Status Screen Banner Overlay -->
        <div id="status-overlay" class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm flex flex-col items-center justify-center hidden z-20">
            <h1 id="status-title" class="text-4xl sm:text-7xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 tracking-wider animate-bounce">
                ROUND 1
            </h1>
            <p id="status-sub" class="text-lg sm:text-2xl text-slate-200 mt-2 font-bold tracking-widest">READY?</p>
            
            <!-- Restart Button (Shown on Match End) -->
            <button id="btn-restart" class="hidden mt-6 px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black text-lg rounded-xl shadow-lg hover:shadow-cyan-500/50 transform hover:scale-105 transition">
                <i class="fa-solid fa-rotate-right mr-2"></i> 게임 다시 시작
            </button>
        </div>

        <!-- Ultimate Skill Visual Effect Cut-in Banner -->
        <div id="ult-cutin" class="absolute inset-0 pointer-events-none flex items-center justify-center hidden z-30">
            <div class="w-full bg-gradient-to-r from-transparent via-red-950/90 to-transparent py-8 border-y-4 border-amber-400 flex flex-col items-center justify-center animate-pulse">
                <h2 id="ult-user-text" class="text-3xl sm:text-6xl font-black font-orbitron italic text-amber-300 drop-shadow-[0_0_20px_rgba(245,158,11,1)]">
                    CRITICAL ULTIMATE!
                </h2>
                <span class="text-amber-100 font-extrabold text-sm sm:text-xl tracking-widest mt-1">165 ULTRA DAMAGE STRIKE!</span>
            </div>
        </div>
    </main>

    <!-- CONTROLS CONTAINER (Touch D-Pad + Action Buttons) -->
    <footer class="w-full max-w-5xl z-10 grid grid-cols-12 gap-2 items-center pb-1 px-1">
        
        <!-- Left: Movement D-Pad -->
        <div class="col-span-5 flex gap-2 items-center justify-start">
            <div class="grid grid-cols-3 gap-1.5 w-36 sm:w-48 h-24 sm:h-32">
                <div></div>
                <button id="btn-up" class="btn-touch bg-slate-800 border border-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-slate-200 font-bold text-lg shadow">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
                <div></div>
                
                <button id="btn-left" class="btn-touch bg-slate-800 border border-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-slate-200 font-bold text-lg shadow">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <button id="btn-down" class="btn-touch bg-slate-800 border border-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-slate-200 font-bold text-lg shadow">
                    <i class="fa-solid fa-shield-halved"></i>
                </button>
                <button id="btn-right" class="btn-touch bg-slate-800 border border-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-slate-200 font-bold text-lg shadow">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
            <div class="hidden md:flex flex-col text-xs text-slate-400 leading-tight border-l border-slate-800 pl-3">
                <span class="font-bold text-cyan-400 mb-1">⌨️ 키보드 조작</span>
                <span>이동: A / D</span>
                <span>점프: W / Space</span>
                <span>가드: S</span>
            </div>
        </div>

        <!-- Center: Ultimate Button -->
        <div class="col-span-2 flex justify-center">
            <button id="btn-ult" class="btn-touch relative w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-slate-800 border-2 border-slate-600 flex flex-col items-center justify-center text-amber-400 font-black opacity-50 cursor-not-allowed transition shadow-lg">
                <i class="fa-solid fa-bolt text-xl sm:text-2xl"></i>
                <span class="text-[9px] sm:text-[11px] font-orbitron mt-0.5">ULT (E)</span>
            </button>
        </div>

        <!-- Right: Attack Action Buttons -->
        <div class="col-span-5 flex justify-end gap-2 items-center">
            <div class="hidden md:flex flex-col text-xs text-slate-400 leading-tight border-r border-slate-800 pr-3 text-right">
                <span class="font-bold text-cyan-400 mb-1">공격 키</span>
                <span>약공격: J</span>
                <span>강공격: K</span>
                <span>킥: U</span>
                <span>궁극기: E</span>
            </div>

            <div class="grid grid-cols-3 gap-2 w-44 sm:w-56 h-24 sm:h-32">
                <button id="btn-punch" class="btn-touch bg-cyan-900/80 border border-cyan-500/50 active:bg-cyan-500 text-cyan-200 rounded-xl font-bold flex flex-col items-center justify-center shadow">
                    <i class="fa-solid fa-hand-back-fist text-base sm:text-xl"></i>
                    <span class="text-[10px] font-orbitron">약Punch (J)</span>
                </button>
                
                <button id="btn-heavy" class="btn-touch bg-blue-900/80 border border-blue-500/50 active:bg-blue-500 text-blue-200 rounded-xl font-bold flex flex-col items-center justify-center shadow">
                    <i class="fa-solid fa-hand-fist text-base sm:text-xl"></i>
                    <span class="text-[10px] font-orbitron">강Punch (K)</span>
                </button>
                
                <button id="btn-kick" class="btn-touch bg-purple-900/80 border border-purple-500/50 active:bg-purple-500 text-purple-200 rounded-xl font-bold flex flex-col items-center justify-center shadow">
                    <i class="fa-solid fa-socks text-base sm:text-xl"></i>
                    <span class="text-[10px] font-orbitron">Kick (U)</span>
                </button>
            </div>
        </div>

    </footer>

    <script>
        /* ===================================================================
           SOUND SYNTHESIZER (Web Audio API - Pure JS Audio)
           =================================================================== */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            playPunch(isHeavy = false) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isHeavy ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(isHeavy ? 120 : 220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + (isHeavy ? 0.25 : 0.15));
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (isHeavy ? 0.25 : 0.15));
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + (isHeavy ? 0.25 : 0.15));
            }

            playBlock() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playUltimate() {
                if (!this.ctx) return;
                // High energy sweeping pitch
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.6);
                
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.8);
            }

            playKO() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 1.2);
                
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.2);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 1.2);
            }
        }

        const sound = new SoundFX();

        const MAX_HP = 200;
        const ULT_MAX = 100;
        const ULT_DAMAGE = 165; // User Question Q6 Rule: Ultimate deals 165 damage out of 200 HP!

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize Canvas dynamically to match container
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game Global State
        let gameState = {
            status: 'STARTING', // STARTING, FIGHTING, ROUND_OVER, MATCH_OVER
            timer: 99,
            timerInterval: null,
            p1Wins: 0,
            p2Wins: 0,
            currentRound: 1,
            screenShake: 0
        };

        // Particles & Floating Damage Texts
        let particles = [];
        let floatingTexts = [];

        class Fighter {
            constructor(x, color, isAI = false) {
                this.x = x;
                this.y = 0;
                this.width = 60;
                this.height = 120;
                this.color = color;
                this.isAI = isAI;

                this.vx = 0;
                this.vy = 0;
                this.speed = 6;
                this.jumpStrength = -16;
                this.isGrounded = false;
                this.isBlocking = false;

                this.hp = MAX_HP;
                this.ultGauge = 0;

                this.facing = isAI ? -1 : 1; // 1: Right, -1: Left
                this.state = 'idle'; // idle, moving, attack_light, attack_heavy, attack_kick, attack_ult, hit, ko
                this.stateTimer = 0;

                // Attack Hitbox configuration
                this.attackBox = { x: 0, y: 0, w: 0, h: 0 };
                this.hasHitCurrentAttack = false;

                // Visual Animation Pose variables
                this.armAngle = 0;
                this.legAngle = 0;
            }

            reset(x) {
                this.x = x;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.hp = MAX_HP;
                this.ultGauge = 0;
                this.isBlocking = false;
                this.state = 'idle';
                this.stateTimer = 0;
                this.hasHitCurrentAttack = false;
            }

            update(groundY, opponent) {
                // Facing Direction towards opponent
                if (this.state !== 'ko' && this.state !== 'attack_ult') {
                    this.facing = this.x < opponent.x ? 1 : -1;
                }

                // Gravity & Physics
                this.vy += 0.8;
                this.x += this.vx;
                this.y += this.vy;

                // Ground Collision
                if (this.y + this.height >= groundY) {
                    this.y = groundY - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }

                // Stage Boundaries
                const margin = 20;
                if (this.x < margin) this.x = margin;
                if (this.x + this.width > canvas.width - margin) this.x = canvas.width - this.width - margin;

                // State Timers handling
                if (this.stateTimer > 0) {
                    this.stateTimer--;
                    if (this.stateTimer === 0 && this.state !== 'ko') {
                        this.state = 'idle';
                        this.hasHitCurrentAttack = false;
                    }
                }

                // Friction
                if (this.isGrounded && this.state === 'idle') {
                    this.vx *= 0.7;
                }
            }

            jump() {
                if (this.isGrounded && this.state === 'idle') {
                    this.vy = this.jumpStrength;
                    this.isGrounded = false;
                }
            }

            block(enable) {
                if (this.state === 'idle' || this.state === 'moving') {
                    this.isBlocking = enable;
                }
            }

            attack(type) {
                if (this.state !== 'idle' && this.state !== 'moving') return;

                this.state = type;
                this.hasHitCurrentAttack = false;

                if (type === 'attack_light') {
                    this.stateTimer = 18;
                    sound.playPunch(false);
                } else if (type === 'attack_heavy') {
                    this.stateTimer = 28;
                    sound.playPunch(true);
                } else if (type === 'attack_kick') {
                    this.stateTimer = 24;
                    sound.playPunch(false);
                } else if (type === 'attack_ult') {
                    if (this.ultGauge < ULT_MAX) return;
                    this.ultGauge = 0;
                    this.stateTimer = 50;
                    sound.playUltimate();
                    triggerUltCutin(this.isAI ? 'AI 적 (P2)' : '플레이어 (P1)');
                }
            }

            takeDamage(amount, attacker) {
                if (this.state === 'ko') return;

                let finalDamage = amount;
                if (this.isBlocking) {
                    finalDamage = Math.floor(amount * 0.2); // 80% damage reduction on block
                    sound.playBlock();
                } else {
                    this.state = 'hit';
                    this.stateTimer = 15;
                    // Knockback
                    this.vx = attacker.facing * (amount > 50 ? 15 : 6);
                }

                this.hp = Math.max(0, this.hp - finalDamage);

                // Gain Ultimate gauge when taking/giving hits
                this.gainUlt(finalDamage * 0.4);
                attacker.gainUlt(amount * 0.3);

                // Spawn floating damage text
                spawnDamageText(this.x + this.width / 2, this.y, finalDamage, finalDamage >= 100);

                // Particle Sparks
                for (let i = 0; i < (finalDamage > 50 ? 25 : 10); i++) {
                    particles.push(new Particle(
                        this.x + this.width / 2,
                        this.y + this.height / 2,
                        finalDamage >= 100 ? '#f59e0b' : '#ef4444'
                    ));
                }

                // Check K.O.
                if (this.hp <= 0) {
                    this.state = 'ko';
                    this.stateTimer = 999;
                    sound.playKO();
                }
            }

            gainUlt(amount) {
                this.ultGauge = Math.min(ULT_MAX, this.ultGauge + amount);
            }

            draw(ctx) {
                ctx.save();

                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;

                // Shadow under fighter
                ctx.beginPath();
                ctx.ellipse(centerX, this.y + this.height, this.width / 1.5, 10, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();

                // Ultimate Aura Effect
                if (this.ultGauge >= ULT_MAX) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
                    ctx.fillStyle = this.isAI ? 'rgba(239, 68, 68, 0.25)' : 'rgba(6, 182, 212, 0.25)';
                    ctx.fill();
                }

                // Body Drawing
                ctx.strokeStyle = this.color;
                ctx.fillStyle = this.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';

                // Head
                const headY = this.y + 20;
                ctx.beginPath();
                ctx.arc(centerX, headY, 16, 0, Math.PI * 2);
                ctx.fill();

                // Eyes / Visor Direction
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(centerX + (this.facing * 4) - 3, headY - 4, 6, 4);

                // Body Torso
                const hipY = this.y + 70;
                ctx.beginPath();
                ctx.moveTo(centerX, headY + 16);
                ctx.lineTo(centerX, hipY);
                ctx.stroke();

                // Limb Animation Adjustments based on State
                let lHandX = centerX - 15, lHandY = headY + 30;
                let rHandX = centerX + 15, rHandY = headY + 30;
                let lFootX = centerX - 15, lFootY = this.y + this.height;
                let rFootX = centerX + 15, rFootY = this.y + this.height;

                if (this.isBlocking) {
                    // Shield pose
                    rHandX = centerX + (this.facing * 20);
                    rHandY = headY + 10;
                    lHandX = centerX + (this.facing * 10);
                    lHandY = headY + 20;

                    ctx.strokeStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.arc(centerX + (this.facing * 25), centerY, 35, -Math.PI / 2, Math.PI / 2, this.facing < 0);
                    ctx.stroke();
                    ctx.strokeStyle = this.color;
                } else if (this.state === 'attack_light') {
                    rHandX = centerX + (this.facing * 50);
                    rHandY = headY + 15;
                } else if (this.state === 'attack_heavy') {
                    rHandX = centerX + (this.facing * 65);
                    rHandY = headY + 20;
                } else if (this.state === 'attack_kick') {
                    rFootX = centerX + (this.facing * 60);
                    rFootY = hipY + 10;
                } else if (this.state === 'attack_ult') {
                    // Ultimate Stance Beam / Strike
                    rHandX = centerX + (this.facing * 80);
                    rHandY = headY + 10;

                    // Epic Ultimate Laser Blast Line
                    ctx.save();
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#f59e0b';
                    ctx.fillStyle = '#fbbf24';
                    ctx.fillRect(
                        this.facing > 0 ? rHandX : rHandX - 450,
                        rHandY - 25,
                        450,
                        50
                    );
                    ctx.restore();
                } else if (this.state === 'hit') {
                    centerX -= this.facing * 10;
                } else if (this.state === 'ko') {
                    // Knocked down pose
                    ctx.restore();
                    ctx.save();
                    ctx.translate(centerX, this.y + this.height - 15);
                    ctx.rotate((this.facing * Math.PI) / 2);
                    ctx.strokeStyle = this.color;
                    ctx.fillStyle = this.color;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(0, -30, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(0, -14);
                    ctx.lineTo(0, 30);
                    ctx.stroke();
                    ctx.restore();
                    return;
                }

                // Draw Arms
                ctx.beginPath();
                ctx.moveTo(centerX, headY + 20);
                ctx.lineTo(lHandX, lHandY);
                ctx.moveTo(centerX, headY + 20);
                ctx.lineTo(rHandX, rHandY);
                ctx.stroke();

                // Draw Legs
                ctx.beginPath();
                ctx.moveTo(centerX, hipY);
                ctx.lineTo(lFootX, lFootY);
                ctx.moveTo(centerX, hipY);
                ctx.lineTo(rFootX, rFootY);
                ctx.stroke();

                ctx.restore();
            }

            getHitBox() {
                const centerX = this.x + this.width / 2;
                if (this.state === 'attack_light') {
                    return { x: centerX + (this.facing > 0 ? 0 : -60), y: this.y + 20, w: 60, h: 40, damage: 15 };
                } else if (this.state === 'attack_heavy') {
                    return { x: centerX + (this.facing > 0 ? 0 : -80), y: this.y + 10, w: 80, h: 50, damage: 28 };
                } else if (this.state === 'attack_kick') {
                    return { x: centerX + (this.facing > 0 ? 0 : -75), y: this.y + 50, w: 75, h: 50, damage: 22 };
                } else if (this.state === 'attack_ult') {
                    // Ultimate Hitbox (Massive Reach & 165 HP Damage)
                    return { x: centerX + (this.facing > 0 ? 0 : -500), y: this.y - 20, w: 500, h: 140, damage: ULT_DAMAGE };
                }
                return null;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.size = Math.random() * 6 + 3;
                this.color = color;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnDamageText(x, y, damage, isUlt = false) {
            floatingTexts.push({
                x: x,
                y: y,
                text: isUlt ? `ULTIMATE! -${damage}` : `-${damage}`,
                color: isUlt ? '#f59e0b' : '#ef4444',
                size: isUlt ? 28 : 20,
                alpha: 1,
                vy: -2
            });
        }

        const player1 = new Fighter(150, '#22d3ee', false);
        const player2 = new Fighter(600, '#f87171', true);

        // Simple Smart AI Behavior loop
        function updateAI() {
            if (gameState.status !== 'FIGHTING' || player2.state === 'ko') return;

            const dist = Math.abs(player1.x - player2.x);

            // Ultimate Attack usage
            if (player2.ultGauge >= ULT_MAX && dist < 350) {
                player2.attack('attack_ult');
                return;
            }

            // Spacing & Movement
            if (dist > 90) {
                player2.vx = player2.facing * player2.speed * 0.7;
                player2.block(false);
            } else if (dist < 50) {
                player2.vx = -player2.facing * player2.speed * 0.5;
            } else {
                player2.vx = 0;
            }

            // Attack Decision
            if (dist < 100 && Math.random() < 0.04) {
                const rand = Math.random();
                if (rand < 0.4) player2.attack('attack_light');
                else if (rand < 0.7) player2.attack('attack_kick');
                else player2.attack('attack_heavy');
            }

            // Guard Decision if player attacks
            if (player1.state.startsWith('attack_') && dist < 120 && Math.random() < 0.35) {
                player2.block(true);
            } else if (Math.random() < 0.05) {
                player2.block(false);
            }
        }

        const keys = {};

        window.addEventListener('keydown', (e) => {
            sound.init();
            keys[e.code] = true;

            if (gameState.status !== 'FIGHTING') return;

            if (e.code === 'KeyW' || e.code === 'Space') player1.jump();
            if (e.code === 'KeyS') player1.block(true);
            if (e.code === 'KeyJ') player1.attack('attack_light');
            if (e.code === 'KeyK') player1.attack('attack_heavy');
            if (e.code === 'KeyU') player1.attack('attack_kick');
            if (e.code === 'KeyE') player1.attack('attack_ult');
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'KeyS') player1.block(false);
        });

        // Touch Control Listeners
        function setupTouchControl(btnId, startFn, endFn) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); sound.init(); startFn(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); if (endFn) endFn(); });
            btn.addEventListener('mousedown', () => { sound.init(); startFn(); });
            btn.addEventListener('mouseup', () => { if (endFn) endFn(); });
        }

        setupTouchControl('btn-up', () => player1.jump());
        setupTouchControl('btn-down', () => player1.block(true), () => player1.block(false));
        setupTouchControl('btn-left', () => keys['KeyA'] = true, () => keys['KeyA'] = false);
        setupTouchControl('btn-right', () => keys['KeyD'] = true, () => keys['KeyD'] = false);
        setupTouchControl('btn-punch', () => player1.attack('attack_light'));
        setupTouchControl('btn-heavy', () => player1.attack('attack_heavy'));
        setupTouchControl('btn-kick', () => player1.attack('attack_kick'));
        setupTouchControl('btn-ult', () => player1.attack('attack_ult'));

        function startMatch() {
            gameState.p1Wins = 0;
            gameState.p2Wins = 0;
            gameState.currentRound = 1;
            updateRoundMarkers();
            startRound();
        }

        function startRound() {
            gameState.status = 'STARTING';
            gameState.timer = 99;

            const groundY = canvas.height - 60;
            player1.reset(150);
            player2.reset(canvas.width - 210);

            showStatusOverlay(`ROUND ${gameState.currentRound}`, 'READY?');

            setTimeout(() => {
                showStatusOverlay('FIGHT!', '');
                setTimeout(() => {
                    hideStatusOverlay();
                    gameState.status = 'FIGHTING';
                    startTimer();
                }, 800);
            }, 1200);
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (gameState.status === 'FIGHTING') {
                    gameState.timer--;
                    document.getElementById('match-timer').textContent = gameState.timer;
                    if (gameState.timer <= 0) {
                        endRound('TIME OVER');
                    }
                }
            }, 1000);
        }

        function checkHitCollisions(attacker, defender) {
            const hitBox = attacker.getHitBox();
            if (!hitBox || attacker.hasHitCurrentAttack) return;

            // Defender AABB collision check
            if (
                hitBox.x < defender.x + defender.width &&
                hitBox.x + hitBox.w > defender.x &&
                hitBox.y < defender.y + defender.height &&
                hitBox.y + hitBox.h > defender.y
            ) {
                attacker.hasHitCurrentAttack = true;
                defender.takeDamage(hitBox.damage, attacker);

                if (hitBox.damage >= 100) {
                    gameState.screenShake = 20; // Big Screen Shake on Ultimate!
                } else {
                    gameState.screenShake = 6;
                }

                if (defender.hp <= 0) {
                    endRound('K.O.');
                }
            }
        }

        function endRound(reason) {
            gameState.status = 'ROUND_OVER';
            clearInterval(gameState.timerInterval);

            let winnerText = '';
            if (player1.hp > player2.hp) {
                gameState.p1Wins++;
                winnerText = 'PLAYER 1 WINS!';
            } else if (player2.hp > player1.hp) {
                gameState.p2Wins++;
                winnerText = 'AI WIN!';
            } else {
                winnerText = 'DRAW!';
            }

            updateRoundMarkers();

            setTimeout(() => {
                showStatusOverlay(reason, winnerText);

                setTimeout(() => {
                    if (gameState.p1Wins >= 2 || gameState.p2Wins >= 2) {
                        // Match Over
                        gameState.status = 'MATCH_OVER';
                        const matchWinner = gameState.p1Wins >= 2 ? 'VICTORY! YOU WIN THE MATCH!' : 'DEFEAT! AI WINS THE MATCH!';
                        showStatusOverlay(matchWinner, '');
                        document.getElementById('btn-restart').classList.remove('hidden');
                    } else {
                        // Next Round
                        gameState.currentRound++;
                        startRound();
                    }
                }, 2000);
            }, 800);
        }

        function updateRoundMarkers() {
            const p1Dots = document.querySelectorAll('#p1-rounds .round-dot');
            const p2Dots = document.querySelectorAll('#p2-rounds .round-dot');

            p1Dots.forEach((dot, idx) => {
                if (idx < gameState.p1Wins) dot.classList.add('bg-yellow-400');
                else dot.classList.remove('bg-yellow-400');
            });

            p2Dots.forEach((dot, idx) => {
                if (idx < gameState.p2Wins) dot.classList.add('bg-yellow-400');
                else dot.classList.remove('bg-yellow-400');
            });
        }

        function triggerUltCutin(username) {
            const cutin = document.getElementById('ult-cutin');
            document.getElementById('ult-user-text').textContent = `${username} CRITICAL ULTIMATE!`;
            cutin.classList.remove('hidden');
            setTimeout(() => cutin.classList.add('hidden'), 1000);
        }

        function showStatusOverlay(title, sub) {
            const overlay = document.getElementById('status-overlay');
            document.getElementById('status-title').textContent = title;
            document.getElementById('status-sub').textContent = sub;
            overlay.classList.remove('hidden');
        }

        function hideStatusOverlay() {
            document.getElementById('status-overlay').classList.add('hidden');
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('btn-restart').classList.add('hidden');
            startMatch();
        });

        function updateHUD() {
            // Player 1 HP
            const p1Pct = Math.max(0, (player1.hp / MAX_HP) * 100);
            document.getElementById('p1-health').style.width = `${p1Pct}%`;
            document.getElementById('p1-hp-text').textContent = `${player1.hp} / ${MAX_HP}`;

            // Player 2 HP
            const p2Pct = Math.max(0, (player2.hp / MAX_HP) * 100);
            document.getElementById('p2-health').style.width = `${p2Pct}%`;
            document.getElementById('p2-hp-text').textContent = `${player2.hp} / ${MAX_HP}`;

            // Ultimate Bars
            document.getElementById('p1-ult').style.width = `${player1.ultGauge}%`;
            document.getElementById('p2-ult').style.width = `${player2.ultGauge}%`;

            // Ultimate Button Glow
            const ultBtn = document.getElementById('btn-ult');
            if (player1.ultGauge >= ULT_MAX) {
                ultBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                ultBtn.classList.add('ult-glow', 'cursor-pointer');
            } else {
                ultBtn.classList.add('opacity-50', 'cursor-not-allowed');
                ultBtn.classList.remove('ult-glow', 'cursor-pointer');
            }
        }

        function drawBackground(ctx, width, height, groundY) {
            // Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#0f172a');
            skyGrad.addColorStop(0.7, '#1e1b4b');
            skyGrad.addColorStop(1, '#311042');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // Arena Sunset Grid / Lights
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.15)';
            ctx.lineWidth = 2;
            for (let i = 0; i < width; i += 60) {
                ctx.beginPath();
                ctx.moveTo(i, height - 120);
                ctx.lineTo(i, height);
                ctx.stroke();
            }

            // Flat Arena Ground Stage (Question Q3: Flat ground)
            const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
            groundGrad.addColorStop(0, '#1e293b');
            groundGrad.addColorStop(0.2, '#0f172a');
            groundGrad.addColorStop(1, '#020617');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, width, height - groundY);

            // Ground Stage Border Line
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
        }

        function render() {
            ctx.save();

            // Screen Shake Effect
            if (gameState.screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * gameState.screenShake;
                const shakeY = (Math.random() - 0.5) * gameState.screenShake;
                ctx.translate(shakeX, shakeY);
                gameState.screenShake *= 0.85;
                if (gameState.screenShake < 0.5) gameState.screenShake = 0;
            }

            const groundY = canvas.height - 60;

            // Clear & Draw Stage Background
            drawBackground(ctx, canvas.width, canvas.height, groundY);

            // Player Inputs for Movement
            if (gameState.status === 'FIGHTING') {
                if (keys['KeyA']) player1.vx = -player1.speed;
                else if (keys['KeyD']) player1.vx = player1.speed;

                updateAI();
            }

            // Update Fighters
            player1.update(groundY, player2);
            player2.update(groundY, player1);

            // Hitbox Collisions
            if (gameState.status === 'FIGHTING') {
                checkHitCollisions(player1, player2);
                checkHitCollisions(player2, player1);
            }

            // Draw Fighters
            player1.draw(ctx);
            player2.draw(ctx);

            // Particles Update & Draw
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            // Floating Damage Texts
            floatingTexts = floatingTexts.filter(t => t.alpha > 0);
            floatingTexts.forEach(t => {
                t.y += t.vy;
                t.alpha -= 0.02;
                ctx.save();
                ctx.globalAlpha = Math.max(0, t.alpha);
                ctx.font = `900 ${t.size}px Orbitron, sans-serif`;
                ctx.fillStyle = t.color;
                ctx.fillText(t.text, t.x - 20, t.y);
                ctx.restore();
            });

            ctx.restore();

            // Update HUD Stats
            updateHUD();

            requestAnimationFrame(render);
        }

        window.onload = () => {
            resizeCanvas();
            startMatch();
            render();
        };
    </script>
</body>
</html>
