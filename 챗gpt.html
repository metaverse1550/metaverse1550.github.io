<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2.5D 자연 지형 레이싱 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        .font-racing {
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
        }

        /* Canvas Fullscreen Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism UI Style */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Custom Scrollbar for vehicle/track select */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Animated Pulsing Buttons */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 30px rgba(59, 130, 246, 0.9); }
        }
        .btn-glow {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white select-none">

    <div id="game-container">
        <!-- Canvas Element -->
        <canvas id="gameCanvas"></canvas>

        <!-- Overlay UI Screens -->
        <div id="ui-overlay" class="absolute inset-0 flex flex-col justify-between pointer-events-none p-4 md:p-6 z-10">
            
            <!-- START / ATMOSPHERE MENU SCREEN -->
            <div id="screen-atmosphere" class="pointer-events-auto absolute inset-0 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div class="glass-panel p-6 md:p-8 rounded-2xl max-w-xl w-full text-center space-y-6 border border-slate-700/50 shadow-2xl">
                    <h1 class="text-3xl md:text-5xl font-black font-racing tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500">
                        NATURE RALLY 2.5D
                    </h1>
                    <p class="text-slate-300 text-sm md:text-base">원하는 레이싱 분위기를 선택하세요</p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-left">
                        <button onclick="selectAtmosphere('realistic')" class="p-4 rounded-xl border border-slate-700 hover:border-cyan-400 bg-slate-800/60 hover:bg-slate-800 transition transform hover:-translate-y-1">
                            <div class="font-bold text-cyan-400 text-lg">1. 현실 스릴 레이싱</div>
                            <div class="text-xs text-slate-400">묵직한 핸들링과 스릴 넘치는 속도감</div>
                        </button>
                        <button onclick="selectAtmosphere('arcade')" class="p-4 rounded-xl border border-slate-700 hover:border-amber-400 bg-slate-800/60 hover:bg-slate-800 transition transform hover:-translate-y-1">
                            <div class="font-bold text-amber-400 text-lg">2. 화려한 아케이드</div>
                            <div class="text-xs text-slate-400">화려한 부스터 이펙트와 익스트림 가속</div>
                        </button>
                        <button onclick="selectAtmosphere('offroad')" class="p-4 rounded-xl border border-slate-700 hover:border-emerald-400 bg-slate-800/60 hover:bg-slate-800 transition transform hover:-translate-y-1">
                            <div class="font-bold text-emerald-400 text-lg">3. 역동적 오프로드</div>
                            <div class="text-xs text-slate-400">거친 흙먼지, 접지력 변화와 강력한 4WD</div>
                        </button>
                        <button onclick="selectAtmosphere('scenic')" class="p-4 rounded-xl border border-slate-700 hover:border-pink-400 bg-slate-800/60 hover:bg-slate-800 transition transform hover:-translate-y-1">
                            <div class="font-bold text-pink-400 text-lg">4. 시원한 자연 풍경</div>
                            <div class="text-xs text-slate-400">아름다운 배경색과 쾌적한 크루징 조향</div>
                        </button>
                    </div>

                    <div class="text-xs text-slate-500 pt-2">
                        방향키 (↑ 가속, ↓ 감속, ←/→ 조향) 로 조작합니다.
                    </div>
                </div>
            </div>

            <!-- VEHICLE SELECT & UPGRADE SCREEN -->
            <div id="screen-vehicle" class="hidden pointer-events-auto absolute inset-0 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div class="glass-panel p-6 rounded-2xl max-w-3xl w-full space-y-6 border border-slate-700/50 shadow-2xl">
                    <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
                        <h2 class="text-2xl font-bold font-racing text-cyan-400">차량 선택 & 업그레이드</h2>
                        <div class="text-right">
                            <div class="text-xs text-slate-400">보유 골드</div>
                            <div id="display-gold" class="text-xl font-bold text-yellow-400">0 G</div>
                        </div>
                    </div>

                    <!-- Vehicle Cards -->
                    <div id="vehicle-list" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <!-- Dynamic render via JS -->
                    </div>

                    <!-- Upgrade Panel for Selected Vehicle -->
                    <div id="upgrade-panel" class="bg-slate-800/70 p-4 rounded-xl border border-slate-700 space-y-3">
                        <div class="flex justify-between items-center">
                            <div id="selected-vehicle-name" class="font-bold text-lg text-white">차량 정보</div>
                            <button id="btn-unlock" onclick="unlockVehicle()" class="hidden px-4 py-1.5 bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold text-sm rounded-lg transition">
                                해금 (500 G)
                            </button>
                        </div>
                        
                        <!-- Vehicle Stats Bars -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <div class="flex justify-between text-xs text-slate-300 mb-1">
                                    <span>최고 속도 (Speed)</span>
                                    <span id="stat-speed-val">0</span>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-2">
                                    <div id="stat-speed-bar" class="bg-cyan-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                                </div>
                                <button onclick="upgradeStat('speed')" id="btn-upgrade-speed" class="mt-2 w-full py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded text-slate-200 transition">
                                    업그레이드 (+50 G)
                                </button>
                            </div>

                            <div>
                                <div class="flex justify-between text-xs text-slate-300 mb-1">
                                    <span>가속력 (Acceleration)</span>
                                    <span id="stat-accel-val">0</span>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-2">
                                    <div id="stat-accel-bar" class="bg-amber-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                                </div>
                                <button onclick="upgradeStat('accel')" id="btn-upgrade-accel" class="mt-2 w-full py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded text-slate-200 transition">
                                    업그레이드 (+50 G)
                                </button>
                            </div>

                            <div>
                                <div class="flex justify-between text-xs text-slate-300 mb-1">
                                    <span>핸들링 (Handling)</span>
                                    <span id="stat-handling-val">0</span>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-2">
                                    <div id="stat-handling-bar" class="bg-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                                </div>
                                <button onclick="upgradeStat('handling')" id="btn-upgrade-handling" class="mt-2 w-full py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded text-slate-200 transition">
                                    업그레이드 (+50 G)
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-2">
                        <button onclick="showScreen('screen-atmosphere')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-bold transition">
                            ← 분위기 선택
                        </button>
                        <button onclick="goToTrackSelect()" id="btn-to-track" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 font-bold rounded-xl text-white shadow-lg btn-glow transition">
                            트랙 선택 →
                        </button>
                    </div>
                </div>
            </div>

            <!-- TRACK SELECT SCREEN -->
            <div id="screen-track" class="hidden pointer-events-auto absolute inset-0 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div class="glass-panel p-6 rounded-2xl max-w-2xl w-full space-y-6 border border-slate-700/50 shadow-2xl">
                    <h2 class="text-2xl font-bold font-racing text-cyan-400 text-center">자연 레이싱 트랙 선택</h2>

                    <div id="track-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Dynamic track cards -->
                    </div>

                    <div class="flex justify-between items-center pt-2">
                        <button onclick="showScreen('screen-vehicle')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-bold transition">
                            ← 차량 변경
                        </button>
                        <button onclick="startRace()" class="px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black text-lg rounded-xl shadow-xl btn-glow transition transform hover:scale-105">
                            RACE START!
                        </button>
                    </div>
                </div>
            </div>

            <!-- IN-GAME HUD -->
            <div id="hud" class="hidden w-full flex justify-between items-start pointer-events-none">
                <!-- Top Left: Rank, Lap, Time -->
                <div class="glass-panel p-3 md:p-4 rounded-xl space-y-1">
                    <div class="flex items-baseline gap-2">
                        <span class="text-xs text-slate-400">순위</span>
                        <span id="hud-rank" class="text-2xl md:text-4xl font-black font-racing text-yellow-400">1st</span>
                        <span class="text-xs text-slate-400">/ 5</span>
                    </div>
                    <div class="text-sm font-bold text-slate-200">
                        LAP: <span id="hud-lap" class="text-cyan-400">1</span> / <span id="hud-total-laps">2</span>
                    </div>
                    <div class="text-xs font-mono text-slate-300">
                        TIME: <span id="hud-time">00:00.00</span>
                    </div>
                    <div id="hud-shortcut-indicator" class="hidden text-xs font-bold text-amber-400 animate-pulse">
                        ⚠️ 지름길 진입!
                    </div>
                </div>

                <!-- Top Right: Speedometer & Minimap Progress -->
                <div class="glass-panel p-3 md:p-4 rounded-xl text-right space-y-1">
                    <div class="text-xs text-slate-400">SPEED</div>
                    <div class="text-3xl md:text-5xl font-black font-racing text-cyan-400">
                        <span id="hud-speed">0</span> <span class="text-xs font-normal text-slate-400">KM/H</span>
                    </div>
                    <!-- Mini Track Progress Bar -->
                    <div class="w-32 md:w-48 bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700">
                        <div id="hud-progress-bar" class="bg-gradient-to-r from-blue-500 to-cyan-400 h-2 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- COUNTDOWN / NOTICE OVERLAY -->
            <div id="hud-countdown" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="countdown-text" class="text-7xl md:text-9xl font-black font-racing text-yellow-400 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] animate-bounce">
                    3
                </div>
            </div>

            <!-- RACE RESULT SCREEN -->
            <div id="screen-result" class="hidden pointer-events-auto absolute inset-0 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
                <div class="glass-panel p-6 md:p-8 rounded-2xl max-w-lg w-full text-center space-y-6 border border-slate-700 shadow-2xl">
                    <h2 id="result-title" class="text-3xl md:text-4xl font-black font-racing text-yellow-400">
                        FINISH!
                    </h2>

                    <div class="bg-slate-800/80 p-4 rounded-xl space-y-3 border border-slate-700">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                            <span class="text-slate-400">최종 순위</span>
                            <span id="result-rank" class="text-2xl font-bold text-cyan-400">1위</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                            <span class="text-slate-400">완주 기록</span>
                            <span id="result-time" class="text-lg font-mono text-slate-200">01:23.45</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                            <span class="text-slate-400">획득 점수</span>
                            <span id="result-score" class="text-lg font-bold text-amber-400">+500 PTS</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400">획득 골드</span>
                            <span id="result-gold" class="text-lg font-bold text-yellow-400">+200 G</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button onclick="restartRace()" class="py-3 bg-cyan-600 hover:bg-cyan-500 font-bold rounded-xl text-white shadow-lg transition">
                            다시 시작
                        </button>
                        <button onclick="showScreen('screen-vehicle')" class="py-3 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl text-white transition">
                            차량 / 코스 변경
                        </button>
                    </div>
                </div>
            </div>

            <!-- Touch On-Screen Controls for Mobile / Touch Devices -->
            <div id="touch-controls" class="pointer-events-auto flex justify-between items-end w-full md:hidden pb-2 px-2">
                <div class="flex gap-2">
                    <button id="btn-left" class="w-16 h-16 bg-slate-800/80 active:bg-slate-600 text-white font-bold rounded-2xl border border-slate-600 flex items-center justify-center text-2xl select-none">
                        ◀
                    </button>
                    <button id="btn-right" class="w-16 h-16 bg-slate-800/80 active:bg-slate-600 text-white font-bold rounded-2xl border border-slate-600 flex items-center justify-center text-2xl select-none">
                        ▶
                    </button>
                </div>
                <div class="flex gap-2">
                    <button id="btn-brake" class="w-16 h-16 bg-rose-900/80 active:bg-rose-700 text-white font-bold rounded-2xl border border-rose-600 flex items-center justify-center text-xl select-none">
                        ▼
                    </button>
                    <button id="btn-accel" class="w-20 h-20 bg-emerald-600/80 active:bg-emerald-500 text-white font-bold rounded-2xl border border-emerald-400 flex items-center justify-center text-3xl shadow-lg select-none">
                        ▲
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        /* ==========================================================================
           1. CONFIG & GAME CONSTANTS
           ========================================================================== */
        const CONFIG = {
            SEGMENT_LENGTH: 200,    // 2.5D segment Z-depth
            RUMBLE_LENGTH: 3,       // Alternating curb color count
            CAMERA_HEIGHT: 1000,    // Camera y-offset above player
            CAMERA_DEPTH: 0.8,      // Camera field of view scale (1/tan(fov/2))
            ROAD_WIDTH: 2000,       // Standard road width
            LANES: 3,               // Virtual visual lanes
            FPS: 60,                // Target render FPS
        };

        // Atmosphere visual themes
        const ATMOSPHERES = {
            realistic: {
                name: '현실 스릴 레이싱',
                skyGradient: ['#0f172a', '#1e293b'],
                fogColor: '#1e293b',
                grassColor1: '#166534', grassColor2: '#15803d',
                rumbleColor1: '#ef4444', rumbleColor2: '#ffffff',
                roadColor: '#334155',
                sunColor: '#fef08a'
            },
            arcade: {
                name: '화려한 아케이드',
                skyGradient: ['#311b92', '#880e4f'],
                fogColor: '#4a148c',
                grassColor1: '#00897b', grassColor2: '#00bfa5',
                rumbleColor1: '#ff007f', rumbleColor2: '#00ffff',
                roadColor: '#263238',
                sunColor: '#ff007f'
            },
            offroad: {
                name: '역동적 오프로드',
                skyGradient: ['#451a03', '#78350f'],
                fogColor: '#78350f',
                grassColor1: '#a16207', grassColor2: '#ca8a04',
                rumbleColor1: '#d97706', rumbleColor2: '#fef3c7',
                roadColor: '#78350f',
                sunColor: '#fde047'
            },
            scenic: {
                name: '시원한 자연 풍경',
                skyGradient: ['#0284c7', '#38bdf8'],
                fogColor: '#e0f2fe',
                grassColor1: '#4d7c0f', grassColor2: '#65a30d',
                rumbleColor1: '#ffffff', rumbleColor2: '#ef4444',
                roadColor: '#475569',
                sunColor: '#fef08a'
            }
        };

        /* ==========================================================================
           2. SAVE_STATE & LOCAL STORAGE
           ========================================================================== */
        const SAVE_STATE = {
            gold: 300,
            score: 0,
            unlockedVehicles: ['sportsCar'],
            selectedVehicle: 'sportsCar',
            upgrades: {
                sportsCar: { speed: 0, accel: 0, handling: 0 },
                motorbike: { speed: 0, accel: 0, handling: 0 },
                kart: { speed: 0, accel: 0, handling: 0 },
                monsterTruck: { speed: 0, accel: 0, handling: 0 },
            },
            
            load() {
                try {
                    const data = localStorage.getItem('nature_rally_save_v1');
                    if (data) {
                        const parsed = JSON.parse(data);
                        this.gold = parsed.gold ?? 300;
                        this.score = parsed.score ?? 0;
                        this.unlockedVehicles = parsed.unlockedVehicles || ['sportsCar'];
                        this.selectedVehicle = parsed.selectedVehicle || 'sportsCar';
                        this.upgrades = parsed.upgrades || this.upgrades;
                    }
                } catch(e) { console.error('Save state error:', e); }
            },

            save() {
                try {
                    localStorage.setItem('nature_rally_save_v1', JSON.stringify({
                        gold: this.gold,
                        score: this.score,
                        unlockedVehicles: this.unlockedVehicles,
                        selectedVehicle: this.selectedVehicle,
                        upgrades: this.upgrades
                    }));
                } catch(e) { console.error('Save write error:', e); }
            }
        };
        SAVE_STATE.load();

        /* ==========================================================================
           3. VEHICLES DATA & SPECIFICATIONS
           ========================================================================== */
        const VEHICLES = {
            sportsCar: {
                id: 'sportsCar',
                name: '스포티 쿠페 (Sports Car)',
                type: '자동차',
                price: 0,
                baseMaxSpeed: 10000,
                baseAccel: 3200,
                baseHandling: 2.8,
                color: '#ef4444',
                secondaryColor: '#f8fafc',
                offroadDecel: 0.94,
                icon: '🏎️',
                description: '균형 잡힌 성능과 안정적인 최고 속도를 자랑합니다.'
            },
            motorbike: {
                id: 'motorbike',
                name: '슈퍼 바이크 (Motorbike)',
                type: '오토바이',
                price: 400,
                baseMaxSpeed: 11200,
                baseAccel: 4000,
                baseHandling: 3.5,
                color: '#3b82f6',
                secondaryColor: '#f59e0b',
                offroadDecel: 0.88,
                icon: '🏍️',
                description: '폭발적인 가속력과 가벼운 코너링을 보유하지만 오프로드에 약합니다.'
            },
            kart: {
                id: 'kart',
                name: '익스트림 카트 (Go-Kart)',
                type: '카트',
                price: 250,
                baseMaxSpeed: 9200,
                baseAccel: 4800,
                baseHandling: 4.2,
                color: '#10b981',
                secondaryColor: '#facc15',
                offroadDecel: 0.90,
                icon: '🏎️',
                description: '최고의 핸들링과 가속 반응성으로 코너와 지름길에서 강력합니다.'
            },
            monsterTruck: {
                id: 'monsterTruck',
                name: '와일드 몬스터 (Monster Truck)',
                type: '특수 차량',
                price: 600,
                baseMaxSpeed: 9600,
                baseAccel: 2800,
                baseHandling: 2.2,
                color: '#8b5cf6',
                secondaryColor: '#10b981',
                offroadDecel: 0.99, // Offroad bypass!
                icon: '🛻',
                description: '거대한 바퀴로 험로와 오프로드 진흙 장애물 속도 저하를 무시합니다.'
            }
        };

        /* ==========================================================================
           4. TRACK & TERRAIN GENERATOR
           ========================================================================== */
        const TRACK_PRESETS = [
            {
                id: 'forest',
                name: '숲속 계곡 트랙 (Forest Valley)',
                laps: 2,
                bgGradient: ['#064e3b', '#022c22'],
                description: '울창한 나무와 울퉁불퉁한 커브, 좁은 통나무 지름길이 존재하는 코스'
            },
            {
                id: 'canyon',
                name: '사막 캐년 트랙 (Desert Canyon)',
                laps: 2,
                bgGradient: ['#78350f', '#451a03'],
                description: '거대한 바위와 협곡 지형. 위험하지만 압도적으로 빠른 바위 지름길 배치'
            },
            {
                id: 'alpine',
                name: '알프스 설산 트랙 (Alpine Pass)',
                laps: 2,
                bgGradient: ['#0f172a', '#1e293b'],
                description: '급경사 내리막과 물웅덩이/빙판 장애물이 널려있는 테크니컬 트랙'
            }
        ];

        class TrackManager {
            constructor() {
                this.segments = [];
                this.trackLength = 0;
            }

            buildTrack(trackId) {
                this.segments = [];
                
                // Track generation helper logic
                const addSegment = (enter, hold, leave, curve, hill, shortcut = false) => {
                    const total = enter + hold + leave;
                    for (let i = 0; i < total; i++) {
                        let easeVal = 0;
                        if (i < enter) easeVal = i / enter;
                        else if (i < enter + hold) easeVal = 1;
                        else easeVal = (total - i) / leave;

                        const curCurve = curve * easeVal;
                        const curHill = hill * easeVal;
                        
                        this.segments.push({
                            index: this.segments.length,
                            p1: { world: { y: 0, z: this.segments.length * CONFIG.SEGMENT_LENGTH }, camera: {}, screen: {} },
                            p2: { world: { y: 0, z: (this.segments.length + 1) * CONFIG.SEGMENT_LENGTH }, camera: {}, screen: {} },
                            curve: curCurve,
                            hill: curHill,
                            isShortcut: shortcut,
                            sprites: [],
                            obstacles: [],
                            color: Math.floor(this.segments.length / CONFIG.RUMBLE_LENGTH) % 2 ? 'dark' : 'light'
                        });
                    }
                };

                // Track segment definitions
                if (trackId === 'canyon') {
                    addSegment(50, 50, 50, 0, 0);         // Start straight
                    addSegment(40, 60, 40, 3, 20);        // Uphill Curve
                    addSegment(30, 40, 30, -4, -15);      // Downhill curve
                    addSegment(20, 80, 20, 0, 0, true);   // SHORTCUT SECTION 1
                    addSegment(50, 50, 50, 5, 30);
                    addSegment(40, 40, 40, -3, 0);
                    addSegment(20, 60, 20, -2, 0, true);  // SHORTCUT SECTION 2
                    addSegment(60, 60, 60, 0, -20);
                } else if (trackId === 'alpine') {
                    addSegment(40, 40, 40, 0, 0);
                    addSegment(50, 80, 50, -5, 40);       // High mountain climb
                    addSegment(30, 50, 30, 6, -30);       // Steep slope curve
                    addSegment(20, 70, 20, 1, -10, true);  // Mountain shortcut
                    addSegment(40, 60, 40, -4, 15);
                    addSegment(50, 50, 50, 0, 0);
                } else { // Forest default
                    addSegment(50, 50, 50, 0, 0);         // Straight start
                    addSegment(40, 50, 40, 2.5, 10);      // Gentle right curve
                    addSegment(30, 60, 30, -3.5, -10);    // Left curve
                    addSegment(20, 70, 20, -1, 0, true);  // SHORTCUT 1
                    addSegment(40, 40, 40, 4, 15);        // Sharp curve
                    addSegment(30, 50, 30, -2, 0);
                    addSegment(20, 80, 20, 2, 0, true);   // SHORTCUT 2
                    addSegment(50, 50, 50, 0, 0);
                }

                // Calculate cumulative Y hills
                let currentY = 0;
                for (let i = 0; i < this.segments.length; i++) {
                    const seg = this.segments[i];
                    seg.p1.world.y = currentY;
                    currentY += seg.hill * 20;
                    seg.p2.world.y = currentY;
                }

                this.trackLength = this.segments.length * CONFIG.SEGMENT_LENGTH;
                this.populateDecorationsAndObstacles(trackId);
            }

            populateDecorationsAndObstacles(trackId) {
                // Populate roadside scenery (Trees, Rocks) & On-road Obstacles (Mud, Rocks, Puddles)
                for (let i = 10; i < this.segments.length - 10; i += 3) {
                    const seg = this.segments[i];
                    
                    // Side scenery
                    if (i % 2 === 0) {
                        seg.sprites.push({
                            type: trackId === 'canyon' ? 'rock' : (trackId === 'alpine' ? 'snowTree' : 'tree'),
                            offset: -1.4 - Math.random() * 1.5
                        });
                    }
                    if (i % 3 === 0) {
                        seg.sprites.push({
                            type: trackId === 'canyon' ? 'rock' : (trackId === 'alpine' ? 'snowTree' : 'tree'),
                            offset: 1.4 + Math.random() * 1.5
                        });
                    }

                    // On-road Obstacles or Moving Hazards
                    if (!seg.isShortcut && i % 18 === 0) {
                        const obstacleType = (i % 36 === 0) ? 'rock' : (trackId === 'alpine' ? 'water' : 'mud');
                        seg.obstacles.push({
                            type: obstacleType,
                            offset: (Math.random() - 0.5) * 1.2, // Within road range
                            radius: 120,
                            moving: (i % 36 === 0),             // Dynamic moving obstacle
                            moveDir: 1,
                            moveSpeed: 0.015
                        });
                    }

                    // Shortcuts have additional hazards inside them
                    if (seg.isShortcut && i % 8 === 0) {
                        seg.obstacles.push({
                            type: 'rock',
                            offset: (Math.random() - 0.5) * 0.8,
                            radius: 100,
                            moving: false
                        });
                    }
                }
            }

            getSegment(z) {
                if (z < 0) z = (z % this.trackLength) + this.trackLength;
                const index = Math.floor(z / CONFIG.SEGMENT_LENGTH) % this.segments.length;
                return this.segments[index];
            }
        }

        /* ==========================================================================
           5. INPUT HANDLER
           ========================================================================== */
        const INPUT = {
            up: false,
            down: false,
            left: false,
            right: false,

            init() {
                window.addEventListener('keydown', (e) => this.handleKey(e, true));
                window.addEventListener('keyup', (e) => this.handleKey(e, false));

                // Mobile touch controls setup
                const setupTouch = (id, key) => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); this[key] = true; });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); this[key] = false; });
                    btn.addEventListener('mousedown', (e) => { e.preventDefault(); this[key] = true; });
                    btn.addEventListener('mouseup', (e) => { e.preventDefault(); this[key] = false; });
                };

                setupTouch('btn-accel', 'up');
                setupTouch('btn-brake', 'down');
                setupTouch('btn-left', 'left');
                setupTouch('btn-right', 'right');
            },

            handleKey(e, isPressed) {
                switch (e.key) {
                    case 'ArrowUp': case 'w': case 'W': this.up = isPressed; break;
                    case 'ArrowDown': case 's': case 'S': this.down = isPressed; break;
                    case 'ArrowLeft': case 'a': case 'A': this.left = isPressed; break;
                    case 'ArrowRight': case 'd': case 'D': this.right = isPressed; break;
                }
            }
        };

        /* ==========================================================================
           6. VEHICLE & AI INSTANCE
           ========================================================================== */
        class VehicleInstance {
            constructor(data, isAI = false, aiName = 'AI') {
                this.data = data;
                this.isAI = isAI;
                this.name = aiName;
                this.x = 0;              // Normalized road center offset (-1.0 to +1.0 is main road)
                this.z = 0;              // Position along track length
                this.speed = 0;
                this.lap = 1;
                this.finished = false;
                this.finishTime = 0;
                this.driftAngle = 0;
                this.bounceY = 0;
                
                // Calculated stats with upgrades
                this.maxSpeed = data.baseMaxSpeed;
                this.accel = data.baseAccel;
                this.handling = data.baseHandling;
            }

            applyUpgrades(upgrades) {
                if (!upgrades) return;
                this.maxSpeed = this.data.baseMaxSpeed + (upgrades.speed || 0) * 400;
                this.accel = this.data.baseAccel + (upgrades.accel || 0) * 300;
                this.handling = this.data.baseHandling + (upgrades.handling || 0) * 0.4;
            }

            update(dt, track) {
                const currentSeg = track.getSegment(this.z);

                if (this.isAI) {
                    this.updateAI(dt, currentSeg);
                } else {
                    this.updatePlayer(dt, currentSeg);
                }

                // Obstacle interaction
                this.checkObstacles(currentSeg);

                // Update Z Position
                this.z += this.speed * dt;

                // Track looping & Lap tracking
                if (this.z >= track.trackLength) {
                    this.z -= track.trackLength;
                    this.lap++;
                }

                // Dynamic visual bounce based on speed and offroad
                if (Math.abs(this.x) > 1.0) {
                    this.bounceY = Math.sin(Date.now() * 0.03) * 6;
                } else {
                    this.bounceY = Math.sin(Date.now() * 0.01) * 2;
                }
            }

            updatePlayer(dt, seg) {
                // Acceleration / Braking
                if (INPUT.up) {
                    this.speed += this.accel * dt;
                } else if (INPUT.down) {
                    this.speed -= this.accel * 1.5 * dt;
                } else {
                    // Natural friction deceleration
                    this.speed -= this.accel * 0.4 * dt;
                }

                // Offroad speed reduction (unless monster truck)
                if (Math.abs(this.x) > 1.0) {
                    this.speed *= this.data.offroadDecel;
                }

                // Speed limit capping
                this.speed = Math.max(0, Math.min(this.speed, this.maxSpeed));

                // Steering / Handling
                const speedFactor = (this.speed / this.maxSpeed);
                if (INPUT.left) {
                    this.x -= this.handling * dt * (0.4 + speedFactor * 0.8);
                    this.driftAngle = Math.max(-0.25, this.driftAngle - dt * 2);
                } else if (INPUT.right) {
                    this.x += this.handling * dt * (0.4 + speedFactor * 0.8);
                    this.driftAngle = Math.min(0.25, this.driftAngle + dt * 2);
                } else {
                    this.driftAngle *= 0.85; // Recenter drift
                }

                // Centrifugal force pull from track curves
                this.x -= seg.curve * 0.0003 * (this.speed / 1000);
            }

            updateAI(dt, seg) {
                // AI Speed regulation
                const targetSpeed = this.maxSpeed * (0.88 + (seg.curve ? 0.05 : 0.12));
                if (this.speed < targetSpeed) {
                    this.speed += this.accel * dt * 0.8;
                } else {
                    this.speed -= this.accel * dt * 0.5;
                }

                // Waypoint Steering logic
                let targetX = seg.curve * 0.1; // Smooth curve leaning
                if (this.x < targetX) this.x += this.handling * dt * 0.5;
                if (this.x > targetX) this.x -= this.handling * dt * 0.5;

                // Drift representation
                this.driftAngle = (targetX - this.x) * 0.2;
            }

            checkObstacles(seg) {
                if (!seg.obstacles) return;
                for (let obs of seg.obstacles) {
                    // Check horizontal offset collision
                    if (Math.abs(this.x - obs.offset) < 0.25) {
                        if (obs.type === 'rock') {
                            this.speed *= 0.6; // Heavy hit deceleration
                        } else if (obs.type === 'mud' || obs.type === 'water') {
                            this.speed *= 0.85; // Soft puddle hit
                        }
                    }

                    // Update moving obstacles
                    if (obs.moving) {
                        obs.offset += obs.moveDir * obs.moveSpeed;
                        if (Math.abs(obs.offset) > 0.9) obs.moveDir *= -1;
                    }
                }
            }
        }

        /* ==========================================================================
           7. 2.5D CAMERA & CANVAS RENDERER
           ========================================================================== */
        class Render2D {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            // Project 3D World coordinates into 2D Canvas Screen space
            project(p, cameraX, cameraY, cameraZ, cameraDepth, roadWidth) {
                p.camera.x = (p.world.x || 0) - cameraX;
                p.camera.y = (p.world.y || 0) - cameraY;
                p.camera.z = (p.world.z || 0) - cameraZ;

                const scale = cameraDepth / p.camera.z;
                p.screen.x = Math.round((this.canvas.width / 2) + (scale * p.camera.x * this.canvas.width / 2));
                p.screen.y = Math.round((this.canvas.height / 2) - (scale * p.camera.y * this.canvas.height / 2));
                p.screen.w = Math.round(scale * roadWidth * this.canvas.width / 2);
            }

            render(player, racers, track, theme) {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // 1. Draw Sky & Horizon Background
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.5);
                skyGrad.addColorStop(0, theme.skyGradient[0]);
                skyGrad.addColorStop(1, theme.skyGradient[1]);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, width, height);

                // Sun / Light orb
                ctx.fillStyle = theme.sunColor;
                ctx.beginPath();
                ctx.arc(width * 0.7, height * 0.2, 50, 0, Math.PI * 2);
                ctx.fill();

                // 2. Render Road Segments back-to-front
                const playerSeg = track.getSegment(player.z);
                const baseSeg = track.getSegment(player.z);
                let maxy = height;
                let x = 0;
                let dx = - (playerSeg.curve * 0.02);

                const cameraX = player.x * CONFIG.ROAD_WIDTH;
                const cameraY = playerSeg.p1.world.y + CONFIG.CAMERA_HEIGHT;
                const cameraZ = player.z;

                const drawDistance = 200;

                for (let n = 0; n < drawDistance; n++) {
                    const segmentIndex = (baseSeg.index + n) % track.segments.length;
                    const seg = track.segments[segmentIndex];

                    // Loop track z wrap around adjustment
                    const loopZ = (baseSeg.index + n >= track.segments.length) ? track.trackLength : 0;

                    this.project(seg.p1, cameraX - x, cameraY, cameraZ - loopZ, CONFIG.CAMERA_DEPTH, CONFIG.ROAD_WIDTH);
                    this.project(seg.p2, cameraX - x - dx, cameraY, cameraZ - loopZ, CONFIG.CAMERA_DEPTH, CONFIG.ROAD_WIDTH);

                    x += dx;
                    dx += seg.curve;

                    if (seg.p1.camera.z <= CONFIG.CAMERA_DEPTH || seg.p2.screen.y >= maxy) {
                        continue;
                    }

                    // Render Terrain & Road Polygon
                    this.drawSegmentPolygon(ctx, width, maxy, seg, theme);
                    maxy = seg.p2.screen.y;
                }

                // 3. Render Sprites, Obstacles, & AI Racers from back to front
                for (let n = drawDistance - 1; n >= 0; n--) {
                    const segmentIndex = (baseSeg.index + n) % track.segments.length;
                    const seg = track.segments[segmentIndex];

                    // Draw roadside decorations & obstacles
                    this.drawSegmentObjects(ctx, seg);

                    // Draw AI Racers on this segment
                    for (let racer of racers) {
                        if (racer.isAI && track.getSegment(racer.z).index === seg.index) {
                            this.drawRacerVehicle(ctx, racer, seg);
                        }
                    }
                }

                // 4. Render Player Vehicle in foreground
                this.drawPlayerVehicle(ctx, player);
            }

            drawSegmentPolygon(ctx, width, maxy, seg, theme) {
                const p1 = seg.p1.screen;
                const p2 = seg.p2.screen;

                // Grass Ground
                ctx.fillStyle = (seg.color === 'dark') ? theme.grassColor1 : theme.grassColor2;
                ctx.fillRect(0, p2.y, width, p1.y - p2.y);

                // Shortcut highlight terrain
                if (seg.isShortcut) {
                    ctx.fillStyle = 'rgba(245, 158, 11, 0.2)'; // Amber shortcut glow
                    ctx.fillRect(0, p2.y, width, p1.y - p2.y);
                }

                // Rumble Strip Curb
                const rumbleWidth1 = p1.w * 0.15;
                const rumbleWidth2 = p2.w * 0.15;
                ctx.fillStyle = (seg.color === 'dark') ? theme.rumbleColor1 : theme.rumbleColor2;
                
                // Left Rumble
                this.drawQuad(ctx, p1.x - p1.w - rumbleWidth1, p1.y, p1.x - p1.w, p1.y, p2.x - p2.w, p2.y, p2.x - p2.w - rumbleWidth2, p2.y);
                // Right Rumble
                this.drawQuad(ctx, p1.x + p1.w, p1.y, p1.x + p1.w + rumbleWidth1, p1.y, p2.x + p2.w + rumbleWidth2, p2.y, p2.x + p2.w, p2.y);

                // Road Surface
                ctx.fillStyle = seg.isShortcut ? '#1e293b' : theme.roadColor;
                this.drawQuad(ctx, p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y);

                // Center Lane Divider
                if (seg.color === 'dark' && !seg.isShortcut) {
                    const lineW1 = p1.w * 0.03;
                    const lineW2 = p2.w * 0.03;
                    ctx.fillStyle = '#ffffff';
                    this.drawQuad(ctx, p1.x - lineW1, p1.y, p1.x + lineW1, p1.y, p2.x + lineW2, p2.y, p2.x - lineW2, p2.y);
                }
            }

            drawQuad(ctx, x1, y1, x2, y2, x3, y3, x4, y4) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineTo(x3, y3);
                ctx.lineTo(x4, y4);
                ctx.closePath();
                ctx.fill();
            }

            drawSegmentObjects(ctx, seg) {
                const p1 = seg.p1.screen;
                const scale = p1.w / CONFIG.ROAD_WIDTH;

                // Draw Scenery (Trees / Rocks)
                for (let sprite of seg.sprites) {
                    const spriteX = p1.x + (sprite.offset * p1.w);
                    const spriteY = p1.y;
                    const size = Math.max(10, 120 * scale * 2);

                    ctx.save();
                    ctx.translate(spriteX, spriteY);
                    
                    if (sprite.type === 'tree') {
                        // Green Tree SVG / Canvas Draw
                        ctx.fillStyle = '#15803d';
                        ctx.beginPath();
                        ctx.moveTo(0, -size);
                        ctx.lineTo(-size * 0.4, 0);
                        ctx.lineTo(size * 0.4, 0);
                        ctx.fill();
                        ctx.fillStyle = '#78350f';
                        ctx.fillRect(-size * 0.08, 0, size * 0.16, size * 0.2);
                    } else if (sprite.type === 'snowTree') {
                        ctx.fillStyle = '#e2e8f0';
                        ctx.beginPath();
                        ctx.moveTo(0, -size);
                        ctx.lineTo(-size * 0.4, 0);
                        ctx.lineTo(size * 0.4, 0);
                        ctx.fill();
                    } else { // Rock
                        ctx.fillStyle = '#64748b';
                        ctx.beginPath();
                        ctx.arc(0, -size * 0.2, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Draw On-Road Hazards / Obstacles
                for (let obs of seg.obstacles) {
                    const obsX = p1.x + (obs.offset * p1.w);
                    const obsY = p1.y;
                    const size = Math.max(8, 60 * scale);

                    ctx.save();
                    ctx.translate(obsX, obsY);

                    if (obs.type === 'rock') {
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(-size * 0.5, -size * 0.5, size, size * 0.7);
                    } else if (obs.type === 'mud') {
                        ctx.fillStyle = '#78350f';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, size * 0.8, size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (obs.type === 'water') {
                        ctx.fillStyle = '#38bdf8';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, size * 0.8, size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            drawRacerVehicle(ctx, racer, seg) {
                const p1 = seg.p1.screen;
                const scale = p1.w / CONFIG.ROAD_WIDTH;
                const racerX = p1.x + (racer.x * p1.w);
                const racerY = p1.y + racer.bounceY;
                const width = Math.max(12, 110 * scale);
                const height = width * 0.6;

                ctx.save();
                ctx.translate(racerX, racerY);
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(0, 0, width * 0.5, height * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Vehicle Body
                ctx.fillStyle = racer.data.color;
                ctx.fillRect(-width * 0.5, -height, width, height * 0.8);

                // AI Indicator Label
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(racer.name, 0, -height - 6);

                ctx.restore();
            }

            drawPlayerVehicle(ctx, player) {
                const width = this.canvas.width;
                const height = this.canvas.height;

                const screenX = width * 0.5 + (player.driftAngle * 100);
                const screenY = height * 0.82 + player.bounceY;
                const carWidth = Math.min(width * 0.22, 180);
                const carHeight = carWidth * 0.55;

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(player.driftAngle * 0.5);

                // Tire Dust / Exhaust Particles when accelerating
                if (player.speed > 500) {
                    ctx.fillStyle = 'rgba(200, 200, 200, 0.4)';
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(-carWidth * 0.4 + (Math.random() - 0.5) * 20, carHeight * 0.2 + Math.random() * 10, 6 + Math.random() * 8, 0, Math.PI * 2);
                        ctx.arc(carWidth * 0.4 + (Math.random() - 0.5) * 20, carHeight * 0.2 + Math.random() * 10, 6 + Math.random() * 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Vehicle Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.ellipse(0, carHeight * 0.1, carWidth * 0.52, carHeight * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Detailed Custom Car Rendering
                // Tires
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-carWidth * 0.48, -carHeight * 0.3, carWidth * 0.18, carHeight * 0.45);
                ctx.fillRect(carWidth * 0.30, -carHeight * 0.3, carWidth * 0.18, carHeight * 0.45);

                // Main Body Frame
                ctx.fillStyle = player.data.color;
                ctx.beginPath();
                ctx.roundRect(-carWidth * 0.42, -carHeight * 0.8, carWidth * 0.84, carHeight * 0.8, 12);
                ctx.fill();

                // Secondary Accent stripe
                ctx.fillStyle = player.data.secondaryColor;
                ctx.fillRect(-carWidth * 0.1, -carHeight * 0.8, carWidth * 0.2, carHeight * 0.8);

                // Windshield / Cabin Glass
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.roundRect(-carWidth * 0.3, -carHeight * 0.72, carWidth * 0.6, carHeight * 0.38, 6);
                ctx.fill();

                // Tail Lights Glow
                ctx.fillStyle = player.speed > 0 ? '#ef4444' : '#991b1b';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = player.speed > 0 ? 12 : 2;
                ctx.fillRect(-carWidth * 0.38, -carHeight * 0.22, carWidth * 0.15, carHeight * 0.12);
                ctx.fillRect(carWidth * 0.23, -carHeight * 0.22, carWidth * 0.15, carHeight * 0.12);

                ctx.restore();
            }
        }

        /* ==========================================================================
           8. RACE SYSTEM & GAME STATE MANAGER
           ========================================================================== */
        class GameManager {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.renderer = new Render2D(this.canvas);
                this.trackManager = new TrackManager();
                
                this.state = 'MENU'; // MENU, VEHICLE, TRACK, COUNTDOWN, RACING, RESULT
                this.selectedAtmosphere = 'realistic';
                this.selectedTrackId = 'forest';
                
                this.player = null;
                this.racers = [];
                this.raceStartTime = 0;
                this.elapsedTime = 0;
                this.countdownVal = 3;

                INPUT.init();
                this.setupUI();
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            setupUI() {
                this.updateVehicleUI();
                this.updateTrackUI();
            }

            setAtmosphere(key) {
                this.selectedAtmosphere = key;
                showScreen('screen-vehicle');
                this.updateVehicleUI();
            }

            updateVehicleUI() {
                document.getElementById('display-gold').textContent = `${SAVE_STATE.gold} G`;

                const container = document.getElementById('vehicle-list');
                container.innerHTML = '';

                Object.values(VEHICLES).forEach(v => {
                    const isUnlocked = SAVE_STATE.unlockedVehicles.includes(v.id);
                    const isSelected = SAVE_STATE.selectedVehicle === v.id;

                    const card = document.createElement('div');
                    card.className = `p-3 rounded-xl border cursor-pointer transition flex flex-col items-center justify-between text-center ${
                        isSelected ? 'border-cyan-400 bg-cyan-950/40 ring-2 ring-cyan-400' : 'border-slate-700 bg-slate-800/60 hover:bg-slate-800'
                    }`;
                    card.onclick = () => {
                        SAVE_STATE.selectedVehicle = v.id;
                        SAVE_STATE.save();
                        this.updateVehicleUI();
                    };

                    card.innerHTML = `
                        <div class="text-3xl mb-1">${v.icon}</div>
                        <div class="font-bold text-xs text-slate-200 mb-1">${v.type}</div>
                        <div class="text-xs ${isUnlocked ? 'text-emerald-400' : 'text-amber-400'}">
                            ${isUnlocked ? '보유중' : `${v.price} G`}
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Update selected stats panel
                const selected = VEHICLES[SAVE_STATE.selectedVehicle];
                const upgrades = SAVE_STATE.upgrades[selected.id] || { speed: 0, accel: 0, handling: 0 };
                
                document.getElementById('selected-vehicle-name').textContent = selected.name;

                const isUnlocked = SAVE_STATE.unlockedVehicles.includes(selected.id);
                const unlockBtn = document.getElementById('btn-unlock');
                if (!isUnlocked) {
                    unlockBtn.classList.remove('hidden');
                    unlockBtn.textContent = `해금 (${selected.price} G)`;
                } else {
                    unlockBtn.classList.add('hidden');
                }

                // Bar fill calculations
                const speedVal = selected.baseMaxSpeed + upgrades.speed * 400;
                const accelVal = selected.baseAccel + upgrades.accel * 300;
                const handlingVal = selected.baseHandling + upgrades.handling * 0.4;

                document.getElementById('stat-speed-val').textContent = `${Math.round(speedVal / 100)}`;
                document.getElementById('stat-speed-bar').style.width = `${Math.min(100, (speedVal / 13000) * 100)}%`;

                document.getElementById('stat-accel-val').textContent = `${Math.round(accelVal / 50)}`;
                document.getElementById('stat-accel-bar').style.width = `${Math.min(100, (accelVal / 6000) * 100)}%`;

                document.getElementById('stat-handling-val').textContent = `${handlingVal.toFixed(1)}`;
                document.getElementById('stat-handling-bar').style.width = `${Math.min(100, (handlingVal / 5.0) * 100)}%`;
            }

            unlockVehicle() {
                const selected = VEHICLES[SAVE_STATE.selectedVehicle];
                if (SAVE_STATE.gold >= selected.price) {
                    SAVE_STATE.gold -= selected.price;
                    SAVE_STATE.unlockedVehicles.push(selected.id);
                    SAVE_STATE.save();
                    this.updateVehicleUI();
                } else {
                    alert('골드가 부족합니다!');
                }
            }

            upgradeStat(type) {
                const vehicleId = SAVE_STATE.selectedVehicle;
                if (!SAVE_STATE.unlockedVehicles.includes(vehicleId)) {
                    alert('먼저 차량을 해금해야 합니다!');
                    return;
                }

                const cost = 50;
                if (SAVE_STATE.gold >= cost) {
                    SAVE_STATE.gold -= cost;
                    SAVE_STATE.upgrades[vehicleId][type] = (SAVE_STATE.upgrades[vehicleId][type] || 0) + 1;
                    SAVE_STATE.save();
                    this.updateVehicleUI();
                } else {
                    alert('업그레이드 골드가 부족합니다!');
                }
            }

            updateTrackUI() {
                const container = document.getElementById('track-list');
                container.innerHTML = '';

                TRACK_PRESETS.forEach(t => {
                    const isSelected = this.selectedTrackId === t.id;
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border cursor-pointer transition space-y-2 ${
                        isSelected ? 'border-cyan-400 bg-cyan-950/40 ring-2 ring-cyan-400' : 'border-slate-700 bg-slate-800/60 hover:bg-slate-800'
                    }`;
                    card.onclick = () => {
                        this.selectedTrackId = t.id;
                        this.updateTrackUI();
                    };

                    card.innerHTML = `
                        <div class="font-bold text-lg text-cyan-300">${t.name}</div>
                        <div class="text-xs text-slate-300">${t.description}</div>
                        <div class="text-xs text-amber-400 font-bold">LAPS: ${t.laps}</div>
                    `;
                    container.appendChild(card);
                });
            }

            startRace() {
                // Build Selected Track
                this.trackManager.buildTrack(this.selectedTrackId);

                // Create Player Vehicle
                const vData = VEHICLES[SAVE_STATE.selectedVehicle];
                this.player = new VehicleInstance(vData, false, 'PLAYER');
                this.player.applyUpgrades(SAVE_STATE.upgrades[vData.id]);

                // Create AI Racers
                this.racers = [this.player];
                const aiNames = ['AI RIVAL 1', 'AI SPEEDY', 'AI NITRO', 'AI BUSTER'];
                const aiTypes = ['sportsCar', 'motorbike', 'kart', 'monsterTruck'];

                for (let i = 0; i < 4; i++) {
                    const aiVehicle = new VehicleInstance(VEHICLES[aiTypes[i]], true, aiNames[i]);
                    aiVehicle.z = - (i + 1) * 300; // Staggered starting line grid
                    aiVehicle.x = (i % 2 === 0 ? -0.4 : 0.4);
                    this.racers.push(aiVehicle);
                }

                // Switch UI to HUD
                showScreen('hud');
                document.getElementById('hud-total-laps').textContent = TRACK_PRESETS.find(t => t.id === this.selectedTrackId).laps;

                // Start Countdown
                this.state = 'COUNTDOWN';
                this.countdownVal = 3;
                const countdownEl = document.getElementById('hud-countdown');
                const textEl = document.getElementById('countdown-text');
                countdownEl.classList.remove('hidden');

                const countInterval = setInterval(() => {
                    this.countdownVal--;
                    if (this.countdownVal > 0) {
                        textEl.textContent = this.countdownVal;
                    } else if (this.countdownVal === 0) {
                        textEl.textContent = 'GO!';
                    } else {
                        clearInterval(countInterval);
                        countdownEl.classList.add('hidden');
                        this.state = 'RACING';
                        this.raceStartTime = Date.now();
                    }
                }, 1000);
            }

            update(dt) {
                if (this.state !== 'RACING' && this.state !== 'COUNTDOWN') return;

                // Update Racers Physics
                if (this.state === 'RACING') {
                    this.elapsedTime = Date.now() - this.raceStartTime;
                }

                const targetLaps = TRACK_PRESETS.find(t => t.id === this.selectedTrackId).laps;

                for (let racer of this.racers) {
                    if (!racer.finished) {
                        racer.update(dt, this.trackManager);

                        // Check Finish Condition
                        if (racer.lap > targetLaps) {
                            racer.finished = true;
                            racer.finishTime = this.elapsedTime;

                            if (racer === this.player) {
                                this.finishRace();
                            }
                        }
                    }
                }

                // Sort Ranks by Lap & Z position
                this.racers.sort((a, b) => {
                    if (a.lap !== b.lap) return b.lap - a.lap;
                    return b.z - a.z;
                });

                // Update HUD Displays
                const rankIndex = this.racers.indexOf(this.player) + 1;
                const rankSuffix = ['st', 'nd', 'rd', 'th', 'th'][rankIndex - 1] || 'th';
                document.getElementById('hud-rank').textContent = `${rankIndex}${rankSuffix}`;
                document.getElementById('hud-lap').textContent = Math.min(this.player.lap, targetLaps);
                document.getElementById('hud-speed').textContent = Math.round(this.player.speed / 80);

                // HUD Progress Bar
                const totalProgress = ((this.player.lap - 1) * this.trackManager.trackLength + this.player.z) / (targetLaps * this.trackManager.trackLength);
                document.getElementById('hud-progress-bar').style.width = `${Math.min(100, Math.max(0, totalProgress * 100))}%`;

                // HUD Timer
                const ms = Math.floor((this.elapsedTime % 1000) / 10);
                const sec = Math.floor((this.elapsedTime / 1000) % 60);
                const min = Math.floor(this.elapsedTime / 60000);
                document.getElementById('hud-time').textContent = 
                    `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;

                // Shortcut Notice HUD
                const currentSeg = this.trackManager.getSegment(this.player.z);
                const shortcutNotice = document.getElementById('hud-shortcut-indicator');
                if (currentSeg.isShortcut) {
                    shortcutNotice.classList.remove('hidden');
                } else {
                    shortcutNotice.classList.add('hidden');
                }
            }

            finishRace() {
                this.state = 'RESULT';
                const rankIndex = this.racers.indexOf(this.player) + 1;
                
                // Reward Calculation
                let earnedGold = 100;
                let earnedScore = 200;
                if (rankIndex === 1) { earnedGold = 300; earnedScore = 1000; }
                else if (rankIndex === 2) { earnedGold = 200; earnedScore = 600; }
                else if (rankIndex === 3) { earnedGold = 150; earnedScore = 400; }

                SAVE_STATE.gold += earnedGold;
                SAVE_STATE.score += earnedScore;
                SAVE_STATE.save();

                // Fill Result UI
                document.getElementById('result-rank').textContent = `${rankIndex} 위`;
                document.getElementById('result-time').textContent = document.getElementById('hud-time').textContent;
                document.getElementById('result-score').textContent = `+${earnedScore} PTS`;
                document.getElementById('result-gold').textContent = `+${earnedGold} G`;

                showScreen('screen-result');
            }

            loop() {
                const dt = 1 / CONFIG.FPS;
                this.update(dt);

                if (this.player) {
                    const theme = ATMOSPHERES[this.selectedAtmosphere];
                    this.renderer.render(this.player, this.racers, this.trackManager, theme);
                }

                requestAnimationFrame(this.loop);
            }
        }

        /* ==========================================================================
           9. UI SCREEN SWITCHING HELPERS
           ========================================================================== */
        function showScreen(screenId) {
            const screens = ['screen-atmosphere', 'screen-vehicle', 'screen-track', 'hud', 'screen-result'];
            screens.forEach(s => {
                const el = document.getElementById(s);
                if (el) {
                    if (s === screenId) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                }
            });
        }

        let game;
        window.onload = () => {
            game = new GameManager();
        };

        function selectAtmosphere(key) { game.setAtmosphere(key); }
        function goToTrackSelect() { 
            if (!SAVE_STATE.unlockedVehicles.includes(SAVE_STATE.selectedVehicle)) {
                alert('선택된 차량을 먼저 해금하세요!');
                return;
            }
            showScreen('screen-track'); 
        }
        function unlockVehicle() { game.unlockVehicle(); }
        function upgradeStat(type) { game.upgradeStat(type); }
        function startRace() { game.startRace(); }
        function restartRace() { game.startRace(); }
    </script>
</body>
</html>
