if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        const [tl, tr, br, bl] = r;
        this.beginPath();
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
        return this;
    };
}

let canvas, ctx;

const audio = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    },
    playClick() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
    },
    playHeartSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    },
    playChime() {
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.08);
            osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
        });
    }
};

function loadAllCharacterSprites() {
    ['normal', 'smile', 'blush', 'surprised'].forEach(exp => {
        characterSpriteCache[exp] = [];
        for (let i = 0; i < 5; i++) {
            characterSpriteCache[exp][i] = createCharacterSVGData(i, exp);
        }
    });
}

function drawBackground(bgType) {
    const W = CONFIG.CANVAS_WIDTH;
    const H = CONFIG.CANVAS_HEIGHT;

    ctx.save();
    switch (bgType) {
        case 'title': {
            const grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#2c001e');
            grad.addColorStop(0.5, '#581845');
            grad.addColorStop(1, '#0f0015');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            break;
        }
        case 'gym': {
            ctx.fillStyle = '#1e272c';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#d35400';
            ctx.fillRect(0, H - 180, W, 180);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(W / 2, H - 90, 80, 0, Math.PI * 2);
            ctx.stroke();
            break;
        }
        case 'student_council': {
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(100, 100, W - 200, H - 200);
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(120, 120, W - 240, H - 240);
            break;
        }
        case 'rooftop': {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#ff7e5f');
            grad.addColorStop(1, '#feb47b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(0, H - 120, W, 120);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 6;
            for (let x = 0; x < W; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, H - 120); ctx.lineTo(x, H - 220); ctx.stroke();
            }
            break;
        }
        case 'library': {
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#5d4037';
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(50 + i * 200, 80, 150, H - 160);
            }
            break;
        }
        case 'study_room': {
            ctx.fillStyle = '#1a252f';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, H - 160, W, 160);
            break;
        }
        case 'cafe': {
            ctx.fillStyle = '#4a235a';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#f5eef8';
            ctx.fillRect(0, H - 150, W, 150);
            break;
        }
        case 'park': {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#a1c4fd');
            grad.addColorStop(1, '#c2e9fb');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, H - 140, W, 140);
            break;
        }
        default: {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1a1c20');
            grad.addColorStop(1, '#0f1012');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            break;
        }
    }
    ctx.restore();
}

function drawCharacterSprite(charIdx, expression, x, y, scale = 1.0) {
    const img = characterSpriteCache[expression]?.[charIdx] || characterSpriteCache['normal'][charIdx];
    if (img && img.complete) {
        const w = 300 * scale;
        const h = 400 * scale;
        ctx.drawImage(img, x - w / 2, y - h, w, h);
    }
}

function initCanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    canvas.width = CONFIG.CANVAS_WIDTH;
    canvas.height = CONFIG.CANVAS_HEIGHT;

    for (let i = 0; i < 35; i++) {
        GAME_STATE.particles.push({
            x: Math.random() * CONFIG.CANVAS_WIDTH,
            y: Math.random() * CONFIG.CANVAS_HEIGHT,
            radius: Math.random() * 4 + 2,
            vy: Math.random() * 1.2 + 0.5,
            vx: Math.random() * 0.8 - 0.4,
            alpha: Math.random() * 0.6 + 0.3
        });
    }
}

function updateParticles() {
    GAME_STATE.particles.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        if (p.y > CONFIG.CANVAS_HEIGHT) {
            p.y = -10;
            p.x = Math.random() * CONFIG.CANVAS_WIDTH;
        }
    });
}

function drawParticles() {
    ctx.save();
    GAME_STATE.particles.forEach(p => {
        ctx.fillStyle = `rgba(255, 182, 193, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();
}

function renderUI() {
    ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    drawBackground(GAME_STATE.currentBG);
    updateParticles();
    drawParticles();

    switch (GAME_STATE.screen) {
        case 'TITLE':
            drawTitleScreen();
            break;
        case 'CHARACTER_SELECT':
            drawCharacterSelectScreen();
            break;
        case 'STORY':
            drawStoryScreen();
            drawHUD();
            break;
        case 'DATE_SELECT':
            drawDateSelectScreen();
            drawHUD();
            break;
        case 'CONFESSION_SELECT':
            drawConfessionSelectScreen();
            break;
        case 'ENDING':
            drawEndingScreen();
            break;
        case 'STATUS_MODAL':
            drawStoryScreen();
            drawStatusModal();
            break;
        case 'GALLERY_MODAL':
            drawStoryScreen();
            drawGalleryModal();
            break;
    }

    if (GAME_STATE.notificationTimer > 0) {
        GAME_STATE.notificationTimer--;
        ctx.save();
        ctx.fillStyle = 'rgba(255, 51, 102, 0.92)';
        ctx.beginPath();
        ctx.roundRect(CONFIG.CANVAS_WIDTH / 2 - 200, 20, 400, 45, 22);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(GAME_STATE.notification, CONFIG.CANVAS_WIDTH / 2, 48);
        ctx.restore();
    }
}

function drawStoryScreen() {
    const W = CONFIG.CANVAS_WIDTH;
    const H = CONFIG.CANVAS_HEIGHT;

    if (GAME_STATE.selectedCharacter !== null && GAME_STATE.selectedCharacter !== undefined) {
        drawCharacterSprite(
            GAME_STATE.selectedCharacter,
            GAME_STATE.currentExpression || 'normal',
            W / 2,
            H - 120,
            1.25
        );
    }

    const boxX = 60;
    const boxY = H - 200;
    const boxW = W - 120;
    const boxH = 170;

    ctx.save();
    ctx.fillStyle = 'rgba(15, 10, 25, 0.92)';
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, 16);
    ctx.fill();

    ctx.strokeStyle = '#ff69b4';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    if (GAME_STATE.currentSpeaker) {
        const charObj = CHARACTERS.find(c => c.name === GAME_STATE.currentSpeaker);
        const tagColor = charObj ? charObj.themeColor : '#ff3366';

        ctx.fillStyle = tagColor;
        ctx.beginPath();
        ctx.roundRect(boxX + 25, boxY - 20, 160, 40, 10);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(GAME_STATE.currentSpeaker, boxX + 105, boxY + 6);
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px "Gowun Dodum", sans-serif';
    ctx.textAlign = 'left';

    const text = GAME_STATE.typedText || '';
    const maxTextWidth = boxW - 60;
    let line = '';
    let startY = boxY + 50;

    for (let n = 0; n < text.length; n++) {
        const testLine = line + text[n];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxTextWidth && n > 0) {
            ctx.fillText(line, boxX + 30, startY);
            line = text[n];
            startY += 32;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, boxX + 30, startY);

    if (!GAME_STATE.isTyping && (!GAME_STATE.choices || GAME_STATE.choices.length === 0)) {
        ctx.fillStyle = '#ff69b4';
        ctx.font = 'bold 20px sans-serif';
        const floatY = boxY + boxH - 25 + Math.sin(Date.now() / 150) * 4;
        ctx.fillText('▼', boxX + boxW - 40, floatY);
    }

    if (GAME_STATE.choices && GAME_STATE.choices.length > 0 && !GAME_STATE.isTyping) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(0, 0, W, H);

        GAME_STATE.choices.forEach((choice, idx) => {
            const cW = 640;
            const cH = 54;
            const cX = W / 2 - cW / 2;
            const cY = 180 + idx * 70;

            const grad = ctx.createLinearGradient(cX, cY, cX + cW, cY + cH);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(1, '#fff0f5');

            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(255, 51, 102, 0.4)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(cX, cY, cW, cH, 27);
            ctx.fill();

            ctx.strokeStyle = '#ff3366';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff1493';
            ctx.font = 'bold 18px "Gowun Dodum", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(choice.text, W / 2, cY + 34);
        });
    }

    ctx.restore();
}

        ctx.font = '18px "Gowun Dodum", sans-serif';
        ctx.fillText(`"${char.name}도 사실 당신을 오랫동안 진심으로 좋아하고 있었습니다!"`, W / 2, H - 142);
        ctx.fillText('서로의 진심을 확인한 두 사람은 달콤한 연인이 되었습니다.', W / 2, H - 110);
    } else {
        drawCharacterSprite(GAME_STATE.selectedCharacter, 'normal', W / 2, H - 70, 1.4);

        ctx.fillStyle = 'rgba(15, 10, 25, 0.94)';
        ctx.fillRect(W / 2 - 380, H - 230, 760, 160);
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 380, H - 230, 760, 160);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px "Gowun Batang", serif';
        ctx.fillText(`NORMAL ENDING: 아쉬운 마음`, W / 2, H - 180);

        ctx.fillStyle = '#ffccd5';
        ctx.font = '16px "Gowun Dodum", sans-serif';
        ctx.fillText(`${char.name}와의 호감도가 연인이 되기엔 조금 아쉬웠습니다.`, W / 2, H - 142);

        const secretChar = CHARACTERS[GAME_STATE.secretAdmirer];
        ctx.fillStyle = '#ffe66d';
        ctx.fillText(`★ 참고: 당신을 비밀리에 짝사랑하던 남학생은 [${secretChar.name}] 이었습니다!`, W / 2, H - 105);
    }

    const reBtnX = W / 2 - 130;
    const reBtnY = H - 55;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(reBtnX, reBtnY, 260, 48, 24);
    ctx.fill();
    ctx.strokeStyle = '#ff3366';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ff3366';
    ctx.font = 'bold 18px "Gowun Batang", serif';
    ctx.fillText('처음부터 다시 시작 ↺', W / 2, reBtnY + 31);

    ctx.restore();
}

function drawHUD() {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
    ctx.beginPath();
    ctx.roundRect(20, 20, 240, 48, 14);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px "Gowun Dodum", sans-serif';
    ctx.textAlign = 'left';
    const dayStr = GAME_STATE.day <= CONFIG.TOTAL_DAYS ? `DAY ${GAME_STATE.day} / ${CONFIG.TOTAL_DAYS}` : '고백의 날';
    ctx.fillText(`📅 ${dayStr} [${getKoreanTimeOfDay(GAME_STATE.timeOfDay)}]`, 35, 50);

    const statusBtnX = CONFIG.CANVAS_WIDTH - 210;
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.roundRect(statusBtnX, 20, 90, 44, 12);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px "Gowun Dodum", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('♥ 호감도', statusBtnX + 45, 47);

    const galleryBtnX = CONFIG.CANVAS_WIDTH - 110;
    ctx.fillStyle = '#9b59b6';
    ctx.beginPath();
    ctx.roundRect(galleryBtnX, 20, 90, 44, 12);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px "Gowun Dodum", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🖼 갤러리', galleryBtnX + 45, 47);

    ctx.restore();
}

function getKoreanTimeOfDay(time) {
    switch (time) {
        case 'MORNING': return '아침';
        case 'SCHOOL': return '학교생활';
        case 'AFTER_SCHOOL': return '방과 후';
        case 'DATE': return '데이트';
        case 'EVENING': return '귀가';
        default: return '진행 중';
    }
}

function drawStatusModal() {
    const W = CONFIG.CANVAS_WIDTH;
    const H = CONFIG.CANVAS_HEIGHT;

    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, W, H);

    const mX = W / 2 - 300;
    const mY = H / 2 - 220;
    const mW = 600;
    const mH = 440;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(mX, mY, mW, mH, 20);
    ctx.fill();

    ctx.fillStyle = '#ff3366';
    ctx.font = 'bold 24px "Gowun Batang", serif';
    ctx.textAlign = 'center';
    ctx.fillText('♥ 캐릭터별 호감도 현황 ♥', W / 2, mY + 45);

    CHARACTERS.forEach((char, idx) => {
        const rowY = mY + 90 + idx * 60;
        const aff = GAME_STATE.affections[idx];
        const isPick = GAME_STATE.favoritePicks.includes(idx);

        ctx.textAlign = 'left';
        ctx.fillStyle = char.themeColor;
        ctx.font = 'bold 18px "Gowun Dodum", sans-serif';
        ctx.fillText(`${char.name} ${isPick ? '★내픽' : ''}`, mX + 40, rowY + 20);

        ctx.fillStyle = '#eee';
        ctx.fillRect(mX + 240, rowY + 5, 240, 22);

        ctx.fillStyle = char.themeColor;
        ctx.fillRect(mX + 240, rowY + 5, (aff / CONFIG.MAX_AFFECTION) * 240, 22);

        ctx.fillStyle = '#333';
        ctx.font = '14px "Gowun Dodum", sans-serif';
        ctx.fillText(`${aff} pt`, mX + 490, rowY + 21);
    });

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(W / 2 - 60, mY + mH - 50, 120, 38, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px "Gowun Dodum", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('닫기', W / 2, mY + mH - 26);

    ctx.restore();
}

function drawGalleryModal() {
    const W = CONFIG.CANVAS_WIDTH;
    const H = CONFIG.CANVAS_HEIGHT;

    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px "Gowun Batang", serif';
    ctx.textAlign = 'center';
    ctx.fillText('🖼 추억의 특별 CG 갤러리', W / 2, 60);

    const cardW = 190;
    const cardH = 260;
    const startX = 80;
    const spacing = 230;

    CHARACTERS.forEach((char, idx) => {
        const x = startX + idx * spacing;
        const y = 130;
        const isUnlocked = GAME_STATE.cgUnlocked[idx];

        ctx.fillStyle = isUnlocked ? '#fff' : '#333';
        ctx.beginPath();
        ctx.roundRect(x, y, cardW, cardH, 14);
        ctx.fill();

        if (isUnlocked) {
            drawCharacterSprite(idx, 'blush', x + cardW / 2, y + cardH - 10, 0.85);
            ctx.fillStyle = char.themeColor;
            ctx.font = 'bold 16px "Gowun Batang", serif';
            ctx.fillText(char.name, x + cardW / 2, y + 30);
        } else {
            ctx.fillStyle = '#888';
            ctx.font = '16px "Gowun Dodum", sans-serif';
            ctx.fillText('🔒 미해금', x + cardW / 2, y + cardH / 2);
            ctx.font = '12px "Gowun Dodum", sans-serif';
            ctx.fillText('고백 성공 시 해금', x + cardW / 2, y + cardH / 2 + 25);
        }
    });

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(W / 2 - 60, H - 70, 120, 40, 10);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.font = 'bold 16px "Gowun Dodum", sans-serif';
    ctx.fillText('닫기', W / 2, H - 44);

    ctx.restore();
}

let typingInterval = null;

function startDialogue(dialogueList, onCompleteCallback = null) {
    GAME_STATE.currentDialogueSequence = dialogueList;
    GAME_STATE.dialogueIndex = 0;
    GAME_STATE.onDialogueComplete = onCompleteCallback;
    showNextDialogue();
}

function showNextDialogue() {
    if (GAME_STATE.dialogueIndex >= GAME_STATE.currentDialogueSequence.length) {
        if (GAME_STATE.onDialogueComplete) {
            GAME_STATE.onDialogueComplete();
        }
        return;
    }

    const item = GAME_STATE.currentDialogueSequence[GAME_STATE.dialogueIndex];
    GAME_STATE.currentSpeaker = item.speaker;
    GAME_STATE.currentExpression = item.expression || 'normal';
    GAME_STATE.choices = item.choices || null;

    const targetText = item.text;
    GAME_STATE.typedText = '';
    GAME_STATE.isTyping = true;
    let charIdx = 0;

    if (typingInterval) clearInterval(typingInterval);

    typingInterval = setInterval(() => {
        if (charIdx < targetText.length) {
            GAME_STATE.typedText += targetText[charIdx];
            charIdx++;
        } else {
            GAME_STATE.isTyping = false;
            clearInterval(typingInterval);
        }
    }, 28);
}

function advanceDialogue() {
    if (GAME_STATE.isTyping) {
        const item = GAME_STATE.currentDialogueSequence[GAME_STATE.dialogueIndex];
        GAME_STATE.typedText = item.text;
        GAME_STATE.isTyping = false;
        if (typingInterval) clearInterval(typingInterval);
        return;
    }

    if (GAME_STATE.choices && GAME_STATE.choices.length > 0) return;

    audio.playClick();
    GAME_STATE.dialogueIndex++;
    showNextDialogue();
}

function triggerNotification(msg) {
    GAME_STATE.notification = msg;
    GAME_STATE.notificationTimer = 120;
}

function startNewGame() {
    GAME_STATE.day = 1;
    GAME_STATE.timeOfDay = 'MORNING';
    GAME_STATE.favoritePicks = [];
    GAME_STATE.secretAdmirer = Math.floor(Math.random() * 5);
    GAME_STATE.affections = [30, 30, 30, 30, 30];
    GAME_STATE.affections[GAME_STATE.secretAdmirer] += 15;

    GAME_STATE.screen = 'CHARACTER_SELECT';
    audio.playChime();
}

function advanceDayCycle() {
    if (GAME_STATE.day >= CONFIG.TOTAL_DAYS) {
        GAME_STATE.screen = 'CONFESSION_SELECT';
        GAME_STATE.currentBG = 'rooftop';
        audio.playChime();
        return;
    }

    GAME_STATE.day++;
    GAME_STATE.timeOfDay = 'MORNING';
    triggerNotification(`☀️ DAY ${GAME_STATE.day} 아침이 밝았습니다!`);
    runMorningSchoolRoutine();
}

function runMorningSchoolRoutine() {
    GAME_STATE.screen = 'STORY';
    GAME_STATE.timeOfDay = 'SCHOOL';

    const targetCharIdx = Math.random() > 0.4 && GAME_STATE.favoritePicks.length > 0
        ? GAME_STATE.favoritePicks[Math.floor(Math.random() * GAME_STATE.favoritePicks.length)]
        : Math.floor(Math.random() * 5);

    GAME_STATE.selectedCharacter = targetCharIdx;
    const eventData = SCHOOL_EVENTS[targetCharIdx];
    GAME_STATE.currentBG = eventData.location;

    const eventDialogues = JSON.parse(JSON.stringify(eventData.dialogues));
    const lastDiag = eventDialogues[eventDialogues.length - 1];
    lastDiag.choices = eventData.choices;

    startDialogue(eventDialogues, () => {
        GAME_STATE.screen = 'DATE_SELECT';
        GAME_STATE.timeOfDay = 'AFTER_SCHOOL';
        GAME_STATE.currentBG = 'hallway';
    });
}

function handleChoiceSelect(choiceIdx) {
    audio.playHeartSound();
    const item = GAME_STATE.currentDialogueSequence[GAME_STATE.dialogueIndex];
    const chosen = item.choices[choiceIdx];

    const randomMod = Math.floor(Math.random() * 6) - 2;
    const delta = chosen.affection + randomMod;
    
    GAME_STATE.affections[GAME_STATE.selectedCharacter] = Math.max(0, Math.min(CONFIG.MAX_AFFECTION, GAME_STATE.affections[GAME_STATE.selectedCharacter] + delta));

    if (delta > 0) {
        triggerNotification(`♥ ${CHARACTERS[GAME_STATE.selectedCharacter].name}의 호감도 상승!`);
    } else {
        triggerNotification(`💔 호감도에 변화가 생겼습니다.`);
    }

    GAME_STATE.choices = null;
    advanceDialogue();
}

function startAfterSchoolDate(charIdx) {
    audio.playClick();
    GAME_STATE.screen = 'STORY';
    GAME_STATE.timeOfDay = 'DATE';
    GAME_STATE.selectedCharacter = charIdx;

    const dateData = DATE_EVENTS[charIdx];
    GAME_STATE.currentBG = dateData.location;

    const dateDialogues = JSON.parse(JSON.stringify(dateData.dialogues));
    const lastDiag = dateDialogues[dateDialogues.length - 1];
    lastDiag.choices = dateData.choices;

    startDialogue(dateDialogues, () => {
        advanceDayCycle();
    });
}

function handleConfession(targetCharIdx) {
    audio.playChime();
    GAME_STATE.selectedCharacter = targetCharIdx;
    
    const isSecretAdmirer = (targetCharIdx === GAME_STATE.secretAdmirer);
    const aff = GAME_STATE.affections[targetCharIdx];

    if (isSecretAdmirer || aff >= CONFIG.PASSING_AFFECTION) {
        GAME_STATE.endingSuccess = true;
    } else {
        GAME_STATE.endingSuccess = false;
    }

    GAME_STATE.screen = 'ENDING';
}

function setupInputListeners() {
    function handlePointer(x, y) {
        audio.init();

        if (['STORY', 'DATE_SELECT', 'CONFESSION_SELECT'].includes(GAME_STATE.screen)) {
            const statusBtnX = CONFIG.CANVAS_WIDTH - 210;
            if (x >= statusBtnX && x <= statusBtnX + 90 && y >= 20 && y <= 64) {
                GAME_STATE.screen = 'STATUS_MODAL';
                audio.playClick();
                return;
            }
            const galleryBtnX = CONFIG.CANVAS_WIDTH - 110;
            if (x >= galleryBtnX && x <= galleryBtnX + 90 && y >= 20 && y <= 64) {
                GAME_STATE.screen = 'GALLERY_MODAL';
                audio.playClick();
                return;
            }
        }

        if (GAME_STATE.screen === 'STATUS_MODAL' || GAME_STATE.screen === 'GALLERY_MODAL') {
            GAME_STATE.screen = 'STORY';
            audio.playClick();
            return;
        }

        if (GAME_STATE.screen === 'TITLE') {
            const btnX = CONFIG.CANVAS_WIDTH / 2 - 180;
            const btnY = CONFIG.CANVAS_HEIGHT / 2 + 100;
            if (x >= btnX && x <= btnX + 360 && y >= btnY && y <= btnY + 75) {
                startNewGame();
            }
            return;
        }

        if (GAME_STATE.screen === 'CHARACTER_SELECT') {
            const cardW = 215;
            const cardH = 460;
            const startX = 55;
            const spacing = 238;

            CHARACTERS.forEach((char, idx) => {
                const cx = startX + idx * spacing;
                const cy = 125;
                if (x >= cx && x <= cx + cardW && y >= cy && y <= cy + cardH) {
                    audio.playClick();
                    if (GAME_STATE.favoritePicks.includes(idx)) {
                        GAME_STATE.favoritePicks = GAME_STATE.favoritePicks.filter(i => i !== idx);
                    } else if (GAME_STATE.favoritePicks.length < 2) {
                        GAME_STATE.favoritePicks.push(idx);
                    }
                }
            });

            if (GAME_STATE.favoritePicks.length === 2) {
                const confirmBtnX = CONFIG.CANVAS_WIDTH / 2 - 160;
                const confirmBtnY = 625;
                if (x >= confirmBtnX && x <= confirmBtnX + 320 && y >= confirmBtnY && y <= confirmBtnY + 55) {
                    audio.playChime();
                    runMorningSchoolRoutine();
                }
            }
            return;
        }

        if (GAME_STATE.screen === 'STORY') {
            if (GAME_STATE.choices && GAME_STATE.choices.length > 0 && !GAME_STATE.isTyping) {
                GAME_STATE.choices.forEach((c, idx) => {
                    const cW = 640;
                    const cH = 54;
                    const cX = CONFIG.CANVAS_WIDTH / 2 - cW / 2;
                    const cY = 180 + idx * 70;
                    if (x >= cX && x <= cX + cW && y >= cY && y <= cY + cH) {
                        handleChoiceSelect(idx);
                    }
                });
            } else {
                advanceDialogue();
            }
            return;
        }

        if (GAME_STATE.screen === 'DATE_SELECT') {
            const cardW = 215;
            const startX = 55;
            const spacing = 238;

            CHARACTERS.forEach((char, idx) => {
                const cx = startX + idx * spacing;
                const btnY = 115 + 390;
                if (x >= cx + 18 && x <= cx + cardW - 18 && y >= btnY && y <= btnY + 42) {
                    startAfterSchoolDate(idx);
                }
            });
            return;
        }

        if (GAME_STATE.screen === 'CONFESSION_SELECT') {
            const cardW = 215;
            const startX = 55;
            const spacing = 238;

            CHARACTERS.forEach((char, idx) => {
                const cx = startX + idx * spacing;
                const btnY = 130 + 345;
                if (x >= cx + 15 && x <= cx + cardW - 15 && y >= btnY && y <= btnY + 52) {
                    handleConfession(idx);
                }
            });
            return;
        }

        if (GAME_STATE.screen === 'ENDING') {
            const reBtnX = CONFIG.CANVAS_WIDTH / 2 - 130;
            const reBtnY = CONFIG.CANVAS_HEIGHT - 55;
            if (x >= reBtnX && x <= reBtnX + 260 && y >= reBtnY && y <= reBtnY + 48) {
                GAME_STATE.screen = 'TITLE';
                audio.playClick();
            }
            return;
        }
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = CONFIG.CANVAS_WIDTH / rect.width;
        const scaleY = CONFIG.CANVAS_HEIGHT / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    canvas.addEventListener('click', (e) => {
        const pos = getCanvasPos(e);
        handlePointer(pos.x, pos.y);
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const pos = getCanvasPos(e);
        handlePointer(pos.x, pos.y);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            audio.init();

            if (GAME_STATE.screen === 'STORY') {
                if (GAME_STATE.choices && GAME_STATE.choices.length > 0 && !GAME_STATE.isTyping) {
                    handleChoiceSelect(0);
                } else {
                    advanceDialogue();
                }
            } else if (GAME_STATE.screen === 'TITLE') {
                startNewGame();
            } else if (GAME_STATE.screen === 'CHARACTER_SELECT' && GAME_STATE.favoritePicks.length === 2) {
                audio.playChime();
                runMorningSchoolRoutine();
            } else if (GAME_STATE.screen === 'ENDING') {
                GAME_STATE.screen = 'TITLE';
                audio.playClick();
            }
        }
    });
}

function gameLoop() {
    renderUI();
    requestAnimationFrame(gameLoop);
}

window.onload = function () {
    loadAllCharacterSprites();
    initCanvas();
    setupInputListeners();
    GAME_STATE.screen = 'TITLE';
    GAME_STATE.currentBG = 'title';
    gameLoop();
};
</script>
