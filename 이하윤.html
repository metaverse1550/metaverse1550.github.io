<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이상한 나라의 사슴 앨리스 - 체스판 잔혹동화</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            background-color: #0b0712;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .font-teko { font-family: 'Teko', sans-serif; }
        
        /* Zombie High Style Glass Panels */
        .zh-panel {
            background: rgba(20, 12, 35, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(236, 72, 153, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        /* Damage and Pop Text */
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1.4); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(0.9); }
        }
        .damage-pop {
            position: absolute;
            font-weight: 900;
            font-family: 'Jua', sans-serif;
            font-size: 2.2rem;
            line-height: 1;
            pointer-events: none;
            animation: floatUp 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            text-shadow: 0 0 10px #000, 2px 2px 0px #000, -2px -2px 0px #000;
        }

        /* Portal Beacon Pulse Effect */
        @keyframes portalPulse {
            0% { box-shadow: 0 0 15px #ec4899, 0 0 30px #3b82f6; }
            50% { box-shadow: 0 0 35px #f43f5e, 0 0 60px #8b5cf6; }
            100% { box-shadow: 0 0 15px #ec4899, 0 0 30px #3b82f6; }
        }
        .portal-active-badge {
            animation: portalPulse 1.5s infinite;
        }

        /* Joystick Styles */
        .joystick-outer {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(244, 114, 182, 0.6);
            box-shadow: inset 0 0 20px rgba(236, 72, 153, 0.3);
        }
        .joystick-inner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, #f472b6 0%, #a855f7 100%);
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.9);
            border: 2px solid #ffffff;
        }

        .btn-skill {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
        }
        .btn-skill:active { transform: scale(0.92); }
    </style>
</head>
<body class="relative w-full h-full select-none overflow-hidden bg-black">

    <!-- 3D Canvas Viewport -->
    <div id="canvasContainer" class="absolute inset-0 w-full h-full"></div>

    <!-- Floating Damage Overlay -->
    <div id="damageOverlay" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>

    <!-- TOP HUD & CONTROLS OVERLAY -->
    <div class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-3 md:p-5">

        <!-- TOP HEADER: Stage Info, Objective & Minimap -->
        <div class="flex justify-between items-start w-full">
            
            <!-- Left: Deer Alice Profile & Companions -->
            <div class="flex items-center gap-3 pointer-events-auto">
                <div class="relative w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-700 p-1 border-2 border-pink-300 shadow-lg">
                    <div class="w-full h-full bg-pink-950 rounded-xl flex items-center justify-center text-2xl font-bold text-pink-200">
                        🦌
                    </div>
                    <span id="playerLevelBadge" class="absolute -bottom-1 -right-1 bg-amber-400 text-black text-[10px] font-extrabold px-1.5 rounded-full border border-black">Lv.1</span>
                </div>

                <div class="flex flex-col gap-1">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-extrabold text-pink-300 drop-shadow">사슴 앨리스</span>
                        <span class="bg-purple-900/90 text-purple-200 text-[10px] px-2 py-0.5 rounded-full border border-purple-400 flex items-center gap-1">
                            <span>😺 동료: 체셔캣</span>
                        </span>
                    </div>

                    <!-- HP Bar -->
                    <div class="w-36 md:w-48 bg-gray-900/90 h-4 rounded-full overflow-hidden border border-pink-400/50 p-0.5 relative">
                        <div id="hpBar" class="bg-gradient-to-r from-emerald-400 to-teal-300 h-full w-[100%] rounded-full transition-all duration-200"></div>
                        <span id="hpText" class="absolute inset-0 flex items-center justify-center text-[10px] font-extrabold text-white leading-none">100 / 100</span>
                    </div>

                    <!-- Cheshire Cat Special gauge -->
                    <div class="w-32 md:w-40 bg-gray-900/90 h-2.5 rounded-full overflow-hidden border border-purple-400/50 p-0.5 relative">
                        <div id="catGaugeBar" class="bg-gradient-to-r from-purple-500 to-pink-500 h-full w-[100%] rounded-full transition-all duration-200"></div>
                        <span class="absolute inset-0 flex items-center justify-center text-[8px] font-bold text-pink-100">체셔캣 지원 마법 가동 중</span>
                    </div>
                </div>
            </div>

            <!-- Top Center: Stage Objective & Exit Status Indicator -->
            <div class="flex flex-col items-center">
                <div class="zh-panel px-6 py-2 rounded-2xl flex flex-col items-center border-pink-500/60 shadow-pink-950/50">
                    <div class="flex items-center gap-3">
                        <span id="stageBadge" class="text-sm text-amber-300 font-extrabold">STAGE 1</span>
                        <span class="text-xs text-gray-400">|</span>
                        <span id="gameTimer" class="font-teko text-xl text-pink-400 font-bold leading-none tracking-widest">03:00</span>
                    </div>
                    <!-- Detailed Mission Objective -->
                    <div id="objectiveBox" class="text-[12px] font-bold text-pink-200 mt-1 flex items-center gap-1.5 bg-purple-950/70 px-3 py-1 rounded-xl border border-pink-400/30">
                        <span id="objectiveIcon">⚔️</span>
                        <span id="objectiveText">카드 병정 (0/8) 처치 시 탈출 포탈이 열립니다!</span>
                    </div>
                </div>

                <!-- Portal Notification Banner (When Stage Objective Reached) -->
                <div id="portalNotice" class="hidden mt-2 px-4 py-1.5 rounded-full bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 text-white text-xs font-black shadow-lg border-2 border-amber-300 portal-active-badge flex items-center gap-2">
                    <span>✨ 체스판 끝에 [이상한 나라 탈출 포탈]이 개설되었습니다! 포탈로 이동하세요! ✨</span>
                </div>
            </div>

            <!-- Top Right: Minimap & Kill Score -->
            <div class="flex flex-col items-end gap-2 pointer-events-auto">
                <div class="zh-panel p-1.5 rounded-2xl border-pink-400/40">
                    <div class="relative w-24 h-24 md:w-28 md:h-28 rounded-xl overflow-hidden bg-purple-950/90 border border-pink-500/50">
                        <canvas id="minimapCanvas" width="112" height="112" class="w-full h-full block"></canvas>
                    </div>
                </div>
                <div class="bg-purple-950/80 px-3 py-1 rounded-xl border border-pink-500/40 text-xs font-bold text-pink-300 flex items-center gap-1.5">
                    <span>병정 제압:</span>
                    <span id="killScore" class="text-amber-300 font-extrabold">0 / 8</span>
                </div>
            </div>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="flex justify-between items-end w-full">
            
            <!-- Bottom Left: Virtual Joystick -->
            <div class="pointer-events-auto mb-2 ml-2">
                <div id="joystickOuter" class="joystick-outer relative flex items-center justify-center">
                    <div id="joystickInner" class="joystick-inner absolute"></div>
                </div>
            </div>

            <!-- Bottom Right: Attack & Skills -->
            <div class="flex items-end gap-3 pointer-events-auto mb-2 mr-2">
                
                <!-- Skill 2: Cheshire Cat Smile Beam (체셔캣 미소 광선) -->
                <button id="btnSkill2" class="relative w-14 h-14 rounded-full btn-skill flex flex-col items-center justify-center text-white active:scale-90 transition">
                    <span class="text-xl">😸</span>
                    <span class="text-[9px] font-bold">체셔 광선</span>
                    <span id="cdSkill2" class="absolute inset-0 bg-black/80 rounded-full flex items-center justify-center text-amber-300 font-extrabold text-sm hidden">6</span>
                </button>

                <!-- Skill 1: White Rabbit Time Freeze (시계토끼 시간정지) -->
                <button id="btnSkill1" class="relative w-14 h-14 rounded-full btn-skill flex flex-col items-center justify-center text-white active:scale-90 transition">
                    <span class="text-xl">⏰</span>
                    <span class="text-[9px] font-bold">시간정지</span>
                    <span id="cdSkill1" class="absolute inset-0 bg-black/80 rounded-full flex items-center justify-center text-amber-300 font-extrabold text-sm hidden">4</span>
                </button>

                <!-- Main Attack: Magic Tea Splash (홍차 마법탄) -->
                <button id="btnAttack" class="w-20 h-20 bg-gradient-to-tr from-pink-500 to-rose-400 rounded-full border-4 border-white flex flex-col items-center justify-center text-white shadow-lg shadow-pink-500/50 active:scale-90 transition">
                    <span class="text-3xl">🫖</span>
                    <span class="text-[10px] font-extrabold drop-shadow">홍차 공격</span>
                </button>
            </div>
        </div>
    </div>

    <!-- STAGE CLEAR MODAL -->
    <div id="clearModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-6 text-center">
        <div class="zh-panel p-8 rounded-3xl max-w-md w-full border-pink-400/80 shadow-2xl flex flex-col items-center">
            <div class="text-5xl mb-2">🎉✨</div>
            <h2 class="font-teko text-5xl text-amber-300 font-extrabold tracking-wider mb-1">STAGE CLEAR!</h2>
            <p id="clearStageTitle" class="text-pink-300 font-bold text-lg mb-4">스테이지 1 체스판 길 탈출 성공!</p>
            
            <div class="w-full bg-purple-950/80 p-4 rounded-2xl border border-pink-500/40 text-left text-sm text-gray-200 mb-6 space-y-2">
                <div class="flex justify-between"><span>제압한 카드 병정:</span><span id="clearKills" class="font-bold text-amber-300">8명</span></div>
                <div class="flex justify-between"><span>체셔캣 지원 횟수:</span><span id="clearCatSupport" class="font-bold text-pink-300">12회</span></div>
                <div class="flex justify-between"><span>남은 체력:</span><span id="clearHp" class="font-bold text-emerald-400">100 / 100</span></div>
            </div>

            <button id="btnNextStage" class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:opacity-90 text-white font-extrabold text-xl rounded-2xl shadow-lg shadow-emerald-500/40 transition transform active:scale-95">
                다음 스테이지 진입하기 ➔
            </button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-6 text-center">
        <div class="zh-panel p-8 rounded-3xl max-w-md w-full border-pink-400/80 shadow-2xl flex flex-col items-center">
            <div class="text-5xl mb-2">🥀</div>
            <h2 id="modalTitle" class="font-teko text-5xl text-rose-500 font-extrabold tracking-wider mb-2">탈출 실패...</h2>
            <p id="modalDesc" class="text-gray-200 text-sm mb-6 leading-relaxed">카드 병정들의 포위망에 잡혔습니다. 사슴 앨리스, 체셔캣과 함께 다시 도전해보세요!</p>
            <button id="btnRestart" class="w-full py-3.5 bg-gradient-to-r from-pink-500 via-purple-500 to-pink-500 hover:opacity-90 text-white font-extrabold text-xl rounded-2xl shadow-lg shadow-pink-500/40 transition transform active:scale-95">
                다시 시도하기 💖
            </button>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer for Retro Game Sound Effects
        class SoundFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            
            playShoot() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(550, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
                } catch(e){}
            }

            playCatBeam() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.35);
                } catch(e){}
            }

            playHit() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
                } catch(e){}
            }

            playPortalOpen() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(1000, this.ctx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.6);
                } catch(e){}
            }
        }

        const audio = new SoundFX();

        class AliceGameEngine {
            constructor() {
                this.container = document.getElementById('canvasContainer');
                this.scene = new THREE.Scene();
                
                // Zombie High School Style Isometric Top-Down Camera View
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });

                // Stage & Game State
                this.currentStage = 1;
                this.requiredKills = 8;
                this.kills = 0;
                this.catSupportCount = 0;
                this.playerHp = 100;
                this.maxHp = 100;
                this.gameActive = true;
                this.portalActive = false;

                // Cooldowns & Controls
                this.cd1 = 0;
                this.cd2 = 0;
                this.keys = {};
                this.moveVector = { x: 0, z: 0 };

                // Game Objects
                this.bullets = [];
                this.enemies = [];
                this.decorations = [];
                this.catMagicTimer = 0;

                this.initRenderer();
                this.initLights();
                this.initStageTerrain();
                this.initFairytaleDecorations();
                this.initDeerAlice();
                this.initCheshireCat();
                this.initWhiteRabbit();
                this.initExitPortal();
                this.spawnEnemies();
                this.initControls();
                this.initMinimap();

                window.addEventListener('resize', () => this.onWindowResize());
            }

            initRenderer() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.container.appendChild(this.renderer.domElement);

                this.scene.background = new THREE.Color('#1a0826');
                this.scene.fog = new THREE.FogExp2('#1a0826', 0.012);
            }

            initLights() {
                const dirLight = new THREE.DirectionalLight('#ffe4e6', 1.8);
                dirLight.position.set(20, 40, 20);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                const d = 50;
                dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
                dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
                this.scene.add(dirLight);

                const ambLight = new THREE.AmbientLight('#a855f7', 1.2);
                this.scene.add(ambLight);
            }

            initStageTerrain() {
                // Dark Forest Moss Floor
                const groundGeo = new THREE.PlaneGeometry(180, 220);
                const groundMat = new THREE.MeshStandardMaterial({ color: '#092015', roughness: 0.9 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Iconic Pink & Black Checkerboard Path (분홍색 & 검은색 체스판 길)
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                const tileSize = 64;
                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        ctx.fillStyle = (i + j) % 2 === 0 ? '#f472b6' : '#18181b';
                        ctx.fillRect(i * tileSize, j * tileSize, tileSize, tileSize);
                    }
                }
                const pathTex = new THREE.CanvasTexture(canvas);
                pathTex.wrapS = THREE.RepeatWrapping;
                pathTex.wrapT = THREE.RepeatWrapping;
                pathTex.repeat.set(2, 30);

                const pathGeo = new THREE.PlaneGeometry(16, 180);
                const pathMat = new THREE.MeshStandardMaterial({ map: pathTex, roughness: 0.4 });
                this.checkerboardPath = new THREE.Mesh(pathGeo, pathMat);
                this.checkerboardPath.rotation.x = -Math.PI / 2;
                this.checkerboardPath.position.set(0, 0.02, -10);
                this.checkerboardPath.receiveShadow = true;
                this.scene.add(this.checkerboardPath);
            }

            initFairytaleDecorations() {
                const woodMat = new THREE.MeshStandardMaterial({ color: '#2a160d', roughness: 0.9 });

                // Twisted Dark Tree Arches along the path
                for (let z = -80; z <= 60; z += 30) {
                    const trunkL = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2.0, 14, 8), woodMat);
                    trunkL.position.set(-10, 7, z);
                    trunkL.rotation.z = -0.22;
                    trunkL.castShadow = true;

                    const trunkR = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2.0, 14, 8), woodMat);
                    trunkR.position.set(10, 7, z);
                    trunkR.rotation.z = 0.22;
                    trunkR.castShadow = true;

                    const archTop = new THREE.Mesh(new THREE.TorusGeometry(9.5, 1.2, 8, 16, Math.PI), woodMat);
                    archTop.position.set(0, 13, z);
                    archTop.rotation.x = Math.PI / 2;

                    this.scene.add(trunkL); this.scene.add(trunkR); this.scene.add(archTop);

                    // Hanging Pocket Watches
                    const clockMesh = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.9, 0.9, 0.2, 16),
                        new THREE.MeshStandardMaterial({ color: '#fbbf24', metalness: 0.8, roughness: 0.2 })
                    );
                    clockMesh.rotation.x = Math.PI / 2;
                    clockMesh.position.set((Math.random() - 0.5) * 8, 9, z + 2);
                    this.scene.add(clockMesh);
                }

                // Fairytale Signpost ("THIS WAY / NOWHERE / THAT WAY / SOMEWHERE")
                const postGroup = new THREE.Group();
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 4), woodMat);
                pole.position.y = 2;
                postGroup.add(pole);

                const boardMat = new THREE.MeshStandardMaterial({ color: '#78350f' });
                const texts = ["THIS WAY ➔", "NOWHERE ❌", "THAT WAY ⬅️", "SOMEWHERE ❓"];
                texts.forEach((txt, idx) => {
                    const board = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 0.1), boardMat);
                    board.position.set(idx % 2 === 0 ? 0.45 : -0.45, 1.2 + idx * 0.55, 0);
                    board.rotation.y = idx % 2 === 0 ? 0.35 : -0.35;
                    postGroup.add(board);
                });
                postGroup.position.set(7, 0, -5);
                this.scene.add(postGroup);
            }

            initDeerAlice() {
                this.playerGroup = new THREE.Group();

                // 1. Deer Head & Cute Face
                const deerSkinMat = new THREE.MeshStandardMaterial({ color: '#b45309', roughness: 0.6 });
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), deerSkinMat);
                head.position.y = 1.4;
                head.castShadow = true;
                this.playerGroup.add(head);

                // Snout & Nose
                const snout = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: '#fef3c7' }));
                snout.position.set(0, 1.25, 0.5);
                snout.scale.set(0.9, 0.7, 1);
                this.playerGroup.add(snout);

                const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), new THREE.MeshBasicMaterial({ color: '#18181b' }));
                nose.position.set(0, 1.32, 0.78);
                this.playerGroup.add(nose);

                // Deer Ears
                const earGeo = new THREE.ConeGeometry(0.28, 0.75, 8);
                const earL = new THREE.Mesh(earGeo, deerSkinMat);
                earL.position.set(-0.7, 1.65, 0);
                earL.rotation.z = 1.1;
                const earR = earL.clone(); earR.position.x = 0.7; earR.rotation.z = -1.1;
                this.playerGroup.add(earL); this.playerGroup.add(earR);

                // 2. Blonde Hair & Black Ribbon
                const hairMat = new THREE.MeshStandardMaterial({ color: '#fef08a', roughness: 0.4 });
                const hair = new THREE.Mesh(new THREE.SphereGeometry(0.74, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.75), hairMat);
                hair.position.set(0, 1.42, -0.05);
                this.playerGroup.add(hair);

                const ribbonMat = new THREE.MeshStandardMaterial({ color: '#09090b' });
                const bowL = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), ribbonMat);
                bowL.scale.set(1.6, 0.7, 0.4);
                bowL.position.set(-0.28, 2.0, 0.1);
                const bowR = bowL.clone(); bowR.position.x = 0.28;
                this.playerGroup.add(bowL); this.playerGroup.add(bowR);

                // 3. Blue Dress & Apron
                const dressMat = new THREE.MeshStandardMaterial({ color: '#38bdf8', roughness: 0.4 });
                const apronMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.4 });

                const dress = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.8, 0.85, 16), dressMat);
                dress.position.y = 0.62;
                dress.castShadow = true;
                this.playerGroup.add(dress);

                const apron = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.81, 0.7, 16, 1, false, -Math.PI * 0.35, Math.PI * 0.7), apronMat);
                apron.position.set(0, 0.57, 0.02);
                this.playerGroup.add(apron);

                this.playerGroup.position.set(0, 0, 45);
                this.scene.add(this.playerGroup);
            }

            // CHESHIRE CAT (체셔캣 3D 캐릭터 - 핑크/보라 스트라이프 고양이)
            initCheshireCat() {
                this.catGroup = new THREE.Group();

                // Striped Purple/Pink Body & Head
                const catMat = new THREE.MeshStandardMaterial({ color: '#d946ef', roughness: 0.3 }); // Vibrant Pink
                const catHead = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), catMat);
                catHead.scale.set(1.2, 0.9, 1.0);
                this.catGroup.add(catHead);

                // Cat Ears
                const earGeo = new THREE.ConeGeometry(0.2, 0.4, 8);
                const earL = new THREE.Mesh(earGeo, catMat);
                earL.position.set(-0.35, 0.5, 0);
                earL.rotation.z = 0.3;
                const earR = earL.clone(); earR.position.x = 0.35; earR.rotation.z = -0.3;
                this.catGroup.add(earL); this.catGroup.add(earR);

                // Giant Iconic Cheshire Smile (커다란 체셔캣 미소)
                const smileCanvas = document.createElement('canvas');
                smileCanvas.width = 256; smileCanvas.height = 128;
                const sCtx = smileCanvas.getContext('2d');
                sCtx.fillStyle = '#ffffff';
                sCtx.beginPath();
                sCtx.arc(128, 40, 80, 0, Math.PI);
                sCtx.fill();
                sCtx.strokeStyle = '#000000';
                sCtx.lineWidth = 6;
                sCtx.stroke();
                // Teeth stripes
                for (let x = 60; x <= 196; x += 20) {
                    sCtx.beginPath(); sCtx.moveTo(x, 40); sCtx.lineTo(x, 110); sCtx.stroke();
                }

                const smileTex = new THREE.CanvasTexture(smileCanvas);
                const smileMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.7, 0.35),
                    new THREE.MeshBasicMaterial({ map: smileTex, transparent: true })
                );
                smileMesh.position.set(0, -0.05, 0.52);
                this.catGroup.add(smileMesh);

                // Glowing Yellow Eyes
                const eyeMat = new THREE.MeshBasicMaterial({ color: '#facc15' });
                const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
                eyeL.position.set(-0.22, 0.2, 0.48);
                const eyeR = eyeL.clone(); eyeR.position.x = 0.22;
                this.catGroup.add(eyeL); this.catGroup.add(eyeR);

                // Fluffy Tail
                const tail = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.1, 8, 16, Math.PI), catMat);
                tail.position.set(0, 0, -0.5);
                tail.rotation.y = Math.PI / 2;
                this.catGroup.add(tail);

                this.catGroup.position.set(2, 2.5, 43);
                this.scene.add(this.catGroup);
            }

            // WHITE RABBIT (시계 토끼 NPC - 포탈 가이드)
            initWhiteRabbit() {
                this.rabbitGroup = new THREE.Group();
                const furMat = new THREE.MeshStandardMaterial({ color: '#ffffff' });
                const coatMat = new THREE.MeshStandardMaterial({ color: '#dc2626' });

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), furMat);
                head.position.y = 1.0;
                this.rabbitGroup.add(head);

                // Long Rabbit Ears
                const earGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.6, 8);
                const earL = new THREE.Mesh(earGeo, furMat);
                earL.position.set(-0.15, 1.4, 0);
                earL.rotation.z = -0.15;
                const earR = earL.clone(); earR.position.x = 0.15; earR.rotation.z = 0.15;
                this.rabbitGroup.add(earL); this.rabbitGroup.add(earR);

                // Red Coat
                const coat = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 0.5, 12), coatMat);
                coat.position.y = 0.5;
                this.rabbitGroup.add(coat);

                // Pocket Watch in Hand
                const watch = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.18, 0.18, 0.05, 12),
                    new THREE.MeshStandardMaterial({ color: '#fbbf24', metalness: 0.9 })
                );
                watch.rotation.x = Math.PI / 2;
                watch.position.set(0.3, 0.5, 0.2);
                this.rabbitGroup.add(watch);

                this.rabbitGroup.position.set(-1.8, 0, 42);
                this.scene.add(this.rabbitGroup);
            }

            // STAGE EXIT PORTAL (다음 스테이지 진입 포탈)
            initExitPortal() {
                this.portalGroup = new THREE.Group();

                // Outer Glowing Ring
                const ringGeo = new THREE.TorusGeometry(3.0, 0.3, 16, 32);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: '#ec4899',
                    emissive: '#f43f5e',
                    emissiveIntensity: 0.8,
                    metalness: 0.8
                });
                this.portalRing = new THREE.Mesh(ringGeo, ringMat);
                this.portalRing.position.y = 3.2;
                this.portalGroup.add(this.portalRing);

                // Swirling Inner Vortex
                const innerGeo = new THREE.CircleGeometry(2.8, 32);
                const innerMat = new THREE.MeshBasicMaterial({
                    color: '#8b5cf6',
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.75
                });
                this.portalVortex = new THREE.Mesh(innerGeo, innerMat);
                this.portalVortex.position.y = 3.2;
                this.portalGroup.add(this.portalVortex);

                // Portal Pillar Supports
                const pillarMat = new THREE.MeshStandardMaterial({ color: '#4c1d95', roughness: 0.5 });
                const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 6), pillarMat);
                p1.position.set(-3, 3, 0);
                const p2 = p1.clone(); p2.position.x = 3;
                this.portalGroup.add(p1); this.portalGroup.add(p2);

                // Portal Stage Exit Target Position (체스판 길 맨 끝)
                this.portalGroup.position.set(0, 0, -85);
                this.scene.add(this.portalGroup);
            }

            spawnEnemies() {
                // Clear old enemies
                this.enemies.forEach(e => this.scene.remove(e.mesh));
                this.enemies = [];

                const count = 8 + (this.currentStage - 1) * 4;
                this.requiredKills = count;
                this.kills = 0;
                document.getElementById('killScore').innerText = `0 / ${this.requiredKills}`;

                const suits = ['♠️', '♥️', '♣️', '♦️'];
                const suitColors = ['#18181b', '#dc2626', '#18181b', '#dc2626'];

                for (let i = 0; i < count; i++) {
                    const soldier = new THREE.Group();

                    const suitIdx = i % 4;
                    // Card Body
                    const cardBody = new THREE.Mesh(
                        new THREE.BoxGeometry(1.4, 2.2, 0.12),
                        new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.3 })
                    );
                    cardBody.position.y = 1.2;
                    cardBody.castShadow = true;
                    soldier.add(cardBody);

                    // Suit Emblem
                    const suitEmblem = new THREE.Mesh(
                        new THREE.SphereGeometry(0.28, 8, 8),
                        new THREE.MeshBasicMaterial({ color: suitColors[suitIdx] })
                    );
                    suitEmblem.scale.set(1, 1.2, 0.2);
                    suitEmblem.position.set(0, 1.2, 0.08);
                    soldier.add(suitEmblem);

                    // Head & Spear Pike
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshStandardMaterial({ color: suitColors[suitIdx] }));
                    head.position.y = 2.5;
                    soldier.add(head);

                    const spear = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.5), new THREE.MeshStandardMaterial({ color: '#94a3b8' }));
                    spear.position.set(0.8, 1.6, 0.2);
                    spear.rotation.x = 0.2;
                    soldier.add(spear);

                    // Scatter along the path stages
                    const x = (Math.random() - 0.5) * 18;
                    const z = 20 - (i * 10) - Math.random() * 8;
                    soldier.position.set(x, 0, z);

                    this.scene.add(soldier);
                    this.enemies.push({
                        mesh: soldier,
                        hp: 75 + (this.currentStage * 15),
                        maxHp: 75 + (this.currentStage * 15),
                        speed: 0.085 + (this.currentStage * 0.012),
                        frozen: false
                    });
                }
            }

            initControls() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                    audio.init();
                });
                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });

                document.getElementById('btnAttack').addEventListener('click', () => this.attack());
                document.getElementById('btnSkill1').addEventListener('click', () => this.useSkill1());
                document.getElementById('btnSkill2').addEventListener('click', () => this.useSkill2());
                document.getElementById('btnNextStage').addEventListener('click', () => this.nextStage());
                document.getElementById('btnRestart').addEventListener('click', () => location.reload());

                // Virtual Touch Joystick
                const outer = document.getElementById('joystickOuter');
                const inner = document.getElementById('joystickInner');
                let active = false;

                const handleJoystick = (cx, cy) => {
                    const rect = outer.getBoundingClientRect();
                    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                    const dx = cx - center.x;
                    const dy = cy - center.y;
                    const dist = Math.hypot(dx, dy);
                    const maxDist = rect.width / 2;
                    const angle = Math.atan2(dy, dx);
                    const clamp = Math.min(dist, maxDist);

                    const stickX = Math.cos(angle) * clamp;
                    const stickY = Math.sin(angle) * clamp;

                    inner.style.transform = `translate(${stickX}px, ${stickY}px)`;
                    this.moveVector.x = stickX / maxDist;
                    this.moveVector.z = stickY / maxDist;
                };

                outer.addEventListener('touchstart', (e) => { active = true; handleJoystick(e.touches[0].clientX, e.touches[0].clientY); });
                window.addEventListener('touchmove', (e) => { if (active) handleJoystick(e.touches[0].clientX, e.touches[0].clientY); });
                window.addEventListener('touchend', () => {
                    active = false;
                    inner.style.transform = 'translate(0px, 0px)';
                    this.moveVector = { x: 0, z: 0 };
                });
            }

            attack() {
                if (!this.gameActive) return;
                audio.playShoot();

                // Pink Magic Tea Projectile
                const proj = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.3),
                    new THREE.MeshBasicMaterial({ color: '#f472b6' })
                );

                const spawnPos = this.playerGroup.position.clone();
                spawnPos.y += 0.9;
                proj.position.copy(spawnPos);

                const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.playerGroup.rotation.y);
                this.bullets.push({ mesh: proj, dir: dir, life: 35, isCatBeam: false });
                this.scene.add(proj);
            }

            // Skill 1: White Rabbit Time Freeze
            useSkill1() {
                if (this.cd1 > 0 || !this.gameActive) return;
                this.cd1 = 4;
                this.enemies.forEach(e => e.frozen = true);
                setTimeout(() => { this.enemies.forEach(e => e.frozen = false); }, 2500);

                const el = document.getElementById('cdSkill1');
                el.classList.remove('hidden');
                const interval = setInterval(() => {
                    this.cd1--;
                    el.innerText = this.cd1;
                    if (this.cd1 <= 0) { clearInterval(interval); el.classList.add('hidden'); }
                }, 1000);
            }

            // Skill 2: Cheshire Cat Special Beam Attack
            useSkill2() {
                if (this.cd2 > 0 || !this.gameActive) return;
                this.cd2 = 6;
                audio.playCatBeam();
                this.catSupportCount++;

                // Cheshire Cat fires giant purple beam in player's forward direction
                const beam = new THREE.Mesh(
                    new THREE.SphereGeometry(0.7, 16, 16),
                    new THREE.MeshBasicMaterial({ color: '#d946ef' })
                );
                const spawnPos = this.catGroup.position.clone();
                beam.position.copy(spawnPos);

                const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.playerGroup.rotation.y);
                this.bullets.push({ mesh: beam, dir: dir, life: 50, isCatBeam: true });
                this.scene.add(beam);

                const el = document.getElementById('cdSkill2');
                el.classList.remove('hidden');
                const interval = setInterval(() => {
                    this.cd2--;
                    el.innerText = this.cd2;
                    if (this.cd2 <= 0) { clearInterval(interval); el.classList.add('hidden'); }
                }, 1000);
            }

            initMinimap() {
                this.minimapCanvas = document.getElementById('minimapCanvas');
                this.mmCtx = this.minimapCanvas.getContext('2d');
            }

            update() {
                if (!this.gameActive) return;

                // Move Player
                let mx = 0, mz = 0;
                if (this.keys['w'] || this.keys['arrowup']) mz -= 1;
                if (this.keys['s'] || this.keys['arrowdown']) mz += 1;
                if (this.keys['a'] || this.keys['arrowleft']) mx -= 1;
                if (this.keys['d'] || this.keys['arrowright']) mx += 1;

                if (this.moveVector.x !== 0 || this.moveVector.z !== 0) {
                    mx = this.moveVector.x; mz = this.moveVector.z;
                }

                const moveSpeed = 0.18;
                if (mx !== 0 || mz !== 0) {
                    this.playerGroup.position.x += mx * moveSpeed;
                    this.playerGroup.position.z += mz * moveSpeed;
                    this.playerGroup.rotation.y = Math.atan2(-mx, -mz);
                }

                // Cheshire Cat Companion Floating AI (Follows Alice with gentle float levitation)
                this.catMagicTimer += 0.05;
                const catTargetX = this.playerGroup.position.x + Math.sin(this.catMagicTimer) * 2.2;
                const catTargetZ = this.playerGroup.position.z + Math.cos(this.catMagicTimer) * 1.5;
                const catTargetY = 2.2 + Math.sin(this.catMagicTimer * 2) * 0.4;
                this.catGroup.position.lerp(new THREE.Vector3(catTargetX, catTargetY, catTargetZ), 0.1);
                this.catGroup.rotation.y = this.playerGroup.rotation.y;

                // Camera Follows Alice
                const targetCamPos = new THREE.Vector3(
                    this.playerGroup.position.x,
                    this.playerGroup.position.y + 17,
                    this.playerGroup.position.z + 13
                );
                this.camera.position.lerp(targetCamPos, 0.1);
                this.camera.lookAt(this.playerGroup.position.x, this.playerGroup.position.y + 0.5, this.playerGroup.position.z);

                // Update Projectiles & Hits
                this.bullets.forEach((b, bIdx) => {
                    const speed = b.isCatBeam ? 1.4 : 1.1;
                    b.mesh.position.addScaledVector(b.dir, speed);
                    b.life--;

                    this.enemies.forEach((enemy, eIdx) => {
                        if (b.mesh.position.distanceTo(enemy.mesh.position) < 1.4) {
                            const dmg = b.isCatBeam ? Math.floor(65 + Math.random() * 20) : Math.floor(30 + Math.random() * 15);
                            enemy.hp -= dmg;
                            audio.playHit();
                            this.showDamagePop(enemy.mesh.position, dmg, b.isCatBeam);

                            if (enemy.hp <= 0) {
                                this.scene.remove(enemy.mesh);
                                this.enemies.splice(eIdx, 1);
                                this.kills++;
                                document.getElementById('killScore').innerText = `${this.kills} / ${this.requiredKills}`;

                                // Check Stage Objective Goal
                                if (this.kills >= this.requiredKills && !this.portalActive) {
                                    this.activateExitPortal();
                                }
                            }
                        }
                    });

                    if (b.life <= 0) {
                        this.scene.remove(b.mesh);
                        this.bullets.splice(bIdx, 1);
                    }
                });

                // Update Enemy Chase AI
                this.enemies.forEach(enemy => {
                    if (enemy.frozen) return;
                    const dist = enemy.mesh.position.distanceTo(this.playerGroup.position);
                    if (dist < 22) {
                        enemy.mesh.lookAt(this.playerGroup.position.x, enemy.mesh.position.y, this.playerGroup.position.z);
                        enemy.mesh.translateZ(enemy.speed);

                        if (dist < 1.3) {
                            this.playerHp = Math.max(0, this.playerHp - 0.4);
                            this.updateHpUI();
                        }
                    }
                });

                // Check Stage Exit Portal Entry (체스판 끝 탈출 포탈 도달 여부)
                if (this.portalActive) {
                    this.portalRing.rotation.z += 0.03;
                    this.portalVortex.rotation.z -= 0.05;

                    const distToPortal = this.playerGroup.position.distanceTo(this.portalGroup.position);
                    if (distToPortal < 3.2) {
                        this.triggerStageClear();
                    }
                }

                this.renderMinimap();
                this.renderer.render(this.scene, this.camera);
            }

            activateExitPortal() {
                this.portalActive = true;
                audio.playPortalOpen();

                document.getElementById('portalNotice').classList.remove('hidden');
                document.getElementById('objectiveIcon').innerText = '✨';
                document.getElementById('objectiveText').innerText = '모든 병정 제압 완료! 체스판 끝 [탈출 포탈]로 이동하세요!';
            }

            triggerStageClear() {
                this.gameActive = false;
                document.getElementById('clearStageTitle').innerText = `STAGE ${this.currentStage} 체스판 길 탈출 성공!`;
                document.getElementById('clearKills').innerText = `${this.kills} / ${this.requiredKills}명`;
                document.getElementById('clearCatSupport').innerText = `${this.catSupportCount}회`;
                document.getElementById('clearHp').innerText = `${Math.ceil(this.playerHp)} / ${this.maxHp}`;
                document.getElementById('clearModal').classList.remove('hidden');
            }

            nextStage() {
                this.currentStage++;
                this.gameActive = true;
                this.portalActive = false;
                this.playerHp = this.maxHp;
                this.updateHpUI();

                document.getElementById('clearModal').classList.add('hidden');
                document.getElementById('portalNotice').classList.add('hidden');
                document.getElementById('stageBadge').innerText = `STAGE ${this.currentStage}`;
                document.getElementById('objectiveIcon').innerText = '⚔️';
                document.getElementById('objectiveText').innerText = `카드 병정 (0/${8 + (this.currentStage - 1) * 4}) 처치 시 탈출 포탈이 열립니다!`;

                // Reset positions
                this.playerGroup.position.set(0, 0, 45);
                this.spawnEnemies();
            }

            showDamagePop(pos3D, amount, isCatBeam = false) {
                const screenPos = pos3D.clone().project(this.camera);
                const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;

                const pop = document.createElement('div');
                pop.className = isCatBeam ? "damage-pop text-purple-400 scale-125" : "damage-pop text-pink-400";
                pop.innerText = isCatBeam ? `💥-${amount}` : `-${amount}`;
                pop.style.left = `${x}px`;
                pop.style.top = `${y}px`;

                document.getElementById('damageOverlay').appendChild(pop);
                setTimeout(() => pop.remove(), 700);
            }

            updateHpUI() {
                const pct = (this.playerHp / this.maxHp) * 100;
                document.getElementById('hpBar').style.width = `${pct}%`;
                document.getElementById('hpText').innerText = `${Math.ceil(this.playerHp)} / 100`;

                if (this.playerHp <= 0 && this.gameActive) {
                    this.gameActive = false;
                    document.getElementById('modalOverlay').classList.remove('hidden');
                }
            }

            renderMinimap() {
                const ctx = this.mmCtx;
                const w = this.minimapCanvas.width;
                const h = this.minimapCanvas.height;
                const cx = w / 2; const cy = h / 2;

                ctx.clearRect(0, 0, w, h);

                // Path Preview
                ctx.fillStyle = 'rgba(244, 114, 182, 0.2)';
                ctx.fillRect(cx - 12, 0, 24, h);

                // Exit Portal Indicator on Minimap
                const portalDx = (this.portalGroup.position.x - this.playerGroup.position.x) * 0.8;
                const portalDz = (this.portalGroup.position.z - this.playerGroup.position.z) * 0.8;
                ctx.fillStyle = this.portalActive ? '#f43f5e' : '#6b21a8';
                ctx.beginPath();
                ctx.arc(cx + portalDx, cy + portalDz, 6, 0, Math.PI * 2);
                ctx.fill();

                // Enemies (Red)
                ctx.fillStyle = '#ef4444';
                this.enemies.forEach(e => {
                    const dx = (e.mesh.position.x - this.playerGroup.position.x) * 0.8;
                    const dz = (e.mesh.position.z - this.playerGroup.position.z) * 0.8;
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dz, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Cheshire Cat (Purple)
                const catDx = (this.catGroup.position.x - this.playerGroup.position.x) * 0.8;
                const catDz = (this.catGroup.position.z - this.playerGroup.position.z) * 0.8;
                ctx.fillStyle = '#c084fc';
                ctx.beginPath();
                ctx.arc(cx + catDx, cy + catDz, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // Player Alice (Pink)
                ctx.fillStyle = '#f472b6';
                ctx.beginPath();
                ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        window.onload = () => {
            const game = new AliceGameEngine();
            function animate() {
                game.update();
                requestAnimationFrame(animate);
            }
            animate();
        };
    </script>
