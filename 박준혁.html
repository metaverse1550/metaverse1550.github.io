<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chase Racing Deluxe - Ultimate Edition</title>
<style>
*{box-sizing:border-box; user-select:none; -webkit-user-select:none;}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}
canvas{display:block;}

#hud{
  position:fixed;top:15px;left:15px;right:15px;
  display:flex;justify-content:space-between;align-items:flex-start;
  color:white;pointer-events:none;
  text-shadow:0 2px 6px rgba(0,0,0,0.9);
  z-index: 10;
}
.panel{
  background:rgba(8,12,18,0.82);border:1px solid rgba(255,255,255,0.18);
  border-radius:14px;padding:12px 20px;backdrop-filter:blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
#speed{font-size:32px; font-weight:900; color:#00f2fe; font-family:monospace;}
#danger{color:#ff3333;display:none; font-weight:bold; font-size: 15px; margin-top:4px; animation: pulse 0.5s infinite alternate;}
#biome-tag{font-size: 13px; font-weight: bold; color: #ffeb3b; text-transform: uppercase; margin-bottom: 2px;}

@keyframes pulse {
  0% { opacity: 0.2; transform: scale(0.97); }
  100% { opacity: 1; transform: scale(1.03); }
}

#message{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(2,4,8,0.92);color:white;text-align:center; z-index:100;
  backdrop-filter:blur(15px);
}
.box{
  background:rgba(14,18,26,0.96);padding:30px 40px;border-radius:24px;
  min-width:340px; max-width:520px; box-shadow:0 25px 70px rgba(0,0,0,0.95);
  border:1px solid rgba(255,255,255,0.15);
}

.title-banner {
  width: 100%; max-height: 180px; object-fit: contain;
  margin-bottom: 15px; border-radius: 12px;
  filter: drop-shadow(0 10px 20px rgba(0,242,254,0.3));
}

p{line-height:1.6; color:#ccc; font-size:14px;}
button{
  border:0;border-radius:12px;padding:15px 36px;margin-top:15px;
  font-size:18px;font-weight:bold;cursor:pointer;
  background:linear-gradient(45deg, #00c6ff, #0072ff); color:white;
  box-shadow: 0 6px 22px rgba(0,114,255,0.4);
  transition: all 0.2s ease;
}
button:hover{transform:scale(1.05); box-shadow: 0 8px 28px rgba(0,114,255,0.6);}
button:active{transform:scale(0.98);}

#minimap{
  position:fixed;right:20px;bottom:20px;width:180px;height:140px;
  background:rgba(8,12,18,0.8);border:2px solid rgba(255,255,255,0.2);
  border-radius:14px; backdrop-filter:blur(8px); z-index:10;
}

/* 터치 컨트롤러 UI */
.touch-controls {
  position: fixed; bottom: 20px; left: 20px; right: 20px;
  display: none; justify-content: space-between; pointer-events: none;
  z-index: 20;
}
@media (max-width: 900px), (pointer: coarse) {
  .touch-controls { display: flex; }
}
.d-pad, .action-pad { pointer-events: auto; display: flex; gap: 10px; }
.btn-touch {
  width: 65px; height: 65px; background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.35); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 24px; font-weight: bold;
  backdrop-filter: blur(5px);
  touch-action: manipulation;
}
.btn-touch:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }
.btn-pedal { width: 65px; height: 80px; border-radius: 16px; }
.btn-gas { background: rgba(0, 200, 83, 0.4); border-color: rgba(0, 230, 118, 0.6); }
.btn-brake { background: rgba(213, 0, 0, 0.4); border-color: rgba(255, 23, 68, 0.6); }
.btn-boost { background: rgba(255, 145, 0, 0.4); border-color: rgba(255, 171, 0, 0.6); height: 50px; border-radius: 25px; }

/* 부스트 게이지 */
#boost-bar-container {
  width: 100%; height: 8px; background: rgba(255,255,255,0.2);
  border-radius: 4px; margin-top: 8px; overflow: hidden;
}
#boost-bar {
  width: 100%; height: 100%; background: linear-gradient(90deg, #00f2fe, #ffea00);
  transition: width 0.1s linear;
}
</style>
</head>
<body>

<div id="hud">
  <div class="panel">
    <div id="biome-tag">⛰️ 익스트림 산악 언덕</div>
    <div id="distance">결승선까지: 0 m</div>
  </div>

  <div class="panel" style="text-align:center">
    <div id="speed">0 <span style="font-size:16px;">km/h</span></div>
    <div id="boost-bar-container"><div id="boost-bar"></div></div>
    <div id="danger">🚨 경찰 추격차 근접!!</div>
  </div>

  <div class="panel" style="text-align:right">
    <div id="chase" style="font-size: 18px; font-weight: bold; color: #ffeb3b;">추격 거리: -- m</div>
    <div id="score" style="font-size:12px; color:#aaa; margin-top:4px;">SCORE: 0</div>
  </div>
</div>

<canvas id="minimap" width="180" height="140"></canvas>

<div class="touch-controls">
  <div class="d-pad">
    <div class="btn-touch" id="btn-left">◀</div>
    <div class="btn-touch" id="btn-right">▶</div>
  </div>
  <div class="action-pad" style="flex-direction: column; align-items: flex-end;">
    <div class="btn-touch btn-boost" id="btn-boost">🚀 BOOST</div>
    <div style="display:flex; gap:10px;">
      <div class="btn-touch btn-pedal btn-brake" id="btn-brake">▼</div>
      <div class="btn-touch btn-pedal btn-gas" id="btn-gas">▲</div>
    </div>
  </div>
</div>

<div id="message">
  <div class="box">
    <!-- SVG 타이틀 배너 아트 연동 -->
    <svg class="title-banner" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="50%" stop-color="#00f2fe" />
          <stop offset="100%" stop-color="#0066ff" />
        </linearGradient>
        <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffea00" />
          <stop offset="100%" stop-color="#ff0055" />
        </linearGradient>
      </defs>
      <!-- 네온 그리드 라인 -->
      <g opacity="0.2">
        <path d="M 0 280 L 1200 280 M 0 320 L 1200 320 M 0 370 L 1200 370" stroke="#00f2fe" stroke-width="2" />
        <path d="M 600 250 L 0 400 M 600 250 L 300 400 M 600 250 L 600 400 M 600 250 L 900 400 M 600 250 L 1200 400" stroke="#00f2fe" stroke-width="2" />
      </g>
      <!-- 스포츠카 스피드 아웃라인 -->
      <path d="M 380 260 Q 420 220 510 210 Q 600 195 690 220 Q 780 230 810 260" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.8" />
      <ellipse cx="390" cy="260" rx="20" ry="5" fill="#00f2fe" />
      <ellipse cx="800" cy="260" rx="15" ry="4" fill="#ff0055" />
      <!-- 타이틀 텍스트 -->
      <g transform="translate(600, 140) skewX(-10)">
        <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="105" font-weight="900" text-anchor="middle" fill="url(#titleGrad)">CHASE RACING</text>
        <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="105" font-weight="900" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="2">CHASE RACING</text>
      </g>
      <!-- 서브 배지 -->
      <rect x="410" y="170" width="380" height="40" rx="20" fill="#081020" stroke="url(#badgeGrad)" stroke-width="2" />
      <text x="600" y="196" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="url(#badgeGrad)" letter-spacing="4">3D ULTIMATE EDITION</text>
    </svg>

    <p style="background:rgba(255,255,255,0.05); padding:12px 16px; border-radius:12px; text-align:left; margin-top:0;">
      🎯 <b>부드러운 조향감</b>: 원만하고 세밀한 완만 차선 제어<br>
      ⛰️ <b>3D 입체 코스</b>: 오르막 언덕, 내리막 경사, 다이내믹 4가지 테마<br>
      🏁 <b>초반 400m 안전구역</b>: 부드러운 출차 및 완전 개방형 회피 차선<br>
      🎮 <b>PC 조작법</b>: ↑/W (가속), ↓/S (브레이크), ← →/A D (조향), Shift (부스트)
    </p>
    <button onclick="startGame()">레이스 시작</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene, camera, renderer;
let player, chaseCar;
let obstacles = [];
let treeProps = [];
let keys = {};
let touchInput = { up: false, down: false, left: false, right: false, boost: false };

let gameState = "menu";
let speed = 0;
let maxSpeed = 1.4;
let acceleration = .025;
let braking = .045;

const roadWidth = 44; 
let playerDistance = 0; // 도로 상 진행 거리 (s)
let playerOffset = 0;   // 도로 중심 기준 좌우 오프셋 (-19 ~ 19)
let steerAngle = 0;     // 차량의 도로 대비 상대 조향각

let boostAmount = 100;
let isBoosting = false;

const roadLength = 8000;
let chaseDistance = 180;
let score = 0;
let lastTime = performance.now();

// 바이옴 테마 설정
const BIOMES = [
  { name: "⛰️ 산악 오르막 언덕 코스", startZ: 0, endZ: 2000, sky: 0x0a101d, grass: 0x162c1b },
  { name: "🌃 야간 입체 도심 고속도로", startZ: 2000, endZ: 4000, sky: 0x04060f, grass: 0x0a0f1d },
  { name: "🌫️ 안개 협곡 내리막 코너", startZ: 4000, endZ: 6000, sky: 0x141a22, grass: 0x3d352e },
  { name: "❄️ 설산 롤러코스터 경사로", startZ: 6000, endZ: 8500, sky: 0x121e2b, grass: 0xcde0f7 }
];

/* 3D 고저차 및 곡선 연산 함수 */
function getRoadData(s) {
  if (s < 120) return { x: 0, y: 0, angle: 0, pitch: 0 };

  // X축 곡선 (부드러운 좌우 와인딩)
  const curve1 = Math.sin(s * 0.0025) * 110;
  const curve2 = Math.sin(s * 0.006) * 65;
  const x = curve1 + curve2;

  // Y축 고저차 (입체 오르막 & 내리막 언덕)
  const hill1 = Math.sin(s * 0.0035) * 30; 
  const hill2 = Math.cos(s * 0.008) * 16;
  const y = Math.max(0, hill1 + hill2);

  // 미분을 통한 정밀 방위각 & 피치각
  const ds = 0.5;
  const xNext = Math.sin((s + ds) * 0.0025) * 110 + Math.sin((s + ds) * 0.006) * 65;
  const yNext = Math.max(0, Math.sin((s + ds) * 0.0035) * 30 + Math.cos((s + ds) * 0.008) * 16);
  
  const angle = Math.atan2(xNext - x, ds);
  const pitch = Math.atan2(yNext - y, ds);

  return { x, y, angle, pitch };
}

function getCurrentBiome(s) {
  for (let b of BIOMES) {
    if (s >= b.startZ && s < b.endZ) return b;
  }
  return BIOMES[BIOMES.length - 1];
}

// UI 요소
const biomeTagEl = document.getElementById("biome-tag");
const distanceEl = document.getElementById("distance");
const speedEl = document.getElementById("speed");
const chaseEl = document.getElementById("chase");
const dangerEl = document.getElementById("danger");
const message = document.getElementById("message");
const boostBar = document.getElementById("boost-bar");
const scoreEl = document.getElementById("score");

const mini = document.getElementById("minimap");
const ctx = mini.getContext("2d");

/* 사운드 효과 */
let audioCtx;
function playSound(type) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;

  if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(25, now + 0.4);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.4);
  } else if (type === 'boost') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.18);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
    osc.start(now);
    osc.stop(now + 0.18);
  } else if (type === 'win') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(554.37, now + 0.15);
    osc.frequency.setValueAtTime(659.25, now + 0.3);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
    osc.start(now);
    osc.stop(now + 0.6);
  }
}

/* Three.js 초기화 */
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(BIOMES[0].sky);
  scene.fog = new THREE.FogExp2(BIOMES[0].sky, 0.003);

  camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, .1, 1000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x111122, 1.3);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(-60, 140, 60);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  scene.add(sun);
}

const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e222a, roughness: 0.75 });
const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 });
const yellowLineMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x554400 });

/* 입체 트랙 생성 */
function createTrack() {
  const step = 6;
  const segments = Math.floor(roadLength / step);

  for (let i = 0; i < segments; i++) {
    const s = i * step;
    const roadData = getRoadData(s);
    const x = roadData.x;
    const y = roadData.y;
    const z = -s;
    const angle = roadData.angle;
    const pitch = roadData.pitch;
    const biome = getCurrentBiome(s);

    // 바닥 지형
    const grassGeo = new THREE.PlaneGeometry(600, step + 0.4);
    const grassMat = new THREE.MeshStandardMaterial({ color: biome.grass, roughness: 0.9 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2 + pitch;
    grass.rotation.z = angle;
    grass.position.set(x, y - 0.08, z);
    grass.receiveShadow = true;
    scene.add(grass);

    // 3D 도로
    const roadGeo = new THREE.PlaneGeometry(roadWidth, step + 0.4);
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2 + pitch;
    road.rotation.z = angle;
    road.position.set(x, y, z);
    road.receiveShadow = true;
    scene.add(road);

    // 중앙 노란 차선
    for (let offset of [-0.6, 0.6]) {
      const yellowLine = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.03, step), yellowLineMat);
      const lx = x + offset * Math.cos(angle);
      const lz = z - offset * Math.sin(angle);
      yellowLine.rotation.y = angle;
      yellowLine.rotation.x = pitch;
      yellowLine.position.set(lx, y + 0.02, lz);
      scene.add(yellowLine);
    }

    // 흰색 차선
    for (let laneOffset of [-13, 13]) {
      if (i % 2 === 0) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 3.5), lineMat);
        const lx = x + laneOffset * Math.cos(angle);
        const lz = z - laneOffset * Math.sin(angle);
        line.rotation.y = angle;
        line.rotation.x = pitch;
        line.position.set(lx, y + 0.02, lz);
        scene.add(line);
      }
    }

    // 도로 바깥 안전지대에 나무 생성 (도로 침범 방지)
    if (i % 6 === 0) {
      for (let side of [-1, 1]) {
        const safeDistance = roadWidth / 2 + 22 + Math.random() * 20;
        const propX = x + side * safeDistance * Math.cos(angle);
        const propZ = z - side * safeDistance * Math.sin(angle);
        createTreeProp(propX, y, propZ, biome);
      }
    }
  }

  createFinishLine();
}

function createTreeProp(x, y, z, biome) {
  const group = new THREE.Group();

  const trunkGeo = new THREE.CylinderGeometry(0.6, 0.9, 5, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2616, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 2.5;
  trunk.castShadow = true;
  group.add(trunk);

  const crownGeo = new THREE.ConeGeometry(3.8, 8.5, 8);
  const crownMat = new THREE.MeshStandardMaterial({ color: 0x114422, roughness: 0.8 });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 7.5;
  crown.castShadow = true;
  group.add(crown);

  group.position.set(x, y, z);
  scene.add(group);

  treeProps.push({ x: x, y: y, z: z, radius: 2.2 });
}

function createFinishLine() {
  const s = roadLength;
  const roadData = getRoadData(s);
  const x = roadData.x;
  const y = roadData.y;
  const z = -s;
  const angle = roadData.angle;

  const arch = new THREE.Group();
  
  const finishMat = new THREE.MeshStandardMaterial({ color: 0x00f2fe, emissive: 0x00f2fe });
  const p1 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 13, 1.6), finishMat);
  p1.position.set(-roadWidth/2 - 1, 6.5, 0);
  const p2 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 13, 1.6), finishMat);
  p2.position.set(roadWidth/2 + 1, 6.5, 0);
  
  const top = new THREE.Mesh(new THREE.BoxGeometry(roadWidth + 4, 2.2, 2.2), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xaaaaaa }));
  top.position.set(0, 12, 0);

  arch.add(p1, p2, top);
  arch.position.set(x, y, z);
  arch.rotation.y = angle;
  scene.add(arch);
}

/* 3D 차량 제작 */
function createCar(color = 0x0072ff, isPolice = false) {
  const car = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.85, roughness: 0.15 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.6, 4.6), bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  car.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.75, 0.6, 2.4),
    new THREE.MeshStandardMaterial({ color: 0x0a0d12, metalness: 0.95, roughness: 0.05 })
  );
  cabin.position.set(0, 1.1, -0.2);
  cabin.castShadow = true;
  car.add(cabin);

  if (!isPolice) {
    const spoilerBase1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.2), bodyMat);
    spoilerBase1.position.set(-0.8, 1.0, 2.0);
    const spoilerBase2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.2), bodyMat);
    spoilerBase2.position.set(0.8, 1.0, 2.0);
    const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.08, 0.5), bodyMat);
    spoilerWing.position.set(0, 1.2, 2.0);
    car.add(spoilerBase1, spoilerBase2, spoilerWing);
  }

  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });
  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 20);
  const rimGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.33, 12);

  for (let x of [-1.15, 1.15]) {
    for (let z of [-1.45, 1.45]) {
      const wheelGroup = new THREE.Group();
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.rotation.z = Math.PI / 2;
      wheelGroup.add(wheel, rim);

      wheelGroup.position.set(x, 0.42, z);
      wheelGroup.castShadow = true;
      car.add(wheelGroup);
    }
  }

  const headLightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.5 });
  for (let x of [-0.85, 0.85]) {
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headLightMat);
    lamp.position.set(x, 0.65, -2.31);
    car.add(lamp);
  }

  const tailLightMat = new THREE.MeshStandardMaterial({ color: 0xff0033, emissive: 0xff0033, emissiveIntensity: 2.0 });
  for (let x of [-0.85, 0.85]) {
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.15, 0.1), tailLightMat);
    lamp.position.set(x, 0.65, 2.31);
    car.add(lamp);
  }

  if (isPolice) {
    const sirenBar = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.3), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    sirenBar.position.set(0, 1.45, -0.2);

    const blueLight = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.25), new THREE.MeshBasicMaterial({ color: 0x0044ff }));
    blueLight.position.set(-0.3, 1.55, -0.2);
    const redLight = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.25), new THREE.MeshBasicMaterial({ color: 0xff0022 }));
    redLight.position.set(0.3, 1.55, -0.2);

    car.add(sirenBar, blueLight, redLight);
  }

  return car;
}

/* 통과 가능한 장애물 (초반 400m는 장애물 없는 100% 안전 구역) */
function createObstacles() {
  const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.7 });
  const allLanes = [-13, -6.5, 0, 6.5, 13];

  for (let i = 0; i < 35; i++) {
    // 400m 이후부터만 장애물 배치 (출차 구간 100% 보장)
    const dist = 400 + i * 210 + Math.random() * 40; 
    
    // 5개 차선 중 단 1개 차선에만 생성 (항상 4개 차선 개방)
    const laneIndex = Math.floor(Math.random() * allLanes.length);
    const laneOffset = allLanes[laneIndex];

    const obj = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.2, 6.8), obstacleMat);
    obj.position.y = 1.1;
    obj.castShadow = true;
    obj.userData = { dist: dist, offset: laneOffset };
    scene.add(obj);
    obstacles.push(obj);
  }
}

/* 컨트롤 이벤트 바인딩 */
function setupControls() {
  addEventListener("keydown", e => {
    keys[e.key] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    if (e.key === "Shift") touchInput.boost = true;
  });

  addEventListener("keyup", e => {
    keys[e.key] = false;
    if (e.key === "Shift") touchInput.boost = false;
  });

  const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); touchInput[key] = true; });
    el.addEventListener("touchend", (e) => { e.preventDefault(); touchInput[key] = false; });
    el.addEventListener("mousedown", () => touchInput[key] = true);
    el.addEventListener("mouseup", () => touchInput[key] = false);
  };

  bindTouch("btn-left", "left");
  bindTouch("btn-right", "right");
  bindTouch("btn-gas", "up");
  bindTouch("btn-brake", "down");
  bindTouch("btn-boost", "boost");
}

/* 도로 추종 정밀 물리학 (조향 감도를 대폭 낮추어 원만하고 안정적인 핸들링 제어) */
function updatePlayer(dt) {
  const isUp = keys.ArrowUp || keys.w || keys.W || touchInput.up;
  const isDown = keys.ArrowDown || keys.s || keys.S || touchInput.down;
  const isLeft = keys.ArrowLeft || keys.a || keys.A || touchInput.left;
  const isRight = keys.ArrowRight || keys.d || keys.D || touchInput.right;
  const wantBoost = (keys.Shift || touchInput.boost) && boostAmount > 5;

  if (wantBoost && isUp) {
    isBoosting = true;
    boostAmount -= dt * 32;
    if (!audioCtx || Math.random() < 0.1) playSound('boost');
  } else {
    isBoosting = false;
    if (boostAmount < 100) boostAmount += dt * 10;
  }
  boostBar.style.width = `${Math.max(0, boostAmount)}%`;

  let currentMaxSpeed = isBoosting ? maxSpeed * 1.35 : maxSpeed;

  if (isUp) {
    speed += acceleration * (isBoosting ? 1.6 : 1) * dt * 60;
  } else if (isDown) {
    speed -= braking * dt * 60;
  } else {
    speed -= 0.007 * dt * 60;
  }

  speed = THREE.MathUtils.clamp(speed, -0.1, currentMaxSpeed);

  // 조향 감도 조정 (최대 꺾임각 0.10으로 대폭 축소 & 보간율 0.04로 부드럽게 완화)
  const maxSteer = 0.10; 
  if (isLeft) {
    steerAngle = THREE.MathUtils.lerp(steerAngle, maxSteer, 0.04); 
  } else if (isRight) {
    steerAngle = THREE.MathUtils.lerp(steerAngle, -maxSteer, 0.04);
  } else {
    steerAngle = THREE.MathUtils.lerp(steerAngle, 0, 0.08); // 부드러운 직진 복귀
  }

  // 전진 및 차선 오프셋 이동 연산 (도로 곡률을 자연스럽게 따라감)
  const forwardSpeed = speed * Math.cos(steerAngle);
  playerDistance += forwardSpeed * dt * 60;

  const lateralSpeed = speed * Math.sin(steerAngle);
  playerOffset -= lateralSpeed * dt * 60 * 5.5; // 횡이동 민감도 완화

  // 도로 내부 경계선 안에서 완벽 유지 (-19 ~ 19)
  playerOffset = THREE.MathUtils.clamp(playerOffset, -19.0, 19.0);

  // 도로 데이터 계산
  const roadData = getRoadData(playerDistance);
  const px = roadData.x + playerOffset * Math.cos(roadData.angle);
  const py = roadData.y;
  const pz = -playerDistance - playerOffset * Math.sin(roadData.angle);

  player.position.set(px, py, pz);
  player.rotation.y = roadData.angle + steerAngle;
  player.rotation.x = roadData.pitch;

  score = Math.floor(playerDistance * 10);
  scoreEl.textContent = `SCORE: ${score}`;

  const currentBiome = getCurrentBiome(playerDistance);
  biomeTagEl.textContent = currentBiome.name;
  scene.background.lerp(new THREE.Color(currentBiome.sky), 0.05);
  scene.fog.color.lerp(new THREE.Color(currentBiome.sky), 0.05);
}

function updateObstacles() {
  for (const obs of obstacles) {
    const dist = obs.userData.dist;
    const offset = obs.userData.offset;
    const roadData = getRoadData(dist);
    const x = roadData.x + offset * Math.cos(roadData.angle);
    const y = roadData.y;
    const z = -dist - offset * Math.sin(roadData.angle);

    obs.position.set(x, y + 1.1, z);
    obs.rotation.y = roadData.angle;
    obs.rotation.x = roadData.pitch;
  }
}

function updateChase(dt) {
  // 공정한 추격 거리 조율
  let chaseSpeedDiff = (1.02 - speed) * 14;
  chaseDistance -= chaseSpeedDiff * dt;
  chaseDistance = THREE.MathUtils.clamp(chaseDistance, 1, 250);

  const chaseDist = playerDistance - chaseDistance;
  const roadData = getRoadData(chaseDist);
  
  const cx = roadData.x;
  const cy = roadData.y;
  const cz = -chaseDist;

  chaseCar.position.set(cx, cy, cz);
  chaseCar.rotation.y = roadData.angle;
  chaseCar.rotation.x = roadData.pitch;

  if (chaseDistance < 35) {
    dangerEl.style.display = "block";
  } else {
    dangerEl.style.display = "none";
  }

  if (chaseDistance <= 2.6) {
    endGame(false);
  }
}

/* 충돌 판정 */
function checkCollisions() {
  for (const obs of obstacles) {
    const dx = player.position.x - obs.position.x;
    const dy = player.position.y - obs.position.y;
    const dz = player.position.z - obs.position.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

    if (dist < 3.5) {
      if (speed > 0.2) playSound('crash');
      speed *= 0.35;
      playerOffset += playerOffset < obs.userData.offset ? -1.5 : 1.5;
    }
  }
}

/* HUD 및 미니맵 */
function updateHUD() {
  const remaining = Math.max(0, roadLength - playerDistance);
  distanceEl.textContent = `결승선까지: ${Math.round(remaining)} m`;
  speedEl.innerHTML = `${Math.round(Math.max(0, speed) * 180)} <span style="font-size:16px;">km/h</span>`;
  chaseEl.textContent = `추격 거리: ${Math.round(chaseDistance)} m`;
}

function updateMinimap() {
  ctx.clearRect(0, 0, 180, 140);
  ctx.fillStyle = "rgba(8,12,18,0.85)";
  ctx.fillRect(0, 0, 180, 140);

  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 18;
  ctx.beginPath();

  const scale = 130 / roadLength;
  for (let s = 0; s < roadLength; s += 120) {
    const roadData = getRoadData(s);
    const mapX = 90 + roadData.x * 0.35;
    const mapY = 135 - s * scale;
    if (s === 0) ctx.moveTo(mapX, mapY);
    else ctx.lineTo(mapX, mapY);
  }
  ctx.stroke();

  // 경찰
  const chaseDist = playerDistance - chaseDistance;
  const chaseRoad = getRoadData(chaseDist);
  const cx = 90 + chaseRoad.x * 0.35;
  const cy = 135 - chaseDist * scale;
  ctx.fillStyle = "#ff0033";
  ctx.beginPath();
  ctx.arc(cx, THREE.MathUtils.clamp(cy, 5, 135), 4.5, 0, Math.PI * 2);
  ctx.fill();

  // 플레이어
  const pRoad = getRoadData(playerDistance);
  const px = 90 + (pRoad.x + playerOffset) * 0.35;
  const py = 135 - playerDistance * scale;
  ctx.fillStyle = "#00f2fe";
  ctx.beginPath();
  ctx.arc(px, THREE.MathUtils.clamp(py, 5, 135), 5.5, 0, Math.PI * 2);
  ctx.fill();
}

/* 동적 카메라 추적 */
function updateCamera(dt) {
  const roadData = getRoadData(playerDistance);
  const backCamDist = 9.2;

  const targetCamPos = new THREE.Vector3(
    player.position.x - Math.sin(roadData.angle) * backCamDist,
    player.position.y + 4.8 + Math.sin(roadData.pitch) * 2,
    player.position.z + Math.cos(roadData.angle) * backCamDist
  );

  camera.position.lerp(targetCamPos, 0.15);

  const lookTarget = player.position.clone();
  lookTarget.y += 1.2;
  lookTarget.z -= Math.cos(roadData.angle) * 8;
  lookTarget.x += Math.sin(roadData.angle) * 8;
  camera.lookAt(lookTarget);

  camera.fov = 65 + (speed / maxSpeed) * 12;
  camera.updateProjectionMatrix();
}

/* 게임 상태 관리 */
function startGame() {
  message.style.display = "none";
  gameState = "playing";
  speed = 0;
  playerDistance = 0;
  playerOffset = 0;
  steerAngle = 0;
  boostAmount = 100;
  chaseDistance = 180;
}

function endGame(win) {
  gameState = win ? "win" : "gameover";
  message.style.display = "flex";

  if (win) playSound('win');
  else playSound('crash');

  message.innerHTML = `
    <div class="box">
      <h1>${win ? "🏁 VICTORY!" : "🚨 ARRESTED!"}</h1>
      <p style="font-size: 18px;">${win ? "축하합니다! 8,000m의 3D 입체 트랙을 완주하여 탈출 성공했습니다!" : "경찰 추격 차량에게 붙잡혔습니다!"}</p>
      <p>최종 점수: <b>${score}</b></p>
      <button onclick="startGame()">다시 도전하기</button>
    </div>
  `;
}

/* 애니메이션 메인 프레임 */
function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;

  if (gameState === "playing") {
    updatePlayer(dt);
    updateObstacles();
    updateChase(dt);
    checkCollisions();
    updateHUD();
    updateMinimap();
    updateCamera(dt);

    if (playerDistance >= roadLength) {
      endGame(true);
    }
  }

  renderer.render(scene, camera);
}

/* window onload 인스턴스 실행 */
window.onload = () => {
  initThree();
  createTrack();

  player = createCar(0x0072ff, false);
  scene.add(player);

  createObstacles();

  chaseCar = createCar(0x0a0d12, true);
  scene.add(chaseCar);

  setupControls();

  camera.position.set(0, 5, 10);
  camera.lookAt(0, 0, 0);

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  animate(performance.now());
};
</script>
