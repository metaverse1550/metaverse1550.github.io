<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>우주비행사 서바이버 (Space Astronaut Runner)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b071e;
            font-family: 'Fredoka', 'Malgun Gothic', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* Custom UI Glassmorphism & Neon Glow Effects */
        .glass-panel {
            background: rgba(20, 15, 45, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 110, 220, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(120, 50, 255, 0.15);
        }
        .glow-title {
            text-shadow: 0 0 18px rgba(0, 240, 255, 0.9), 0 0 35px rgba(236, 72, 153, 0.8), 0 0 50px rgba(147, 51, 234, 0.6);
        }
        .glow-btn {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease-in-out;
        }
        .glow-btn:hover {
            box-shadow: 0 0 35px rgba(0, 230, 255, 0.9), 0 0 15px rgba(236, 72, 153, 0.8);
            transform: translateY(-2px) scale(1.02);
        }
        .glow-btn:active {
            transform: translateY(1px) scale(0.98);
        }
        /* Item Bar Animations */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 10px currentColor); }
            50% { opacity: 0.6; filter: drop-shadow(0 0 3px currentColor); }
        }
        .pulse-glow {
            animation: pulseGlow 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden text-white">

    <!-- GAME CANVAS CONTAINER -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- START UI OVERLAY -->
    <div id="start-overlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md">
        <div class="glass-panel rounded-3xl p-8 md:p-12 max-w-lg w-full text-center border border-cyan-400/40">
            <div class="inline-block p-3 rounded-2xl bg-cyan-500/20 border border-cyan-300/40 mb-4 animate-bounce">
                <svg class="w-12 h-12 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold font-orbitron tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-fuchsia-400 to-amber-300 mb-2 glow-title">
                SPACE SURVIVOR
            </h1>
            <p class="text-purple-200 text-sm md:text-base mb-6 font-medium">화려한 우주 속 무한 코스를 달리고 장애물을 피하세요!</p>

            <div class="bg-slate-900/70 rounded-xl p-4 mb-8 text-left text-xs md:text-sm text-slate-200 space-y-2 border border-purple-500/30">
                <div class="flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <span class="px-2 py-0.5 bg-slate-800 rounded font-mono font-bold text-cyan-300">←</span> 
                        <span class="px-2 py-0.5 bg-slate-800 rounded font-mono font-bold text-cyan-300">→</span> / 
                        <span class="px-2 py-0.5 bg-slate-800 rounded font-mono font-bold text-cyan-300">A</span> 
                        <span class="px-2 py-0.5 bg-slate-800 rounded font-mono font-bold text-cyan-300">D</span>
                    </span>
                    <span>레인 이동 (좌 / 우)</span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="px-3 py-0.5 bg-slate-800 rounded font-mono font-bold text-cyan-300">SpaceBar</span>
                    <span>점프</span>
                </div>
                <div class="pt-2 border-t border-purple-800/50 text-purple-300 text-center text-xs">
                    💡 모바일에서는 화면 아래의 터치 버튼을 이용하세요!
                </div>
            </div>

            <button id="btn-start" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-indigo-600 font-bold text-xl text-white tracking-wider glow-btn cursor-pointer">
                게임 시작 (START)
            </button>
        </div>
    </div>

    <!-- HUD OVERLAY (PLAYING) -->
    <div id="hud-overlay" class="absolute inset-0 z-10 pointer-events-none p-4 md:p-6 flex flex-col justify-between hidden">
        <!-- TOP HUD -->
        <div class="flex justify-between items-start gap-4">
            <!-- SCORE & DISTANCE -->
            <div class="glass-panel rounded-2xl p-3 md:p-4 min-w-[140px] md:min-w-[180px]">
                <div class="text-xs uppercase tracking-wider text-cyan-300 font-bold mb-0.5">SCORE</div>
                <div id="hud-score" class="text-2xl md:text-3xl font-black font-orbitron text-white tracking-tight">0</div>
                <div class="flex justify-between items-center mt-1 text-xs text-purple-200 font-medium">
                    <span>최고: <span id="hud-highscore" class="text-amber-300 font-bold font-orbitron">0</span></span>
                    <span><span id="hud-distance" class="text-white">0</span>m</span>
                </div>
            </div>

            <!-- COINS & SPEED -->
            <div class="glass-panel rounded-2xl p-3 md:p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-400/20 border border-amber-300/50 flex items-center justify-center text-amber-300 text-xl font-bold animate-pulse">
                    🪙
                </div>
                <div>
                    <div class="text-xs uppercase tracking-wider text-amber-300 font-bold">COINS</div>
                    <div id="hud-coins" class="text-2xl font-black font-orbitron text-amber-300">0</div>
                </div>
            </div>
        </div>

        <!-- ACTIVE ITEM STATUS TIMERS (LEFT SIDE) -->
        <div id="hud-items" class="flex flex-col gap-2 max-w-[220px]">
            <!-- Dynamic Item Cards dynamically injected here -->
        </div>

        <!-- MOBILE TOUCH CONTROLS -->
        <div class="pointer-events-auto flex justify-between items-end md:hidden pb-2 px-2">
            <div class="flex gap-2">
                <button id="btn-left" class="w-16 h-16 rounded-2xl glass-panel active:bg-cyan-500/50 text-2xl flex items-center justify-center active:scale-95 transition-transform">
                    ◀
                </button>
                <button id="btn-right" class="w-16 h-16 rounded-2xl glass-panel active:bg-cyan-500/50 text-2xl flex items-center justify-center active:scale-95 transition-transform">
                    ▶
                </button>
            </div>
            <button id="btn-jump" class="w-20 h-20 rounded-full bg-gradient-to-tr from-cyan-400 via-fuchsia-500 to-purple-600 border-2 border-white/50 active:scale-90 text-sm font-bold shadow-lg shadow-cyan-500/40 flex items-center justify-center">
                JUMP
            </button>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameover-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-4 bg-slate-950/85 backdrop-blur-lg hidden">
        <div class="glass-panel rounded-3xl p-8 md:p-10 max-w-md w-full text-center border border-rose-500/40 animate-fade-in">
            <div class="inline-block px-4 py-1.5 rounded-full bg-rose-500/20 border border-rose-400/40 text-rose-300 text-xs font-bold uppercase tracking-widest mb-3">
                MISSION FAILED
            </div>
            <h2 class="text-4xl md:text-5xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-fuchsia-300 to-amber-300 mb-6 glow-title">
                GAME OVER
            </h2>

            <!-- STATS CONTAINER -->
            <div class="bg-slate-900/80 rounded-2xl p-4 mb-6 space-y-3 border border-purple-800/40 text-left">
                <div class="flex justify-between items-center">
                    <span class="text-slate-300 text-sm">최종 점수 (Score)</span>
                    <span id="go-score" class="text-2xl font-black font-orbitron text-cyan-300">0</span>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-purple-900/50">
                    <span class="text-slate-300 text-sm">이동 거리 (Distance)</span>
                    <span id="go-distance" class="text-lg font-bold font-orbitron text-slate-100">0 m</span>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-purple-900/50">
                    <span class="text-slate-300 text-sm">획득 코인 (Coins)</span>
                    <span id="go-coins" class="text-lg font-bold font-orbitron text-amber-300">0</span>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-purple-900/50">
                    <span class="text-slate-300 text-sm">최고 기록 (Best)</span>
                    <span id="go-highscore" class="text-xl font-bold font-orbitron text-emerald-400">0</span>
                </div>
            </div>

            <button id="btn-restart" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-purple-600 font-bold text-lg text-white tracking-wider glow-btn cursor-pointer">
                다시 시작 (SpaceBar)
            </button>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // ==========================================
        // 1. CONFIG: Game balance & Parameters
        // ==========================================
        const CONFIG = {
            // Lanes mapped to X coordinates (3D 카메라 시점에 맞춰 +3.2: 화면 왼쪽, 0: 중앙, -3.2: 화면 오른쪽)
            lanes: [3.2, 0, -3.2],
            laneChangeSpeed: 20.0,
            
            // Movement & Physics
            baseSpeed: 22.0,
            maxSpeed: 52.0,
            speedIncreaseRate: 0.25, // speed increase per 100 meters
            gravity: -42.0,
            jumpVelocity: 15.5,
            superJumpVelocity: 23.5,

            // Course & Spawning
            segmentLength: 50,
            spawnDistance: 160,
            despawnDistance: -25,
            minObstacleGap: 13.5,

            // Items & Duration (Seconds)
            itemDuration: 8.0,
            magnetRadius: 15.0,
            
            // Scoring
            scoreMultiplier: 10,
            coinScoreValue: 50
        };

        // ==========================================
        // 2. WEB AUDIO SYNTHESIZER (Sound Effects)
        // ==========================================
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            jump() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                } catch(e){}
            }
            coin() {
                this.playTone(880, 'sine', 0.08, 0.12);
                setTimeout(() => this.playTone(1320, 'sine', 0.12, 0.12), 60);
            }
            item() {
                const notes = [440, 554, 659, 880];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.15, 0.1), idx * 50);
                });
            }
            shieldBreak() {
                this.playTone(180, 'sawtooth', 0.3, 0.2);
            }
            hit() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.4);
                } catch(e){}
            }
        }
        const sfx = new SoundFX();

        // ==========================================
        // 3. INPUT MANAGER (Corrected Controls)
        // ==========================================
        class InputManager {
            constructor() {
                this.bufferedInput = null;
                
                window.addEventListener('keydown', (e) => this.onKeyDown(e));
                
                // Mobile buttons - Corrected Left / Right binding
                document.getElementById('btn-left').addEventListener('click', () => this.buffer('left'));
                document.getElementById('btn-right').addEventListener('click', () => this.buffer('right'));
                document.getElementById('btn-jump').addEventListener('click', () => this.buffer('jump'));
            }

            onKeyDown(e) {
                sfx.init();
                // Fixed key direction mapping as requested by user
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                    this.buffer('left');
                } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                    this.buffer('right');
                } else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    this.buffer('jump');
                    e.preventDefault();
                }
            }

            buffer(action) {
                this.bufferedInput = action;
            }

            consumeBuffer() {
                const act = this.bufferedInput;
                this.bufferedInput = null;
                return act;
            }
        }
        const INPUT = new InputManager();

        // ==========================================
        // 4. THREE.JS SCENE SETUP & VIBRANT LIGHTING
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Colorful Cosmic Space Atmosphere Fog
        scene.fog = new THREE.FogExp2(0x130b2e, 0.0075);
        scene.background = new THREE.Color(0x0b071e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 350);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting: Vibrant Ambient + Glowing Directional + Point Lights
        const ambientLight = new THREE.AmbientLight(0x8a70d6, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
        dirLight.position.set(20, 45, -15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 160;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        // Vibrant Magenta & Cyan Pointlights for glowing space aesthetic
        const cyanGlow = new THREE.PointLight(0x00f0ff, 2.0, 60);
        cyanGlow.position.set(-10, 8, 10);
        scene.add(cyanGlow);

        const magentaGlow = new THREE.PointLight(0xff00b7, 2.0, 60);
        magentaGlow.position.set(10, 8, 20);
        scene.add(magentaGlow);

        // ==========================================
        // 5. PLAYER (SD Astronaut Character)
        // ==========================================
        class AstronautPlayer {
            constructor() {
                this.group = new THREE.Group();
                this.currentLane = 1; // 0 (Left -3.2), 1 (Middle 0), 2 (Right +3.2)
                this.targetX = CONFIG.lanes[1];
                this.y = 0;
                this.velocityY = 0;
                this.isGrounded = true;

                this.buildModel();
                scene.add(this.group);

                // Shield visual mesh (Glowing Cyber Energy Field)
                const shieldGeo = new THREE.IcosahedronGeometry(1.35, 2);
                const shieldMat = new THREE.MeshStandardMaterial({
                    color: 0x00f0ff,
                    transparent: true,
                    opacity: 0.45,
                    wireframe: true,
                    emissive: 0x00d2ff,
                    emissiveIntensity: 0.8
                });
                this.shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
                this.shieldMesh.visible = false;
                this.group.add(this.shieldMesh);

                this.runAnimTime = 0;
            }

            buildModel() {
                // Materials
                const suitMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25 });
                const cyanMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, roughness: 0.2, emissive: 0x0088cc, emissiveIntensity: 0.3 });
                const visorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.95, roughness: 0.05 });
                const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b });
                const packMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });

                // Head / Helmet (Cute SD Proportion)
                const headGeo = new THREE.SphereGeometry(0.65, 16, 16);
                const head = new THREE.Mesh(headGeo, suitMat);
                head.position.y = 1.1;
                head.castShadow = true;
                this.group.add(head);

                // Visor with glowing reflection
                const visorGeo = new THREE.SphereGeometry(0.5, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
                const visor = new THREE.Mesh(visorGeo, visorMat);
                visor.rotation.x = Math.PI / 2;
                visor.position.set(0, 1.15, 0.22);
                visor.scale.set(0.9, 1.0, 0.7);
                this.group.add(visor);

                // Helmet Ears
                const earGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.1, 12);
                const leftEar = new THREE.Mesh(earGeo, cyanMat);
                leftEar.rotation.z = Math.PI / 2;
                leftEar.position.set(-0.65, 1.1, 0);
                const rightEar = leftEar.clone();
                rightEar.position.x = 0.65;
                this.group.add(leftEar);
                this.group.add(rightEar);

                // Body (SD Torso)
                const bodyGeo = new THREE.CylinderGeometry(0.45, 0.38, 0.6, 16);
                const body = new THREE.Mesh(bodyGeo, suitMat);
                body.position.y = 0.5;
                body.castShadow = true;
                this.group.add(body);

                // Chest Pad Detail
                const padGeo = new THREE.BoxGeometry(0.35, 0.25, 0.1);
                const pad = new THREE.Mesh(padGeo, cyanMat);
                pad.position.set(0, 0.55, 0.42);
                this.group.add(pad);

                // Jetpack Backpack
                const packGeo = new THREE.BoxGeometry(0.5, 0.6, 0.25);
                const pack = new THREE.Mesh(packGeo, packMat);
                pack.position.set(0, 0.65, -0.4);
                pack.castShadow = true;
                this.group.add(pack);

                // Limbs Group for Running Animation
                this.leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.45), suitMat);
                this.leftArm.position.set(-0.55, 0.55, 0);
                this.rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.45), suitMat);
                this.rightArm.position.set(0.55, 0.55, 0);

                this.leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.4), darkMat);
                this.leftLeg.position.set(-0.22, 0.18, 0);
                this.rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.4), darkMat);
                this.rightLeg.position.set(0.22, 0.18, 0);

                this.group.add(this.leftArm, this.rightArm, this.leftLeg, this.rightLeg);

                // Shadow mesh projector under player
                const shadowGeo = new THREE.PlaneGeometry(1.2, 1.2);
                const shadowMat = new THREE.MeshBasicMaterial({
                    color: 0x000000,
                    transparent: true,
                    opacity: 0.45,
                    depthWrite: false
                });
                this.shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
                this.shadowPlane.rotation.x = -Math.PI / 2;
                this.shadowPlane.position.y = 0.02;
                scene.add(this.shadowPlane);
            }

            update(delta, currentSpeed, hasSuperJump) {
                // 1. Lane Movement Handling (A / ← = 화면 왼쪽, D / → = 화면 오른쪽)
                const inputAct = INPUT.consumeBuffer();
                if (inputAct === 'left' && this.currentLane > 0) {
                    this.currentLane--;
                    this.targetX = CONFIG.lanes[this.currentLane];
                } else if (inputAct === 'right' && this.currentLane < CONFIG.lanes.length - 1) {
                    this.currentLane++;
                    this.targetX = CONFIG.lanes[this.currentLane];
                } else if (inputAct === 'jump' && this.isGrounded) {
                    this.jump(hasSuperJump);
                }

                // Smooth horizontal Lerp to target lane
                this.group.position.x += (this.targetX - this.group.position.x) * Math.min(1.0, delta * CONFIG.laneChangeSpeed);

                // Tilt and rotate astronaut intuitively towards the moving direction
                const laneDiff = this.targetX - this.group.position.x;
                this.group.rotation.z = laneDiff * 0.12; // Roll tilt
                this.group.rotation.y = laneDiff * 0.08; // Yaw face direction match

                // 2. Vertical Jump / Gravity Physics
                if (!this.isGrounded) {
                    this.velocityY += CONFIG.gravity * delta;
                    this.y += this.velocityY * delta;

                    if (this.y <= 0) {
                        this.y = 0;
                        this.velocityY = 0;
                        this.isGrounded = true;
                    }
                }
                this.group.position.y = this.y;

                // Update shadow scale & position
                this.shadowPlane.position.x = this.group.position.x;
                this.shadowPlane.position.z = this.group.position.z;
                const shadowScale = Math.max(0.2, 1.0 - (this.y / 6.0));
                this.shadowPlane.scale.set(shadowScale, shadowScale, shadowScale);
                this.shadowPlane.material.opacity = 0.45 * shadowScale;

                // 3. Running Animation
                if (this.isGrounded) {
                    this.runAnimTime += delta * currentSpeed * 0.85;
                    this.leftArm.rotation.x = Math.sin(this.runAnimTime) * 0.7;
                    this.rightArm.rotation.x = -Math.sin(this.runAnimTime) * 0.7;
                    this.leftLeg.rotation.x = -Math.sin(this.runAnimTime) * 0.8;
                    this.rightLeg.rotation.x = Math.sin(this.runAnimTime) * 0.8;
                } else {
                    // Air jump pose
                    this.leftArm.rotation.x = -1.2;
                    this.rightArm.rotation.x = -1.2;
                    this.leftLeg.rotation.x = 0.6;
                    this.rightLeg.rotation.x = -0.6;
                }
            }

            jump(hasSuperJump) {
                this.velocityY = hasSuperJump ? CONFIG.superJumpVelocity : CONFIG.jumpVelocity;
                this.isGrounded = false;
                sfx.jump();
            }

            reset() {
                this.currentLane = 1;
                this.targetX = CONFIG.lanes[1];
                this.group.position.set(this.targetX, 0, 0);
                this.y = 0;
                this.velocityY = 0;
                this.isGrounded = true;
                this.shieldMesh.visible = false;
            }
        }

        // ==========================================
        // 6. CAMERA SYSTEM (Smooth 3rd Person Chase)
        // ==========================================
        class ChaseCamera {
            constructor() {
                this.offset = new THREE.Vector3(0, 4.3, -7.5);
                this.lookOffset = new THREE.Vector3(0, 1.8, 10);
            }

            update(playerPos) {
                const targetCamX = playerPos.x * 0.35;
                camera.position.x += (targetCamX - camera.position.x) * 0.12;
                camera.position.y = playerPos.y + this.offset.y;
                camera.position.z = playerPos.z + this.offset.z;

                const lookTarget = new THREE.Vector3(
                    playerPos.x * 0.18,
                    playerPos.y * 0.5 + this.lookOffset.y,
                    playerPos.z + this.lookOffset.z
                );
                camera.lookAt(lookTarget);
            }
        }

        // ==========================================
        // 7. ENVIRONMENT & COLORFUL NEBULA SPACE TRACK
        // ==========================================
        class SpaceEnvironment {
            constructor() {
                this.trackSegments = [];
                this.backgroundPlanets = [];
                this.starField = null;
                this.nebulaClouds = [];
                
                this.createSkyboxStars();
                this.createBackgroundPlanets();
                this.createNebulaClouds();
                this.initTrack();
            }

            createSkyboxStars() {
                const starGeo = new THREE.BufferGeometry();
                const count = 1600;
                const pos = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    pos[i * 3] = (Math.random() - 0.5) * 450;
                    pos[i * 3 + 1] = (Math.random() - 0.5) * 450;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 450;

                    // Neon Cosmic colors (Cyan, Magenta, Bright Yellow, Pure Blue)
                    const choice = Math.random();
                    if (choice < 0.35) { // Cyan
                        colors[i * 3] = 0.1; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 1.0;
                    } else if (choice < 0.7) { // Neon Pink/Purple
                        colors[i * 3] = 0.95; colors[i * 3 + 1] = 0.2; colors[i * 3 + 2] = 0.95;
                    } else { // Golden Yellow / White
                        colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 0.5;
                    }
                }

                starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const starMat = new THREE.PointsMaterial({
                    size: 1.5,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.9
                });

                this.starField = new THREE.Points(starGeo, starMat);
                scene.add(this.starField);
            }

            createBackgroundPlanets() {
                // Giant Glowing Saturn with Multi-layer Neon Rings
                const planetGroup = new THREE.Group();
                const pGeo = new THREE.SphereGeometry(22, 32, 32);
                const pMat = new THREE.MeshStandardMaterial({
                    color: 0x8b5cf6,
                    roughness: 0.5,
                    emissive: 0x4c1d95,
                    emissiveIntensity: 0.4
                });
                const planet = new THREE.Mesh(pGeo, pMat);

                // Inner Ring
                const ringGeo1 = new THREE.RingGeometry(26, 35, 32);
                const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.65 });
                const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
                ring1.rotation.x = Math.PI / 2.3;

                // Outer Ring
                const ringGeo2 = new THREE.RingGeometry(37, 44, 32);
                const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xf43f5e, side: THREE.DoubleSide, transparent: true, opacity: 0.45 });
                const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
                ring2.rotation.x = Math.PI / 2.3;

                planetGroup.add(planet, ring1, ring2);
                planetGroup.position.set(-95, 45, 200);
                scene.add(planetGroup);

                // Vibrant Glowing Crystal Moon
                const mGeo = new THREE.IcosahedronGeometry(12, 2);
                const mMat = new THREE.MeshStandardMaterial({
                    color: 0x38bdf8,
                    emissive: 0x0284c7,
                    emissiveIntensity: 0.6,
                    roughness: 0.3
                });
                const moon = new THREE.Mesh(mGeo, mMat);
                moon.position.set(105, 30, 240);
                scene.add(moon);
            }

            createNebulaClouds() {
                // Floating Soft Space Nebulae for rich atmospheric glow
                const colors = [0xd946ef, 0x06b6d4, 0x6366f1];
                for (let i = 0; i < 8; i++) {
                    const nebGeo = new THREE.SphereGeometry(20 + Math.random() * 15, 12, 12);
                    const color = colors[i % colors.length];
                    const nebMat = new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: 0.12,
                        depthWrite: false
                    });
                    const cloud = new THREE.Mesh(nebGeo, nebMat);
                    cloud.position.set(
                        (Math.random() - 0.5) * 200,
                        (Math.random() - 0.5) * 60 + 20,
                        i * 50
                    );
                    scene.add(cloud);
                    this.nebulaClouds.push(cloud);
                }
            }

            initTrack() {
                for (let i = 0; i < 6; i++) {
                    this.spawnTrackSegment(i * CONFIG.segmentLength);
                }
            }

            spawnTrackSegment(zPos) {
                const group = new THREE.Group();
                group.position.z = zPos;

                // Main Cyber-Grid Sci-Fi Runway
                const trackWidth = 11.5;
                const platformGeo = new THREE.BoxGeometry(trackWidth, 0.4, CONFIG.segmentLength);
                const platformMat = new THREE.MeshStandardMaterial({
                    color: 0x1e1b4b,
                    roughness: 0.3,
                    metalness: 0.7,
                    emissive: 0x0f172a,
                    emissiveIntensity: 0.3
                });
                const platform = new THREE.Mesh(platformGeo, platformMat);
                platform.position.set(0, -0.2, CONFIG.segmentLength / 2);
                platform.receiveShadow = true;
                group.add(platform);

                // Neon Lane Dividers with Pulsing Glow
                CONFIG.lanes.forEach((laneX) => {
                    const lineGeo = new THREE.PlaneGeometry(0.14, CONFIG.segmentLength);
                    const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.55 });
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(laneX, 0.01, CONFIG.segmentLength / 2);
                    group.add(line);
                });

                // Glowing Neon Pink Side Beams
                const railGeo = new THREE.BoxGeometry(0.35, 0.35, CONFIG.segmentLength);
                const railMat = new THREE.MeshStandardMaterial({
                    color: 0xf43f5e,
                    emissive: 0xe11d48,
                    emissiveIntensity: 0.8
                });
                const leftRail = new THREE.Mesh(railGeo, railMat);
                leftRail.position.set(-trackWidth / 2, 0.12, CONFIG.segmentLength / 2);
                const rightRail = leftRail.clone();
                rightRail.position.x = trackWidth / 2;
                group.add(leftRail, rightRail);

                scene.add(group);
                this.trackSegments.push(group);
            }

            update(playerZ) {
                if (this.starField) this.starField.position.z = playerZ;

                // Move nebula clouds dynamically along with player progress
                this.nebulaClouds.forEach((cloud) => {
                    if (cloud.position.z < playerZ - 50) {
                        cloud.position.z += 400;
                    }
                });

                this.trackSegments.forEach((seg) => {
                    if (seg.position.z + CONFIG.segmentLength < playerZ + CONFIG.despawnDistance) {
                        seg.position.z += this.trackSegments.length * CONFIG.segmentLength;
                    }
                });
            }
        }

        // ==========================================
        // 8. ENHANCED PRETTY OBSTACLES (Meteorites & Debris)
        // ==========================================
        class ObstacleManager {
            constructor() {
                this.obstacles = [];
                this.lastSpawnZ = 35;

                // High-detail Asteroid Geometry with magma vein overlay
                this.asteroidGeo = new THREE.DodecahedronGeometry(1.25, 2);
                const pos = this.asteroidGeo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    pos.setXYZ(i, 
                        pos.getX(i) * (0.8 + Math.random() * 0.4),
                        pos.getY(i) * (0.8 + Math.random() * 0.4),
                        pos.getZ(i) * (0.8 + Math.random() * 0.4)
                    );
                }
                this.asteroidGeo.computeVertexNormals();

                // Rich glowing meteorite rock material
                this.rockMat = new THREE.MeshStandardMaterial({
                    color: 0x475569,
                    roughness: 0.8,
                    metalness: 0.2
                });

                // Glowing Magma Core Inner Shell for Asteroid
                this.magmaMat = new THREE.MeshStandardMaterial({
                    color: 0xff3300,
                    emissive: 0xff5500,
                    emissiveIntensity: 0.8,
                    roughness: 0.3
                });

                // Cyber Satellite Metallic Materials
                this.satelliteBodyMat = new THREE.MeshStandardMaterial({
                    color: 0xf8fafc,
                    metalness: 0.95,
                    roughness: 0.1,
                    emissive: 0x38bdf8,
                    emissiveIntensity: 0.3
                });
                this.solarPanelMat = new THREE.MeshStandardMaterial({
                    color: 0x0284c7,
                    metalness: 0.9,
                    roughness: 0.1,
                    emissive: 0x0369a1,
                    emissiveIntensity: 0.5
                });
                this.beaconLedMat = new THREE.MeshStandardMaterial({
                    color: 0xf43f5e,
                    emissive: 0xf43f5e,
                    emissiveIntensity: 1.2
                });
            }

            spawnObstacles(playerZ) {
                while (this.lastSpawnZ < playerZ + CONFIG.spawnDistance) {
                    this.lastSpawnZ += CONFIG.minObstacleGap + Math.random() * 9.0;

                    const laneIndices = [0, 1, 2];
                    const numObstacles = Math.random() < 0.4 ? 2 : 1;
                    
                    for (let i = laneIndices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [laneIndices[i], laneIndices[j]] = [laneIndices[j], laneIndices[i]];
                    }

                    for (let i = 0; i < numObstacles; i++) {
                        const laneIndex = laneIndices[i];
                        const laneX = CONFIG.lanes[laneIndex];
                        const isDebris = Math.random() > 0.48;

                        if (!isDebris) {
                            // BEAUTIFUL METEORITE WITH GLOWING CRYSTAL/MAGMA VEINS
                            const astGroup = new THREE.Group();
                            const scale = 0.95 + Math.random() * 0.35;

                            // Outer Rock Shell
                            const rockMesh = new THREE.Mesh(this.asteroidGeo, this.rockMat);
                            rockMesh.scale.set(scale, scale, scale);
                            rockMesh.castShadow = true;
                            astGroup.add(rockMesh);

                            // Inner Glowing Magma Core / Crystal Spikes
                            const magmaMesh = new THREE.Mesh(this.asteroidGeo, this.magmaMat);
                            magmaMesh.scale.set(scale * 0.88, scale * 0.88, scale * 0.88);
                            astGroup.add(magmaMesh);

                            // Glowing Crystal Spikes extending out
                            const spikeGeo = new THREE.ConeGeometry(0.25 * scale, 1.2 * scale, 5);
                            const crystalMat = new THREE.MeshStandardMaterial({
                                color: 0x00ffff,
                                emissive: 0x00f0ff,
                                emissiveIntensity: 0.9,
                                transparent: true,
                                opacity: 0.85
                            });
                            for (let s = 0; s < 3; s++) {
                                const spike = new THREE.Mesh(spikeGeo, crystalMat);
                                spike.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                                spike.position.set((Math.random() - 0.5) * scale, (Math.random() - 0.5) * scale, (Math.random() - 0.5) * scale);
                                astGroup.add(spike);
                            }

                            astGroup.position.set(laneX, 0.85 * scale, this.lastSpawnZ);
                            
                            this.obstacles.push({
                                mesh: astGroup,
                                type: 'asteroid',
                                radius: 0.88 * scale,
                                rotAxis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(),
                                rotSpeed: (Math.random() - 0.5) * 2.2
                            });
                            scene.add(astGroup);
                        } else {
                            // HIGH-TECH SATELLITE DEBRIS WITH SOLAR PANELS & BLINKING BEACONS
                            const satGroup = new THREE.Group();

                            // Satellite Core Box
                            const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.3), this.satelliteBodyMat);
                            body.castShadow = true;
                            satGroup.add(body);

                            // Solar Wings
                            const wingGeo = new THREE.BoxGeometry(1.8, 0.08, 0.7);
                            const leftWing = new THREE.Mesh(wingGeo, this.solarPanelMat);
                            leftWing.position.x = -1.3;
                            const rightWing = leftWing.clone();
                            rightWing.position.x = 1.3;
                            satGroup.add(leftWing, rightWing);

                            // Blinking Red Warning Beacons
                            const beaconGeo = new THREE.SphereGeometry(0.18, 8, 8);
                            const beaconTop = new THREE.Mesh(beaconGeo, this.beaconLedMat);
                            beaconTop.position.set(0, 0.8, 0);
                            satGroup.add(beaconTop);

                            // High / Low barrier positioning
                            const highObstacle = Math.random() < 0.38;
                            const posY = highObstacle ? 2.6 : 0.9;

                            satGroup.position.set(laneX, posY, this.lastSpawnZ);

                            this.obstacles.push({
                                mesh: satGroup,
                                type: 'debris',
                                radius: 1.15,
                                beacon: beaconTop,
                                rotAxis: new THREE.Vector3(0, 1, 0),
                                rotSpeed: (Math.random() - 0.5) * 1.8
                            });
                            scene.add(satGroup);
                        }
                    }
                }
            }

            update(delta, playerZ) {
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    const obs = this.obstacles[i];
                    obs.mesh.rotateOnAxis(obs.rotAxis, obs.rotSpeed * delta);

                    // Pulse blinking warning LED on satellites
                    if (obs.beacon) {
                        obs.beacon.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.012) * 0.8;
                    }

                    if (obs.mesh.position.z < playerZ + CONFIG.despawnDistance) {
                        scene.remove(obs.mesh);
                        this.obstacles.splice(i, 1);
                    }
                }
            }

            reset() {
                this.obstacles.forEach(obs => scene.remove(obs.mesh));
                this.obstacles = [];
                this.lastSpawnZ = 35;
            }
        }

        // ==========================================
        // 9. COINS & ITEMS SYSTEM
        // ==========================================
        class CollectibleManager {
            constructor() {
                this.coins = [];
                this.items = [];
                this.lastCoinZ = 20;

                // Golden Coin Geometry & Material
                this.coinGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.12, 16);
                this.coinMat = new THREE.MeshStandardMaterial({
                    color: 0xfacc15,
                    metalness: 0.95,
                    roughness: 0.1,
                    emissive: 0xeab308,
                    emissiveIntensity: 0.5
                });

                // Octahedron Gem Power-Up Items
                this.itemGeo = new THREE.OctahedronGeometry(0.75, 0);
            }

            spawnCollectibles(playerZ) {
                while (this.lastCoinZ < playerZ + CONFIG.spawnDistance) {
                    this.lastCoinZ += 8.0 + Math.random() * 11.0;

                    const laneX = CONFIG.lanes[Math.floor(Math.random() * CONFIG.lanes.length)];
                    const isItem = Math.random() < 0.18;

                    if (isItem) {
                        const types = ['jump', 'shield', 'magnet'];
                        const itemType = types[Math.floor(Math.random() * types.length)];

                        let itemColor = 0x22c55e; // Jump: Green
                        if (itemType === 'shield') itemColor = 0x06b6d4; // Shield: Cyan
                        if (itemType === 'magnet') itemColor = 0xf59e0b; // Magnet: Amber

                        const mat = new THREE.MeshStandardMaterial({
                            color: itemColor,
                            emissive: itemColor,
                            emissiveIntensity: 0.7,
                            roughness: 0.15
                        });

                        const mesh = new THREE.Mesh(this.itemGeo, mat);
                        mesh.position.set(laneX, 1.25, this.lastCoinZ);

                        this.items.push({
                            mesh: mesh,
                            type: itemType,
                            radius: 0.9
                        });
                        scene.add(mesh);
                    } else {
                        const count = 3 + Math.floor(Math.random() * 3);
                        for (let k = 0; k < count; k++) {
                            const coinMesh = new THREE.Mesh(this.coinGeo, this.coinMat);
                            coinMesh.rotation.x = Math.PI / 2;
                            coinMesh.position.set(laneX, 1.0, this.lastCoinZ + (k * 2.2));
                            coinMesh.castShadow = true;

                            this.coins.push({
                                mesh: coinMesh,
                                radius: 0.65
                            });
                            scene.add(coinMesh);
                        }
                    }
                }
            }

            update(delta, player, activeItems) {
                const playerPos = player.group.position;

                // 1. Coins & Magnet Attraction
                for (let i = this.coins.length - 1; i >= 0; i--) {
                    const c = this.coins[i];
                    c.mesh.rotation.z += 3.2 * delta;

                    if (activeItems.magnet > 0) {
                        const dist = c.mesh.position.distanceTo(playerPos);
                        if (dist < CONFIG.magnetRadius) {
                            c.mesh.position.lerp(playerPos, delta * 11.0);
                        }
                    }

                    if (c.mesh.position.distanceTo(playerPos) < (c.radius + 0.65)) {
                        sfx.coin();
                        EFFECTS.createSparkles(c.mesh.position, 0xfacc15);
                        scene.remove(c.mesh);
                        this.coins.splice(i, 1);
                        GAME.addCoin();
                        continue;
                    }

                    if (c.mesh.position.z < playerPos.z + CONFIG.despawnDistance) {
                        scene.remove(c.mesh);
                        this.coins.splice(i, 1);
                    }
                }

                // 2. Items Pickup
                for (let i = this.items.length - 1; i >= 0; i--) {
                    const it = this.items[i];
                    it.mesh.rotation.y += 2.8 * delta;
                    it.mesh.position.y = 1.25 + Math.sin(Date.now() * 0.006) * 0.22;

                    if (it.mesh.position.distanceTo(playerPos) < (it.radius + 0.75)) {
                        sfx.item();
                        EFFECTS.createSparkles(it.mesh.position, 0xffffff);
                        scene.remove(it.mesh);
                        GAME.activateItem(it.type);
                        this.items.splice(i, 1);
                        continue;
                    }

                    if (it.mesh.position.z < playerPos.z + CONFIG.despawnDistance) {
                        scene.remove(it.mesh);
                        this.items.splice(i, 1);
                    }
                }
            }

            reset() {
                this.coins.forEach(c => scene.remove(c.mesh));
                this.items.forEach(it => scene.remove(it.mesh));
                this.coins = [];
                this.items = [];
                this.lastCoinZ = 20;
            }
        }

        // ==========================================
        // 10. VISUAL PARTICLES & EFFECTS SYSTEM
        // ==========================================
        class VisualEffects {
            constructor() {
                this.particles = [];
            }

            createSparkles(pos, colorHex) {
                const count = 14;
                const pGeo = new THREE.SphereGeometry(0.14, 6, 6);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });

                for (let i = 0; i < count; i++) {
                    const p = new THREE.Mesh(pGeo, pMat);
                    p.position.copy(pos);
                    
                    const vel = new THREE.Vector3(
                        (Math.random() - 0.5) * 9.0,
                        Math.random() * 7.0 + 2.0,
                        (Math.random() - 0.5) * 9.0
                    );

                    this.particles.push({
                        mesh: p,
                        velocity: vel,
                        life: 0.48
                    });
                    scene.add(p);
                }
            }

            update(delta) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.life -= delta;
                    p.mesh.position.addScaledVector(p.velocity, delta);
                    p.mesh.scale.multiplyScalar(0.91);

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        this.particles.splice(i, 1);
                    }
                }
            }

            reset() {
                this.particles.forEach(p => scene.remove(p.mesh));
                this.particles = [];
            }
        }
        const EFFECTS = new VisualEffects();

        // ==========================================
        // 11. MAIN GAME CONTROLLER & UI BINDINGS
        // ==========================================
        class Game {
            constructor() {
                this.state = 'START';
                this.score = 0;
                this.highScore = localStorage.getItem('space_runner_highscore') || 0;
                this.coins = 0;
                this.distance = 0;
                this.currentSpeed = CONFIG.baseSpeed;

                this.activeItems = {
                    jump: 0,
                    shield: 0,
                    magnet: 0
                };

                this.player = new AstronautPlayer();
                this.chaseCam = new ChaseCamera();
                this.environment = new SpaceEnvironment();
                this.obstacleManager = new ObstacleManager();
                this.collectibleManager = new CollectibleManager();

                this.bindUIEvents();
                this.updateUI();
            }

            bindUIEvents() {
                document.getElementById('btn-start').addEventListener('click', () => this.startGame());
                document.getElementById('btn-restart').addEventListener('click', () => this.startGame());

                window.addEventListener('keydown', (e) => {
                    if ((this.state === 'START' || this.state === 'GAMEOVER') && e.code === 'Space') {
                        this.startGame();
                    }
                });

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            startGame() {
                sfx.init();
                this.state = 'PLAYING';
                this.score = 0;
                this.coins = 0;
                this.distance = 0;
                this.currentSpeed = CONFIG.baseSpeed;

                this.activeItems = { jump: 0, shield: 0, magnet: 0 };

                this.player.reset();
                this.obstacleManager.reset();
                this.collectibleManager.reset();
                EFFECTS.reset();

                document.getElementById('start-overlay').classList.add('hidden');
                document.getElementById('gameover-overlay').classList.add('hidden');
                document.getElementById('hud-overlay').classList.remove('hidden');
            }

            activateItem(type) {
                if (type === 'shield') {
                    this.activeItems.shield = 1;
                    this.player.shieldMesh.visible = true;
                } else {
                    this.activeItems[type] = CONFIG.itemDuration;
                }
            }

            addCoin() {
                this.coins++;
                this.score += CONFIG.coinScoreValue;
            }

            gameOver() {
                sfx.hit();
                this.state = 'GAMEOVER';

                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('space_runner_highscore', this.highScore);
                }

                document.getElementById('go-score').innerText = Math.floor(this.score).toLocaleString();
                document.getElementById('go-distance').innerText = Math.floor(this.distance) + ' m';
                document.getElementById('go-coins').innerText = this.coins;
                document.getElementById('go-highscore').innerText = Math.floor(this.highScore).toLocaleString();

                document.getElementById('hud-overlay').classList.add('hidden');
                document.getElementById('gameover-overlay').classList.remove('hidden');
            }

            update(delta) {
                if (this.state !== 'PLAYING') return;

                this.distance += this.currentSpeed * delta;
                this.score = Math.floor(this.distance * CONFIG.scoreMultiplier) + (this.coins * CONFIG.coinScoreValue);
                this.currentSpeed = Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + (this.distance / 100.0) * CONFIG.speedIncreaseRate);

                this.player.group.position.z = this.distance;

                if (this.activeItems.jump > 0) this.activeItems.jump = Math.max(0, this.activeItems.jump - delta);
                if (this.activeItems.magnet > 0) this.activeItems.magnet = Math.max(0, this.activeItems.magnet - delta);

                this.player.update(delta, this.currentSpeed, this.activeItems.jump > 0);
                this.chaseCam.update(this.player.group.position);
                this.environment.update(this.distance);

                this.obstacleManager.spawnObstacles(this.distance);
                this.obstacleManager.update(delta, this.distance);

                this.collectibleManager.spawnCollectibles(this.distance);
                this.collectibleManager.update(delta, this.player, this.activeItems);

                EFFECTS.update(delta);

                this.checkCollisions();
                this.updateUI();
            }

            checkCollisions() {
                const playerPos = this.player.group.position.clone();
                playerPos.y += 0.8;

                for (let i = 0; i < this.obstacleManager.obstacles.length; i++) {
                    const obs = this.obstacleManager.obstacles[i];
                    const obsPos = obs.mesh.position.clone();

                    const dist = playerPos.distanceTo(obsPos);
                    if (dist < (obs.radius + 0.65)) {
                        if (this.activeItems.shield > 0) {
                            sfx.shieldBreak();
                            EFFECTS.createSparkles(obsPos, 0x00f0ff);
                            this.activeItems.shield = 0;
                            this.player.shieldMesh.visible = false;
                            
                            scene.remove(obs.mesh);
                            this.obstacleManager.obstacles.splice(i, 1);
                            break;
                        } else {
                            this.gameOver();
                            break;
                        }
                    }
                }
            }

            updateUI() {
                document.getElementById('hud-score').innerText = Math.floor(this.score).toLocaleString();
                document.getElementById('hud-highscore').innerText = Math.floor(this.highScore).toLocaleString();
                document.getElementById('hud-distance').innerText = Math.floor(this.distance);
                document.getElementById('hud-coins').innerText = this.coins;

                const itemsContainer = document.getElementById('hud-items');
                itemsContainer.innerHTML = '';

                if (this.activeItems.shield > 0) {
                    itemsContainer.appendChild(this.createItemCard('🛡️ 보호막 (Shield)', '∞', 'bg-cyan-500/20 text-cyan-300 border-cyan-400/40'));
                }
                if (this.activeItems.jump > 0) {
                    itemsContainer.appendChild(this.createItemCard('🚀 점프 강화 (Super Jump)', this.activeItems.jump.toFixed(1) + 's', 'bg-emerald-500/20 text-emerald-300 border-emerald-400/40'));
                }
                if (this.activeItems.magnet > 0) {
                    itemsContainer.appendChild(this.createItemCard('🧲 코인 자석 (Magnet)', this.activeItems.magnet.toFixed(1) + 's', 'bg-amber-500/20 text-amber-300 border-amber-400/40'));
                }
            }

            createItemCard(title, timerText, colorClass) {
                const div = document.createElement('div');
                div.className = `glass-panel rounded-xl px-3 py-1.5 flex justify-between items-center text-xs font-bold border ${colorClass} pulse-glow`;
                div.innerHTML = `<span>${title}</span><span class="font-orbitron font-black ml-2">${timerText}</span>`;
                return div;
            }
        }

        // ==========================================
        // 12. GAME LOOP (requestAnimationFrame)
        // ==========================================
        let GAME = null;
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const delta = Math.min((currentTime - lastTime) / 1000.0, 0.1);
            lastTime = currentTime;

            if (GAME) {
                GAME.update(delta);
            }

            renderer.render(scene, camera);
        }

        window.onload = () => {
            GAME = new Game();
            requestAnimationFrame(animate);
        };
    </script>
</body>
