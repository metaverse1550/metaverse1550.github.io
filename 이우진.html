<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Slasher - 다크 판타지 로그라이크</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #050508;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 1024px;
      height: 768px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 10px rgba(100, 50, 255, 0.2);
      border: 2px solid #2a2a38;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    /* UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 15, 22, 0.85);
      border: 1px solid rgba(80, 80, 120, 0.4);
      border-radius: 6px;
      padding: 10px 14px;
      backdrop-filter: blur(4px);
    }
    .bar-container {
      width: 200px;
      height: 14px;
      background: #1a1a24;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #3a3a4c;
      margin-top: 4px;
      position: relative;
    }
    .bar-fill-hp {
      height: 100%;
      background: linear-gradient(90deg, #a31d1d, #e63946);
      width: 100%;
      transition: width 0.2s ease-out;
    }
    .bar-fill-exp {
      height: 100%;
      background: linear-gradient(90deg, #1d7aa3, #4cc9f0);
      width: 0%;
      transition: width 0.2s ease-out;
    }
    .bar-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 2px #000;
    }
    .stats-summary {
      font-size: 12px;
      line-height: 1.5;
      color: #aaa;
    }
    .stats-summary span {
      color: #fff;
      font-weight: bold;
    }
    /* Skill Slots UI */
    .skill-hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .skill-slot {
      width: 60px;
      height: 60px;
      background: rgba(20, 20, 30, 0.9);
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .skill-slot.ready {
      border-color: #7b2cbf;
      box-shadow: 0 0 10px rgba(123, 44, 191, 0.6);
    }
    .skill-key {
      position: absolute;
      top: -8px;
      left: -8px;
      background: #33334d;
      border: 1px solid #666699;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .skill-icon {
      font-size: 20px;
    }
    .skill-name {
      font-size: 9px;
      margin-top: 2px;
      color: #ddd;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 54px;
    }
    .cooldown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff4d4d;
      font-size: 16px;
      font-weight: bold;
    }
    .enchant-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 2px #000;
    }

    /* Modal Screens */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: auto;
      backdrop-filter: blur(6px);
    }
    .modal-title {
      font-size: 28px;
      font-weight: bold;
      color: #e2e2e2;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    .modal-subtitle {
      font-size: 14px;
      color: #8888aa;
      margin-bottom: 24px;
    }
    .card-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      width: 200px;
      height: 260px;
      background: linear-gradient(145deg, #181824, #101018);
      border: 2px solid #3d3d5c;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: #9d4edd;
      box-shadow: 0 8px 20px rgba(157, 78, 221, 0.4);
    }
    .card.silver { border-color: #a0a0b0; }
    .card.gold { border-color: #e0a030; }
    .card.prism { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
    
    .card-tier {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .silver .card-tier { background: #4a4a5a; color: #e0e0e0; }
    .gold .card-tier { background: #8a6500; color: #fff; }
    .prism .card-tier { background: #0088aa; color: #fff; }

    .card-icon {
      font-size: 36px;
      margin: 12px 0;
    }
    .card-name {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      text-align: center;
    }
    .card-desc {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      line-height: 1.4;
      margin-top: 8px;
    }
    .btn {
      background: linear-gradient(180deg, #4a287a, #2a104e);
      border: 1px solid #7b2cbf;
      color: #fff;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: linear-gradient(180deg, #6a38aa, #3a186e);
      box-shadow: 0 0 12px rgba(123, 44, 191, 0.6);
    }
    .btn:disabled {
      background: #222;
      border-color: #444;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Boss Bar */
    .boss-bar-container {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      background: rgba(15, 15, 20, 0.9);
      border: 2px solid #881111;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    .boss-name {
      font-size: 14px;
      font-weight: bold;
      color: #ff4d4d;
      margin-bottom: 4px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="1024" height="768"></canvas>

  <!-- HUD Overlay -->
  <div class="ui-layer">
    <div class="hud" id="hud">
      <div class="hud-card">
        <div style="font-weight: bold; font-size: 16px; color: #e2e2e2;" id="hud-floor">지상 1층</div>
        <div style="font-size: 12px; color: #ffd700; margin-top:2px;">골드: <span id="hud-gold">0</span> G</div>
        <div style="display: flex; gap: 12px; margin-top: 6px;">
          <div>
            <div style="font-size: 11px; color: #aaa;">체력 (HP)</div>
            <div class="bar-container">
              <div class="bar-fill-hp" id="hp-bar"></div>
              <div class="bar-text" id="hp-text">200 / 200</div>
            </div>
          </div>
          <div>
            <div style="font-size: 11px; color: #aaa;">경험치 (Lv.<span id="hud-level">1</span>)</div>
            <div class="bar-container">
              <div class="bar-fill-exp" id="exp-bar"></div>
              <div class="bar-text" id="exp-text">0 / 100</div>
            </div>
          </div>
        </div>
      </div>

      <div class="hud-card stats-summary">
        <div>공격력: <span id="stat-atk">50</span> | 방어력: <span id="stat-def">30</span></div>
        <div>치명타: <span id="stat-crit">5%</span> (피해 <span id="stat-critdmg">50%</span>)</div>
        <div>쿨타임 감소: <span id="stat-cdr">0%</span></div>
      </div>
    </div>

    <!-- Boss HP Bar -->
    <div class="boss-bar-container hidden" id="boss-hud">
      <div class="boss-name" id="boss-name">보스 이름</div>
      <div class="bar-container" style="width: 100%; height: 16px;">
        <div class="bar-fill-hp" id="boss-hp-bar"></div>
        <div class="bar-text" id="boss-hp-text">1000 / 1000</div>
      </div>
    </div>

    <!-- Skill HUD -->
    <div class="skill-hud" id="skill-hud">
      <div class="skill-slot" id="slot-e">
        <div class="skill-key">E / R-Click</div>
        <div class="skill-icon" id="slot-e-icon">🗡️</div>
        <div class="skill-name" id="slot-e-name">빈 슬롯</div>
        <div class="cooldown-overlay hidden" id="slot-e-cd">0</div>
        <div class="enchant-badge hidden" id="slot-e-enchant"></div>
      </div>
      <div class="skill-slot" id="slot-q">
        <div class="skill-key">Q</div>
        <div class="skill-icon" id="slot-q-icon">🗡️</div>
        <div class="skill-name" id="slot-q-name">빈 슬롯</div>
        <div class="cooldown-overlay hidden" id="slot-q-cd">0</div>
        <div class="enchant-badge hidden" id="slot-q-enchant"></div>
      </div>
    </div>
  </div>

  <!-- Dynamic Modal Overlay for Menu, Levelup, Shop, Skill Choice, Victory, Defeat -->
  <div class="modal-overlay hidden" id="modal-screen">
    <div class="modal-title" id="modal-title">제목</div>
    <div class="modal-subtitle" id="modal-subtitle">설명 문구</div>
    <div class="card-container" id="modal-cards"></div>
    <div id="modal-custom-ui" style="display:flex; gap:10px; flex-direction:column; align-items:center;"></div>
    <button class="btn" id="modal-action-btn" style="margin-top: 16px;">확인</button>
  </div>
</div>

<script>
/* ==========================================================================
   GAME CONSTANTS & GLOBAL STATE
   ========================================================================== */
const CANVAS_WIDTH = 1024;
const CANVAS_HEIGHT = 768;

const GAME_STATE = {
  MENU: 'MENU',
  PLAYING: 'PLAYING',
  COMBAT: 'COMBAT',
  SHOP: 'SHOP',
  LEVEL_UP: 'LEVEL_UP',
  SKILL_REWARD: 'SKILL_REWARD',
  BOSS: 'BOSS',
  GAME_OVER: 'GAME_OVER',
  VICTORY: 'VICTORY',
  PAUSE: 'PAUSE'
};

let currentState = GAME_STATE.MENU;

// Canvas Initialization
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Input Handling State
const keys = { w: false, a: false, s: false, d: false, q: false, e: false };
const mouse = { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2, leftDown: false, rightDown: false };

// Prevent Context Menu on Right Click
window.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ㅈ') keys.w = true;
  if (k === 'a' || k === 'ㅁ') keys.a = true;
  if (k === 's' || k === 'ㄴ') keys.s = true;
  if (k === 'd' || k === 'ㅇ') keys.d = true;
  if (k === 'q' || k === 'ㅂ') keys.q = true;
  if (k === 'e' || k === 'ㄷ') keys.e = true;
  if (k === 'escape' && (currentState === GAME_STATE.COMBAT || currentState === GAME_STATE.BOSS)) {
    togglePause();
  }
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ㅈ') keys.w = false;
  if (k === 'a' || k === 'ㅁ') keys.a = false;
  if (k === 's' || k === 'ㄴ') keys.s = false;
  if (k === 'd' || k === 'ㅇ') keys.d = false;
  if (k === 'q' || k === 'ㅂ') keys.q = false;
  if (k === 'e' || k === 'ㄷ') keys.e = false;
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
  mouse.y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) mouse.leftDown = true;
  if (e.button === 2) mouse.rightDown = true;
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.leftDown = false;
  if (e.button === 2) mouse.rightDown = false;
});

/* ==========================================================================
   ELEMENTAL ENCHANTS & DEFINITIONS
   ========================================================================== */
const ENCHANTS = {
  FIRE: { name: '화염', color: '#ff4500', bg: '#8b0000', desc: '3초간 스킬 피해 기반 화상 지속 피해' },
  LIGHTNING: { name: '번개', color: '#00ffff', bg: '#008b8b', desc: '3초간 감전(이속감소) 후 강력한 추가 타격' },
  ICE: { name: '얼음', color: '#a0e0ff', bg: '#4682b4', desc: '1.5초간 빙결 (보스 면역)' },
  WATER: { name: '물', color: '#1e90ff', bg: '#00008b', desc: '2초간 젖음(이속 및 공격력 감소)' },
  NATURE: { name: '자연', color: '#3cb371', bg: '#006400', desc: '3초간 취약(받는 피해 30% 증가)' }
};

/* ==========================================================================
   SKILLS DATABASE
   ========================================================================== */
const SKILL_DATABASE = [
  {
    id: 'slash_wave',
    name: '검풍 날리기',
    icon: '🌪️',
    multiplier: 1.8,
    addDamage: 30,
    cooldown: 3.5, // seconds
    range: 350,
    type: 'PROJECTILE',
    desc: '전방으로 날카로운 검풍을 날려 넓은 범위에 피해를 입힙니다.'
  },
  {
    id: 'whirlwind',
    name: '회전 베기',
    icon: '🌀',
    multiplier: 2.2,
    addDamage: 40,
    cooldown: 5.0,
    range: 120,
    type: 'AOE_SELF',
    desc: '자신 주위의 모든 적을 베어 쳐냅니다.'
  },
  {
    id: 'dash_strike',
    name: '돌진 베기',
    icon: '⚡',
    multiplier: 2.5,
    addDamage: 50,
    cooldown: 4.0,
    range: 200,
    type: 'DASH',
    desc: '마우스 방향으로 빠르게 돌진하며 경로 상의 적을 베어버립니다.'
  },
  {
    id: 'heavy_slam',
    name: '강타 내려치기',
    icon: '💥',
    multiplier: 3.0,
    addDamage: 80,
    cooldown: 6.0,
    range: 160,
    type: 'CONE',
    desc: '전방 좁은 지역을 강하게 내려쳐 묵직한 피해를 줍니다.'
  }
];

/* ==========================================================================
   GAME ENGINE & STATE MANAGERS
   ========================================================================== */
let player;
let enemies = [];
let boss = null;
let projectiles = [];
let particleEffects = [];
let damageTexts = [];
let currentRoom = null;
let dungeonFloor = 1; // 1 = 지상1층, -1 ~ -300 = 지하
let gold = 0;
let playerItems = [];

class Player {
  constructor() {
    this.x = CANVAS_WIDTH / 2;
    this.y = CANVAS_HEIGHT / 2;
    this.radius = 18;
    this.speed = 3.8;
    
    // Stats
    this.baseAtk = 50;
    this.maxHp = 200;
    this.hp = 200;
    this.critChance = 0.05; // 5%
    this.critDamage = 0.50; // +50%
    this.def = 30;
    this.cdr = 0.0; // Skill Cooldown Reduction (0~0.5)

    this.level = 1;
    this.exp = 0;
    this.maxExp = 100;

    // Attack State
    this.attackCooldown = 0;
    this.basicAttackRate = 0.35; // seconds
    this.angle = 0;

    // Skills
    this.skillE = null;
    this.skillQ = null;
    this.cdE = 0;
    this.cdQ = 0;
    this.enchantE = null;
    this.enchantQ = null;

    // Stats Modification Boosts
    this.atkMultiplier = 1.0;
    this.defMultiplier = 1.0;
  }

  get effectiveAtk() { return Math.round(this.baseAtk * this.atkMultiplier); }
  get effectiveDef() { return Math.round(this.def * this.defMultiplier); }

  update(dt) {
    // Movement
    let dx = 0, dy = 0;
    if (keys.w) dy -= 1;
    if (keys.s) dy += 1;
    if (keys.a) dx -= 1;
    if (keys.d) dx += 1;

    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }

    // Apply water puddle slow down if inside gimmick
    let speedMult = 1.0;
    if (currentRoom && currentRoom.checkSlowGimmick(this.x, this.y)) {
      speedMult = 0.5;
    }

    let nx = this.x + dx * this.speed * speedMult;
    let ny = this.y + dy * this.speed * speedMult;

    // Room Collision Checks
    if (currentRoom && currentRoom.isWalkable(nx, this.y, this.radius)) this.x = nx;
    if (currentRoom && currentRoom.isWalkable(this.x, ny, this.radius)) this.y = ny;

    // Direction angle facing mouse
    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

    // Cooldown updates
    if (this.attackCooldown > 0) this.attackCooldown -= dt;
    if (this.cdE > 0) this.cdE -= dt;
    if (this.cdQ > 0) this.cdQ -= dt;

    // Basic Attack Action
    if (mouse.leftDown && this.attackCooldown <= 0) {
      this.performBasicAttack();
    }

    // Skill Trigger Actions
    if ((keys.e || mouse.rightDown) && this.skillE && this.cdE <= 0) {
      this.useSkill(this.skillE, this.enchantE, 'E');
    }
    if (keys.q && this.skillQ && this.cdQ <= 0) {
      this.useSkill(this.skillQ, this.enchantQ, 'Q');
    }
  }

  performBasicAttack() {
    this.attackCooldown = this.basicAttackRate;

    // Visual slash arc particle
    particleEffects.push(new SlashEffect(this.x, this.y, this.angle, 70, '#ffffff'));

    // Check hit on enemies or boss
    const range = 75;
    const targets = [...enemies];
    if (boss) targets.push(boss);

    targets.forEach(target => {
      let dist = Math.hypot(target.x - this.x, target.y - this.y);
      let angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
      let angleDiff = Math.abs(normalizeAngle(this.angle - angleToTarget));

      if (dist <= range + target.radius && angleDiff <= Math.PI / 3) {
        // Basic attack damage: Atk x 1.0, No Crit, No Enchant
        let rawDmg = this.effectiveAtk * 1.0;
        applyDamage(this, target, rawDmg, false, null);

        // Trigger item effects on hit
        triggerItemEffects('ON_HIT', target);
      }
    });
  }

  useSkill(skill, enchant, slot) {
    const cd = skill.cooldown * (1 - this.cdr);
    if (slot === 'E') this.cdE = cd;
    if (slot === 'Q') this.cdQ = cd;

    triggerItemEffects('ON_SKILL', null);

    const rawDmg = (this.effectiveAtk * skill.multiplier) + skill.addDamage;

    if (skill.type === 'PROJECTILE') {
      projectiles.push(new SkillProjectile(this.x, this.y, this.angle, skill, enchant, rawDmg));
    } else if (skill.type === 'AOE_SELF') {
      particleEffects.push(new CircleAoeEffect(this.x, this.y, skill.range, enchant ? enchant.color : '#bdb2ff'));
      const targets = [...enemies];
      if (boss) targets.push(boss);
      targets.forEach(target => {
        if (Math.hypot(target.x - this.x, target.y - this.y) <= skill.range + target.radius) {
          applyDamage(this, target, rawDmg, true, enchant);
        }
      });
    } else if (skill.type === 'DASH') {
      let dashDist = skill.range;
      let targetX = this.x + Math.cos(this.angle) * dashDist;
      let targetY = this.y + Math.sin(this.angle) * dashDist;

      // Ensure dash doesn't breach walls
      let step = 10;
      let currDist = 0;
      while (currDist < dashDist) {
        let testX = this.x + Math.cos(this.angle) * step;
        let testY = this.y + Math.sin(this.angle) * step;
        if (currentRoom.isWalkable(testX, testY, this.radius)) {
          this.x = testX;
          this.y = testY;
          currDist += step;
        } else break;
      }

      particleEffects.push(new SlashEffect(this.x, this.y, this.angle, 100, enchant ? enchant.color : '#00f0ff'));
      const targets = [...enemies];
      if (boss) targets.push(boss);
      targets.forEach(target => {
        if (Math.hypot(target.x - this.x, target.y - this.y) <= 80) {
          applyDamage(this, target, rawDmg, true, enchant);
        }
      });
    } else if (skill.type === 'CONE') {
      particleEffects.push(new ConeEffect(this.x, this.y, this.angle, skill.range, enchant ? enchant.color : '#ff0055'));
      const targets = [...enemies];
      if (boss) targets.push(boss);
      targets.forEach(target => {
        let dist = Math.hypot(target.x - this.x, target.y - this.y);
        let angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
        let angleDiff = Math.abs(normalizeAngle(this.angle - angleToTarget));

        if (dist <= skill.range + target.radius && angleDiff <= Math.PI / 4) {
          applyDamage(this, target, rawDmg, true, enchant);
        }
      });
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Player Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 12, 16, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Player Body
    ctx.rotate(this.angle);
    ctx.fillStyle = '#4cc9f0';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#f72585';
    ctx.stroke();

    // Sword Graphic
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(10, 8, 22, 5);
    ctx.fillStyle = '#7209b7';
    ctx.fillRect(8, 6, 4, 9);

    ctx.restore();
  }
}

/* ==========================================================================
   DAMAGE CALCULATION & DEBUFF SYSTEM
   ========================================================================== */
function applyDamage(attacker, defender, rawDamage, canCrit = true, enchant = null) {
  if (defender.dead) return;

  let isCrit = false;
  let damage = rawDamage;

  if (canCrit && attacker.critChance && Math.random() < attacker.critChance) {
    isCrit = true;
    damage = rawDamage * (1.0 + attacker.critDamage);
  }

  // Vulnerable Debuff check (+30% dmg)
  if (defender.debuffs && defender.debuffs.vulnerable > 0) {
    damage *= 1.30;
  }

  // Mandatory Defense Formula: Actual Damage = Raw Damage * 100 / Def
  let actualDamage = Math.max(1, Math.round((damage * 100) / Math.max(1, defender.effectiveDef || defender.def)));

  defender.hp -= actualDamage;

  // Add Damage Floating Text
  damageTexts.push(new DamageText(defender.x, defender.y - 15, actualDamage, isCrit));

  // Trigger On Damage Taken Item Effects if player
  if (defender === player) {
    triggerItemEffects('ON_HIT_TAKEN', attacker);
  }

  // Handle Elemental Debuffs (Only via Skills)
  if (enchant && defender.debuffs) {
    applyEnchantDebuff(defender, enchant, actualDamage);
  }

  // Check Death
  if (defender.hp <= 0) {
    defender.hp = 0;
    defender.dead = true;
  }
}

function applyEnchantDebuff(defender, enchant, skillDmg) {
  const isBoss = defender.isBoss;
  const durationMult = isBoss ? 0.5 : 1.0;

  switch (enchant.name) {
    case '화염':
      defender.debuffs.burn = { time: 3.0 * durationMult, tickDmg: (skillDmg * 0.2) / 3 };
      break;
    case '번개':
      defender.debuffs.shock = { time: 3.0 * durationMult, finalDmg: skillDmg * 0.4 };
      break;
    case '얼음':
      if (!isBoss) {
        defender.debuffs.freeze = 1.5;
      }
      break;
    case '물':
      defender.debuffs.wet = 2.0 * durationMult;
      break;
    case '자연':
      defender.debuffs.vulnerable = 3.0 * durationMult;
      break;
  }
}

/* ==========================================================================
   ENEMY & BOSS CLASSES
   ========================================================================== */
class Enemy {
  constructor(x, y, type, floor) {
    this.x = x;
    this.y = y;
    this.type = type; // 'MELEE', 'RANGED', 'TANK'
    this.dead = false;

    // Scaling Factor based on dungeon depth (-1 to -300)
    let depth = Math.abs(Math.min(0, floor));
    let scale = 1 + (depth * 0.025); // +2.5% per floor down

    if (type === 'MELEE') {
      this.radius = 16;
      this.maxHp = 120 * scale;
      this.baseAtk = 20 * scale;
      this.def = 20 * scale;
      this.speed = 2.4;
      this.color = '#e63946';
      this.expValue = 25;
      this.goldValue = 15 + Math.floor(depth * 0.5);
    } else if (type === 'RANGED') {
      this.radius = 14;
      this.maxHp = 80 * scale;
      this.baseAtk = 18 * scale;
      this.def = 15 * scale;
      this.speed = 2.0;
      this.color = '#a855f7';
      this.shootCooldown = 0;
      this.expValue = 30;
      this.goldValue = 20 + Math.floor(depth * 0.5);
    } else if (type === 'TANK') {
      this.radius = 24;
      this.maxHp = 300 * scale;
      this.baseAtk = 30 * scale;
      this.def = 50 * scale;
      this.speed = 1.3;
      this.color = '#457b9d';
      this.expValue = 45;
      this.goldValue = 35 + Math.floor(depth * 0.8);
    }

    this.hp = this.maxHp;
    this.attackCd = 0;

    // Active Debuffs
    this.debuffs = { freeze: 0, burn: null, shock: null, wet: 0, vulnerable: 0 };
  }

  get effectiveDef() { return this.def; }

  update(dt) {
    // Process Debuffs
    if (this.debuffs.freeze > 0) {
      this.debuffs.freeze -= dt;
      return; // Freeze halts movement and attacks
    }

    if (this.debuffs.burn) {
      this.debuffs.burn.time -= dt;
      this.hp -= this.debuffs.burn.tickDmg * dt;
      if (this.hp <= 0) this.dead = true;
      if (this.debuffs.burn.time <= 0) this.debuffs.burn = null;
    }

    if (this.debuffs.shock) {
      this.debuffs.shock.time -= dt;
      if (this.debuffs.shock.time <= 0) {
        // Shock Final Explosion
        applyDamage(player, this, this.debuffs.shock.finalDmg, false, null);
        this.debuffs.shock = null;
      }
    }

    if (this.debuffs.wet > 0) this.debuffs.wet -= dt;
    if (this.debuffs.vulnerable > 0) this.debuffs.vulnerable -= dt;

    // Movement & AI Behavior
    let spd = this.speed * (this.debuffs.wet > 0 || this.debuffs.shock ? 0.6 : 1.0);
    let dist = Math.hypot(player.x - this.x, player.y - this.y);
    let angle = Math.atan2(player.y - this.y, player.x - this.x);

    if (this.type === 'MELEE' || this.type === 'TANK') {
      if (dist > this.radius + player.radius) {
        let nx = this.x + Math.cos(angle) * spd;
        let ny = this.y + Math.sin(angle) * spd;
        if (currentRoom.isWalkable(nx, ny, this.radius)) {
          this.x = nx;
          this.y = ny;
        }
      } else {
        // Attack Player
        if (this.attackCd <= 0) {
          let atkDmg = this.baseAtk * (this.debuffs.wet > 0 ? 0.7 : 1.0);
          applyDamage(this, player, atkDmg, false, null);
          this.attackCd = 1.2;
        }
      }
    } else if (this.type === 'RANGED') {
      // Keep Distance
      if (dist < 180) {
        let nx = this.x - Math.cos(angle) * spd;
        let ny = this.y - Math.sin(angle) * spd;
        if (currentRoom.isWalkable(nx, ny, this.radius)) {
          this.x = nx;
          this.y = ny;
        }
      } else if (dist > 280) {
        let nx = this.x + Math.cos(angle) * spd;
        let ny = this.y + Math.sin(angle) * spd;
        if (currentRoom.isWalkable(nx, ny, this.radius)) {
          this.x = nx;
          this.y = ny;
        }
      }

      if (this.shootCooldown <= 0 && dist < 350) {
        let atkDmg = this.baseAtk * (this.debuffs.wet > 0 ? 0.7 : 1.0);
        projectiles.push(new EnemyProjectile(this.x, this.y, angle, atkDmg));
        this.shootCooldown = 2.0;
      }
      if (this.shootCooldown > 0) this.shootCooldown -= dt;
    }

    if (this.attackCd > 0) this.attackCd -= dt;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Freeze Visual Overlay
    if (this.debuffs.freeze > 0) {
      ctx.strokeStyle = '#a0e0ff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    // HP Bar Above Enemy
    let hpPercent = this.hp / this.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(-15, -this.radius - 10, 30, 4);
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-15, -this.radius - 10, 30 * hpPercent, 4);

    ctx.restore();
  }
}

class Boss {
  constructor(floor) {
    this.isBoss = true;
    this.x = CANVAS_WIDTH / 2;
    this.y = 200;
    this.radius = 42;
    this.floor = floor;
    this.dead = false;

    if (floor === -100) {
      this.name = '지하 100층 수호자 - 골렘 리치';
      this.maxHp = 2500;
      this.baseAtk = 55;
      this.def = 40;
      this.color = '#8338ec';
    } else if (floor === -200) {
      this.name = '지하 200층 군주 - 크림슨 파괴자';
      this.maxHp = 6000;
      this.baseAtk = 85;
      this.def = 65;
      this.color = '#d62828';
    } else { // -300
      this.name = '심연의 최종 보스 - 심연의 군주 헬로스';
      this.maxHp = 15000;
      this.baseAtk = 130;
      this.def = 90;
      this.color = '#000000';
    }

    this.hp = this.maxHp;
    this.phase = 1;
    this.patternTimer = 0;
    this.warningArea = null;

    this.debuffs = { freeze: 0, burn: null, shock: null, wet: 0, vulnerable: 0 };
    this.expValue = 300;
    this.goldValue = 500;
  }

  get effectiveDef() { return this.def; }

  update(dt) {
    // Debuffs update (Boss freeze immune)
    if (this.debuffs.burn) {
      this.debuffs.burn.time -= dt;
      this.hp -= this.debuffs.burn.tickDmg * dt;
      if (this.debuffs.burn.time <= 0) this.debuffs.burn = null;
    }
    if (this.debuffs.shock) {
      this.debuffs.shock.time -= dt;
      if (this.debuffs.shock.time <= 0) {
        applyDamage(player, this, this.debuffs.shock.finalDmg, false, null);
        this.debuffs.shock = null;
      }
    }
    if (this.debuffs.wet > 0) this.debuffs.wet -= dt;
    if (this.debuffs.vulnerable > 0) this.debuffs.vulnerable -= dt;

    if (this.hp <= 0) {
      this.dead = true;
      return;
    }

    this.patternTimer += dt;

    // Boss Pattern AI with explicit Telegraph Warning Areas
    if (this.floor === -100) {
      if (this.patternTimer >= 3.0) {
        this.patternTimer = 0;
        this.executePatternGolem();
      }
    } else if (this.floor === -200) {
      if (this.patternTimer >= 2.5) {
        this.patternTimer = 0;
        this.executePatternCrimson();
      }
    } else if (this.floor === -300) {
      if (this.patternTimer >= 2.0) {
        this.patternTimer = 0;
        this.executePatternFinal();
      }
    }

    // Process Warning Telegraph
    if (this.warningArea) {
      this.warningArea.time -= dt;
      if (this.warningArea.time <= 0) {
        // Trigger Telegraph Attack
        if (this.warningArea.type === 'CIRCLE') {
          if (Math.hypot(player.x - this.warningArea.x, player.y - this.warningArea.y) <= this.warningArea.r) {
            applyDamage(this, player, this.baseAtk * 1.5, false, null);
          }
          particleEffects.push(new CircleAoeEffect(this.warningArea.x, this.warningArea.y, this.warningArea.r, '#ff0000'));
        }
        this.warningArea = null;
      }
    }
  }

  executePatternGolem() {
    // Pattern: Target Circle Telegraph Slam
    this.warningArea = {
      x: player.x,
      y: player.y,
      r: 120,
      time: 1.2,
      type: 'CIRCLE'
    };
  }

  executePatternCrimson() {
    // Pattern: 8-way projectile burst
    for (let i = 0; i < 8; i++) {
      let angle = (Math.PI * 2 / 8) * i;
      projectiles.push(new EnemyProjectile(this.x, this.y, angle, this.baseAtk));
    }
  }

  executePatternFinal() {
    // Pattern: 12-way projectile + Immediate Slam
    for (let i = 0; i < 12; i++) {
      let angle = (Math.PI * 2 / 12) * i;
      projectiles.push(new EnemyProjectile(this.x, this.y, angle, this.baseAtk * 0.8));
    }
    this.warningArea = {
      x: player.x,
      y: player.y,
      r: 150,
      time: 0.9,
      type: 'CIRCLE'
    };
  }

  draw(ctx) {
    // Draw Telegraph Warning Area
    if (this.warningArea) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 0, 0, 0.25)';
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.warningArea.x, this.warningArea.y, this.warningArea.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(this.x, this.y);

    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffd700';
    ctx.stroke();

    ctx.restore();
  }
}

/* ==========================================================================
   PROJECTILES & VISUAL EFFECTS
   ========================================================================== */
class SkillProjectile {
  constructor(x, y, angle, skill, enchant, damage) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.skill = skill;
    this.enchant = enchant;
    this.damage = damage;
    this.speed = 9.0;
    this.radius = 10;
    this.alive = true;
    this.distanceTraveled = 0;
    this.maxRange = skill.range;
  }

  update(dt) {
    let move = this.speed;
    this.x += Math.cos(this.angle) * move;
    this.y += Math.sin(this.angle) * move;
    this.distanceTraveled += move;

    if (this.distanceTraveled >= this.maxRange || !currentRoom.isWalkable(this.x, this.y, this.radius)) {
      this.alive = false;
    }

    // Check collision against enemies
    const targets = [...enemies];
    if (boss) targets.push(boss);

    targets.forEach(target => {
      if (this.alive && Math.hypot(target.x - this.x, target.y - this.y) <= target.radius + this.radius) {
        applyDamage(player, target, this.damage, true, this.enchant);
        this.alive = false;
      }
    });
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle = this.enchant ? this.enchant.color : '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class EnemyProjectile {
  constructor(x, y, angle, damage) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.damage = damage;
    this.speed = 5.0;
    this.radius = 6;
    this.alive = true;
  }

  update(dt) {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;

    if (!currentRoom.isWalkable(this.x, this.y, this.radius)) {
      this.alive = false;
    }

    if (this.alive && Math.hypot(player.x - this.x, player.y - this.y) <= player.radius + this.radius) {
      applyDamage(null, player, this.damage, false, null);
      this.alive = false;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class DamageText {
  constructor(x, y, text, isCrit) {
    this.x = x + (Math.random() * 20 - 10);
    this.y = y;
    this.text = text;
    this.isCrit = isCrit;
    this.alpha = 1.0;
    this.life = 1.0; // 1 second
  }

  update(dt) {
    this.life -= dt;
    this.y -= 18 * dt; // Rise up
    this.alpha = Math.max(0, this.life);
  }

  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.font = this.isCrit ? 'bold 18px sans-serif' : 'bold 14px sans-serif';
    ctx.fillStyle = this.isCrit ? '#ffcc00' : '#ffffff';
    ctx.textAlign = 'center';

    if (this.isCrit) {
      ctx.fillText('치명타!', this.x, this.y - 16);
    }
    ctx.fillText(this.text, this.x, this.y);

    ctx.restore();
  }
}

class SlashEffect {
  constructor(x, y, angle, radius, color) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.radius = radius;
    this.color = color;
    this.life = 0.15;
    this.maxLife = 0.15;
  }
  update(dt) { this.life -= dt; }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 4;
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, -Math.PI / 4, Math.PI / 4);
    ctx.stroke();
    ctx.restore();
  }
}

class CircleAoeEffect {
  constructor(x, y, radius, color) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.color = color;
    this.life = 0.3;
    this.maxLife = 0.3;
  }
  update(dt) { this.life -= dt; }
  draw(ctx) {
    ctx.save();
    ctx.fillStyle = this.color;
    ctx.globalAlpha = (this.life / this.maxLife) * 0.4;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class ConeEffect {
  constructor(x, y, angle, range, color) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.range = range;
    this.color = color;
    this.life = 0.25;
    this.maxLife = 0.25;
  }
  update(dt) { this.life -= dt; }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = (this.life / this.maxLife) * 0.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, this.range, -Math.PI / 4, Math.PI / 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

/* ==========================================================================
   ROOM & MAP GIMMICK SYSTEM
   ========================================================================== */
class Room {
  constructor(templateIndex, isBossRoom = false) {
    this.width = CANVAS_WIDTH;
    this.height = CANVAS_HEIGHT;
    this.isBossRoom = isBossRoom;
    this.obstacles = [];
    this.gimmicks = [];
    this.exits = [];
    this.exitActive = false;

    this.buildTemplate(templateIndex);
  }

  buildTemplate(idx) {
    // Outer Walls
    this.bounds = { left: 40, right: CANVAS_WIDTH - 40, top: 40, bottom: CANVAS_HEIGHT - 40 };

    if (this.isBossRoom) {
      // Wide open arena with no internal obstacles
      return;
    }

    // Standard Room Templates with Obstacles and Gimmicks
    if (idx === 0) {
      // Pillars in center
      this.obstacles.push({ x: 300, y: 300, w: 80, h: 80 });
      this.obstacles.push({ x: 644, y: 300, w: 80, h: 80 });
      this.gimmicks.push({ type: 'WATER_PUDDLE', x: 450, y: 400, r: 90 });
    } else if (idx === 1) {
      // Cross Layout
      this.obstacles.push({ x: 200, y: 200, w: 120, h: 40 });
      this.obstacles.push({ x: 704, y: 200, w: 120, h: 40 });
      this.obstacles.push({ x: 200, y: 528, w: 120, h: 40 });
      this.obstacles.push({ x: 704, y: 528, w: 120, h: 40 });
      this.gimmicks.push({ type: 'TURRET', x: 512, y: 100, cd: 0, rate: 3.0 });
    } else {
      // Central Block with water
      this.obstacles.push({ x: 412, y: 284, w: 200, h: 200 });
      this.gimmicks.push({ type: 'WATER_PUDDLE', x: 200, y: 384, r: 70 });
      this.gimmicks.push({ type: 'WATER_PUDDLE', x: 824, y: 384, r: 70 });
    }
  }

  isWalkable(x, y, radius) {
    if (x - radius < this.bounds.left || x + radius > this.bounds.right ||
        y - radius < this.bounds.top || y + radius > this.bounds.bottom) {
      return false;
    }

    for (let obs of this.obstacles) {
      if (x + radius > obs.x && x - radius < obs.x + obs.w &&
          y + radius > obs.y && y - radius < obs.y + obs.h) {
        return false;
      }
    }
    return true;
  }

  checkSlowGimmick(x, y) {
    for (let g of this.gimmicks) {
      if (g.type === 'WATER_PUDDLE' && Math.hypot(x - g.x, y - g.y) <= g.r) {
        return true;
      }
    }
    return false;
  }

  update(dt) {
    // Process Turrets
    this.gimmicks.forEach(g => {
      if (g.type === 'TURRET' && !this.exitActive) {
        g.cd -= dt;
        if (g.cd <= 0) {
          g.cd = g.rate;
          let angle = Math.atan2(player.y - g.y, player.x - g.x);
          projectiles.push(new EnemyProjectile(g.x, g.y, angle, 25));
        }
      }
    });

    // Handle Exits Transition trigger
    if (this.exitActive) {
      for (let exit of this.exits) {
        if (Math.hypot(player.x - exit.x, player.y - exit.y) <= 30) {
          enterFloor(exit.targetFloor);
          break;
        }
      }
    }
  }

  spawnExits(paths) {
    this.exitActive = true;
    this.exits = [];

    if (paths.length === 1) {
      this.exits.push({ x: CANVAS_WIDTH / 2, y: 80, targetFloor: paths[0] });
    } else if (paths.length === 2) {
      this.exits.push({ x: CANVAS_WIDTH / 2 - 120, y: 80, targetFloor: paths[0] });
      this.exits.push({ x: CANVAS_WIDTH / 2 + 120, y: 80, targetFloor: paths[1] });
    }
  }

  draw(ctx) {
    // Background Dark Dungeon Tiles
    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Floor Grid Line Art
    ctx.strokeStyle = '#141420';
    ctx.lineWidth = 1;
    for (let x = this.bounds.left; x < this.bounds.right; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, this.bounds.top); ctx.lineTo(x, this.bounds.bottom); ctx.stroke();
    }
    for (let y = this.bounds.top; y < this.bounds.bottom; y += 40) {
      ctx.beginPath(); ctx.moveTo(this.bounds.left, y); ctx.lineTo(this.bounds.right, y); ctx.stroke();
    }

    // Outer Walls
    ctx.strokeStyle = '#3a3a50';
    ctx.lineWidth = 8;
    ctx.strokeRect(this.bounds.left, this.bounds.top, this.bounds.right - this.bounds.left, this.bounds.bottom - this.bounds.top);

    // Obstacles
    ctx.fillStyle = '#222233';
    ctx.strokeStyle = '#444466';
    ctx.lineWidth = 2;
    for (let obs of this.obstacles) {
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }

    // Gimmicks
    for (let g of this.gimmicks) {
      if (g.type === 'WATER_PUDDLE') {
        ctx.fillStyle = 'rgba(30, 144, 255, 0.25)';
        ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
      } else if (g.type === 'TURRET') {
        ctx.fillStyle = '#882222';
        ctx.beginPath(); ctx.arc(g.x, g.y, 16, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Active Exits
    if (this.exitActive) {
      for (let exit of this.exits) {
        ctx.fillStyle = '#7b2cbf';
        ctx.beginPath(); ctx.arc(exit.x, exit.y, 24, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#e0a030';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(exit.targetFloor + '층', exit.x, exit.y + 4);
      }
    }
  }
}

/* ==========================================================================
   FLOOR PATH GENERATION & NAVIGATION
   ========================================================================== */
function generatePaths(current) {
  // Goal: Reach -300 floor
  let paths = [];
  let pathCount = Math.random() < 0.5 ? 1 : 2;

  for (let i = 0; i < pathCount; i++) {
    let diff = Math.floor(Math.random() * 3) + 1; // 1 ~ 3
    let goingDown = Math.random() < 0.75; // 75% chance downward path

    let target = goingDown ? current - diff : current + diff;

    // Boundary & Rule Check
    if (target > 1) target = 1;
    if (target < -300) target = -300;

    // 100 Floor Milestone boundaries prevention
    if (current <= -100 && target > -100) target = -100;
    if (current <= -200 && target > -200) target = -200;

    if (target !== current && !paths.includes(target)) {
      paths.push(target);
    }
  }

  if (paths.length === 0) paths.push(current - 1);
  return paths;
}

function enterFloor(targetFloor) {
  dungeonFloor = targetFloor;
  updateHUD();

  // Reset Combat Entities
  enemies = [];
  boss = null;
  projectiles = [];

  player.x = CANVAS_WIDTH / 2;
  player.y = CANVAS_HEIGHT - 100;

  // Check Boss Floors
  if (dungeonFloor === -100 || dungeonFloor === -200 || dungeonFloor === -300) {
    currentState = GAME_STATE.BOSS;
    currentRoom = new Room(0, true);
    boss = new Boss(dungeonFloor);
    document.getElementById('boss-hud').classList.remove('hidden');
    document.getElementById('boss-name').innerText = boss.name;
    return;
  } else {
    document.getElementById('boss-hud').classList.add('hidden');
  }

  // Check Shop Floor (15% Chance on standard floors)
  if (Math.random() < 0.15 && dungeonFloor < 1) {
    currentState = GAME_STATE.SHOP;
    openShopScreen();
    return;
  }

  // Standard Combat Room
  currentState = GAME_STATE.COMBAT;
  let tIdx = Math.floor(Math.random() * 3);
  currentRoom = new Room(tIdx, false);

  // Spawn 3 to 10 monsters
  let count = Math.floor(Math.random() * 8) + 3;
  let types = ['MELEE', 'RANGED', 'TANK'];
  for (let i = 0; i < count; i++) {
    let rx = 100 + Math.random() * (CANVAS_WIDTH - 200);
    let ry = 100 + Math.random() * (CANVAS_HEIGHT - 300);
    let type = types[Math.floor(Math.random() * types.length)];
    enemies.push(new Enemy(rx, ry, type, dungeonFloor));
  }
}

function completeCombat() {
  // Check 20% Chance for Skill Reward (Or 100% on Boss Kill)
  const isBossFloor = (dungeonFloor === -100 || dungeonFloor === -200 || dungeonFloor === -300);

  if (isBossFloor || Math.random() < 0.20) {
    currentState = GAME_STATE.SKILL_REWARD;
    openSkillRewardScreen(isBossFloor);
  } else {
    // Generate next path exits
    let paths = generatePaths(dungeonFloor);
    currentRoom.spawnExits(paths);
  }
}

   ========================================================================== */
function addExperience(amt) {
  player.exp += amt;
  if (player.exp >= player.maxExp) {
    player.exp -= player.maxExp;
    player.level += 1;
    player.maxExp = Math.round(player.maxExp * 1.3);

    // Trigger Level up modal
    currentState = GAME_STATE.LEVEL_UP;
    openLevelUpScreen();
  }
  updateHUD();
}

function openLevelUpScreen() {

    `;

        completeCombat();
      } else {
        currentState = GAME_STATE.COMBAT;
      }
    };
    cardsContainer.appendChild(card);
  }
}

function generateStatChoice() {
  // Tiers: Silver (60%), Gold (30%), Prism (10%)
  const rand = Math.random();
  let tier = 'silver';
  let mult = 1.0;
  if (rand > 0.90) { tier = 'prism'; mult = 2.5; }
  else if (rand > 0.60) { tier = 'gold'; mult = 1.6; }

  // Stat Options (Strict: Crit Chance < 100%)
  let options = ['ATK', 'HP', 'DEF', 'CDR', 'CRIT_DMG'];
  if (player.critChance < 1.0) options.push('CRIT_CHANCE');

  // CDR has lower appearance rate
  let chosenType = options[Math.floor(Math.random() * options.length)];
  if (chosenType === 'CDR' && Math.random() < 0.5) {
    chosenType = 'ATK';
  }

  switch (chosenType) {
    case 'ATK':
      let atkVal = Math.round(8 * mult);
      return { tier, icon: '⚔️', name: '공격력 증가', desc: `공격력이 +${atkVal} 영구적으로 증가합니다.`, apply: () => player.baseAtk += atkVal };
    case 'HP':
      if (Math.random() < 0.5) {
        let hpVal = Math.round(30 * mult);
        return { tier, icon: '❤️', name: '체력 증가', desc: `최대 체력이 +${hpVal} 증가하고 회복합니다.`, apply: () => { player.maxHp += hpVal; player.hp += hpVal; } };
      } else {
        let hpPct = Math.round(10 * mult);
        return { tier, icon: '💖', name: '체력 % 증가', desc: `최대 체력이 +${hpPct}% 증가합니다.`, apply: () => { player.maxHp = Math.round(player.maxHp * (1 + hpPct/100)); player.hp += 20; } };
      }
    case 'DEF':
      let defVal = Math.round(6 * mult);
      return { tier, icon: '🛡️', name: '방어력 증가', desc: `방어력이 +${defVal} 영구적으로 증가합니다.`, apply: () => player.def += defVal };
    case 'CDR':
      let cdrVal = Number((0.03 * mult).toFixed(2));
      return { tier, icon: '⏳', name: '쿨타임 감소', desc: `스킬 쿨타임이 ${Math.round(cdrVal*100)}% 감소합니다.`, apply: () => player.cdr = Math.min(0.50, player.cdr + cdrVal) };
    case 'CRIT_CHANCE':
      let critVal = Number((0.04 * mult).toFixed(2));
      return { tier, icon: '🎯', name: '치명타 확률', desc: `치명타 확률이 +${Math.round(critVal*100)}% 증가합니다.`, apply: () => player.critChance = Math.min(1.0, player.critChance + critVal) };
    case 'CRIT_DMG':
      let critDmgVal = Number((0.15 * mult).toFixed(2));
      return { tier, icon: '💥', name: '치명타 피해', desc: `치명타 피해가 +${Math.round(critDmgVal*100)}% 증가합니다.`, apply: () => player.critDamage += critDmgVal };
  }
}

  // EXP Bar
  let expPct = (player.exp / player.maxExp) * 100;
  document.getElementById('exp-bar').style.width = expPct + '%';
  document.getElementById('exp-text').innerText = `${player.exp} / ${player.maxExp}`;

  // Stats
  document.getElementById('stat-atk').innerText = player.effectiveAtk;
  document.getElementById('stat-def').innerText = player.effectiveDef;
  document.getElementById('stat-crit').innerText = Math.round(player.critChance * 100) + '%';
  document.getElementById('stat-critdmg').innerText = Math.round(player.critDamage * 100) + '%';
  document.getElementById('stat-cdr').innerText = Math.round(player.cdr * 100) + '%';

  // Skills HUD
  updateSkillSlotUI('e', player.skillE, player.cdE, player.enchantE);
  updateSkillSlotUI('q', player.skillQ, player.cdQ, player.enchantQ);

  // Boss HUD Update
  if (boss) {
    let bossHpPct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    document.getElementById('boss-hp-bar').style.width = bossHpPct + '%';
    document.getElementById('boss-hp-text').innerText = `${Math.round(boss.hp)} / ${boss.maxHp}`;
  }
}

function updateSkillSlotUI(slotId, skill, cd, enchant) {
  const iconEl = document.getElementById(`slot-${slotId}-icon`);
  const nameEl = document.getElementById(`slot-${slotId}-name`);
  const cdEl = document.getElementById(`slot-${slotId}-cd`);
  const enchantEl = document.getElementById(`slot-${slotId}-enchant`);
  const slotEl = document.getElementById(`slot-${slotId}`);

  if (skill) {
    iconEl.innerText = skill.icon;
    nameEl.innerText = skill.name;
    slotEl.classList.add('ready');

    if (cd > 0) {
      cdEl.classList.remove('hidden');
      cdEl.innerText = cd.toFixed(1);
    } else {
      cdEl.classList.add('hidden');
    }

    if (enchant) {
      enchantEl.classList.remove('hidden');
      enchantEl.innerText = enchant.name;
      enchantEl.style.backgroundColor = enchant.bg;
    } else {
      enchantEl.classList.add('hidden');
    }
  } else {
    iconEl.innerText = '🗡️';
    nameEl.innerText = '빈 슬롯';
    cdEl.classList.add('hidden');
    enchantEl.classList.add('hidden');
    slotEl.classList.remove('ready');
  }
}

function togglePause() {
  if (currentState === GAME_STATE.PAUSE) {
    currentState = GAME_STATE.COMBAT;
    document.getElementById('modal-screen').classList.add('hidden');
  } else {
    currentState = GAME_STATE.PAUSE;
    const modal = document.getElementById('modal-screen');
    modal.classList.remove('hidden');
    document.getElementById('modal-title').innerText = '일시 정지';
    document.getElementById('modal-subtitle').innerText = '게임을 계속하시겠습니까?';
    document.getElementById('modal-cards').innerHTML = '';
    document.getElementById('modal-custom-ui').innerHTML = '';
    
    const btn = document.getElementById('modal-action-btn');
    btn.classList.remove('hidden');
    btn.innerText = '게임 재개';
    btn.onclick = () => togglePause();
  }
}

/* ==========================================================================
   GAME LOOP & INITIALIZATION
   ========================================================================== */
let lastTime = performance.now();

function gameLoop(now) {
  let dt = (now - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1; // Cap Delta Time
  lastTime = now;

  if (currentState === GAME_STATE.COMBAT || currentState === GAME_STATE.BOSS) {
    // 1. Update Game Objects
    player.update(dt);

    if (currentRoom) currentRoom.update(dt);

    // Update Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.update(dt);
      if (e.dead) {
        gold += e.goldValue;
        addExperience(e.expValue);
        enemies.splice(i, 1);
      }
    }

    // Update Boss
    if (boss) {
      boss.update(dt);
      if (boss.dead) {
        gold += boss.goldValue;
        addExperience(boss.expValue);
        boss = null;
        document.getElementById('boss-hud').classList.add('hidden');

        if (dungeonFloor === -300) {
          // Game Victory!
          currentState = GAME_STATE.VICTORY;
          showEndScreen(true);
        } else {
          completeCombat();
        }
      }
    }

    // Check Player Death
    if (player.hp <= 0) {
      currentState = GAME_STATE.GAME_OVER;
      showEndScreen(false);
    }

    // Check All Normal Enemies Cleared
    if (currentState === GAME_STATE.COMBAT && enemies.length === 0 && !currentRoom.exitActive) {
      completeCombat();
    }

    // Update Projectiles & Particles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      projectiles[i].update(dt);
      if (!projectiles[i].alive) projectiles.splice(i, 1);
    }

    for (let i = particleEffects.length - 1; i >= 0; i--) {
      particleEffects[i].update(dt);
      if (particleEffects[i].life <= 0) particleEffects.splice(i, 1);
    }

    for (let i = damageTexts.length - 1; i >= 0; i--) {
      damageTexts[i].update(dt);
      if (damageTexts[i].life <= 0) damageTexts.splice(i, 1);
    }

    updateHUD();
  }

  // 2. Render Frame
  ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  if (currentRoom) currentRoom.draw(ctx);
  particleEffects.forEach(p => p.draw(ctx));
  projectiles.forEach(p => p.draw(ctx));
  enemies.forEach(e => e.draw(ctx));
  if (boss) boss.draw(ctx);
  if (player) player.draw(ctx);
  damageTexts.forEach(d => d.draw(ctx));

  requestAnimationFrame(gameLoop);
}

function showEndScreen(isVictory) {
  const modal = document.getElementById('modal-screen');
  modal.classList.remove('hidden');
  document.getElementById('modal-title').innerText = isVictory ? '던전 정복 성공!' : '전사하였습니다...';
  document.getElementById('modal-subtitle').innerText = isVictory ? '지하 300층의 심연의 보스를 물리쳤습니다!' : `도달한 층: 지하 ${Math.abs(dungeonFloor)}층`;
  document.getElementById('modal-cards').innerHTML = '';
  document.getElementById('modal-custom-ui').innerHTML = '';

  const btn = document.getElementById('modal-action-btn');
  btn.classList.remove('hidden');
  btn.innerText = '메인 화면으로';
  btn.onclick = () => initGame();
}

function initGame() {
  player = new Player();
  enemies = [];
  boss = null;
  projectiles = [];
  particleEffects = [];
  damageTexts = [];
  gold = 0;
  playerItems = [];
  dungeonFloor = 1;

  currentState = GAME_STATE.MENU;

  const modal = document.getElementById('modal-screen');
  modal.classList.remove('hidden');
  document.getElementById('modal-title').innerText = 'DUNGEON SLASHER';
  document.getElementById('modal-subtitle').innerText = '지하 300층에 도전하는 검사의 다크 판타지 로그라이크';
  document.getElementById('modal-cards').innerHTML = '';
  document.getElementById('modal-custom-ui').innerHTML = '';

  const btn = document.getElementById('modal-action-btn');
  btn.classList.remove('hidden');
  btn.innerText = '던전 입구로 입장';
  btn.onclick = () => {
    modal.classList.add('hidden');
    enterFloor(1);
  };

  updateHUD();
}

// Angles Utility Normalizer
function normalizeAngle(angle) {
  while (angle > Math.PI) angle -= Math.PI * 2;
  while (angle < -Math.PI) angle += Math.PI * 2;
  return angle;
}

// Window Load Start Game
window.onload = () => {
  initGame();
  requestAnimationFrame(gameLoop);
};
</script>
