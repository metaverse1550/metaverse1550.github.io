            isCrit ? '#ff0055' : '#ffffff',
            isCrit ? 32 : 22,
            isCrit
        );

        if (this.hp <= 0) {
            this.dead = true;
            sound.playExplosion();
        }
    }

    draw(ctx, camera) {
        if (this.dead) return;

        const rx = this.x - camera.x;
        const ry = this.y - camera.y;

        for (const t of this.telegraphs) {
            ctx.save();
            ctx.fillStyle = 'rgba(255, 0, 0, 0.55)';
            ctx.fillRect(t.x - camera.x, t.y - camera.y, t.w, t.h);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 3;
            ctx.strokeRect(t.x - camera.x, t.y - camera.y, t.w, t.h);
            ctx.restore();
        }

        ctx.save();
        if (this.phase === 2) {
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 35;
        } else if (this.state === 'vulnerable') {
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 30;
        }

        if (this.stageIndex === 1) {
            const bodyGrad = ctx.createLinearGradient(rx, ry, rx, ry + this.height);
            if (this.phase === 2) {
                bodyGrad.addColorStop(0, '#a83300');
                bodyGrad.addColorStop(1, '#3a0d00');
            } else {
                bodyGrad.addColorStop(0, '#6b4a34');
                bodyGrad.addColorStop(1, '#2a1c12');
            }
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(rx, ry, this.width, this.height, 24);
            ctx.fill();

            const crownGrad = ctx.createLinearGradient(rx + 20, ry - 40, rx + 130, ry);
            crownGrad.addColorStop(0, '#fff2b0');
            crownGrad.addColorStop(0.5, '#ffd700');
            crownGrad.addColorStop(1, '#b8860b');
            ctx.fillStyle = crownGrad;
            ctx.beginPath();
            ctx.moveTo(rx + 20, ry);
            ctx.lineTo(rx + 50, ry - 40);
            ctx.lineTo(rx + 75, ry - 12);
            ctx.lineTo(rx + 100, ry - 40);
            ctx.lineTo(rx + 130, ry);
            ctx.fill();

            const eyeColor = this.state === 'vulnerable' ? '#00ffff' : '#ff0000';
            const eyeX = rx + (this.facingRight ? 115 : 45);
            const eyeY = ry + 50;
            const eyeGrad = ctx.createRadialGradient(eyeX, eyeY, 2, eyeX, eyeY, 20);
            eyeGrad.addColorStop(0, '#ffffff');
            eyeGrad.addColorStop(0.4, eyeColor);
            eyeGrad.addColorStop(1, eyeColor);
            ctx.save();
            ctx.shadowColor = eyeColor;
            ctx.shadowBlur = 18;
            ctx.fillStyle = eyeGrad;
            ctx.beginPath();
            ctx.arc(eyeX, eyeY, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else {
            const bodyGrad = ctx.createLinearGradient(rx, ry, rx, ry + this.height);
            if (this.phase === 2) {
                bodyGrad.addColorStop(0, '#c81800');
                bodyGrad.addColorStop(1, '#450000');
            } else {
                bodyGrad.addColorStop(0, '#8f0d0d');
                bodyGrad.addColorStop(1, '#380202');
            }
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(rx, ry + this.height);
            ctx.lineTo(rx + this.width / 2, ry);
            ctx.lineTo(rx + this.width, ry + this.height);
            ctx.fill();

            const coreGrad = ctx.createRadialGradient(
                rx + this.width / 2, ry + this.height / 2, 4,
                rx + this.width / 2, ry + this.height / 2, 50
            );
            coreGrad.addColorStop(0, '#ffe08a');
            coreGrad.addColorStop(0.5, '#ff4500');
            coreGrad.addColorStop(1, '#8a1500');
            ctx.save();
            ctx.shadowColor = '#ff4500';
            ctx.shadowBlur = 22;
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(rx + this.width / 2, ry + this.height / 2, 50, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        ctx.restore();

        for (const atk of this.bossAttacks) {
            ctx.fillStyle = atk.isBeam ? '#ff0055' : (atk.isLava ? '#ff3300' : '#ff6600');
            ctx.fillRect(atk.x - camera.x, atk.y - camera.y, atk.width, atk.height);
        }
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = CONFIG.CANVAS_WIDTH;
        this.canvas.height = CONFIG.CANVAS_HEIGHT;

        this.input = new InputHandler();
        this.camera = new Camera();
        this.particles = new ParticleSystem();

        this.state = 'START';
        this.currentStage = 1;
        this.score = 0;
        this.coins = 0;
        this.gems = 0;
        this.stars = 0;
        this.combo = 0;
        this.comboTimer = 0;
        this.gameTime = 0;
        this.dropItems = [];
        this.restartButton = null; // GAME_OVER / VICTORY 화면에 그려지는 버튼의 클릭 판정 영역

        this.initStage(this.currentStage);
        this.setupAudioButton();
        this.setupRestartButton();

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    setupAudioButton() {
        const btn = document.getElementById('audio-toggle');
        btn.addEventListener('click', () => {
            const enabled = sound.toggleBGM();
            btn.innerText = enabled ? '🎵 BGM: ON' : '🔇 BGM: OFF';
        });
    }

    // 캔버스에 그려진 "다시 시작" 버튼을 클릭/터치로도 누를 수 있게 처리
    setupRestartButton() {
        const handleTap = (clientX, clientY) => {
            if (!this.restartButton) return;
            if (this.state !== 'GAME_OVER' && this.state !== 'VICTORY') return;

            const rect = this.canvas.getBoundingClientRect();
            const scaleX = CONFIG.CANVAS_WIDTH / rect.width;
            const scaleY = CONFIG.CANVAS_HEIGHT / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const b = this.restartButton;
            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
                sound.init();
                this.input.keys.restartClick = true;
            }
        };

        this.canvas.addEventListener('click', (e) => handleTap(e.clientX, e.clientY));
        this.canvas.addEventListener('touchend', (e) => {
            if (e.changedTouches && e.changedTouches[0]) {
                const t = e.changedTouches[0];
                handleTap(t.clientX, t.clientY);
            }
        });
    }

    initStage(stageNum) {
        this.map = new GameMap(stageNum);
        this.player = new Player(120, 400);
        this.bossX = this.map.bossZoneX + 100;
        this.bossY = 460;
        this.boss = new Boss(this.bossX, this.bossY, stageNum);
        this.dropItems = [];
        this.checkpointX = 120; // 현재 스테이지의 마지막 체크포인트 (기본값: 시작 지점)

        // 몹 배치 패턴을 블록마다 반복 배치 (필드 난이도 대폭 하향: 밀도를 절반 가까이 축소)
        const enemyPattern = [
            { x: 550, y: 500, type: 'melee' },
            { x: 1200, y: 300, type: 'ranged' },
            { x: 1800, y: 370, type: 'shield' },
            { x: 2450, y: 500, type: 'melee' },
            { x: 3100, y: 500, type: 'ranged' },
            { x: 3700, y: 500, type: 'shield' },
            { x: 4350, y: 500, type: 'melee' }
        ];

        this.enemies = [];
        for (let b = 0; b < this.map.blockCount; b++) {
            const offset = b * this.map.blockWidth;
            for (const e of enemyPattern) {
                this.enemies.push(new Enemy(offset + e.x, e.y, e.type));
            }
        }
    }

    // 사망 시 마지막 체크포인트에서 재시작 (진행 상황은 유지, 보스는 재생성)
    respawnAtCheckpoint() {
        this.player = new Player(this.checkpointX, 400);
        this.boss = new Boss(this.bossX, this.bossY, this.currentStage);
        this.dropItems = [];
        this.combo = 0;
        this.comboTimer = 0;
    }

    registerHit() {
        this.combo++;
        this.comboTimer = 120;
        this.score += 60 * this.combo;
        this.player.addEnergy(14);
    }

    fullRestart() {
        this.score = 0;
        this.coins = 0;
        this.gems = 0;
        this.stars = 0;
        this.combo = 0;
        this.currentStage = 1;
        this.initStage(1);
        this.state = 'PLAYING';
    }

    update() {
        this.gameTime++;

        if ((this.input.keys.restart || this.input.keys.restartClick) && this.state === 'VICTORY') {
            this.input.keys.restartClick = false;
            this.fullRestart();
            return;
        }

        if ((this.input.keys.restart || this.input.keys.restartClick) && this.state === 'GAME_OVER') {
            this.input.keys.restartClick = false;
            this.respawnAtCheckpoint();
            this.state = 'PLAYING';
            return;
        }

        if (this.state === 'START') {
            if (this.input.keys.jump || this.input.keys.attack) {
                this.state = 'PLAYING';
                sound.startBGM();
            }
            return;
        }

        if (this.state !== 'PLAYING') {
            this.particles.update();
            return;
        }

        if (this.comboTimer > 0) {
            this.comboTimer--;
            if (this.comboTimer <= 0) this.combo = 0;
        }

        const skillTriggered = this.player.update(this.input, this.map, this.particles, this.camera);
        this.camera.update(this.player, this.map.width, this.map.height);
        this.particles.update();

        for (let i = this.dropItems.length - 1; i >= 0; i--) {
            const item = this.dropItems[i];

            item.update(this.map);

            const dx = (this.player.x + this.player.width / 2) - item.x;
            const dy = (this.player.y + this.player.height / 2) - item.y;
            if (Math.sqrt(dx * dx + dy * dy) < 30) {
                if (item.type === 'heal') {
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + 30);
                    sound.playHeal();
                    this.particles.addSparkles(item.x, item.y, '#33ff77', 16);
                    this.particles.addFloatingText(item.x, item.y - 20, '+30 HP', '#33ff77', 20);
                } else {
                    this.player.applyBuff(item.type, 450);
                    this.particles.addSparkles(item.x, item.y, '#ffffff', 14);
                }
                this.dropItems.splice(i, 1);
                continue;
            }

            if (item.life <= 0) this.dropItems.splice(i, 1);
        }

        if (skillTriggered) {
            const baseDmg = CONFIG.PLAYER.BASE_DAMAGE * (this.player.buffs.atk > 0 ? 1.7 : 1.0);
            for (const e of this.enemies) {
                if (!e.dead && Math.abs(e.x - this.player.x) < 320) {
                    e.takeDamage(baseDmg * 4.0, this.particles);
                    this.registerHit();
                }
            }
            if (!this.boss.dead && Math.abs(this.boss.x - this.player.x) < 380) {
                this.boss.takeDamage(baseDmg * 5.5, this.particles);
                this.registerHit();
            }
        }

        if (this.player.hp <= 0) {
            this.state = 'GAME_OVER';
            sound.playExplosion();
        }

        // 체크포인트 도달 체크 (진행한 지점을 저장해두고, 사망 시 여기서 재시작)
        for (const cp of this.map.checkpoints) {
            if (!cp.activated && this.player.isGrounded && this.player.x >= cp.x) {
                cp.activated = true;
                this.checkpointX = cp.x;
                this.player.hp = Math.min(this.player.maxHp, this.player.hp + 20);
                sound.playHeal();
                this.particles.addShockwave(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2, 90, '#ffd700');
                this.particles.addFloatingText(this.player.x, this.player.y - 30, '체크포인트 도달!', '#ffd700', 22);
            }
        }

        for (const c of this.map.collectibles) {
            if (c.collected) continue;
            const dx = (this.player.x + this.player.width / 2) - c.x;
            const dy = (this.player.y + this.player.height / 2) - c.y;
            if (Math.sqrt(dx * dx + dy * dy) < 32) {
                c.collected = true;
                sound.playCoin();
                if (c.type === 'coin') { this.coins++; this.score += 100; this.player.addEnergy(6); }
                if (c.type === 'gem') { this.gems++; this.score += 300; this.player.addEnergy(16); }
                if (c.type === 'star') { this.stars++; this.score += 1000; this.player.addEnergy(32); }
                if (c.type === 'heal') {
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + 50);
                    sound.playHeal();
                    this.particles.addFloatingText(c.x, c.y - 20, '+50 HP', '#33ff77', 22);
                }
                this.particles.addSparkles(c.x, c.y, c.type === 'heal' ? '#33ff77' : '#ffd700', 8);
            }
        }

        const currentAtkDmg = CONFIG.PLAYER.BASE_DAMAGE * (this.player.buffs.atk > 0 ? 1.7 : 1.0);

        for (const enemy of this.enemies) {
            if (enemy.dead) continue;
            enemy.update(this.player, this.map, this.particles);

            if (this.player.isAttacking) {
                const atkBox = {
                    x: this.player.facingRight ? this.player.x + this.player.width : this.player.x - 60,
                    y: this.player.y,
                    width: 60,
                    height: this.player.height
                };

                if (atkBox.x < enemy.x + enemy.width &&
                    atkBox.x + atkBox.width > enemy.x &&
                    atkBox.y < enemy.y + enemy.height &&
                    atkBox.y + atkBox.height > enemy.y) {
                    
                    enemy.takeDamage(currentAtkDmg, this.particles);
                    this.camera.shake(4, 5);
                    this.registerHit();

                    if (enemy.dead && Math.random() < 0.6) {
                        const types = ['atk', 'spd', 'aspd', 'heal'];
                        this.dropItems.push(new DropItem(enemy.x, enemy.y, types[Math.floor(Math.random() * types.length)]));
                    }
                }
            }

            if (!enemy.dead &&
                this.player.x < enemy.x + enemy.width &&
                this.player.x + this.player.width > enemy.x &&
                this.player.y < enemy.y + enemy.height &&
                this.player.y + this.player.height > enemy.y) {
                this.player.takeDamage(5); // 필드 난이도 대폭 하향: 일반몹 접촉 데미지 완화 (8 -> 5)
            }
        }

        if (!this.boss.dead) {
            this.boss.update(this.player, this.map, this.particles, this.camera, this.enemies);

            if (this.player.isAttacking) {
                const atkBox = {
                    x: this.player.facingRight ? this.player.x + this.player.width : this.player.x - 60,
                    y: this.player.y,
                    width: 60,
                    height: this.player.height
                };

                if (atkBox.x < this.boss.x + this.boss.width &&
                    atkBox.x + atkBox.width > this.boss.x &&
                    atkBox.y < this.boss.y + this.boss.height &&
                    atkBox.y + atkBox.height > this.boss.y) {
                    
                    this.boss.takeDamage(currentAtkDmg, this.particles);
                    this.camera.shake(6, 6);
                    this.registerHit();
                }
            }

            if (this.boss.dead) {
                if (this.currentStage === 1) {
                    this.state = 'STAGE_CLEAR';
                    setTimeout(() => {
                        this.currentStage = 2;
                        this.initStage(2);
                        this.state = 'PLAYING';
                    }, 2500);
                } else {
                    this.state = 'VICTORY';
                    sound.playHeal();
                }
            }
        }
    }

    drawUI() {
        this.ctx.save();

        // Low HP Red Vignette Screen Overlay
        if (this.player.hp < this.player.maxHp * 0.35) {
            const pulse = Math.sin(this.gameTime * 0.15) * 0.2 + 0.35;
            this.ctx.fillStyle = `rgba(255, 0, 0, ${pulse})`;
            this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        }

        // Player HP Bar
        this.ctx.fillStyle = 'rgba(0,0,0,0.65)';
        this.ctx.roundRect(20, 20, 260, 26, 6);
        this.ctx.fill();

        const hpPct = Math.max(0, this.player.hp / this.player.maxHp);
        const hpGrad = this.ctx.createLinearGradient(22, 22, 22, 44);
        if (hpPct > 0.35) {
            hpGrad.addColorStop(0, '#ff8855');
            hpGrad.addColorStop(1, '#cc2200');
        } else {
            hpGrad.addColorStop(0, '#ff5533');
            hpGrad.addColorStop(1, '#aa0000');
        }
        this.ctx.fillStyle = hpGrad;
        this.ctx.roundRect(22, 22, 256 * hpPct, 22, 4);
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 13px sans-serif';
        this.ctx.fillText(`🔥 ${this.player.name} HP: ${Math.ceil(this.player.hp)} / ${this.player.maxHp}`, 30, 37);

        // Nightsoul Skill Gauge
        this.ctx.fillStyle = 'rgba(0,0,0,0.65)';
        this.ctx.roundRect(20, 52, 260, 18, 6);
        this.ctx.fill();

        const energyPct = Math.max(0, this.player.energy / this.player.maxEnergy);
        const enGrad = this.ctx.createLinearGradient(22, 54, 22, 68);
        if (energyPct >= 1) {
            enGrad.addColorStop(0, '#fff2b0');
            enGrad.addColorStop(1, '#ffb300');
        } else {
            enGrad.addColorStop(0, '#ffbb55');
            enGrad.addColorStop(1, '#cc5500');
        }
        this.ctx.fillStyle = enGrad;
        this.ctx.roundRect(22, 54, 256 * energyPct, 14, 4);
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 11px sans-serif';
        this.ctx.fillText(energyPct >= 1 ? '🗡️ 필살기 준비 완료! (Q)' : `필살기 게이지 ${Math.floor(energyPct * 100)}%`, 30, 66);


        // Active Buffs
        let buffX = 20;
        if (this.player.buffs.atk > 0) {
            this.ctx.fillStyle = '#ff2200';
            this.ctx.fillRect(buffX, 76, 75, 18);
            this.ctx.fillStyle = '#fff';
            this.ctx.font = 'bold 10px sans-serif';
            this.ctx.fillText(`⚔️ ATK ${Math.ceil(this.player.buffs.atk / 60)}s`, buffX + 5, 89);
            buffX += 80;
        }
        if (this.player.buffs.spd > 0) {
            this.ctx.fillStyle = '#00aaff';
            this.ctx.fillRect(buffX, 76, 75, 18);
            this.ctx.fillStyle = '#fff';
            this.ctx.font = 'bold 10px sans-serif';
            this.ctx.fillText(`⚡ SPD ${Math.ceil(this.player.buffs.spd / 60)}s`, buffX + 5, 89);
            buffX += 80;
        }
        if (this.player.buffs.aspd > 0) {
            this.ctx.fillStyle = '#00ff66';
            this.ctx.fillRect(buffX, 76, 82, 18);
            this.ctx.fillStyle = '#000';
            this.ctx.font = 'bold 10px sans-serif';
            this.ctx.fillText(`🏹 ASPD ${Math.ceil(this.player.buffs.aspd / 60)}s`, buffX + 5, 89);
        }

        // Stats & Skill Keys Guide
        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 16px sans-serif';
        this.ctx.fillText(
            this.player.parryCooldownTimer > 0
                ? `🛡️ 패리(E) 대기: ${Math.ceil(this.player.parryCooldownTimer / 60)}초`
                : '🛡️ 패리(E) 사용 가능!',
            300, 38
        );
        this.ctx.fillText(`SCORE: ${this.score}`, CONFIG.CANVAS_WIDTH - 210, 38);

        if (this.combo > 1) {
            this.ctx.fillStyle = '#ffaa00';
            this.ctx.font = 'italic bold 26px sans-serif';
            this.ctx.fillText(`${this.combo} HITS COMBO!`, 300, 75);
        }

        // Boss Health Bar
        if (this.player.x > this.map.bossZoneX - 300 && !this.boss.dead) {
            this.ctx.fillStyle = 'rgba(0,0,0,0.85)';
            this.ctx.roundRect(CONFIG.CANVAS_WIDTH / 2 - 270, 65, 540, 28, 8);
            this.ctx.fill();

            const bossPct = Math.max(0, this.boss.hp / this.boss.maxHp);
            const bossGrad = this.ctx.createLinearGradient(0, 68, 0, 90);
            if (this.boss.phase === 2) {
                bossGrad.addColorStop(0, '#ff6644');
                bossGrad.addColorStop(1, '#aa0000');
            } else {
                bossGrad.addColorStop(0, '#ff5599');
                bossGrad.addColorStop(1, '#aa0044');
            }
            this.ctx.fillStyle = bossGrad;
            this.ctx.roundRect(CONFIG.CANVAS_WIDTH / 2 - 266, 68, 532 * bossPct, 22, 6);
            this.ctx.fill();

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 13px sans-serif';
            const bossTitle = (this.currentStage === 1 ? 'BOSS: 화염의 제왕 츄츄' : 'BOSS: 염화의 고신 블레이즈드렉') + (this.boss.phase === 2 ? ' [HARD PHASE 2]' : '');
            this.ctx.fillText(bossTitle, CONFIG.CANVAS_WIDTH / 2 - 120, 83);
        }

        // Overlays
        if (this.state === 'START') {
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
            this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            this.ctx.fillStyle = '#ff2200';
            this.ctx.font = 'bold 46px sans-serif';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('불꽃의 검성 호구마 (BOSS HARD)', CONFIG.CANVAS_WIDTH / 2, 170);

            this.ctx.fillStyle = '#ffd700';
            this.ctx.font = 'bold 16px sans-serif';
            this.ctx.fillText('▽ 조작법 (게임 중에도 언제든 확인 가능) ▽', CONFIG.CANVAS_WIDTH / 2, 210);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = '16px sans-serif';
            const controlLines = [
                '🏃 A / D : 좌우 이동',
                '⬆️ Space / W : 점프 (공중에서 한 번 더 누르면 2단 점프)',
                '💨 Shift / K : 대시로 짧게 빠르게 돌진 (돌진 중 무적)',
                '🛡️ E : 패리 - 공격받기 직전에 사용하면 무적 + 반격 기회',
                '⚔️ J / 좌클릭 : 검 공격 (공중에서 사용하면 내려찍기)',
                '🌟 Q / 우클릭 : 필살기 - 게이지가 다 차면 강력한 광역 공격',
                '❤️ 초록색 아이템을 먹으면 체력 회복',
                '🚩 노란 깃발(체크포인트)을 지나면 죽어도 그 지점부터 재시작'
            ];
            let lineY = 244;
            for (const line of controlLines) {
                this.ctx.fillText(line, CONFIG.CANVAS_WIDTH / 2, lineY);
                lineY += 27;
            }

            this.ctx.fillStyle = '#ffd700';
            this.ctx.font = 'bold 24px sans-serif';
            this.ctx.fillText('▶ 화면을 클릭하거나 점프 키를 눌러 게임 시작', CONFIG.CANVAS_WIDTH / 2, lineY + 20);
            this.ctx.textAlign = 'left';
        } else if (this.state === 'GAME_OVER') {
            this.ctx.fillStyle = 'rgba(20, 0, 0, 0.85)';
            this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            this.ctx.textAlign = 'center';
            this.ctx.fillStyle = '#ff2222';
            this.ctx.font = 'bold 60px sans-serif';
            this.ctx.fillText('GAME OVER', CONFIG.CANVAS_WIDTH / 2, 260);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = '22px sans-serif';
            this.ctx.fillText(`최종 점수: ${this.score}  |  획득 코인: ${this.coins}`, CONFIG.CANVAS_WIDTH / 2, 340);

            this.drawButton(CONFIG.CANVAS_WIDTH / 2 - 140, 400, 280, 64, '↻ 체크포인트에서 다시 시작', '#ffd700');
            this.ctx.textAlign = 'left';
        } else if (this.state === 'STAGE_CLEAR') {
            this.ctx.fillStyle = 'rgba(0, 20, 10, 0.80)';
            this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            this.ctx.textAlign = 'center';
            this.ctx.fillStyle = '#00ffaa';
            this.ctx.font = 'bold 54px sans-serif';
            this.ctx.fillText('STAGE 1 CLEAR!', CONFIG.CANVAS_WIDTH / 2, 300);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = '22px sans-serif';
            this.ctx.fillText('다음 스테이지로 이동하고 있습니다...', CONFIG.CANVAS_WIDTH / 2, 380);
            this.ctx.textAlign = 'left';
        } else if (this.state === 'VICTORY') {
            this.ctx.fillStyle = 'rgba(8, 10, 26, 0.92)';
            this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            // 은은한 황금빛 후광 연출
            const glow = this.ctx.createRadialGradient(
                CONFIG.CANVAS_WIDTH / 2, 260, 40,
                CONFIG.CANVAS_WIDTH / 2, 260, 420
            );
            glow.addColorStop(0, 'rgba(255, 215, 0, 0.25)');
            glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
            this.ctx.fillStyle = glow;
            this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            this.ctx.textAlign = 'center';
            this.ctx.fillStyle = '#ffd700';
            this.ctx.font = 'bold 52px sans-serif';
            this.ctx.fillText('🔥 불꽃의 검성, 전설이 되다 🔥', CONFIG.CANVAS_WIDTH / 2, 180);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 28px sans-serif';
            this.ctx.fillText('두 화신을 모두 쓰러뜨리고 대륙에 평화를 되찾았다', CONFIG.CANVAS_WIDTH / 2, 230);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = '22px sans-serif';
            this.ctx.fillText(`최종 점수: ${this.score}`, CONFIG.CANVAS_WIDTH / 2, 320);
            this.ctx.fillText(`획득 아이템: 💰${this.coins}  💎${this.gems}  ⭐${this.stars}`, CONFIG.CANVAS_WIDTH / 2, 355);

            this.drawButton(CONFIG.CANVAS_WIDTH / 2 - 150, 410, 300, 66, '↻ 처음부터 다시 시작', '#00ffaa');
            this.ctx.textAlign = 'left';
        }

        this.ctx.restore();
    }

    // 캔버스 위에 실제로 클릭/터치 가능한 버튼을 그리고, 위치를 저장해 클릭 판정에 사용
    drawButton(x, y, w, h, label, color) {
        this.restartButton = { x, y, w, h };

        this.ctx.save();
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        this.ctx.roundRect(x, y, w, h, 14);
        this.ctx.fill();
        this.ctx.strokeStyle = color;
        this.ctx.lineWidth = 3;
        this.ctx.roundRect(x, y, w, h, 14);
        this.ctx.stroke();

        this.ctx.fillStyle = color;
        this.ctx.font = 'bold 22px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(label, x + w / 2, y + h / 2 + 2);
        this.ctx.textBaseline = 'alphabetic';
        this.ctx.restore();
    }

    draw() {
        this.ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

        this.map.drawParallaxBackground(this.ctx, this.camera, this.gameTime);
        this.particles.drawAmbient(this.ctx);

        this.map.drawPlatforms(this.ctx, this.camera);
        this.map.drawCheckpoints(this.ctx, this.camera);
        this.map.drawCollectibles(this.ctx, this.camera, this.gameTime);

        for (const item of this.dropItems) item.draw(this.ctx, this.camera, this.gameTime);
        for (const enemy of this.enemies) enemy.draw(this.ctx, this.camera);
        this.boss.draw(this.ctx, this.camera);
        this.player.draw(this.ctx, this.camera);

        this.particles.draw(this.ctx, this.camera);

        this.drawUI();
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

window.onload = () => {
    new Game();
};
</script>
</body>
</html>
