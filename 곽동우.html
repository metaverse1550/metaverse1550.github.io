<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판타지 디펜스: 신화의 각성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
        
        * {
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Glassmorphism UI Overlay */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .glass-button:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .glass-button:active:not(:disabled) {
            transform: translateY(1px);
        }

        .glass-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Custom Scrollbar for Fusion List */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center p-2 md:p-4 select-none">

    <!-- Top HUD Banner -->
    <header class="w-full max-w-6xl glass-panel rounded-xl p-3 mb-2 flex flex-wrap justify-between items-center shadow-lg gap-2 text-sm md:text-base">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-xl">🏰</span>
                <div>
                    <div class="text-xs text-slate-400">성 체력</div>
                    <div class="w-28 md:w-36 bg-slate-800 rounded-full h-3.5 border border-slate-600 overflow-hidden relative">
                        <div id="castle-hp-bar" class="bg-gradient-to-r from-red-600 to-emerald-500 h-full w-full transition-all duration-300"></div>
                        <span id="castle-hp-text" class="absolute inset-0 text-[10px] flex items-center justify-center font-bold text-white drop-shadow">100 / 100</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-1 bg-slate-800/60 px-3 py-1 rounded-lg border border-slate-700">
                <span class="text-amber-400 text-lg">⚔️</span>
                <div>
                    <div class="text-[10px] text-slate-400">웨이브</div>
                    <div id="wave-display" class="font-bold text-amber-300">1 / 80</div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-800/60 px-3 py-1 rounded-lg border border-amber-500/30">
                <span class="text-amber-400 font-bold text-lg">💰</span>
                <div>
                    <div class="text-[10px] text-slate-400">골드</div>
                    <div id="gold-display" class="font-extrabold text-amber-400 text-base">150</div>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-slate-800/60 px-3 py-1 rounded-lg border border-purple-500/30">
                <span class="text-purple-400 font-bold text-lg">💎</span>
                <div>
                    <div class="text-[10px] text-slate-400">마법 정수</div>
                    <div id="essence-display" class="font-extrabold text-purple-300 text-base">5</div>
                </div>
            </div>
            <button onclick="UI.toggleMissionModal(true)" class="relative glass-button bg-amber-600/70 hover:bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-lg border border-amber-400/50 flex items-center gap-1.5 shadow">
                <span>📜 미션</span>
                <span id="mission-badge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold animate-bounce shadow-md">!</span>
            </button>
        </div>
    </header>

    <!-- Main Interactive Area -->
    <main class="w-full max-w-6xl flex-1 flex flex-col md:flex-row gap-2 relative overflow-hidden min-h-0">
        
        <!-- Game Canvas Box -->
        <div class="relative flex-1 bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>
            
            <!-- Toast Notification Overlay -->
            <div id="toast-container" class="absolute top-4 left-1/2 -translate-x-1/2 pointer-events-none flex flex-col items-center gap-2 z-20"></div>

            <!-- Start / Next Wave & Auto Start Controls -->
            <div class="absolute bottom-4 right-4 flex gap-2 z-10">
                <button id="auto-wave-btn" onclick="GAME_STATE.toggleAutoStart()" class="glass-button bg-emerald-700/80 hover:bg-emerald-600/80 text-white font-bold px-4 py-3 rounded-xl shadow-lg border border-emerald-400/50 text-sm flex items-center gap-1 transition">
                    <span id="auto-wave-text">⚡ 자동 진행: ON</span>
                </button>
                <button id="wave-start-btn" onclick="GAME_STATE.startWave()" class="glass-button bg-amber-600/80 hover:bg-amber-500 text-white font-extrabold px-6 py-3 rounded-xl shadow-lg border border-amber-400/50 flex items-center gap-2 text-base transition duration-300 animate-bounce">
                    <span>⚔️ 다음 웨이브 시작</span>
                </button>
            </div>
        </div>

        <!-- Sidebar Info & Controls -->
        <aside class="w-full md:w-80 flex flex-col gap-2 min-h-0">
            <!-- Hero Info Card -->
            <div class="glass-panel rounded-xl p-3 flex flex-col gap-2 border border-slate-700/80">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">선택된 영웅 정보</h3>
                <div id="hero-info-content" class="flex flex-col gap-2 min-h-[110px] justify-center">
                    <p class="text-sm text-slate-500 text-center py-4">영웅을 클릭하여 정보를 확인하세요</p>
                </div>
            </div>

            <!-- Fusion & Mythic Recipes Panel -->
            <div class="glass-panel rounded-xl p-3 flex-1 flex flex-col min-h-0 border border-slate-700/80">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">조합 & 승급 창고</h3>
                    <span id="hero-count-badge" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-600">영웅 0/20</span>
                </div>
                
                <div id="fusion-recipe-list" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                    <!-- Dynamic Recipes will be injected here -->
                </div>
            </div>

            <!-- Summon Control Button Box -->
            <div class="glass-panel rounded-xl p-3 flex flex-col gap-2 border border-slate-700">
                <button id="summon-btn" onclick="SUMMON.summonHero()" class="w-full glass-button bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white font-extrabold py-3 rounded-xl shadow-md border border-amber-300/40 flex justify-between items-center px-4">
                    <span class="flex items-center gap-2">🎲 랜덤 영웅 소환</span>
                    <span class="bg-amber-950/60 px-2 py-0.5 rounded text-amber-200 text-xs border border-amber-500/30" id="summon-cost-text">100 Gold</span>
                </button>
                <div class="flex gap-2">
                    <button id="summon-upgrade-btn" onclick="SUMMON.upgradeSummon()" class="flex-1 glass-button bg-indigo-600/60 hover:bg-indigo-500/80 text-white text-xs font-bold py-2 rounded-lg border border-indigo-400/40 flex justify-between items-center px-3">
                        <span id="summon-lvl-text">✨ 소환 강화 (Lv.1→2)</span>
                        <span id="summon-lvl-cost" class="text-[10px] text-indigo-200">300G + 5💎</span>
                    </button>
                    <button onclick="UI.toggleProbabilityModal(true)" class="glass-button bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-2 rounded-lg border border-slate-600 flex items-center justify-center gap-1">
                        📊 확률
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- Modal Overlays (Game Over / Victory) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/90 max-w-md w-full rounded-2xl p-6 text-center border border-slate-700 shadow-2xl flex flex-col items-center gap-4">
            <div id="modal-icon" class="text-6xl animate-bounce">🏆</div>
            <h2 id="modal-title" class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-yellow-500">승리하였습니다!</h2>
            <p id="modal-desc" class="text-sm text-slate-300 leading-relaxed">모든 몬스터 웨이브를 막아내고 성을 완벽하게 수호했습니다.</p>
            <button onclick="GAME_STATE.restartGame()" class="w-full glass-button bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl shadow-lg border border-indigo-400/40 text-base mt-2">
                🔄 게임 다시 시작
            </button>
        </div>
    </div>

    <!-- Probability Info Modal -->
    <div id="prob-modal-overlay" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/95 max-w-md w-full rounded-2xl p-5 border border-slate-700 shadow-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="text-base font-extrabold text-amber-300 flex items-center gap-2">
                    <span>📊 영웅 소환 확률표</span>
                    <span id="prob-modal-level" class="text-xs bg-indigo-900/80 text-indigo-200 px-2 py-0.5 rounded-full border border-indigo-500/40">Lv.1</span>
                </h3>
                <button onclick="UI.toggleProbabilityModal(false)" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            
            <p class="text-xs text-slate-400">소환 강화를 진행하면 상위 등급 영웅이 출현할 확률이 대폭 증가합니다.</p>
            
            <div id="prob-rates-list" class="space-y-2 text-xs">
                <!-- Dynamically populated in JS -->
            </div>

            <button onclick="UI.toggleProbabilityModal(false)" class="w-full glass-button bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl border border-slate-600 text-xs mt-2">
                닫기
            </button>
        </div>
    </div>

    <!-- Mission Modal Overlay -->
    <div id="mission-modal-overlay" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/95 max-w-md w-full rounded-2xl p-5 border border-slate-700 shadow-2xl flex flex-col gap-3 max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="text-base font-extrabold text-amber-300 flex items-center gap-2">
                    <span>📜 도전 과제 & 미션</span>
                </h3>
                <button onclick="UI.toggleMissionModal(false)" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            
            <p class="text-xs text-slate-400">전투 목표를 달성하고 골드와 마법 정수 보상을 수령하세요!</p>
            
            <div id="mission-list" class="space-y-2 text-xs overflow-y-auto pr-1 flex-1 max-h-[60vh]">
                <!-- Dynamically populated in JS -->
            </div>

            <button onclick="UI.toggleMissionModal(false)" class="w-full glass-button bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl border border-slate-600 text-xs mt-2">
                닫기
            </button>
        </div>
    </div>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        // ==========================================
        // 1. CONFIG MODULE
        // ==========================================
        const CONFIG = {
            CANVAS_WIDTH: 800,
            CANVAS_HEIGHT: 600,
            INITIAL_SUMMON_COST: 100,
            SUMMON_COST_DECREMENT: 5, // 소환 시 차감될 비용
            MIN_SUMMON_COST: 10,        // 최소 소환 비용 한도
            MAX_HEROES: 20,
            INITIAL_CASTLE_HP: 100,
            INITIAL_GOLD: 200,
            INITIAL_ESSENCE: 5,
            
            // Hero Grades Definition
            GRADES: {
                COMMON:    { name: "일반", color: "#94a3b8", border: "#cbd5e1", glow: "rgba(148,163,184,0.3)" },
                RARE:      { name: "희귀", color: "#38bdf8", border: "#0ea5e9", glow: "rgba(56,189,248,0.4)" },
                EPIC:      { name: "영웅", color: "#c084fc", border: "#a855f7", glow: "rgba(192,132,252,0.5)" },
                LEGENDARY: { name: "전설", color: "#fbbf24", border: "#f59e0b", glow: "rgba(251,191,36,0.6)" },
                MYTHIC:    { name: "신화", color: "#f43f5e", border: "#e11d48", glow: "rgba(244,63,94,0.8)" }
            },

            // Base Hero Templates
            HERO_TEMPLATES: {
                // Common
                "archer_c": { name: "수련 궁수", grade: "COMMON", attack: 15, range: 130, speed: 0.9, icon: "🏹", projectile: "arrow" },
                "swordsman_c": { name: "경비 검사", grade: "COMMON", attack: 22, range: 75, speed: 1.1, icon: "🗡️", projectile: "slash" },
                "spearman_c": { name: "견습 창병", grade: "COMMON", attack: 18, range: 100, speed: 1.0, icon: "🔱", projectile: "pierce" },
                
                // Rare
                "mage_r": { name: "원소 마도사", grade: "RARE", attack: 45, range: 150, speed: 0.8, icon: "🔮", projectile: "magic_orb" },
                "knight_r": { name: "중갑 기사", grade: "RARE", attack: 65, range: 85, speed: 1.0, icon: "🛡️", projectile: "slash" },
                "assassin_r": { name: "그림자 암살자", grade: "RARE", attack: 55, range: 90, speed: 1.4, icon: "🗡️", projectile: "dagger" },

                // Epic
                "sniper_e": { name: "명사수 저격수", grade: "EPIC", attack: 130, range: 210, speed: 1.3, icon: "🎯", projectile: "bullet" },
                "pyro_e": { name: "화염 술사", grade: "EPIC", attack: 160, range: 140, speed: 0.7, icon: "🔥", projectile: "fireball" },
                "frost_e": { name: "빙설 술사", grade: "EPIC", attack: 140, range: 160, speed: 0.8, icon: "❄️", projectile: "ice_shard" },

                // Legendary
                "paladin_l": { name: "성광 기사", grade: "LEGENDARY", attack: 350, range: 110, speed: 1.2, icon: "⚔️", projectile: "holy_slash" },
                "storm_l": { name: "뇌전 드래곤", grade: "LEGENDARY", attack: 420, range: 180, speed: 1.0, icon: "⚡", projectile: "lightning" },
                "shadow_l": { name: "그림자 군주", grade: "LEGENDARY", attack: 380, range: 150, speed: 1.3, icon: "🌑", projectile: "shadow_bolt" },

                // Mythic (Special Fusion)
                "dragon_m": { name: "신화: 용기사 파프닐", grade: "MYTHIC", attack: 950, range: 170, speed: 1.2, icon: "🐉", projectile: "dragon_fire" },
                "archmage_m": { name: "신화: 시공 대마도사", grade: "MYTHIC", attack: 1200, range: 240, speed: 0.9, icon: "🌌", projectile: "arcane_beam" },
                "sun_god_m": { name: "신화: 태양신 라", grade: "MYTHIC", attack: 1500, range: 200, speed: 1.1, icon: "☀️", projectile: "sun_ray" },
                "death_god_m": { name: "신화: 명왕 하데스", grade: "MYTHIC", attack: 1650, range: 160, speed: 1.3, icon: "💀", projectile: "dark_beam" },
                "odin_m": { name: "신화: 주신 오딘", grade: "MYTHIC", attack: 1800, range: 220, speed: 1.0, icon: "⚡", projectile: "gungnir" },
                "poseidon_m": { name: "신화: 해신 포세이돈", grade: "MYTHIC", attack: 1400, range: 190, speed: 1.4, icon: "🔱", projectile: "tsunami" },
                "zeus_m": { name: "신화: 뇌신 제우스", grade: "MYTHIC", attack: 1950, range: 230, speed: 1.1, icon: "🌩️", projectile: "thunderbolt" },
                "hel_m": { name: "신화: 죽음의 여신 헬", grade: "MYTHIC", attack: 1750, range: 180, speed: 1.2, icon: "☠️", projectile: "soul_reaper" }
            },

            // Wave Configuration
            TOTAL_WAVES: 80,
            WAVE_DATA: (function() {
                const waves = [];
                const bossNames = [
                    "10W: 오거 킹", 
                    "20W: 고대의 리치", 
                    "30W: 골렘 로드", 
                    "40W: 심연의 데몬", 
                    "50W: 타락한 드래곤", 
                    "60W: 지옥의 군주", 
                    "70W: 카오스 베히모스", 
                    "80W: 멸망의 붉은 드래곤"
                ];
                for (let i = 1; i <= 80; i++) {
                    const isBoss = (i % 10 === 0);
                    if (isBoss) {
                        const bossIdx = (i / 10) - 1;
                        const bName = bossNames[bossIdx];
                        // Boss HP progressive scaling
                        const hp = Math.floor(2500 * Math.pow(1.4, bossIdx));
                        waves.push({
                            count: 1,
                            hp: hp,
                            speed: Math.max(0.5, 0.8 - bossIdx * 0.03),
                            gold: 100,
                            boss: true,
                            name: bName
                        });
                    } else {
                        // Normal wave stats (일반 웨이브 몬스터 수: 웨이브당 5마리씩 증가, 1웨이브 15마리 시작)
                        const count = 15 + (i - 1) * 5;
                        const hp = Math.floor(70 * Math.pow(1.05, i - 1) + i * 14);
                        const speed = Math.min(2.2, 1.2 + (i * 0.008));
                        waves.push({
                            count: count,
                            hp: hp,
                            speed: speed,
                            gold: 5,
                            boss: false
                        });
                    }
                }
                return waves;
            })()
        };

        // ==========================================
        // 2. INPUT & CANVAS SETUP
        // ==========================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Scale Canvas for crisp rendering
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = CONFIG.CANVAS_WIDTH;
            canvas.height = CONFIG.CANVAS_HEIGHT;
        }
        resizeCanvas();

        const INPUT = {
            mouseX: 0,
            mouseY: 0,
            selectedHero: null,
            
            init() {
                canvas.addEventListener("click", (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    
                    const clickX = (e.clientX - rect.left) * scaleX;
                    const clickY = (e.clientY - rect.top) * scaleY;

                    // Check if clicked on existing hero
                    const clickedHero = HERO_SYSTEM.heroes.find(h => {
                        const dist = Math.hypot(h.x - clickX, h.y - clickY);
                        return dist <= h.radius + 10;
                    });

                    if (clickedHero) {
                        INPUT.selectedHero = clickedHero;
                        UI.updateHeroInfoPanel();
                    } else if (INPUT.selectedHero) {
                        // Move selected hero if clicked on playable ground
                        if (MAP.isPointOnPlayableArea(clickX, clickY)) {
                            INPUT.selectedHero.targetX = clickX;
                            INPUT.selectedHero.targetY = clickY;
                            EFFECTS.addClickEffect(clickX, clickY);
                        } else {
                            UI.showToast("길 위나 성에는 이동할 수 없습니다!", "warning");
                        }
                    }
                });

                canvas.addEventListener("mousemove", (e) => {
                    const rect = canvas.getBoundingClientRect();
                    INPUT.mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
                    INPUT.mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
                });
            }
        };

        // ==========================================
        // 3. MAP MODULE
        // ==========================================
        const MAP = {
            // Path waypoints for monsters to travel
            path: [
                { x: -20, y: 150 },
                { x: 220, y: 150 },
                { x: 220, y: 450 },
                { x: 550, y: 450 },
                { x: 550, y: 200 },
                { x: 700, y: 200 },
                { x: 700, y: 300 } // Castle Location
            ],
            castle: { x: 700, y: 300, radius: 45 },

            draw() {
                // Background grass pattern
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Field Texture / Grid
                ctx.strokeStyle = "rgba(255,255,255,0.02)";
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }

                // Draw Path
                ctx.strokeStyle = "#334155";
                ctx.lineWidth = 50;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.beginPath();
                this.path.forEach((pt, idx) => {
                    if (idx === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();

                // Path Inner Line
                ctx.strokeStyle = "#475569";
                ctx.lineWidth = 44;
                ctx.stroke();

                // Path Guide Dots
                ctx.strokeStyle = "rgba(255,255,255,0.15)";
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 12]);
                ctx.stroke();
                ctx.setLineDash([]); // Reset dash

                // Draw Castle
                const c = this.castle;
                // Castle Glow
                const glow = ctx.createRadialGradient(c.x, c.y, 10, c.x, c.y, 65);
                glow.addColorStop(0, "rgba(59, 130, 246, 0.3)");
                glow.addColorStop(1, "rgba(59, 130, 246, 0)");
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(c.x, c.y, 65, 0, Math.PI * 2);
                ctx.fill();

                // Castle Outer Circle
                ctx.fillStyle = "#0f172a";
                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Castle Icon / Graphic
                ctx.font = "32px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🏰", c.x, c.y);
            },

            // Prevent heroes from being placed directly on path or castle
            isPointOnPlayableArea(x, y) {
                // Castle check
                if (Math.hypot(x - this.castle.x, y - this.castle.y) < this.castle.radius + 20) return false;

                // Path distance check
                for (let i = 0; i < this.path.length - 1; i++) {
                    const p1 = this.path[i];
                    const p2 = this.path[i + 1];
                    const dist = this.distToSegment({ x, y }, p1, p2);
                    if (dist < 32) return false;
                }
                return true;
            },

            distToSegment(p, v, w) {
                const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
                if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
                let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
            }
        };

        // ==========================================
        // 4. HERO SYSTEM & CLASS
        // ==========================================
        class Hero {
            constructor(typeKey, x, y) {
                const template = CONFIG.HERO_TEMPLATES[typeKey];
                this.id = Math.random().toString(36).substr(2, 9);
                this.typeKey = typeKey;
                this.name = template.name;
                this.gradeKey = template.grade;
                this.grade = CONFIG.GRADES[template.grade];
                
                this.baseAttack = template.attack;
                this.range = template.range;
                this.attackSpeed = template.speed; // attacks per second
                this.icon = template.icon;
                this.projectileType = template.projectile;

                this.level = 1;
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.moveSpeed = 3.5;
                this.radius = 20;

                this.lastAttackTime = 0;
                this.targetEnemy = null;
                this.rotation = 0;
            }

            get attackDamage() {
                return Math.floor(this.baseAttack * (1 + (this.level - 1) * 0.4));
            }

            get upgradeCostGold() {
                return 30 * this.level;
            }

            get upgradeCostEssence() {
                return Math.floor(this.level / 2) + 1;
            }

            upgrade() {
                if (GAME_STATE.gold >= this.upgradeCostGold && GAME_STATE.essence >= this.upgradeCostEssence) {
                    GAME_STATE.gold -= this.upgradeCostGold;
                    GAME_STATE.essence -= this.upgradeCostEssence;
                    this.level++;
                    MISSION_SYSTEM.checkProgress("upgrade", 1);
                    EFFECTS.addUpgradeEffect(this.x, this.y);
                    UI.updateHUD();
                    UI.updateHeroInfoPanel();
                    UI.showToast(`${this.name} 레벨업! (Lv.${this.level})`, "success");
                } else {
                    UI.showToast("골드 또는 마법 정수가 부족합니다!", "warning");
                }
            }

            update(now) {
                // Movement Logic
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    this.x += (dx / dist) * this.moveSpeed;
                    this.y += (dy / dist) * this.moveSpeed;
                    this.rotation = Math.atan2(dy, dx);
                }

                // Combat Logic (Auto-attack closest enemy)
                this.findTarget();
                if (this.targetEnemy) {
                    const cooldown = 1000 / this.attackSpeed;
                    if (now - this.lastAttackTime >= cooldown) {
                        this.attack(this.targetEnemy, now);
                        this.lastAttackTime = now;
                    }
                }
            }

            findTarget() {
                let closest = null;
                let minDist = this.range;

                ENEMY_SYSTEM.enemies.forEach(enemy => {
                    const d = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (d <= minDist) {
                        minDist = d;
                        closest = enemy;
                    }
                });

                this.targetEnemy = closest;
            }

            attack(target, now) {
                COMBAT.createProjectile(this, target);
            }

            draw() {
                // Selection Circle
                if (INPUT.selectedHero === this) {
                    ctx.strokeStyle = "#38bdf8";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();

                    // Attack Range Indicator
                    ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
                    ctx.fillStyle = "rgba(56, 189, 248, 0.05)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                // Grade Glow Aura
                const auraGlow = ctx.createRadialGradient(this.x, this.y, 5, this.x, this.y, this.radius + 10);
                auraGlow.addColorStop(0, this.grade.glow);
                auraGlow.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = auraGlow;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 10, 0, Math.PI * 2);
                ctx.fill();

                // Hero Body Base
                ctx.fillStyle = "#1e293b";
                ctx.strokeStyle = this.grade.border;
                ctx.lineWidth = this.gradeKey === "MYTHIC" ? 4 : 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Mythic Extra Rotating Magic Circle
                if (this.gradeKey === "MYTHIC") {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(Date.now() * 0.002);
                    ctx.strokeStyle = "#f43f5e";
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Hero Icon
                ctx.font = "18px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.icon, this.x, this.y);

                // Level Badge
                ctx.fillStyle = "#0f172a";
                ctx.strokeStyle = "#64748b";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(this.x + 12, this.y + 12, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#f8fafc";
                ctx.font = "bold 9px sans-serif";
                ctx.fillText(`L${this.level}`, this.x + 12, this.y + 12);
            }
        }

            findFreePosition() {
                // Find a valid spot near center canvas
                for (let r = 50; r < 300; r += 30) {
                    for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 6) {
                        const testX = 400 + Math.cos(angle) * r;
                        const testY = 300 + Math.sin(angle) * r;
                        if (MAP.isPointOnPlayableArea(testX, testY)) {
                            return { x: testX, y: testY };
                        }
                    }
                }
                return { x: 350, y: 250 };
            }

        // ==========================================
        // 5. ENEMY MODULE
        // ==========================================
        class Enemy {
            constructor(waveInfo) {
                this.id = Math.random().toString(36).substr(2, 9);
                this.isBoss = waveInfo.boss;
                this.name = waveInfo.boss ? waveInfo.name : "골렘/슬라임";
                
                this.maxHp = waveInfo.hp;
                this.hp = waveInfo.hp;
                this.speed = waveInfo.speed;
                this.goldReward = waveInfo.boss ? 100 : 5;

                this.pathIndex = 0;
                this.x = MAP.path[0].x;
                this.y = MAP.path[0].y;
                this.radius = this.isBoss ? 24 : 14;

                this.icon = this.isBoss ? "👹" : (waveInfo.hp > 1000 ? "👾" : "👿");
                this.reachedCastle = false;
            }

            update() {
                if (this.pathIndex >= MAP.path.length - 1) return;

                const target = MAP.path[this.pathIndex + 1];
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;

                    // Reached Castle
                    if (this.pathIndex >= MAP.path.length - 1) {
                        GAME_STATE.damageCastle(this.isBoss ? 30 : 10);
                        this.reachedCastle = true;
                        this.hp = 0; // Destroy enemy
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }

            draw() {
                // Shadow
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + this.radius * 0.7, this.radius, this.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Boss Aura
                if (this.isBoss) {
                    ctx.strokeStyle = "rgba(225, 29, 72, 0.6)";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Enemy Body
                ctx.fillStyle = this.isBoss ? "#881337" : "#475569";
                ctx.strokeStyle = this.isBoss ? "#fda4af" : "#94a3b8";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Icon
                ctx.font = `${this.radius * 1.2}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.icon, this.x, this.y);

                // HP Bar Overlay
                const barW = this.radius * 2.2;
                const barH = 5;
                const barX = this.x - barW / 2;
                const barY = this.y - this.radius - 10;

                ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
                ctx.fillRect(barX, barY, barW, barH);

                const hpRatio = Math.max(0, this.hp / this.maxHp);
                ctx.fillStyle = hpRatio > 0.5 ? "#10b981" : (hpRatio > 0.2 ? "#f59e0b" : "#ef4444");
                ctx.fillRect(barX, barY, barW * hpRatio, barH);

                ctx.strokeStyle = "rgba(255,255,255,0.2)";
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barW, barH);
            }
        }

        const ENEMY_SYSTEM = {
            enemies: [],
            spawnQueue: [],
            spawnTimer: 0,

            update(now) {
                // Handle Wave Spawning (스폰 간격을 350ms로 단축)
                if (this.spawnQueue.length > 0 && now > this.spawnTimer) {
                    const waveInfo = this.spawnQueue.shift();
                    this.enemies.push(new Enemy(waveInfo));
                    this.spawnTimer = now + (waveInfo.boss ? 1000 : 350);
                }

                // Update Positions
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    enemy.update();

                    // Check Death
                    if (enemy.hp <= 0) {
                        if (!enemy.reachedCastle) {
                            // Killed by player -> Give Rewards
                            REWARD.grantKillReward(enemy);
                        }
                        this.enemies.splice(i, 1);
                    }
                }

                // Check Wave Completion
                if (this.enemies.length === 0 && this.spawnQueue.length === 0 && GAME_STATE.waveActive) {
                    GAME_STATE.onWaveComplete();
                }
            },

            draw() {
                this.enemies.forEach(e => e.draw());
            }
        };

        const COMBAT = {
            projectiles: [],

            createProjectile(hero, target) {
                this.projectiles.push({
                    x: hero.x,
                    y: hero.y,
                    targetEnemy: target,
                    damage: hero.attackDamage,
                    type: hero.projectileType,
                    speed: 12,
                    gradeKey: hero.gradeKey
                });
            },

            update() {
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];

                    if (!p.targetEnemy || p.targetEnemy.hp <= 0) {
                        this.projectiles.splice(i, 1);
                        continue;
                    }

                    const dx = p.targetEnemy.x - p.x;
                    const dy = p.targetEnemy.y - p.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < p.speed) {
                        // Impact Enemy
                        p.targetEnemy.hp -= p.damage;
                        EFFECTS.addHitEffect(p.targetEnemy.x, p.targetEnemy.y, p.damage, p.gradeKey);
                        this.projectiles.splice(i, 1);
                    } else {
                        p.x += (dx / dist) * p.speed;
                        p.y += (dy / dist) * p.speed;
                    }
                }
            },

            draw() {
                this.projectiles.forEach(p => {
                    ctx.save();
                    if (p.gradeKey === "MYTHIC") {
                        ctx.fillStyle = "#f43f5e";
                        ctx.shadowColor = "#f43f5e";
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = "#fbbf24";
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = "#38bdf8";
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);

                    }
                    ctx.restore();
                });
            }

            // Standard Grade Fusion Rules (3 same heroes -> 1 higher random grade hero)
            canStandardFuse(typeKey) {
                const count = HERO_SYSTEM.heroes.filter(h => h.typeKey === typeKey).length;

            executeStandardFusion(typeKey) {
                const matching = HERO_SYSTEM.heroes.filter(h => h.typeKey === typeKey);
                if (matching.length < 3) return;

                const currentGrade = CONFIG.HERO_TEMPLATES[typeKey].grade;
                let nextGradeKeys = [];

                if (currentGrade === "COMMON") nextGradeKeys = ["mage_r", "knight_r", "assassin_r"];
                else if (currentGrade === "RARE") nextGradeKeys = ["sniper_e", "pyro_e", "frost_e"];

                else {

                    return;

                // Average location of removed heroes
                const used = matching.slice(0, 3);
                const avgX = used.reduce((s, h) => s + h.x, 0) / 3;
                const avgY = used.reduce((s, h) => s + h.y, 0) / 3;

                // Remove 3 heroes
                used.forEach(h => {
                    const idx = HERO_SYSTEM.heroes.indexOf(h);
                    if (idx !== -1) HERO_SYSTEM.heroes.splice(idx, 1);
                });

                // Spawn 1 upgraded hero

                HERO_SYSTEM.heroes.push(fusedHero);

            },

            canMythicFuse(recipe) {
                // Check if player has all required heroes
                const available = [...HERO_SYSTEM.heroes];
                for (let reqKey of recipe.reqs) {
                    const idx = available.findIndex(h => h.typeKey === reqKey);
                    if (idx === -1) return false;
                    available.splice(idx, 1); // Mark as used for check
                }
                return true;
            },

            executeMythicFusion(recipeId) {
                const recipe = this.mythicRecipes.find(r => r.id === recipeId);
                if (!recipe || !this.canMythicFuse(recipe)) {
                    UI.showToast("신화 조합에 필요한 영웅 재료가 부족합니다!", "warning");
                    return;
                }

                // Remove required materials
                let posX = 400, posY = 300;
                recipe.reqs.forEach(reqKey => {
                    const idx = HERO_SYSTEM.heroes.findIndex(h => h.typeKey === reqKey);
                    if (idx !== -1) {
                        posX = HERO_SYSTEM.heroes[idx].x;
                        posY = HERO_SYSTEM.heroes[idx].y;
                        HERO_SYSTEM.heroes.splice(idx, 1);
                    }
                });

                // Spawn Mythic Hero
                const mythicHero = new Hero(recipe.resultKey, posX, posY);
                HERO_SYSTEM.heroes.push(mythicHero);

                MISSION_SYSTEM.checkProgress("mythic", 1);

                EFFECTS.addMythicFusionEffect(posX, posY);
                INPUT.selectedHero = mythicHero;
                UI.updateHUD();
                UI.updateHeroInfoPanel();
                UI.updateFusionList();
                UI.showToast(`✨✨ 신화 강림! [${mythicHero.name}] 소환! ✨✨`, "success");
            }

                    m.claimed = false;

            checkProgress(type, amount) {
                let updated = false;
                this.missions.forEach(m => {
                    if (m.type === type && !m.claimed) {
                        if (type === "wave") {
                            if (amount > m.current) {
                                m.current = Math.min(amount, m.target);
                                updated = true;
                            }
                        } else {
                            m.current = Math.min(m.current + amount, m.target);
                            updated = true;
                        }
                    }
                });

                if (updated) {
                    this.updateBadge();
                    if (document.getElementById("mission-modal-overlay") && !document.getElementById("mission-modal-overlay").classList.contains("hidden")) {
                        UI.renderMissionList();
                    }
                }
            },

            hasUnclaimedReward() {
                return this.missions.some(m => m.current >= m.target && !m.claimed);

                if (!badge) return;

            addHitEffect(x, y, damage, gradeKey) {
                // Damage Text
                this.floatingTexts.push({
                    x: x + (Math.random() * 20 - 10),
                    y: y - 10,
                    text: damage.toString(),

                // Spark Particles
                for (let i = 0; i < 4; i++) {
                    this.particles.push({
                        x, y,

                        vy: (Math.random() - 0.5) * 4,

                        size: Math.random() * 3 + 2
                    });

            addClickEffect(x, y) {
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 / 8) * i;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * 3,
                        vy: Math.sin(angle) * 3,
                        life: 1.0,
                        color: "#38bdf8",
                        size: 3
                    });
                }
            },

            addUpgradeEffect(x, y) {
                this.addFloatingText(x, y - 20, "LEVEL UP!", "#38bdf8");
                for (let i = 0; i < 12; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 3,
                        vy: -Math.random() * 4 - 1,
                        life: 1.0,
                        color: "#38bdf8",
                        size: 4
                    });
                }
            },

            addSummonEffect(x, y) {
                for (let i = 0; i < 16; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 2;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        color: "#fbbf24",
                        size: 4
                    });
                }
            },

            addFusionEffect(x, y) {
                this.addFloatingText(x, y - 20, "FUSION SUCCESS!", "#a855f7");
                for (let i = 0; i < 24; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * 6,
                        vy: Math.sin(angle) * 6,
                        life: 1.2,
                        color: "#c084fc",
                        size: 5
                    });
                }
            },

            addMythicFusionEffect(x, y) {
                this.addFloatingText(x, y - 30, "MYTHIC AWAKENED!", "#f43f5e");
                for (let i = 0; i < 40; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 3;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.5,
                        color: Math.random() > 0.5 ? "#f43f5e" : "#fbbf24",
                        size: Math.random() * 6 + 3
                    });
                }
            },

            addFloatingText(x, y, text, color) {
                this.floatingTexts.push({ x, y, text, color, alpha: 1.0, size: 13 });
            },

            update() {
                // Update Particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }

                // Update Floating Texts
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    const t = this.floatingTexts[i];
                    t.y -= 0.8;
                    t.alpha -= 0.02;
                    if (t.alpha <= 0) this.floatingTexts.splice(i, 1);
                }
            },

            draw() {
                // Draw Particles
                this.particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Draw Texts
                this.floatingTexts.forEach(t => {
                    ctx.fillStyle = t.color;
                    ctx.globalAlpha = Math.max(0, t.alpha);
                    ctx.font = `bold ${t.size}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(t.text, t.x, t.y);
                });

                ctx.globalAlpha = 1.0; // Reset
            }
        };

                                <span class="text-[10px] text-amber-400 font-bold ml-1">(${count}/3)</span>
                            </div>
                            <button onclick="FUSION.executeStandardFusion('${typeKey}')" ${!canFuse ? "disabled" : ""} class="glass-button px-2 py-0.5 rounded text-[10px] font-bold ${canFuse ? "bg-amber-600 text-white" : "bg-slate-800 text-slate-600"}">
                                승급
                            </button>
                        `;
                        container.appendChild(item);
                    });
                }
            },

            showToast(message, type = "info") {
                const toastContainer = document.getElementById("toast-container");
                const toast = document.createElement("div");
                
                const bgClass = type === "success" 
                    ? "bg-emerald-900/90 border-emerald-500 text-emerald-100" 
                    : (type === "warning" ? "bg-amber-900/90 border-amber-500 text-amber-100" : "bg-slate-900/90 border-slate-600 text-slate-100");

                toast.className = `px-4 py-2 rounded-xl border backdrop-blur-md text-xs font-bold shadow-lg transition-all duration-300 transform translate-y-[-10px] opacity-0 ${bgClass}`;
                toast.innerText = message;

                toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.classList.remove("translate-y-[-10px]", "opacity-0");
                }, 10);

                setTimeout(() => {
                    toast.classList.add("opacity-0", "translate-y-[-10px]");
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }
        };

        // ==========================================
        // 12. GAME STATE & MAIN LOOP MODULE
        // ==========================================
        const GAME_STATE = {
            gold: CONFIG.INITIAL_GOLD,
            essence: CONFIG.INITIAL_ESSENCE,
            castleHp: CONFIG.INITIAL_CASTLE_HP,
            currentWave: 1,
            waveActive: false,
            autoStart: true,
            isGameOver: false,
            isVictory: false,

            init() {
                this.gold = CONFIG.INITIAL_GOLD;
                this.essence = CONFIG.INITIAL_ESSENCE;
                this.castleHp = CONFIG.INITIAL_CASTLE_HP;
                this.currentWave = 1;
                this.waveActive = false;
                this.autoStart = true;
                this.isGameOver = false;
                this.isVictory = false;

                SUMMON.reset();
                HERO_SYSTEM.heroes = [];
                ENEMY_SYSTEM.enemies = [];
                ENEMY_SYSTEM.spawnQueue = [];
                COMBAT.projectiles = [];
                INPUT.selectedHero = null;

                MISSION_SYSTEM.reset();

                // Initial Free Starter Heroes
                const pos1 = HERO_SYSTEM.findFreePosition();
                HERO_SYSTEM.heroes.push(new Hero("archer_c", pos1.x, pos1.y));
                const pos2 = HERO_SYSTEM.findFreePosition();
                HERO_SYSTEM.heroes.push(new Hero("swordsman_c", pos2.x, pos2.y));

                document.getElementById("modal-overlay").classList.add("hidden");
                document.getElementById("prob-modal-overlay").classList.add("hidden");
                document.getElementById("mission-modal-overlay").classList.add("hidden");
                document.getElementById("wave-start-btn").classList.remove("hidden");

                this.updateAutoStartUI();
                UI.init();
                UI.showToast("게임 시작! 영웅을 배치하고 웨이브를 준비하세요.", "info");
            },

            toggleAutoStart() {
                this.autoStart = !this.autoStart;
                this.updateAutoStartUI();
                UI.showToast(`자동 진행: ${this.autoStart ? 'ON' : 'OFF'}`, "info");
            },

            updateAutoStartUI() {
                const btn = document.getElementById("auto-wave-btn");
                const txt = document.getElementById("auto-wave-text");
                if (!btn || !txt) return;

                if (this.autoStart) {
                    btn.className = "glass-button bg-emerald-700/80 hover:bg-emerald-600/80 text-white font-bold px-4 py-3 rounded-xl shadow-lg border border-emerald-400/50 text-sm flex items-center gap-1 transition";
                    txt.innerText = "⚡ 자동 진행: ON";
                } else {
                    btn.className = "glass-button bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 font-bold px-4 py-3 rounded-xl shadow-lg border border-slate-600/50 text-sm flex items-center gap-1 transition";
                    txt.innerText = "⏸️ 자동 진행: OFF";
                }
            },

            startWave() {
                if (this.waveActive || this.isGameOver || this.isVictory) return;

                this.waveActive = true;
                document.getElementById("wave-start-btn").classList.add("hidden");

                const waveConfig = CONFIG.WAVE_DATA[this.currentWave - 1];
                
                // Populate Spawn Queue
                for (let i = 0; i < waveConfig.count; i++) {
                    ENEMY_SYSTEM.spawnQueue.push(waveConfig);
                }

                UI.showToast(`웨이브 ${this.currentWave} 시작!`, "warning");
            },

            onWaveComplete() {
                this.waveActive = false;
                REWARD.grantWaveClearReward(this.currentWave);

                if (this.currentWave >= CONFIG.TOTAL_WAVES) {
                    this.triggerVictory();
                } else {
                    this.currentWave++;
                    MISSION_SYSTEM.checkProgress("wave", this.currentWave);
                    UI.updateHUD();

                    if (this.autoStart) {
                        document.getElementById("wave-start-btn").classList.add("hidden");
                        UI.showToast(`1초 후 웨이브 ${this.currentWave}가 자동으로 시작됩니다.`, "info");
                        setTimeout(() => {
                            if (!this.waveActive && !this.isGameOver && !this.isVictory) {
                                this.startWave();
                            }
                        }, 1000);
                    } else {
                        document.getElementById("wave-start-btn").classList.remove("hidden");
                    }
                }
            },

            damageCastle(amount) {
                this.castleHp -= amount;
                UI.updateHUD();
                EFFECTS.addFloatingText(MAP.castle.x, MAP.castle.y - 20, `-${amount} HP`, "#ef4444");

                if (this.castleHp <= 0) {
                    this.castleHp = 0;
                    this.triggerGameOver();
                }
            },

            triggerGameOver() {
                this.isGameOver = true;
                document.getElementById("modal-title").innerText = "패배하였습니다...";
                document.getElementById("modal-title").className = "text-3xl font-extrabold text-red-500";
                document.getElementById("modal-icon").innerText = "💀";
                document.getElementById("modal-desc").innerText = "성이 파괴되었습니다. 영웅 조합 전략을 다시 구상해보세요!";
                document.getElementById("modal-overlay").classList.remove("hidden");
            },

            triggerVictory() {
                this.isVictory = true;
                document.getElementById("modal-title").innerText = "최종 승리!";
                document.getElementById("modal-title").className = "text-3xl font-extrabold text-amber-400";
                document.getElementById("modal-icon").innerText = "🏆";
                document.getElementById("modal-desc").innerText = "모든 몬스터 웨이브와 보스를 물리치고 완벽한 승리를 거두었습니다!";
                document.getElementById("modal-overlay").classList.remove("hidden");
            },

            restartGame() {
                this.init();
            }
        };

        // ==========================================
        // 13. GAME LOOP
        // ==========================================
        function gameLoop(now) {
            // Update
            if (!GAME_STATE.isGameOver && !GAME_STATE.isVictory) {
                HERO_SYSTEM.update(now);
                ENEMY_SYSTEM.update(now);
                COMBAT.update();
                EFFECTS.update();
            }

            // Render
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            MAP.draw();
            HERO_SYSTEM.draw();
            ENEMY_SYSTEM.draw();
            COMBAT.draw();
            EFFECTS.draw();

            requestAnimationFrame(gameLoop);
        }

        // Initialize Game System on Window Load
        window.onload = function() {
            INPUT.init();
            GAME_STATE.init();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
